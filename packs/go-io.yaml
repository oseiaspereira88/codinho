  brief: Transforme um inventário CSV em um array JSON, preservando a ordem dos registros e evitando qualquer
    escrita enquanto a entrada não for inteiramente validada.
  constraints:
  - Use somente a biblioteca padrão.
  - Não abra arquivos, não acesse a rede e não altere as assinaturas da fixture.
  - Propague erros de I/O preservando sua identidade.
  acceptance:
  - Exige cabeçalho exato name,quantity; nomes são aparados e únicos, quantidades são inteiros positivos.
  - Preserva UTF-8 e campos CSV entre aspas, inclusive nomes contendo vírgulas.
  - Cabeçalho sem registros produz um array JSON vazio.
  - Rejeita CSV malformado, largura incorreta, nomes vazios/duplicados, quantidades inválidas ou fora
    do intervalo de int.
  - Qualquer erro de entrada ou validação deixa o Writer intocado, mesmo após linhas válidas.
  - Propaga erros do Reader e do Writer com identidade preservada; falha de escrita pode ter produzido
    saída parcial.
