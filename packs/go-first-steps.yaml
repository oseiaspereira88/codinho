      - path: parseage.go
        content: |
          package parseage

          // ParseAge parses raw as an age, validating it is non-empty and
          // numeric.
          func ParseAge(raw string) (age int, err error) {
              panic("not implemented")
          }
      - path: parseage_test.go
        content: |
          package parseage

          import "testing"

          func TestParseAge(t *testing.T) {
              cases := []struct {
                  name    string
                  in      string
                  wantAge int
                  wantErr bool
              }{
                  {"valid", "25", 25, false},
                  {"valid with surrounding spaces", " 25 ", 25, false},
                  {"empty", "", 0, true},
                  {"whitespace only", "   ", 0, true},
                  {"not a number", "abc", 0, true},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      age, err := ParseAge(c.in)
                      if age != c.wantAge {
                          t.Errorf("ParseAge(%q) age = %d, want %d", c.in, age, c.wantAge)
                      }
                      if (err != nil) != c.wantErr {
                          t.Errorf("ParseAge(%q) err = %v, wantErr %v", c.in, err, c.wantErr)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestParseAge$
        timeout: 20s
    variants: []
    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/avoid-shadowing-named-returns

          go 1.25.0
      - path: parseage.go
        content: |
          package parseage

          import (
              "strconv"
              "strings"
          )

          // ParseAge parses raw as an age, validating it is non-empty and
          // numeric.
          func ParseAge(raw string) (age int, err error) {
              raw = strings.TrimSpace(raw)
              if raw == "" {
                  err = strconv.ErrSyntax
                  return
              }
              if age, err = strconv.Atoi(raw); err != nil {
                  return
              }
              return
          }
      - path: parseage_test.go
        content: |
          package parseage

          import "testing"

          func TestParseAge(t *testing.T) {
              cases := []struct {
                  name    string
                  in      string
                  wantAge int
                  wantErr bool
              }{
                  {"valid", "25", 25, false},
                  {"valid with surrounding spaces", " 25 ", 25, false},
                  {"empty", "", 0, true},
                  {"whitespace only", "   ", 0, true},
                  {"not a number", "abc", 0, true},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      age, err := ParseAge(c.in)
                      if age != c.wantAge {
                          t.Errorf("ParseAge(%q) age = %d, want %d", c.in, age, c.wantAge)
                      }
                      if (err != nil) != c.wantErr {
                          t.Errorf("ParseAge(%q) err = %v, wantErr %v", c.in, err, c.wantErr)
                      }
                  })
              }
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
