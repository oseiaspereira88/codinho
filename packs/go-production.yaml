    content: "package worker\n\nimport (\n    \"context\"\n    \"sync\"\n)\n\ntype Message struct { ID string; Value int }\n\
      type Stats struct { Accepted, Rejected, Acked int }\n\ntype Worker struct {\n    mu       sync.Mutex\n    queue    chan\
      \ Message\n    acked    map[string]bool\n    stats    Stats\n    done     chan struct{}\n}\n\nfunc NewWorker(capacity\
      \ int) *Worker {\n    return &Worker{queue: make(chan Message, capacity), acked: make(map[string]bool), done: make(chan\
      \ struct{})}\n}\n\nfunc (w *Worker) Start(ctx context.Context, handle func(Message) error) {\n    go func() {\n    \
      \    defer close(w.done)\n        for {\n            select {\n            case <-ctx.Done():\n                return\n\
      \            case msg := <-w.queue:\n                _ = handle(msg)\n                w.Ack(msg.ID)\n            }\n\
      \        }\n    }()\n}\n\nfunc (w *Worker) Submit(ctx context.Context, msg Message) bool {\n    select {\n    case w.queue\
      \ <- msg:\n        w.mu.Lock(); w.stats.Accepted++; w.mu.Unlock()\n        return true\n    case <-ctx.Done():\n   \
      \     w.mu.Lock(); w.stats.Rejected++; w.mu.Unlock()\n        return false\n    default:\n        w.mu.Lock(); w.stats.Rejected++;\
      \ w.mu.Unlock()\n        return false\n    }\n}\n\nfunc (w *Worker) Ack(id string) {\n    w.mu.Lock()\n    w.acked[id]\
