          import "errors"

          // ErrNameRequired means name was empty.
          var ErrNameRequired = errors.New("name is required")

          // ErrAgeNegative means age was negative.
          var ErrAgeNegative = errors.New("age cannot be negative")

          // ValidateUser returns nil when name and age are both valid, or a
          // single error aggregating every violated rule -- not just the first
          // one found.
          func ValidateUser(name string, age int) error {
              panic("not implemented")
          }
      - path: validate_test.go
        content: |
          package user

          import (
              "errors"
              "testing"
          )

          func TestValidateUser(t *testing.T) {
              t.Run("both valid", func(t *testing.T) {
                  if err := ValidateUser("bob", 5); err != nil {
                      t.Errorf("ValidateUser(\"bob\", 5) = %v, want nil", err)
                  }
              })

              t.Run("only name invalid", func(t *testing.T) {
                  err := ValidateUser("", 5)
                  if !errors.Is(err, ErrNameRequired) {
                      t.Error("expected ErrNameRequired")
                  }
                  if errors.Is(err, ErrAgeNegative) {
                      t.Error("did not expect ErrAgeNegative")
                  }
              })

              t.Run("only age invalid", func(t *testing.T) {
                  err := ValidateUser("bob", -1)
                  if !errors.Is(err, ErrAgeNegative) {
                      t.Error("expected ErrAgeNegative")
                  }
                  if errors.Is(err, ErrNameRequired) {
                      t.Error("did not expect ErrNameRequired")
                  }
              })

              t.Run("both invalid: both errors are present, not just the first", func(t *testing.T) {
                  err := ValidateUser("", -1)
                  if !errors.Is(err, ErrNameRequired) {
                      t.Error("expected ErrNameRequired to be present")
                  }
                  if !errors.Is(err, ErrAgeNegative) {
                      t.Error("expected ErrAgeNegative to also be present, not just the first violation")
                  }
              })
          }
