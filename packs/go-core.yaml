                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.recover-panic-per-command
            kind: micro
            action: implement
            target: function
            title: Tratar falhas de run por comando
            instruction:
              objective: Fazer um panic em run produzir uma entrada "failed:<comando>:<mensagem>" e permitir que o próximo comando seja processado.
              scope: O tratamento do panic ao redor da chamada a run.
              constraints:
                - Usar recover para converter um panic de run em uma entrada de falha, sem interromper os comandos seguintes.
            concepts: [panic-recover-boundary, if-initializer-scope]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: recovers-panic-per-command
