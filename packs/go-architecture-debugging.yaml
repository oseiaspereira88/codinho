  - schema_version: 1
    id: go-architecture-debugging.simplify-overengineered-boundary
    version: 1.0.0
    title: Simplificar uma fronteira superprojetada
    kind: refactoring
    difficulty: advanced
    estimated_minutes: 35
    themes:
      - go-architecture-debugging.design-evolution
    competencies:
      primary:
        - go-architecture-debugging.remove-unsupported-abstraction
      secondary:
        - go-architecture-debugging.justify-trade-off-with-evidence
    prerequisites:
      - go-architecture-debugging.trace-heap-retention
    brief: >
      Uma fronteira de rótulos tem uma única operação concreta, mas foi cercada
      por registry e estratégia configurável sem demanda demonstrada. Preserve
      o contrato observável enquanto reduz a superfície que precisa ser mantida.
    constraints:
      - Preserve NewBoundary, NormalizeLabel e seus tipos de retorno.
      - Remova somente a abstração sem pressão real; não adicione framework ou dependência.
      - Mantenha os casos de entrada da fixture como contrato de comportamento.
    acceptance:
      - O baseline falha ao atender o contrato de normalização por causa da fronteira superprojetada.
      - A referência passa para entradas com espaços, sem espaços e vazias.
      - A implementação final mantém a API pública e deixa explícito por que uma única estratégia não exige registry.
    canonical: true
    publication:
      status: draft
      author: codex
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/demand-boundary

          go 1.25.0
      - path: boundary.go
        content: |
          package boundary

          import (
              "errors"
              "strings"
          )

          type LabelPolicy interface {
              Normalize(string) string
          }

          type trimPolicy struct{}

          func (trimPolicy) Normalize(value string) string {
              return strings.TrimSpace(value)
          }

          type policyRegistry struct {
              policies map[string]LabelPolicy
          }

          type Boundary struct {
              registry policyRegistry
          }

          func NewBoundary() *Boundary {
              return &Boundary{registry: policyRegistry{
                  policies: map[string]LabelPolicy{"display": trimPolicy{}},
              }}
          }

          func (b *Boundary) NormalizeLabel(value string) (string, error) {
              policy, ok := b.registry.policies["label"]
              if !ok {
                  return "", errors.New("label policy unavailable")
              }
              return policy.Normalize(value), nil
          }
      - path: boundary_test.go
        content: |
          package boundary

          import "testing"

          func TestLabelBoundaryPreservesContract(t *testing.T) {
              boundary := NewBoundary()
              cases := []struct {
                  name  string
                  input string
                  want  string
              }{
                  {name: "surrounded", input: "  api event  ", want: "api event"},
                  {name: "already normalized", input: "ready", want: "ready"},
                  {name: "empty", input: "  ", want: ""},
              }

              for _, tc := range cases {
                  t.Run(tc.name, func(t *testing.T) {
                      got, err := boundary.NormalizeLabel(tc.input)
                      if err != nil {
                          t.Fatalf("NormalizeLabel(%q): %v", tc.input, err)
                      }
                      if got != tc.want {
                          t.Fatalf("NormalizeLabel(%q)=%q, want %q", tc.input, got, tc.want)
                      }
                  })
              }
          }
    checks:
