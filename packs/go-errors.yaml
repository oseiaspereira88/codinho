        content: |
          module codinho-practice/extract-field-with-errors-as

          go 1.25.0
      - path: validate.go
        content: |
          package validate

          import (
              "errors"
          )

          import "fmt"

          // ValidationError reports which field failed validation.
          type ValidationError struct {
              Field string
          }

          func (e *ValidationError) Error() string {
              return fmt.Sprintf("invalid field: %s", e.Field)
          }

          // ValidateAge returns an error wrapping a *ValidationError when age is
          // negative.
          func ValidateAge(age int) error {
              if age < 0 {
                  return fmt.Errorf("validating age: %w", &ValidationError{Field: "age"})
              }
              return nil
          }

          // FieldFromError returns the Field of the *ValidationError wrapped
          // anywhere in err's chain, and whether one was found.
          func FieldFromError(err error) (field string, ok bool) {
              var target *ValidationError
              if errors.As(err, &target) && target != nil {
                  return target.Field, true
              }
              return "", false
          }
