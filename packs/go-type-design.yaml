challenges:
  - schema_version: 1
    id: go-type-design.clone-inventory-independently
    version: 1.0.0
    title: Clonar um inventário sem compartilhar a lista de itens
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [structs-and-pointers]
    competencies:
      primary: [clone-struct-with-independent-slice]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a clonagem de um Inventory cuja lista de itens nunca
      compartilha armazenamento com o original -- copiar a struct por
      valor não basta, porque o campo slice continuaria apontando para o
      mesmo backing array.
    constraints:
      - Não usar bibliotecas externas.
      - Items do clone não pode compartilhar backing array com Items do original.
    acceptance:
      - CloneInventory(inv) retorna uma Inventory com o mesmo Owner e os mesmos Items, na mesma ordem.
      - Mutar Items do clone nunca altera Items do original, mesmo quando o original tem capacidade excedente.
      - O isolamento vale mesmo quando Items do original está vazio mas tem capacidade excedente (make com comprimento 0 e capacidade maior que 0).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.copy-items-into-independent-slice
            kind: micro
            action: implement
            target: function
            title: Copiar Items para uma slice independente
            instruction:
              objective: Construir a slice Items do clone de forma que ela nunca compartilhe o backing array de inv.Items.
              scope: A construção do campo Items do valor retornado.
              constraints:
                - Items do clone não pode compartilhar backing array com Items do original.
            concepts: [struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: items-copied-independently
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.copy-remaining-fields
            kind: micro
            action: implement
            target: function
            title: Copiar os demais campos da struct
            instruction:
              objective: Copiar Owner e os demais campos de inv para o valor retornado.
              scope: Os campos de Inventory que não são Items.
              constraints:
                - Owner deve ser copiado com o mesmo valor de inv.Owner.
            concepts: [struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: copies-remaining-fields
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que return inv (copiando a struct inteira por valor) não seria suficiente para isolar Items?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/clone-inventory-independently

          go 1.25.0
      - path: inventory.go
        content: |
          package inventory

          // Inventory holds an owner and a list of item names.
          type Inventory struct {
              Owner string
              Items []string
          }

          // CloneInventory returns a copy of inv whose Items slice never shares
          // storage with inv's Items -- mutating one's Items must never affect
          // the other's.
          func CloneInventory(inv Inventory) Inventory {
              panic("not implemented")
          }
      - path: inventory_test.go
        content: |
          package inventory

          import (
              "reflect"
              "testing"
              "unsafe"
          )

          func TestCloneInventory(t *testing.T) {
              original := Inventory{Owner: "alice", Items: make([]string, 2, 10)}
              copy(original.Items, []string{"sword", "shield"})

              clone := CloneInventory(original)

              if !reflect.DeepEqual(clone, original) {
                  t.Fatalf("CloneInventory(...) = %+v, want %+v", clone, original)
              }

              t.Run("mutating the clone's items does not affect the original", func(t *testing.T) {
                  clone := CloneInventory(original)
                  clone.Items[0] = "bow"
                  if original.Items[0] != "sword" {
                      t.Errorf("original.Items[0] = %q after mutating clone, want unchanged %q", original.Items[0], "sword")
                  }
              })

              t.Run("clone items never point into original's backing array", func(t *testing.T) {
                  clone := CloneInventory(original)
                  if len(clone.Items) == 0 {
                      return
                  }
                  origStart := uintptr(unsafe.Pointer(unsafe.SliceData(original.Items)))
                  origEnd := origStart + uintptr(cap(original.Items))*unsafe.Sizeof(original.Items[0])
                  cloneStart := uintptr(unsafe.Pointer(unsafe.SliceData(clone.Items)))
                  if cloneStart >= origStart && cloneStart < origEnd {
                      t.Error("clone.Items shares backing array with original.Items")
                  }
              })

              t.Run("owner is copied", func(t *testing.T) {
                  clone := CloneInventory(original)
                  if clone.Owner != original.Owner {
                      t.Errorf("clone.Owner = %q, want %q", clone.Owner, original.Owner)
                  }
              })

              t.Run("empty items with spare capacity are still independent", func(t *testing.T) {
                  emptyWithCap := Inventory{Owner: "carol", Items: make([]string, 0, 5)}
                  clone := CloneInventory(emptyWithCap)
                  if len(clone.Items) != 0 {
                      t.Fatalf("clone.Items = %v, want empty", clone.Items)
                  }
                  origData := unsafe.SliceData(emptyWithCap.Items)
                  cloneData := unsafe.SliceData(clone.Items)
                  if origData != nil && cloneData == origData {
                      t.Error("clone.Items shares backing array with an empty-but-spare-capacity original")
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestCloneInventory$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-type-design.select-validator-true-nil
    version: 1.0.0
    title: Devolver um nil de interface verdadeiro quando não há validador
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [interfaces]
    competencies:
      primary: [return-true-nil-interface]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que escolhe um Validator por modo, devolvendo
      um nil de interface verdadeiro quando o modo é desconhecido -- não
      um ponteiro nil embrulhado em uma interface não nil.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Quando mode for desconhecido, o retorno deve ser comparável a nil com ==, resultando true.
      - O validador devolvido para um modo conhecido precisa estar de fato configurado, não apenas ser um ponteiro não nulo qualquer.
    acceptance:
      - SelectValidator("strict") retorna um Validator não nil, de fato configurado, cujo Validate() retorna nil.
      - SelectValidator("unknown") retorna um Validator que é == nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-configured-validator-for-known-mode
            kind: micro
            action: implement
            target: function
            title: Devolver um validador de fato configurado para o modo conhecido
            instruction:
              objective: Quando mode for "strict", devolver um Validator de fato configurado, capaz de validar sem erro.
              scope: O caso em que mode é "strict".
              constraints:
                - Não tratar ainda o caso de modo desconhecido.
            concepts: [typed-nil-interface-trap]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-configured-validator-for-known-mode
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.return-true-nil-for-unknown-mode
            kind: micro
            action: implement
            target: function
            title: Devolver um nil de interface verdadeiro para modo desconhecido
            instruction:
              objective: Quando mode não for reconhecido, garantir que o Validator devolvido seja comparável a nil com ==, resultando true.
              scope: O caso em que mode não é reconhecido.
              constraints:
                - Quando mode for desconhecido, o retorno deve ser comparável a nil com ==, resultando true.
            concepts: [typed-nil-interface-trap]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-true-nil-for-unknown-mode
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que devolver um *strictValidator nil como Validator (mesmo dentro do caso "strict") resulta em uma interface diferente de nil, mas que ainda pode falhar de forma inesperada ao ser usada?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/select-validator-true-nil

          go 1.25.0
      - path: validator.go
        content: |
          package validator

          import "errors"

          var errValidatorNotConfigured = errors.New("validator not configured")

          // Validator validates something and reports an error if invalid.
          type Validator interface {
              Validate() error
          }

          // strictValidator only validates successfully once configured with a
          // positive minLength -- a nil or zero-value strictValidator is not
          // configured.
          type strictValidator struct {
              minLength int
          }

          func (v *strictValidator) Validate() error {
              if v.minLength <= 0 {
                  return errValidatorNotConfigured
              }
              return nil
          }

          // SelectValidator returns a Validator for the given mode, or a true nil
          // interface (not a nil pointer wrapped in a non-nil interface) when
          // mode is unknown.
          func SelectValidator(mode string) Validator {
              panic("not implemented")
          }
      - path: validator_test.go
        content: |
          package validator

          import "testing"

          func TestSelectValidator(t *testing.T) {
              t.Run("known mode returns a usable, configured validator", func(t *testing.T) {
                  v := SelectValidator("strict")
                  if v == nil {
                      t.Fatal("SelectValidator(\"strict\") = nil, want non-nil")
                  }
                  if err := v.Validate(); err != nil {
                      t.Errorf("Validate() = %v, want nil (an unconfigured or nil-backed validator would fail here)", err)
                  }
              })

              t.Run("unknown mode returns a true nil interface", func(t *testing.T) {
                  v := SelectValidator("unknown")
                  if v != nil {
                      t.Errorf("SelectValidator(\"unknown\") = %#v, want nil interface", v)
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestSelectValidator$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-type-design.sum-list-with-nil-safe-receiver
    version: 1.0.0
    title: Somar uma lista encadeada com receptor seguro para nil
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [structs-and-pointers]
    competencies:
      primary: [handle-nil-receiver-safely]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a soma dos valores de uma lista encadeada de nós, de
      forma que o método funcione corretamente mesmo quando chamado em
      um *Node nil, representando uma lista vazia.
    constraints:
      - Não usar bibliotecas externas.
      - Chamar Sum em um *Node nil não pode panicar.
    acceptance:
      - Chamar Sum em um *Node nil retorna 0, sem panicar.
      - Um nó único retorna seu próprio Value.
      - Uma cadeia de nós retorna a soma de todos os Value, seguindo Next, incluindo valores negativos, valores repetidos (cada nó conta uma vez) e cadeias longas (a soma não pode parar em um prefixo fixo).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.handle-nil-receiver-first
            kind: micro
            action: implement
            target: function
            title: Garantir que um receptor nil nunca cause panic
            instruction:
              objective: Garantir que chamar Sum em um receptor nil não acesse nenhum campo e retorne 0.
              scope: Somente o tratamento do receptor nil.
              constraints:
                - Chamar Sum em um *Node nil não pode panicar.
            concepts: [nil-safe-pointer-receiver]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: handles-nil-receiver-first
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.sum-across-the-whole-chain
            kind: micro
            action: implement
            target: function
            title: Somar Value de n e de todos os nós alcançáveis a partir de Next
            instruction:
              objective: Quando n não é nil, incluir Value de n e de todos os nós alcançáveis a partir de Next no resultado.
              scope: O caso em que n não é nil.
              constraints:
                - Incluir Value de todos os nós da cadeia, seguindo Next até o fim.
            concepts: [nil-safe-pointer-receiver]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: sums-across-the-whole-chain
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que tratar o receptor nil já no início da função evita repetir essa checagem para cada nó restante da cadeia, seja a solução recursiva ou iterativa?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/sum-list-with-nil-safe-receiver

          go 1.25.0
      - path: node.go
        content: |
          package list

          // Node is one element of a singly linked list of ints.
          type Node struct {
              Value int
              Next  *Node
          }

          // Sum returns the sum of Value across n and all of its Next nodes. It
          // works correctly even when called on a nil *Node, returning 0 in that
          // case.
          func (n *Node) Sum() int {
              panic("not implemented")
          }
      - path: node_test.go
        content: |
          package list

          import "testing"

          func TestNodeSum(t *testing.T) {
              t.Run("nil receiver returns 0 without panicking", func(t *testing.T) {
                  var n *Node
                  if got := n.Sum(); got != 0 {
                      t.Errorf("nil.Sum() = %d, want 0", got)
                  }
              })

              t.Run("single node", func(t *testing.T) {
                  n := &Node{Value: 5}
                  if got := n.Sum(); got != 5 {
                      t.Errorf("Sum() = %d, want 5", got)
                  }
              })

              t.Run("chain of nodes", func(t *testing.T) {
                  n := &Node{Value: 1, Next: &Node{Value: 2, Next: &Node{Value: 3}}}
                  if got := n.Sum(); got != 6 {
                      t.Errorf("Sum() = %d, want 6", got)
                  }
              })

              t.Run("chain with a negative value", func(t *testing.T) {
                  n := &Node{Value: -3, Next: &Node{Value: 5}}
                  if got := n.Sum(); got != 2 {
                      t.Errorf("Sum() = %d, want 2", got)
                  }
              })

              t.Run("chain with repeated values counts each node", func(t *testing.T) {
                  n := &Node{Value: 2, Next: &Node{Value: 2}}
                  if got := n.Sum(); got != 4 {
                      t.Errorf("Sum() = %d, want 4", got)
                  }
              })

              t.Run("long chain includes every node, not just a fixed prefix", func(t *testing.T) {
                  const length = 20
                  var head *Node
                  want := 0
                  for i := length; i >= 1; i-- {
                      head = &Node{Value: i, Next: head}
                      want += i
                  }
                  if got := head.Sum(); got != want {
                      t.Errorf("Sum() over a %d-node chain = %d, want %d", length, got, want)
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestNodeSum$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-type-design.contains-generic-comparable
    version: 1.0.0
    title: Implementar uma checagem de pertencimento genérica
    kind: atomic
    difficulty: foundational
    estimated_minutes: 10
    themes: [generics]
    competencies:
      primary: [implement-generic-membership-check]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função genérica que verifica se um valor está
      presente em uma slice, funcionando para qualquer tipo comparável.
    constraints:
      - Não usar bibliotecas externas.
      - O parâmetro de tipo deve ter a constraint comparable.
    acceptance:
      - 'Contains([2,1,3], 2) retorna true, incluindo quando o valor procurado está no primeiro índice.'
      - 'Contains([1,2,3,4], 4) retorna true, mesmo quando o valor procurado não está entre os primeiros elementos.'
      - Contains funciona para qualquer índice de uma slice longa (20 elementos), não apenas para um prefixo fixo ou um subconjunto esparso de posições.
      - Contains([1,2,3], 5) retorna false.
      - 'Contains(["a","b"], "b") retorna true, funcionando também para string.'
      - 'Contains funciona para qualquer tipo comparable, incluindo bool e structs comparáveis -- não apenas int e string.'
      - Contains de uma slice vazia sempre retorna false.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.search-for-target-value
            kind: micro
            action: implement
            target: function
            title: Verificar se target aparece em items
            instruction:
              objective: Verificar se target aparece em items, comparando os elementos até encontrar uma correspondência ou concluir que nenhum corresponde.
              scope: O corpo da função.
              constraints:
                - Comparar cada elemento a target usando igualdade, não apenas verificar o comprimento de items.
            concepts: [generic-comparable-constraint]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: searches-for-target-value
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que a constraint any não seria suficiente para comparar elementos com == dentro de Contains?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/contains-generic-comparable

          go 1.25.0
      - path: contains.go
        content: |
          package genset

          // Contains reports whether target appears in items, for any comparable
          // type T.
          func Contains[T comparable](items []T, target T) bool {
              panic("not implemented")
          }
      - path: contains_test.go
        content: |
          package genset

          import "testing"

          type point struct {
              X, Y int
          }

          func TestContains(t *testing.T) {
              t.Run("ints", func(t *testing.T) {
                  if !Contains([]int{2, 1, 3}, 2) {
                      t.Error("Contains([2,1,3], 2) = false, want true (target at index 0)")
                  }
                  if !Contains([]int{1, 2, 3}, 2) {
                      t.Error("Contains([1,2,3], 2) = false, want true")
                  }
                  if !Contains([]int{1, 2, 3, 4}, 4) {
                      t.Error("Contains([1,2,3,4], 4) = false, want true (target beyond the first few elements)")
                  }
                  if Contains([]int{1, 2, 3}, 5) {
                      t.Error("Contains([1,2,3], 5) = true, want false")
                  }
              })

              t.Run("strings", func(t *testing.T) {
                  if !Contains([]string{"a", "b"}, "b") {
                      t.Error(`Contains(["a","b"], "b") = false, want true`)
                  }
                  if Contains([]string{"a", "b"}, "c") {
                      t.Error(`Contains(["a","b"], "c") = true, want false`)
                  }
              })

              t.Run("bools", func(t *testing.T) {
                  if !Contains([]bool{false, false}, false) {
                      t.Error("Contains([false,false], false) = false, want true")
                  }
                  if Contains([]bool{false, false}, true) {
                      t.Error("Contains([false,false], true) = true, want false")
                  }
              })

              t.Run("comparable struct", func(t *testing.T) {
                  pts := []point{{1, 2}, {3, 4}}
                  if !Contains(pts, point{3, 4}) {
                      t.Error("Contains(pts, {3,4}) = false, want true")
                  }
                  if Contains(pts, point{9, 9}) {
                      t.Error("Contains(pts, {9,9}) = true, want false")
                  }
              })

              t.Run("empty slice", func(t *testing.T) {
                  if Contains([]int{}, 1) {
                      t.Error("Contains([], 1) = true, want false")
                  }
              })

              t.Run("every index of a long slice is actually compared", func(t *testing.T) {
                  const length = 20
                  items := make([]int, length)
                  for i := range items {
                      items[i] = i
                  }
                  for target := 0; target < length; target++ {
                      if !Contains(items, target) {
                          t.Fatalf("Contains(items, %d) = false, want true (index %d must be compared, not just a fixed subset)", target, target)
                      }
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestContains$
        timeout: 20s
    variants: []

