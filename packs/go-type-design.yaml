  - schema_version: 1
    id: go-type-design.sum-list-with-nil-safe-receiver
    version: 1.0.0
    title: Somar uma lista encadeada com receptor seguro para nil
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [structs-and-pointers]
    competencies:
      primary: [handle-nil-receiver-safely]
      secondary: []
    prerequisites: []
    brief: >
      Uma lista encadeada de inteiros precisa expor uma soma coerente
      para uma lista vazia, um nó e uma sequência de nós, preservando
      valores válidos ao longo da cadeia.
    constraints:
      - Não usar bibliotecas externas.
      - Chamar Sum em um *Node nil não pode panicar.
    acceptance:
      - Chamar Sum em um *Node nil retorna 0, sem panicar.
      - Um nó único retorna seu próprio Value.
      - Uma cadeia de nós retorna a soma de todos os Value, seguindo Next, incluindo valores zero, negativos, valores repetidos (cada nó conta uma vez) e cadeias longas (a soma não pode parar em um prefixo fixo).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.inspect-receiver-addressability
            kind: macro
            title: Separar chamada conveniente e method set
            instruction:
              objective: Delimitar quando uma chamada de método de ponteiro depende de um valor endereçável e quando o method set permanece diferente.
              scope: O receptor de Node e a chamada de Sum nos casos da fixture.
            concepts: [method-set-addressability, nil-safe-pointer-receiver]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: addressability-and-method-set-are-separated
                kind: qualitative
            children:
