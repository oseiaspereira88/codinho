schema_version: 1
id: go-type-design
version: 1.1.0
themes:
  - id: structs-and-pointers
    title: Structs e ponteiros
  - id: interfaces
    title: Interfaces
  - id: generics
    title: Generics
concepts:
  - id: struct-shallow-copy-aliasing
    title: Aliasing em cópia rasa de struct
    content:
      version: 1
      explanation: Copiar uma struct por valor copia o descritor de uma slice, não os elementos do backing array. O valor novo ganha identidade própria para campos escalares, mas alterações nos elementos compartilhados continuam visíveis. Faça uma cópia explícita dos elementos quando o contrato exigir independência.
      example:
        context: perfil com etiquetas
        code: |
          package example

          import "testing"

          type Profile struct { Name string; Tags []string }

          func clone(p Profile) Profile {
              tags := append([]string(nil), p.Tags...)
              p.Tags = tags
              return p
          }

          func TestClone(t *testing.T) {
              original := Profile{Name: "Ana", Tags: []string{"go"}}
              copy := clone(original)
              copy.Tags[0] = "rust"
              if original.Tags[0] != "go" { t.Fatal("shared tags") }
          }
        explanation: A nova slice recebe seus próprios elementos e não altera a lista original.
      relation_refs:
        - kind: relates_to
          concept_id: nil-safe-pointer-receiver
  - id: typed-nil-interface-trap
    title: Armadilha do nil tipado dentro de uma interface
    content:
      version: 1
      explanation: Uma interface só é nil quando tipo dinâmico e valor dinâmico estão ausentes. Atribuir um ponteiro nil a uma interface preenche o tipo dinâmico; a comparação com nil então resulta falsa. Verifique o ponteiro antes de encaixotá-lo ou defina claramente o comportamento do método para receptor nil.
      example:
        context: resultado opcional
        code: |
          package example

          import "testing"

          type Notice interface { Text() string }
          type notice struct{}
          func (*notice) Text() string { return "notice" }

          func optional(ok bool) Notice {
              if !ok { return nil }
              return (*notice)(nil)
          }

          func TestTypedNil(t *testing.T) {
              if optional(false) != nil { t.Fatal("expected true nil") }
              if optional(true) == nil { t.Fatal("typed nil was lost") }
          }
        explanation: O retorno falso é nil real; o retorno verdadeiro contém um ponteiro nil dentro de uma interface não nil.
      relation_refs:
        - kind: relates_to
          concept_id: nil-safe-pointer-receiver
  - id: nil-safe-pointer-receiver
    title: Receptor de ponteiro seguro para nil
    content:
      version: 1
      explanation: "Um método com receptor de ponteiro pode receber nil e decidir um resultado seguro antes de acessar campos. Isso pode ser útil para tipos opcionais, mas não transforma toda API em nil-safe: métodos devem documentar a decisão e evitar esconder estado inválido."
      example:
        context: nome de uma etiqueta opcional
        code: |
          package example

          import "testing"

          type Tag struct { Value string }
          func (t *Tag) Text() string {
              if t == nil { return "" }
              return t.Value
          }

          func TestNilReceiver(t *testing.T) {
              var absent *Tag
              if absent.Text() != "" { t.Fatal("nil receiver") }
              if (&Tag{Value: "go"}).Text() != "go" { t.Fatal("value") }
          }
        explanation: A guarda precede o acesso a Value e define o retorno para o receptor ausente.
      relation_refs:
        - kind: relates_to
          concept_id: typed-nil-interface-trap
  - id: generic-comparable-constraint
    title: Constraint comparable em funções genéricas
    content:
      version: 1
      explanation: A constraint comparable limita T aos tipos que podem usar == e !=. Isso permite implementar operações de pertencimento sem reflet ou conversões, mas exclui slices, maps e funções, que não são comparáveis. A constraint expressa uma necessidade real da operação.
      example:
        context: pertencimento em uma coleção
        code: |
          package example

          import "testing"

          func contains[T comparable](values []T, want T) bool {
              for _, value := range values { if value == want { return true } }
              return false
          }

          func TestContains(t *testing.T) {
              if !contains([]string{"go", "rust"}, "rust") { t.Fatal("missing") }
              if contains([]int{1, 2}, 3) { t.Fatal("unexpected") }
          }
        explanation: A mesma função compara strings e inteiros porque ambos satisfazem comparable.
      relation_refs:
        - kind: relates_to
          concept_id: generic-two-type-parameters
  - id: safe-type-assertion
    title: Type assertion segura com comma-ok
    content:
      version: 1
      explanation: "A forma value, ok := item.(T) informa se o valor dinâmico implementa ou é do tipo T sem panicar. A forma direta item.(T) é apropriada apenas quando a invariância já foi garantida e um panic é realmente o contrato. Trate o caminho falso antes de acessar o valor convertido."
      example:
        context: mensagens de eventos
        code: |
          package example

          import "testing"

          type Event interface{ event() }
          type Login struct{ User string }
          func (Login) event() {}

          func username(event Event) (string, bool) {
              login, ok := event.(Login)
              if !ok { return "", false }
              return login.User, true
          }

          func TestAssertion(t *testing.T) {
              name, ok := username(Login{User: "ana"})
              if !ok || name != "ana" { t.Fatal(name, ok) }
          }
        explanation: O comma-ok transforma um tipo inesperado em resultado controlável, sem panic.
      relation_refs:
        - kind: relates_to
          concept_id: typed-nil-interface-trap
  - id: generic-two-type-parameters
    title: Função genérica com dois parâmetros de tipo
    content:
      version: 1
      explanation: Uma função pode declarar parâmetros de tipo independentes e relacioná-los na assinatura. O compilador infere os tipos quando os argumentos tornam a relação inequívoca; explicitar os parâmetros pode ajudar em APIs ambíguas. Mantenha a transformação separada da política de ordenação ou validação.
      example:
        context: associação de chaves e valores
        code: |
          package example

          import "testing"

          func Pair[K comparable, V any](keys []K, values []V) map[K]V {
              out := make(map[K]V, len(keys))
              for i, key := range keys {
                  if i == len(values) { break }
                  out[key] = values[i]
              }
              return out
          }

          func TestPair(t *testing.T) {
              got := Pair([]string{"a", "b"}, []int{1, 2})
              if got["a"] != 1 || got["b"] != 2 { t.Fatal(got) }
          }
        explanation: K precisa ser comparável para chave de map; V pode ser qualquer tipo.
      relation_refs:
        - kind: relates_to
          concept_id: generic-comparable-constraint
competencies:
  - id: clone-struct-with-independent-slice
    title: Clonar uma struct com slice de forma independente
  - id: return-true-nil-interface
    title: Retornar um nil de interface verdadeiro
  - id: handle-nil-receiver-safely
    title: Tratar um receptor nil com segurança
  - id: implement-generic-membership-check
    title: Implementar uma checagem de pertencimento genérica
  - id: assert-type-without-panicking
    title: Verificar um tipo concreto sem panicar
  - id: implement-generic-transform
    title: Implementar uma transformação genérica
tracks: []
challenges:
  - schema_version: 1
    id: go-type-design.clone-inventory-independently
    version: 1.0.0
    title: Clonar um inventário sem compartilhar a lista de itens
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [structs-and-pointers]
    competencies:
      primary: [clone-struct-with-independent-slice]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a clonagem de um Inventory cuja lista de itens nunca
      compartilha armazenamento com o original -- copiar a struct por
      valor não basta, porque o campo slice continuaria apontando para o
      mesmo backing array.
    constraints:
      - Não usar bibliotecas externas.
      - Items do clone não pode compartilhar backing array com Items do original.
    acceptance:
      - CloneInventory(inv) retorna uma Inventory com o mesmo Owner e os mesmos Items, na mesma ordem.
      - Mutar Items do clone nunca altera Items do original, mesmo quando o original tem capacidade excedente.
      - O isolamento vale mesmo quando Items do original está vazio mas tem capacidade excedente (make com comprimento 0 e capacidade maior que 0).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.copy-items-into-independent-slice
            kind: micro
            action: implement
            target: function
            title: Copiar Items para uma slice independente
            instruction:
              objective: Construir a slice Items do clone de forma que ela nunca compartilhe o backing array de inv.Items.
              scope: A construção do campo Items do valor retornado.
              constraints:
                - Items do clone não pode compartilhar backing array com Items do original.
            concepts: [struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: items-copied-independently
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.copy-remaining-fields
            kind: micro
            action: implement
            target: function
            title: Copiar os demais campos da struct
            instruction:
              objective: Copiar Owner e os demais campos de inv para o valor retornado.
              scope: Os campos de Inventory que não são Items.
              constraints:
                - Owner deve ser copiado com o mesmo valor de inv.Owner.
            concepts: [struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: copies-remaining-fields
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que return inv (copiando a struct inteira por valor) não seria suficiente para isolar Items?
            children:
              - id: model.verify-capacity-edge
                kind: micro
                action: verify
                target: aliasing
                title: Verificar slice vazia com capacidade excedente
                instruction:
                  objective: Teste o clone quando Items tem comprimento zero e capacidade maior que zero, confirmando que uma futura escrita não alcança o original.
                  scope: Apenas o caso de capacidade excedente.
                concepts: [struct-shallow-copy-aliasing]
                evidence:
                  strategies: [compile]
                criteria:
                  - id: spare-capacity-isolated
                    kind: structural
                completion:
                  requires_positive_evaluation: true
                  requires_user_confirmation: false
              - id: model.verify-owner-preserved
                kind: micro
                action: verify
                target: output
                title: Verificar preservação do proprietário
                instruction:
                  objective: Compare Owner no clone com Owner na entrada e confirme que a cópia profunda da slice não descartou o campo escalar.
                  scope: Apenas os campos escalares do valor retornado.
                concepts: [struct-shallow-copy-aliasing]
                evidence:
                  strategies: [compile]
                criteria:
                  - id: owner-preserved
                    kind: structural
                completion:
                  requires_positive_evaluation: true
                  requires_user_confirmation: false
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/clone-inventory-independently

          go 1.25.0
      - path: inventory.go
        content: |
          package inventory

          // Inventory holds an owner and a list of item names.
          type Inventory struct {
              Owner string
              Items []string
          }

          // CloneInventory returns a copy of inv whose Items slice never shares
          // storage with inv's Items -- mutating one's Items must never affect
          // the other's.
          func CloneInventory(inv Inventory) Inventory {
              panic("not implemented")
          }
      - path: inventory_test.go
        content: |
          package inventory

          import (
              "reflect"
              "testing"
              "unsafe"
          )

          func TestCloneInventory(t *testing.T) {
              original := Inventory{Owner: "alice", Items: make([]string, 2, 10)}
              copy(original.Items, []string{"sword", "shield"})

              clone := CloneInventory(original)

              if !reflect.DeepEqual(clone, original) {
                  t.Fatalf("CloneInventory(...) = %+v, want %+v", clone, original)
              }

              t.Run("mutating the clone's items does not affect the original", func(t *testing.T) {
                  clone := CloneInventory(original)
                  clone.Items[0] = "bow"
                  if original.Items[0] != "sword" {
                      t.Errorf("original.Items[0] = %q after mutating clone, want unchanged %q", original.Items[0], "sword")
                  }
              })

              t.Run("clone items never point into original's backing array", func(t *testing.T) {
                  clone := CloneInventory(original)
                  if len(clone.Items) == 0 {
                      return
                  }
                  origStart := uintptr(unsafe.Pointer(unsafe.SliceData(original.Items)))
                  origEnd := origStart + uintptr(cap(original.Items))*unsafe.Sizeof(original.Items[0])
                  cloneStart := uintptr(unsafe.Pointer(unsafe.SliceData(clone.Items)))
                  if cloneStart >= origStart && cloneStart < origEnd {
                      t.Error("clone.Items shares backing array with original.Items")
                  }
              })

              t.Run("owner is copied", func(t *testing.T) {
                  clone := CloneInventory(original)
                  if clone.Owner != original.Owner {
                      t.Errorf("clone.Owner = %q, want %q", clone.Owner, original.Owner)
                  }
              })

              t.Run("empty items with spare capacity are still independent", func(t *testing.T) {
                  emptyWithCap := Inventory{Owner: "carol", Items: make([]string, 0, 5)}
                  clone := CloneInventory(emptyWithCap)
                  if len(clone.Items) != 0 {
                      t.Fatalf("clone.Items = %v, want empty", clone.Items)
                  }
                  origData := unsafe.SliceData(emptyWithCap.Items)
                  cloneData := unsafe.SliceData(clone.Items)
                  if origData != nil && cloneData == origData {
                      t.Error("clone.Items shares backing array with an empty-but-spare-capacity original")
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestCloneInventory$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/clone-inventory-independently

          go 1.25.0
      - path: inventory.go
        content: |
          package inventory

          // Inventory holds an owner and a list of item names.
          type Inventory struct {
              Owner string
              Items []string
          }

          // CloneInventory returns a copy of inv whose Items slice never shares
          // storage with inv's Items -- mutating one's Items must never affect
          // the other's.
          func CloneInventory(inv Inventory) Inventory {
              items := make([]string, len(inv.Items))
              copy(items, inv.Items)
              inv.Items = items
              return inv
          }
      - path: inventory_test.go
        content: |
          package inventory

          import (
              "reflect"
              "testing"
              "unsafe"
          )

          func TestCloneInventory(t *testing.T) {
              original := Inventory{Owner: "alice", Items: make([]string, 2, 10)}
              copy(original.Items, []string{"sword", "shield"})

              clone := CloneInventory(original)

              if !reflect.DeepEqual(clone, original) {
                  t.Fatalf("CloneInventory(...) = %+v, want %+v", clone, original)
              }

              t.Run("mutating the clone's items does not affect the original", func(t *testing.T) {
                  clone := CloneInventory(original)
                  clone.Items[0] = "bow"
                  if original.Items[0] != "sword" {
                      t.Errorf("original.Items[0] = %q after mutating clone, want unchanged %q", original.Items[0], "sword")
                  }
              })

              t.Run("clone items never point into original's backing array", func(t *testing.T) {
                  clone := CloneInventory(original)
                  if len(clone.Items) == 0 {
                      return
                  }
                  origStart := uintptr(unsafe.Pointer(unsafe.SliceData(original.Items)))
                  origEnd := origStart + uintptr(cap(original.Items))*unsafe.Sizeof(original.Items[0])
                  cloneStart := uintptr(unsafe.Pointer(unsafe.SliceData(clone.Items)))
                  if cloneStart >= origStart && cloneStart < origEnd {
                      t.Error("clone.Items shares backing array with original.Items")
                  }
              })

              t.Run("owner is copied", func(t *testing.T) {
                  clone := CloneInventory(original)
                  if clone.Owner != original.Owner {
                      t.Errorf("clone.Owner = %q, want %q", clone.Owner, original.Owner)
                  }
              })

              t.Run("empty items with spare capacity are still independent", func(t *testing.T) {
                  emptyWithCap := Inventory{Owner: "carol", Items: make([]string, 0, 5)}
                  clone := CloneInventory(emptyWithCap)
                  if len(clone.Items) != 0 {
                      t.Fatalf("clone.Items = %v, want empty", clone.Items)
                  }
                  origData := unsafe.SliceData(emptyWithCap.Items)
                  cloneData := unsafe.SliceData(clone.Items)
                  if origData != nil && cloneData == origData {
                      t.Error("clone.Items shares backing array with an empty-but-spare-capacity original")
                  }
              })
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-type-design.select-validator-true-nil
    version: 1.0.0
    title: Devolver um nil de interface verdadeiro quando não há validador
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [interfaces]
    competencies:
      primary: [return-true-nil-interface]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que escolhe um Validator por modo, devolvendo
      um nil de interface verdadeiro quando o modo é desconhecido -- não
      um ponteiro nil embrulhado em uma interface não nil.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Quando mode for desconhecido, o retorno deve ser comparável a nil com ==, resultando true.
      - O validador devolvido para um modo conhecido precisa estar de fato configurado, não apenas ser um ponteiro não nulo qualquer.
    acceptance:
      - SelectValidator("strict") retorna um Validator não nil, de fato configurado, cujo Validate() retorna nil.
      - SelectValidator("unknown") retorna um Validator que é == nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-configured-validator-for-known-mode
            kind: micro
            action: implement
            target: function
            title: Devolver um validador de fato configurado para o modo conhecido
            instruction:
              objective: Quando mode for "strict", devolver um Validator de fato configurado, capaz de validar sem erro.
              scope: O caso em que mode é "strict".
              constraints:
                - Não tratar ainda o caso de modo desconhecido.
            concepts: [typed-nil-interface-trap]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-configured-validator-for-known-mode
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.return-true-nil-for-unknown-mode
            kind: micro
            action: implement
            target: function
            title: Devolver um nil de interface verdadeiro para modo desconhecido
            instruction:
              objective: Quando mode não for reconhecido, garantir que o Validator devolvido seja comparável a nil com ==, resultando true.
              scope: O caso em que mode não é reconhecido.
              constraints:
                - Quando mode for desconhecido, o retorno deve ser comparável a nil com ==, resultando true.
            concepts: [typed-nil-interface-trap]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-true-nil-for-unknown-mode
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que devolver um *strictValidator nil como Validator (mesmo dentro do caso "strict") resulta em uma interface diferente de nil, mas que ainda pode falhar de forma inesperada ao ser usada?
            children:
              - id: model.verify-validator-identity
                kind: micro
                action: verify
                target: interface
                title: Verificar a identidade da interface
                instruction:
                  objective: Compare os retornos dos modos conhecido e desconhecido com nil e invoque Validate apenas no validador configurado.
                  scope: Somente a distinção entre interface nil e interface com tipo dinâmico.
                concepts: [typed-nil-interface-trap]
                evidence:
                  strategies: [compile, source_inspection]
                criteria:
                  - id: known-interface-non-nil
                    kind: structural
                  - id: unknown-interface-true-nil
                    kind: structural
                completion:
                  requires_positive_evaluation: true
                  requires_user_confirmation: false
              - id: model.explain-interface-zero-state
                kind: micro
                action: reflect
                target: decision
                title: Explicar o estado zero da interface
                instruction:
                  objective: Explique por que o retorno nil direto é diferente de encaixotar um ponteiro nil em Validator.
                  scope: Apenas a justificativa do contrato para modo desconhecido.
                concepts: [typed-nil-interface-trap]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: interface-zero-state-explained
                    kind: qualitative
                completion:
                  requires_positive_evaluation: false
                  requires_user_confirmation: true
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/select-validator-true-nil

          go 1.25.0
      - path: validator.go
        content: |
          package validator

          import "errors"

          var errValidatorNotConfigured = errors.New("validator not configured")

          // Validator validates something and reports an error if invalid.
          type Validator interface {
              Validate() error
          }

          // strictValidator only validates successfully once configured with a
          // positive minLength -- a nil or zero-value strictValidator is not
          // configured.
          type strictValidator struct {
              minLength int
          }

          func (v *strictValidator) Validate() error {
              if v.minLength <= 0 {
                  return errValidatorNotConfigured
              }
              return nil
          }

          // SelectValidator returns a Validator for the given mode, or a true nil
          // interface (not a nil pointer wrapped in a non-nil interface) when
          // mode is unknown.
          func SelectValidator(mode string) Validator {
              panic("not implemented")
          }
      - path: validator_test.go
        content: |
          package validator

          import "testing"

          func TestSelectValidator(t *testing.T) {
              t.Run("known mode returns a usable, configured validator", func(t *testing.T) {
                  v := SelectValidator("strict")
                  if v == nil {
                      t.Fatal("SelectValidator(\"strict\") = nil, want non-nil")
                  }
                  if err := v.Validate(); err != nil {
                      t.Errorf("Validate() = %v, want nil (an unconfigured or nil-backed validator would fail here)", err)
                  }
              })

              t.Run("unknown mode returns a true nil interface", func(t *testing.T) {
                  v := SelectValidator("unknown")
                  if v != nil {
                      t.Errorf("SelectValidator(\"unknown\") = %#v, want nil interface", v)
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestSelectValidator$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/select-validator-true-nil

          go 1.25.0
      - path: validator.go
        content: |
          package validator

          import "errors"

          var errValidatorNotConfigured = errors.New("validator not configured")

          // Validator validates something and reports an error if invalid.
          type Validator interface {
              Validate() error
          }

          // strictValidator only validates successfully once configured with a
          // positive minLength -- a nil or zero-value strictValidator is not
          // configured.
          type strictValidator struct {
              minLength int
          }

          func (v *strictValidator) Validate() error {
              if v.minLength <= 0 {
                  return errValidatorNotConfigured
              }
              return nil
          }

          // SelectValidator returns a Validator for the given mode, or a true nil
          // interface (not a nil pointer wrapped in a non-nil interface) when
          // mode is unknown.
          func SelectValidator(mode string) Validator {
              if mode == "strict" {
                  return &strictValidator{minLength: 1}
              }
              return nil
          }
      - path: validator_test.go
        content: |
          package validator

          import "testing"

          func TestSelectValidator(t *testing.T) {
              t.Run("known mode returns a usable, configured validator", func(t *testing.T) {
                  v := SelectValidator("strict")
                  if v == nil {
                      t.Fatal("SelectValidator(\"strict\") = nil, want non-nil")
                  }
                  if err := v.Validate(); err != nil {
                      t.Errorf("Validate() = %v, want nil (an unconfigured or nil-backed validator would fail here)", err)
