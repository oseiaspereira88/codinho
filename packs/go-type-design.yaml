                      _, first := FirstCircleClone(reg)
                      want := Shape(Circle{Radius: float64(circleAt)})
                      if first != want {
                          t.Fatalf("circle at index %d: firstCircle = %#v, want %#v", circleAt, first, want)
                      }
                  }
              })
