              Value int
          }

          // FindFirstAtLeast returns the first non-nil node's Value that is
          // greater than or equal to min, and whether one was found.
          func FindFirstAtLeast(nodes []*Node, min int) (value int, found bool) {
              panic("not implemented")
          }
      - path: finder_test.go
        content: |
          package finder

          import "testing"

          func TestFindFirstAtLeast(t *testing.T) {
              cases := []struct {
                  name      string
                  nodes     []*Node
                  min       int
                  wantValue int
                  wantFound bool
              }{
                  {"skips nil and finds match", []*Node{nil, {Value: 3}, {Value: 10}}, 5, 10, true},
                  {"all nil returns not found", []*Node{nil, nil}, 0, 0, false},
                  {"first element already matches", []*Node{{Value: 7}, {Value: 1}}, 5, 7, true},
                  {"empty slice", nil, 0, 0, false},
                  {"no element meets minimum", []*Node{{Value: 1}, {Value: 2}}, 5, 0, false},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      gotValue, gotFound := FindFirstAtLeast(c.nodes, c.min)
                      if gotValue != c.wantValue || gotFound != c.wantFound {
                          t.Errorf("FindFirstAtLeast(%v, %d) = (%d, %v), want (%d, %v)", c.nodes, c.min, gotValue, gotFound, c.wantValue, c.wantFound)
                      }
                  })
              }
          }
