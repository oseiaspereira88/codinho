challenges:
  - schema_version: 1
    id: go-http.parse-json-request
    version: 1.0.0
    title: Analisar uma requisição JSON
    kind: atomic
    difficulty: foundational
    estimated_minutes: 20
    themes: [go-http.protocol]
    competencies:
      primary: [go-http.decode-json-request]
      secondary: [go-http.test-http-handler]
    prerequisites: []
    brief: Um endpoint recebe um objeto JSON pequeno e precisa rejeitar entradas malformadas sem expor detalhes internos.
    constraints:
      - Use encoding/json da biblioteca padrão.
      - Diferencie erro de sintaxe de resposta de sucesso.
    acceptance:
      - JSON válido produz uma resposta estruturada.
      - JSON malformado produz status de cliente sem panic.
      - O corpo da resposta usa um formato estável.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: parse-json
        macro_steps:
          - id: parse-json.plan
            kind: macro
            title: Definir a fronteira JSON
            children:
              - id: parse-json.decode
                kind: meso
                title: Decodificar e responder
                children:
                  - id: parse-json.read
                    kind: micro
                    action: implement
                    target: decoder
                    title: Ler o objeto recebido
                    instruction:
                      objective: Decodifique o objeto JSON da requisição.
                      scope: Somente a entrada e o tipo esperado.
                    concepts: [go-http.json-encoding]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: json-is-decoded, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: parse-json.error
                    kind: micro
                    action: verify
                    target: error-response
                    title: Tratar sintaxe inválida
                    instruction:
                      objective: Transforme erro de decodificação em resposta de cliente.
                      scope: O caminho de entrada inválida.
                    concepts: [go-http.error-response]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: malformed-json-is-rejected, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: parse-json.reflect
                    kind: micro
                    action: reflect
                    target: contract
                    title: Explicar o contrato de erro
                    instruction:
                      objective: Explique por que a resposta não deve vazar o erro interno completo.
                      scope: Status, formato e fronteira pública.
                    concepts: [go-http.json-encoding, go-http.error-response]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-json-error-boundary, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Que parte do erro pertence ao log interno e que parte pertence ao cliente?']}
  - schema_version: 1
    id: go-http.limit-http-body
    version: 1.0.0
    title: Limitar o corpo de uma requisição
    kind: atomic
    difficulty: foundational
    estimated_minutes: 20
    themes: [go-http.protocol]
    competencies:
      primary: [go-http.bound-request-body]
      secondary: [go-http.validate-http-method]
    prerequisites: [go-http.parse-json-request]
    brief: Um handler aceita JSON, mas precisa impor um limite de entrada antes de decodificar o conteúdo.
    constraints:
      - O limite deve ser aplicado antes da leitura completa.
      - O handler não pode depender de serviço externo.
    acceptance:
      - Um corpo dentro do limite é processado.
      - Um corpo acima do limite é rejeitado de forma observável.
      - O limite não é substituído por truncamento silencioso.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: body-limit
        macro_steps:
          - id: body-limit.plan
            kind: macro
            title: Proteger a leitura da entrada
            children:
              - id: body-limit.wrap
                kind: meso
                title: Aplicar limite e validar resultado
                children:
                  - id: body-limit.bound
                    kind: micro
                    action: implement
                    target: request-body
                    title: Aplicar o limite
                    instruction:
                      objective: Envolva o corpo recebido com um limite explícito.
                      scope: A fronteira de leitura do handler.
                    concepts: [go-http.body-limit]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: request-body-is-bounded, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: body-limit.reject
                    kind: micro
                    action: verify
                    target: negative-case
                    title: Rejeitar entrada grande
                    instruction:
                      objective: Verifique o comportamento quando o corpo excede o orçamento.
                      scope: Status e ausência de processamento parcial.
                    concepts: [go-http.body-limit, go-http.error-response]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: oversized-body-is-rejected, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: body-limit.reflect
                    kind: micro
                    action: reflect
                    target: resource-budget
                    title: Explicar o orçamento
                    instruction:
                      objective: Explique por que limite e validação são decisões diferentes.
                      scope: Memória, protocolo e resposta de erro.
                    concepts: [go-http.body-limit, go-http.handler-contract]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-body-budget, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Por que validar depois de ler tudo ainda deixa um risco de recurso?']}
  - schema_version: 1
    id: go-http.propagate-request-timeout
    version: 1.0.0
    title: Propagar timeout da requisição
    kind: atomic
    difficulty: foundational
    estimated_minutes: 25
    themes: [go-http.client-resilience]
    competencies:
      primary: [go-http.forward-request-deadline]
      secondary: [go-http.build-resilient-client]
    prerequisites: [go-http.limit-http-body]
    brief: Uma operação downstream deve respeitar o deadline recebido pelo handler em vez de criar uma espera independente.
    constraints:
      - Passe o contexto derivado da requisição ao trabalho downstream.
      - Não use time.Sleep para sincronizar o teste.
    acceptance:
      - O trabalho recebe o mesmo cancelamento lógico da requisição.
      - O handler não continua trabalho depois do deadline.
      - O caminho de timeout produz uma resposta estável.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: request-timeout
        macro_steps:
          - id: request-timeout.plan
            kind: macro
            title: Respeitar o tempo da requisição
            children:
              - id: request-timeout.context
                kind: meso
                title: Encadear o contexto
                children:
                  - id: request-timeout.read
                    kind: micro
                    action: implement
                    target: context
                    title: Obter contexto do request
                    instruction:
                      objective: Use o contexto associado à requisição no trabalho downstream.
                      scope: A chamada do handler para o serviço.
                    concepts: [go-http.request-context]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: request-context-is-forwarded, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: request-timeout.cancel
                    kind: micro
                    action: verify
                    target: deadline
                    title: Observar o deadline
                    instruction:
                      objective: Verifique o caminho em que o contexto é cancelado antes do resultado.
                      scope: Timeout e resposta de erro.
                    concepts: [go-http.deadline-propagation, go-http.client-timeout]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: deadline-stops-downstream-work, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: request-timeout.reflect
                    kind: micro
                    action: reflect
                    target: lifecycle
                    title: Explicar a propagação
                    instruction:
                      objective: Explique por que um contexto novo quebra o orçamento da requisição.
                      scope: Cancelamento e responsabilidade do chamador.
                    concepts: [go-http.request-context, go-http.deadline-propagation]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-deadline-propagation, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Como distinguir timeout do cliente de erro interno do serviço?']}
  - schema_version: 1
    id: go-http.compose-json-handler-middleware
    version: 1.0.0
    title: Compor handler JSON com middleware
    kind: combined
    difficulty: intermediate
    estimated_minutes: 35
    themes: [go-http.protocol]
    competencies:
      primary: [go-http.compose-middleware, go-http.validate-http-method]
      secondary: [go-http.decode-json-request]
    prerequisites: [go-http.propagate-request-timeout]
    brief: Um endpoint JSON precisa validar método, aplicar uma política transversal e preservar o contrato do handler.
    constraints:
      - Middleware deve envolver sem duplicar a resposta.
      - Método não permitido deve terminar antes da decodificação.
    acceptance:
      - O método permitido chega ao handler interno.
      - Método não permitido recebe status de cliente sem executar o corpo.
      - O middleware mantém headers e status coerentes.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: handler-middleware
        macro_steps:
          - id: handler-middleware.plan
            kind: macro
            title: Compor responsabilidades HTTP
            children:
              - id: handler-middleware.method
                kind: meso
                title: Validar antes de delegar
                children:
                  - id: handler-middleware.check
                    kind: micro
                    action: implement
                    target: method
                    title: Validar o método
                    instruction:
                      objective: Restrinja a entrada ao método contratado.
                      scope: A decisão antes do handler interno.
                    concepts: [go-http.method-validation]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: method-is-checked-first, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: handler-middleware.wrap
                    kind: micro
                    action: implement
                    target: middleware
                    title: Encadear middleware
                    instruction:
                      objective: Envolva o handler sem assumir o controle do contrato interno.
                      scope: Ordem de composição e delegação.
                    concepts: [go-http.middleware-chain]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: middleware-delegates-once, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: handler-middleware.reflect
                    kind: micro
                    action: reflect
                    target: contract
                    title: Explicar a ordem
                    instruction:
                      objective: Explique por que validação de método precede parsing do corpo.
                      scope: Custo e comportamento observável.
                    concepts: [go-http.method-validation, go-http.middleware-chain]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-middleware-order, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Que erro aparece se dois níveis escrevem status sem uma política de ownership?']}
  - schema_version: 1
    id: go-http.configure-http-server-lifecycle
    version: 1.0.0
    title: Configurar lifecycle de servidor HTTP
    kind: combined
    difficulty: intermediate
    estimated_minutes: 40
    themes: [go-http.server-lifecycle]
    competencies:
      primary: [go-http.manage-server-lifecycle]
      secondary: [go-http.forward-request-deadline]
    prerequisites: [go-http.compose-json-handler-middleware]
    brief: Um servidor precisa iniciar, aceitar cancelamento e encerrar sem abandonar requests em andamento.
    constraints:
      - O shutdown deve receber o contexto de encerramento.
      - Não trate erro normal de shutdown como falha inesperada.
    acceptance:
      - O servidor publica seu endereço somente depois de iniciar.
      - O cancelamento dispara shutdown com prazo definido.
      - O erro final diferencia encerramento esperado de falha de serve.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: server-lifecycle
        macro_steps:
          - id: server-lifecycle.plan
            kind: macro
            title: Orquestrar o servidor
            children:
              - id: server-lifecycle.start
                kind: meso
                title: Iniciar e anunciar
                children:
                  - id: server-lifecycle.configure
                    kind: micro
                    action: implement
                    target: server
                    title: Configurar o servidor
                    instruction:
                      objective: Defina handler, endereço e limites do servidor.
                      scope: Configuração antes da goroutine de serve.
                    concepts: [go-http.server-lifecycle-concept]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: server-has-explicit-config, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: server-lifecycle.shutdown
                    kind: micro
                    action: implement
                    target: shutdown
                    title: Encerrar com contexto
                    instruction:
                      objective: Conecte cancelamento ao shutdown do servidor.
                      scope: Caminho de encerramento gracioso.
                    concepts: [go-http.server-lifecycle-concept, go-http.request-context]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: shutdown-uses-context, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: server-lifecycle.reflect
                    kind: micro
                    action: reflect
                    target: errors
                    title: Explicar erros de lifecycle
                    instruction:
                      objective: Explique como diferenciar shutdown esperado de falha de serve.
                      scope: Classificação do erro retornado.
                    concepts: [go-http.server-lifecycle-concept, go-http.error-response]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-server-error-policy, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Por que fechar o listener não é equivalente a aguardar requests?']}
  - schema_version: 1
    id: go-http.build-resilient-http-client
    version: 1.0.0
    title: Construir cliente HTTP resiliente
    kind: combined
    difficulty: intermediate
    estimated_minutes: 40
    themes: [go-http.client-resilience]
    competencies:
      primary: [go-http.build-resilient-client]
      secondary: [go-http.forward-request-deadline]
    prerequisites: [go-http.configure-http-server-lifecycle]
    brief: Um cliente chama um serviço local e precisa respeitar timeout, reutilizar transport e tratar response body corretamente.
    constraints:
      - Não crie um transport novo a cada request.
      - Sempre feche o response body recebido.
    acceptance:
      - O request carrega o contexto do chamador.
      - Timeout e status não esperado são erros observáveis.
      - O body é fechado em caminhos de sucesso e erro após a resposta.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: resilient-client
        macro_steps:
          - id: resilient-client.plan
            kind: macro
            title: Delimitar o cliente
            children:
              - id: resilient-client.request
                kind: meso
                title: Executar request com política
                children:
                  - id: resilient-client.transport
                    kind: micro
                    action: implement
                    target: transport
                    title: Reutilizar transport
                    instruction:
                      objective: Configure um cliente com transport reutilizável.
                      scope: Construção e uso do cliente.
                    concepts: [go-http.transport-reuse]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: transport-is-reused, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: resilient-client.timeout
                    kind: micro
                    action: verify
                    target: context
                    title: Propagar contexto ao request
                    instruction:
                      objective: Verifique que cancelamento do chamador chega ao request.
                      scope: Timeout e erro de transporte.
                    concepts: [go-http.client-timeout, go-http.deadline-propagation]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: client-respects-context, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: resilient-client.reflect
                    kind: micro
                    action: reflect
                    target: response
                    title: Explicar o fechamento do body
                    instruction:
                      objective: Explique por que o response body precisa ser fechado mesmo quando o status falha.
                      scope: Reuso de conexão e cleanup.
                    concepts: [go-http.response-drain, go-http.transport-reuse]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-response-cleanup, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Que recurso fica preso quando o body não é fechado?']}
  - schema_version: 1
    id: go-http.tested-json-handler
    version: 1.0.0
    title: Testar handler JSON com httptest
    kind: functional_slice
    difficulty: intermediate
    estimated_minutes: 45
    themes: [go-http.protocol]
    competencies:
      primary: [go-http.test-http-handler, go-http.decode-json-request]
      secondary: [go-http.validate-http-method]
    prerequisites: [go-http.build-resilient-http-client]
    brief: Uma fatia de endpoint JSON deve ser implementada e testada sem abrir uma porta real.
    constraints:
      - Use httptest e requests locais.
      - Cubra sucesso, método inválido e JSON inválido.
    acceptance:
      - O baseline falha e a referência passa no check focado.
      - Os testes distinguem status, headers e payload.
      - O handler permanece isolado do sistema operacional.
    canonical: true
    publication: {status: draft, author: codex}
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/http-handler

          go 1.25.0
      - path: handler.go
        content: |
          package handler

          import "net/http"

          type Item struct {
              Name string `json:"name"`
          }

          func Serve(w http.ResponseWriter, r *http.Request) {
              http.Error(w, "not implemented", http.StatusNotImplemented)
          }
      - path: handler_test.go
        content: |
          package handler

          import (
              "encoding/json"
              "net/http"
              "net/http/httptest"
              "strings"
              "testing"
          )

          func TestServe(t *testing.T) {
              request := httptest.NewRequest(http.MethodPost, "/items", strings.NewReader(`{"name":"box"}`))
              response := httptest.NewRecorder()
              Serve(response, request)
