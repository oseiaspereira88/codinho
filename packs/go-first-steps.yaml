              }{
                  {"valid", "25", 25, false},
                  {"valid with surrounding spaces", " 25 ", 25, false},
                  {"empty", "", 0, true},
                  {"whitespace only", "   ", 0, true},
                  {"not a number", "abc", 0, true},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      age, err := ParseAge(c.in)
                      if age != c.wantAge {
                          t.Errorf("ParseAge(%q) age = %d, want %d", c.in, age, c.wantAge)
                      }
                      if (err != nil) != c.wantErr {
                          t.Errorf("ParseAge(%q) err = %v, wantErr %v", c.in, err, c.wantErr)
                      }
                  })
              }
