  brief: Construa uma fronteira HTTP local com identidade explícita, limite de corpo, correlação e logs seguros.
  constraints:
  - Use httptest e valores sintéticos.
  - Não escreva o segredo em resposta ou log.
  - O limite deve funcionar mesmo sem Content-Length confiável.
  acceptance:
  - Identidade desconhecida recebe 401.
  - Entrada acima do limite recebe 413.
  - Logs preservam correlação e não contêm o segredo sintético.
