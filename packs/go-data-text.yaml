      secondary: []
    prerequisites: [strconv-error-handling, map-comma-ok-lookup]
    brief: >
      Um placar chega como uma sequência de entradas textuais no formato
      "nome:placar". Construa os resultados válidos por nome e preserve, em
      ordem de chegada, as entradas com formato inválido ou placar que não
      pôde ser interpretado; mantenha o primeiro placar válido de cada nome,
      inclusive quando for 0.
    constraints:
