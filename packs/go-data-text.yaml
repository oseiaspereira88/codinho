      - path: rows_test.go
        content: |
          package rows

          import (
              "reflect"
              "testing"
          )

          func TestFormatNames(t *testing.T) {
              names := []string{"", "alice smith", "o'brien, jane", ""}

              got := FormatNames(names)
              want := []string{"Alice Smith", `"O'brien, Jane"`}
              if !reflect.DeepEqual(got, want) {
                  t.Errorf("FormatNames(%v) = %v, want %v", names, got, want)
              }

              t.Run("capacity is preallocated to exactly len(names)", func(t *testing.T) {
                  if cap(got) != len(names) {
                      t.Errorf("cap(FormatNames(...)) = %d, want exactly %d", cap(got), len(names))
                  }
              })

              t.Run("no blanks, no quoting needed", func(t *testing.T) {
                  got := FormatNames([]string{"bob", "carol jones"})
                  want := []string{"Bob", "Carol Jones"}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("FormatNames(...) = %v, want %v", got, want)
                  }
                  if cap(got) != 2 {
                      t.Errorf("cap = %d, want 2", cap(got))
                  }
              })

              t.Run("all blank", func(t *testing.T) {
                  got := FormatNames([]string{"", ""})
                  if len(got) != 0 {
                      t.Errorf("FormatNames(all blank) = %v, want empty", got)
                  }
              })

              t.Run("empty input", func(t *testing.T) {
                  got := FormatNames(nil)
                  if len(got) != 0 {
                      t.Errorf("FormatNames(nil) = %v, want empty", got)
                  }
              })

              t.Run("original spacing preserved through title-casing", func(t *testing.T) {
                  got := FormatNames([]string{"  bob   smith  "})
                  want := []string{"  Bob   Smith  "}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("FormatNames(...) = %v, want %v", got, want)
                  }
              })

              t.Run("whitespace-only name is not treated as blank", func(t *testing.T) {
                  got := FormatNames([]string{"   "})
                  want := []string{"   "}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("FormatNames(...) = %v, want %v", got, want)
                  }
              })

              t.Run("internal quotes are doubled after title-casing", func(t *testing.T) {
                  got := FormatNames([]string{`say "hi" john`})
                  want := []string{`"Say ""hi"" John"`}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("FormatNames(...) = %v, want %v", got, want)
                  }
              })
          }
