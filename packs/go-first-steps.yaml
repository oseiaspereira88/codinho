schema_version: 1
id: go-first-steps
version: 1.6.0
themes:
  - id: slices
    title: Slices e arrays
  - id: declarations-and-types
    title: Declarações e tipos
  - id: tooling
    title: Ambiente e tooling
concepts:
  - id: slice-declaration
    title: Declaração de slice
    content:
      version: 1
      explanation: Uma slice declara uma sequência com comprimento variável. nil, uma slice vazia e uma slice com capacidade reservada podem ter comportamentos diferentes em comparação e alocação, embora len(nil) seja zero. Escolha a forma conforme o contrato e use append para crescer a sequência.
      example:
        context: lista de tarefas
        code: |
          package example

          import "testing"

          func addTask(tasks []string, task string) []string {
              return append(tasks, task)
          }

          func TestSlice(t *testing.T) {
              var tasks []string
              tasks = addTask(tasks, "estudar")
              if len(tasks) != 1 || tasks[0] != "estudar" { t.Fatal(tasks) }
          }
        explanation: A slice nil pode receber append diretamente e passa a conter o item.
      relation_refs:
        - kind: relates_to
          concept_id: zero-values
  - id: range-loop
    title: Laço range
    content:
      version: 1
      explanation: range percorre arrays, slices, maps, strings ou canais conforme o tipo. Em strings, o índice aponta para o byte inicial e o valor é um rune; em maps, a ordem não é garantida. Use o segundo valor quando precisar do elemento e descarte com _ quando só o índice importar.
      example:
        context: soma de valores
        code: |
          package example

          import "testing"

          func sum(values []int) int {
              total := 0
              for _, value := range values { total += value }
              return total
          }

          func TestRange(t *testing.T) {
              if sum([]int{2, 3, 5}) != 10 { t.Fatal("sum") }
          }
        explanation: O índice é descartado e o segundo valor alimenta o acumulador.
      relation_refs:
        - kind: relates_to
          concept_id: slice-declaration
  - id: named-types
    title: Tipos nomeados
    content:
      version: 1
      explanation: Um tipo nomeado cria uma identidade própria mesmo quando sua representação subjacente é conhecida. Isso permite métodos e contratos mais claros, mas valores de tipos nomeados distintos não são intercambiáveis sem conversão explícita. Use o nome para representar uma regra do domínio, não apenas para renomear uma variável.
      example:
        context: identificador de usuário
        code: |
          package example

          import "testing"

          type UserID string

          func label(id UserID) string { return "user:" + string(id) }

          func TestNamedType(t *testing.T) {
              if label(UserID("42")) != "user:42" { t.Fatal("label") }
          }
        explanation: A conversão para string é explícita na fronteira da representação.
      relation_refs:
        - kind: relates_to
          concept_id: type-conversion
  - id: structs
    title: Structs
    content:
      version: 1
      explanation: Uma struct agrupa campos nomeados que formam um valor composto. O literal nomeado torna a intenção resistente à reordenação de campos; campos não exportados restringem acesso fora do package. Copiar uma struct copia seus campos conforme o tipo de cada um.
      example:
        context: ponto geométrico
        code: |
          package example

          import "testing"

          type Point struct { X, Y int }

          func TestStruct(t *testing.T) {
              p := Point{X: 2, Y: 3}
              if p.X+p.Y != 5 { t.Fatal(p) }
          }
        explanation: O literal nomeado associa valores aos campos explicitamente.
      relation_refs:
        - kind: relates_to
          concept_id: field-types
  - id: field-types
    title: Tipos de campo
    content:
      version: 1
      explanation: Cada campo de uma struct tem um tipo que define seu zero value, operações e representação. Campos podem ser escalares, slices, maps, ponteiros ou outras structs; essa escolha determina cópia, aliasing e necessidade de nil checks. Modele o campo pelo comportamento que o domínio precisa.
      example:
        context: cadastro mínimo
        code: |
          package example

          import "testing"

          type User struct { Name string; Scores []int; Active bool }

          func TestFields(t *testing.T) {
              var user User
              if user.Name != "" || user.Scores != nil || user.Active { t.Fatal(user) }
          }
        explanation: "Os três campos exibem zeros distintos: string vazia, slice nil e false."
      relation_refs:
        - kind: relates_to
          concept_id: zero-values
  - id: zero-values
    title: Valores zero
    content:
      version: 1
      explanation: "Toda variável declarada sem inicializador recebe o valor zero do tipo: 0, false, string vazia, ponteiro nil ou uma estrutura composta por zeros. Projetar tipos cujo zero value seja útil reduz construtores obrigatórios e torna declarações locais seguras. Zero não significa ausência em todo domínio; modele essa diferença quando necessário."
      example:
        context: acumulador inicial
        code: |
          package example

          import "testing"

          type Counter struct { N int; Active bool }

          func TestZero(t *testing.T) {
              var c Counter
              if c.N != 0 || c.Active { t.Fatal(c) }
              var names []string
              if names != nil || len(names) != 0 { t.Fatal(names) }
          }
        explanation: O zero de Counter é um estado observável e o de slice é nil com comprimento zero.
      relation_refs:
        - kind: relates_to
          concept_id: slice-declaration
  - id: short-variable-declaration
    title: Declaração curta de variável (:=)
    content:
      version: 1
      explanation: Uma declaração associa um nome a um valor e a um tipo em um escopo. A forma := infere o tipo e exige ao menos uma variável nova no lado esquerdo dentro do escopo atual. Prefira declarar no escopo mais curto que comunique a intenção.
      example:
        context: configuração de uma saudação
        code: |
          package example

          import "testing"

          func greeting(name string) string {
              prefix := "Olá"
              return prefix + ", " + name
          }

          func TestGreeting(t *testing.T) {
              if greeting("Ana") != "Olá, Ana" { t.Fatal(greeting("Ana")) }
          }
        explanation: prefix nasce no escopo da função e participa da composição sem estado global.
      relation_refs:
        - kind: relates_to
          concept_id: zero-values
  - id: constant-declaration
    title: Declaração de constantes
    content:
      version: 1
      explanation: Constantes são valores nomeados avaliados em compilação e não podem ser reatribuídos. Uma constante sem tipo pode assumir um tipo no contexto de uso, enquanto uma constante tipada já tem conversões mais restritas. Use constantes para valores estáveis que fazem parte da regra do programa.
      example:
        context: limite de tentativas
        code: |
          package example

          import "testing"

          const maxAttempts = 3

          func allowed(attempt int) bool { return attempt <= maxAttempts }

          func TestConstant(t *testing.T) {
              if !allowed(2) || allowed(4) { t.Fatal("limit") }
          }
        explanation: O limite é nomeado e não muda durante a execução.
      relation_refs:
        - kind: relates_to
          concept_id: iota-sequence
  - id: iota-sequence
    title: Sequência com iota
    content:
      version: 1
      explanation: iota reinicia em cada bloco const e incrementa a cada especificação de constante. Ele é útil para enumerar valores, mas os números não devem ser tratados como uma ordenação de negócio sem uma regra explícita. Comece em um valor que reserve zero para desconhecido quando isso fizer sentido.
      example:
        context: estados de tarefa
        code: |
          package example

          import "testing"

          const (
              Unknown = iota
              Pending
              Done
          )

          func TestIota(t *testing.T) {
              if Unknown != 0 || Pending != 1 || Done != 2 { t.Fatal(Unknown, Pending, Done) }
          }
        explanation: A sequência é determinada pela posição das declarações dentro do bloco.
      relation_refs:
        - kind: relates_to
          concept_id: constant-declaration
  - id: type-conversion
    title: Conversão de tipo explícita
    content:
      version: 1
      explanation: Conversão cria um valor de outro tipo quando a linguagem permite a transformação. Ela não valida automaticamente domínio, overflow ou perda de precisão; essas decisões precisam ser verificadas antes ou depois da conversão. Tipos nomeados exigem conversão explícita mesmo com a mesma representação subjacente.
      example:
        context: distância inteira
        code: |
          package example

          import "testing"

          type Meters int

          func TestConversion(t *testing.T) {
              raw := 12
              distance := Meters(raw)
              if distance != 12 { t.Fatal(distance) }
          }
        explanation: A conversão de int para Meters é explícita na fronteira do domínio.
      relation_refs:
        - kind: relates_to
          concept_id: named-types
  - id: go-modules
    title: Módulos Go (go.mod)
    content:
      version: 1
      explanation: go.mod identifica o módulo, declara a versão de linguagem e registra dependências. O caminho do módulo participa dos imports; mantê-lo coerente com a organização do projeto evita imports quebrados. Ferramentas como go test e go list usam esse arquivo para resolver o contexto de compilação.
      example:
        context: módulo mínimo
        code: |
          package example

          import "testing"

          func TestModuleContext(t *testing.T) {
              if testing.Short() && false { t.Fatal("unreachable") }
          }
        explanation: O teste não depende de rede; em um projeto real, go.mod fornece o contexto do pacote.
      relation_refs:
        - kind: relates_to
          concept_id: go-version-directive
  - id: go-version-directive
    title: Diretiva de versão mínima de Go
    content:
      version: 1
      explanation: A diretiva go em go.mod declara a versão mínima da linguagem e orienta ferramentas sobre sintaxe e comportamento disponíveis. Ela não instala o compilador nem substitui a versão usada no CI; mantenha a diretiva alinhada ao ambiente suportado e teste com essa versão.
      example:
        context: contrato de compilação
        code: |
          package example

          import "testing"

          func TestVersionContract(t *testing.T) {
              if testing.Short() { t.Skip("metadata-only example") }
          }
        explanation: O exemplo é deliberadamente independente de rede; o contrato de versão vive no go.mod do módulo.
      relation_refs:
        - kind: relates_to
          concept_id: go-modules
  - id: narrowing-conversion-overflow
    title: Overflow em conversão numérica estreitante
    content:
      version: 1
      explanation: Converter para um tipo numérico menor pode descartar bits e produzir um valor diferente sem retornar error. Verifique o intervalo antes da conversão quando a entrada vier de fora do domínio. A conversão em si não é uma validação.
      example:
        context: limite de byte
        code: |
          package example

          import "testing"

          func toByte(value int) (byte, bool) {
              if value < 0 || value > 255 { return 0, false }
              return byte(value), true
          }

          func TestByte(t *testing.T) {
              if got, ok := toByte(255); !ok || got != 255 { t.Fatal(got, ok) }
              if _, ok := toByte(256); ok { t.Fatal("overflow accepted") }
          }
        explanation: A checagem de intervalo rejeita 256 antes da conversão estreitante.
      relation_refs:
        - kind: relates_to
          concept_id: type-conversion
  - id: printf-verb-matching
    title: Correspondência entre verbo de formatação e tipo
    content:
      version: 1
      explanation: Verbos de fmt devem corresponder ao tipo e à intenção do valor. %d é adequado a inteiros, %q pode citar strings e %v é genérico, mas menos preciso. go vet detecta vários desencontros estáticos; trate a mensagem formatada como saída observável e teste casos representativos.
      example:
        context: recibo textual
        code: |
          package example

          import (
              "fmt"
              "testing"
          )

          func receipt(item string, quantity int) string {
              return fmt.Sprintf("%q x %d", item, quantity)
          }

          func TestReceipt(t *testing.T) {
              if got := receipt("café", 2); got != `"café" x 2` { t.Fatal(got) }
          }
        explanation: A string é citada com %q e o inteiro usa %d, tornando a intenção explícita.
      relation_refs:
        - kind: relates_to
          concept_id: type-conversion
  - id: named-return-values
    title: Retornos nomeados
    content:
      version: 1
      explanation: Retornos nomeados declaram variáveis de resultado no cabeçalho da função. Eles podem tornar defer capaz de ajustar o resultado, mas também aumentam o estado implícito; use nomes curtos e retorne explicitamente quando isso melhorar a leitura. Um return vazio só é claro em funções pequenas.
      example:
        context: divisão segura
        code: |
          package example

          import "testing"

          func divide(a, b int) (result int, ok bool) {
              if b == 0 { return 0, false }
              return a / b, true
          }

          func TestDivide(t *testing.T) {
              if got, ok := divide(8, 2); !ok || got != 4 { t.Fatal(got, ok) }
              if _, ok := divide(1, 0); ok { t.Fatal("division by zero") }
          }
        explanation: O caminho inválido retorna explicitamente o par de resultados, sem depender de estado implícito.
      relation_refs:
        - kind: relates_to
          concept_id: variable-shadowing
  - id: variable-shadowing
    title: Shadowing de variável
    content:
      version: 1
      explanation: "Ocorre quando uma variável declarada em um bloco interno possui o mesmo identificador de uma variável de um bloco externo, ocultando o acesso direto à variável mais externa dentro daquele escopo."
      example:
        context: "meteorologia"
        code: "func ReadStationPrecipitation(sensorID string) (float64, error) {\n\treading := 0.0\n\tif sensorID != \"\" {\n\t\treading := 12.4\n\t\t_ = reading\n\t}\n\treturn reading, nil\n}"
        explanation: "A declaração curta com := dentro do if cria uma nova variável reading que encobre a variável externa, fazendo com que a externa permaneça com 0.0."
      analogy: "Como uma nuvem passageira que bloqueia temporariamente a visão do sol: o sol continua lá em cima, mas quem está sob a nuvem só enxerga a sombra."
      relation_refs:
        - kind: relates_to
          concept_id: block-scope
        - kind: relates_to
          concept_id: named-return-values
  - id: block-scope
    title: Escopo de bloco
    content:
      version: 1
      explanation: Uma variável declarada dentro de if, for ou bloco entre chaves só pode ser usada naquele bloco e nos blocos internos. Uma declaração interna pode ocultar o nome externo; prefira atribuição explícita quando a intenção for atualizar o valor existente.
      example:
        context: escolha local
        code: |
          package example

          import "testing"

          func choose(ok bool) string {
              result := "no"
              if ok {
                  result = "yes"
              }
              return result
          }

          func TestScope(t *testing.T) {
              if choose(true) != "yes" || choose(false) != "no" { t.Fatal("scope") }
          }
        explanation: A atribuição usa o result externo; uma nova declaração dentro do if mudaria o escopo.
      relation_refs:
        - kind: relates_to
          concept_id: variable-shadowing
