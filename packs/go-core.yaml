              t.Run("runs, recovers panic, and cleans up in order", func(t *testing.T) {
                  got := RunCommands([]string{"a", "boom", "bb"}, run)
                  want := []string{
                      "start:a", "ok:a:1", "closed:a",
                      "start:boom", "failed:boom:kaboom", "closed:boom",
                      "start:bb", "ok:bb:2", "closed:bb",
                  }
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("RunCommands(...) = %v, want %v", got, want)
                  }
              })

              t.Run("stops immediately at stop, without touching remaining commands", func(t *testing.T) {
                  var called []string
                  spy := func(cmd string) int {
                      called = append(called, cmd)
                      return run(cmd)
                  }
                  got := RunCommands([]string{"a", "stop", "c"}, spy)
                  want := []string{"start:a", "ok:a:1", "closed:a"}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("RunCommands(...) = %v, want %v", got, want)
                  }
                  if wantCalled := []string{"a"}; !reflect.DeepEqual(called, wantCalled) {
                      t.Errorf("run was called with %v, want %v (never for stop or c)", called, wantCalled)
                  }
              })

              t.Run("empty input", func(t *testing.T) {
                  got := RunCommands(nil, run)
                  if len(got) != 0 {
                      t.Errorf("RunCommands(nil, run) = %v, want empty", got)
                  }
              })

              t.Run("stop as first command runs nothing", func(t *testing.T) {
                  got := RunCommands([]string{"stop", "a"}, run)
                  if len(got) != 0 {
                      t.Errorf("RunCommands([stop, a], run) = %v, want empty", got)
                  }
              })

              t.Run("panic value is stringified", func(t *testing.T) {
                  got := RunCommands([]string{"boom"}, run)
                  want := []string{"start:boom", "failed:boom:kaboom", "closed:boom"}
