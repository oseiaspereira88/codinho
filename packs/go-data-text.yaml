          package dedupe

          // Dedupe returns items with duplicates removed, keeping only each
          // value's first occurrence and preserving the original order.
          func Dedupe(items []string) []string {
              var out []string
              seen := make(map[string]bool)
              for _, item := range items {
                  if !seen[item] {
