    prerequisites: [go-http.tested-json-handler]
    brief: Um cliente deve ser exercitado com um RoundTripper controlado para provar timeout, status e fechamento de body.
    constraints:
      - Não abra conexão de rede no teste.
      - O dublê deve tornar o contexto observável.
    acceptance:
      - O baseline falha e a referência passa no check focado.
      - O teste verifica o contexto e o status retornado.
      - O cliente fecha o response body.
    canonical: true
    publication: {status: draft, author: codex}
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/http-client

          go 1.25.0
      - path: client.go
        content: |
          package client

          import (
              "context"
              "net/http"
          )

          func Fetch(ctx context.Context, transport http.RoundTripper) (int, error) {
              return 0, nil
          }
      - path: client_test.go
        content: |
          package client

          import (
              "context"
              "io"
              "net/http"
              "strings"
              "testing"
          )

          type roundTripper func(*http.Request) (*http.Response, error)

          func (f roundTripper) RoundTrip(r *http.Request) (*http.Response, error) { return f(r) }

          func TestFetch(t *testing.T) {
              ctx, cancel := context.WithCancel(context.Background())
              defer cancel()
              closed := false
              status, err := Fetch(ctx, roundTripper(func(r *http.Request) (*http.Response, error) {
                  if r.Context() != ctx {
                      t.Fatal("request context was not propagated")
                  }
                  return &http.Response{StatusCode: http.StatusAccepted, Body: closeTracker{Reader: strings.NewReader("ok"), closed: &closed}}, nil
              }))
              if err != nil || status != http.StatusAccepted || !closed {
                  t.Fatalf("status=%d err=%v closed=%v", status, err, closed)
              }
          }

          type closeTracker struct { io.Reader; closed *bool }
          func (c closeTracker) Close() error { *c.closed = true; return nil }
      - path: method_test.go
        content: |
          package client

          import (
              "context"
              "errors"
              "net/http"
              "testing"
          )

          func TestFetchRejectsTransportError(t *testing.T) {
              want := errors.New("synthetic transport error")
              _, err := Fetch(context.Background(), roundTripper(func(*http.Request) (*http.Response, error) { return nil, want }))
              if !errors.Is(err, want) {
                  t.Fatalf("err=%v, want %v", err, want)
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestFetch
        timeout: 20s
    validation:
      reference_fixture:
        - path: go.mod
          content: |
            module codinho-practice/http-client

            go 1.25.0
        - path: client.go
          content: |
            package client

            import (
                "context"
                "io"
                "net/http"
            )

            func Fetch(ctx context.Context, transport http.RoundTripper) (int, error) {
                request, err := http.NewRequestWithContext(ctx, http.MethodGet, "http://service.local/items", nil)
                if err != nil {
                    return 0, err
                }
                response, err := (&http.Client{Transport: transport}).Do(request)
                if err != nil {
                    return 0, err
                }
                defer response.Body.Close()
                _, _ = io.Copy(io.Discard, response.Body)
                if response.StatusCode < 200 || response.StatusCode >= 300 {
                    return response.StatusCode, &statusError{code: response.StatusCode}
                }
                return response.StatusCode, nil
            }

            type statusError struct { code int }
            func (e *statusError) Error() string { return "unexpected status" }
