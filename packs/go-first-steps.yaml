                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.parse-and-assign-without-shadowing
            kind: micro
            action: implement
            target: function
            title: Converter e atribuir sem redeclarar dentro do bloco
