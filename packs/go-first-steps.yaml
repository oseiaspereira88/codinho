challenges:
  - schema_version: 1
    id: go-data.slice-filter-preserve-input
    version: 1.1.0
    title: Filtrar valores sem alterar a entrada
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [slices]
    competencies:
      primary: [slice-filter, preserve-input]
      secondary: [slice-allocation]
    prerequisites: [slice-declaration, range-loop]
    brief: >
      Produza apenas os valores aceitos preservando a ordem e a coleção recebida.
    constraints:
      - Não alterar a coleção de entrada.
    acceptance:
      - A saída contém apenas valores aceitos.
      - A ordem original é preservada.
      - A entrada permanece inalterada.
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-user-struct
            kind: micro
            action: declare
            target: named_type
            title: Declarar a struct User
            instruction:
              objective: Declarar o tipo User conforme a especificação fornecida.
              scope: Somente a declaração da struct.
              constraints:
                - Não adicionar métodos.
                - Não implementar validações.
                - Não criar construtores.
            concepts: [named-types, structs, field-types, zero-values]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: type-exists
                kind: structural
              - id: fields-match
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Qual é o valor zero de dois campos escolhidos?
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestFilter$
        timeout: 20s
    variants: []

    validation:
      justification: 'Protótipo sem fixture distribuída: baseline privada reproduz o check declarado sem materializar
        solução no workspace do aluno.'
      baseline_fixture:
      - path: go.mod
        content: |
          module example.invalid/filterproof

          go 1.25.0
      - path: filter.go
        content: |
          package filterproof
          func Filter(nums []int, keep func(int) bool) []int { panic("not implemented") }
      - path: filter_test.go
        content: |
          package filterproof

          import (
              "reflect"
              "testing"
          )

          func TestFilter(t *testing.T) {
              input := []int{1, 2, 3, 4}
              before := append([]int(nil), input...)
              got := Filter(input, func(v int) bool { return v%2 == 0 })
              if !reflect.DeepEqual(got, []int{2, 4}) || !reflect.DeepEqual(input, before) {
                  t.Fatal("filter must preserve order and input")
              }
              got[0] = 99
              if !reflect.DeepEqual(input, before) {
                  t.Fatal("shared storage")
              }
              if len(Filter(nil, func(int) bool { return true })) != 0 {
                  t.Fatal("nil input")
              }
          }
      reference_fixture:
      - path: go.mod
        content: |
          module example.invalid/filterproof

          go 1.25.0
      - path: filter.go
        content: |
          package filterproof

          func Filter(nums []int, keep func(int) bool) []int {
              out := make([]int, 0, len(nums))
              for _, n := range nums {
                  if keep(n) {
                      out = append(out, n)
                  }
              }
              return out
          }
      - path: filter_test.go
        content: |
          package filterproof

          import (
              "reflect"
              "testing"
          )

          func TestFilter(t *testing.T) {
              input := []int{1, 2, 3, 4}
              before := append([]int(nil), input...)
              got := Filter(input, func(v int) bool { return v%2 == 0 })
              if !reflect.DeepEqual(got, []int{2, 4}) || !reflect.DeepEqual(input, before) {
                  t.Fatal("filter must preserve order and input")
              }
              got[0] = 99
              if !reflect.DeepEqual(input, before) {
                  t.Fatal("shared storage")
              }
              if len(Filter(nil, func(int) bool { return true })) != 0 {
                  t.Fatal("nil input")
              }
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-first-steps.enumerate-weekdays-with-iota
    version: 1.0.0
    title: Modelar os dias da semana com iota
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [model-enumeration-with-iota]
      secondary: []
    prerequisites: []
    brief: >
      Modele um conjunto fechado de dias da semana sem espalhar strings
      mágicas pelo código, e decida quais deles contam como dia útil.
    constraints:
      - Não usar uma struct ou interface para representar os dias.
      - Não comparar dias usando string literal.
    acceptance:
      - As constantes formam uma sequência contígua começando em Monday.
      - IsWeekday retorna true apenas para Monday a Friday.
      - Nenhuma comparação usa string literal.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-weekday-type
            kind: micro
            action: declare
            target: named_type
            title: Declarar o tipo Weekday
            instruction:
              objective: Declarar o tipo Weekday como um tipo nomeado inteiro.
              scope: Somente a declaração do tipo.
              constraints:
                - Não declarar as constantes ainda.
