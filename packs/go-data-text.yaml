challenges:
  - schema_version: 1
    id: go-data-text.filter-without-mutating-input
    version: 1.0.0
    title: Filtrar uma slice sem mutar a entrada
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [slices-arrays-maps]
    competencies:
      primary: [filter-without-mutating-input]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que filtra uma slice de inteiros, preservando
      a ordem dos valores aceitos, sem nunca alterar a slice recebida.
    constraints:
      - Não usar bibliotecas externas.
      - A slice de retorno não pode reaproveitar o backing array de nums.
    acceptance:
      - 'Filter([1,2,3,4,5,6], par) retorna [2,4,6], preservando a ordem.'
      - Após a chamada, a slice recebida permanece com os mesmos valores, na mesma ordem.
      - A slice retornada não aponta para nenhuma posição do backing array da entrada, mesmo quando a entrada tem capacidade excedente.
      - Filter com nenhum valor aceito retorna uma slice vazia.
      - Filter(nil, keep) retorna uma slice vazia.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-independent-output-slice
            kind: micro
            action: declare
            target: function
            title: Declarar a saída independente do backing array de nums
            instruction:
              objective: Declarar a slice de saída de forma que ela nunca reaproveite o backing array de nums, sem ainda percorrer os elementos de nums.
              scope: Somente a declaração da variável de saída.
              constraints:
                - A slice de retorno não pode reaproveitar o backing array de nums.
                - Não percorrer nums ainda.
            concepts: [slice-backing-array-aliasing]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: output-independent-of-input-backing-array
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.append-accepted-values-in-order
            kind: micro
            action: implement
            target: function
            title: Percorrer nums e acrescentar os valores aceitos
            instruction:
              objective: Percorrer nums e, para cada elemento aceito por keep, acrescentá-lo à saída, preservando a ordem original.
              scope: O laço sobre nums e a construção da saída.
              constraints:
                - Preservar a ordem original dos elementos aceitos.
            concepts: [slice-backing-array-aliasing]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: filter-preserves-order
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que escrever o resultado de volta em nums[i], mesmo devolvendo nums[:n], mutaria a slice que o chamador ainda enxerga?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/filter-without-mutating-input

          go 1.25.0
      - path: filter.go
        content: |
          package datafilter

          // Filter returns a new slice containing only the values from nums for
          // which keep returns true, preserving their original order, without
          // modifying nums or sharing its backing array.
          func Filter(nums []int, keep func(int) bool) []int {
              panic("not implemented")
          }
      - path: filter_test.go
        content: |
          package datafilter

          import (
              "reflect"
              "testing"
              "unsafe"
          )

          func TestFilter(t *testing.T) {
              t.Run("keeps order and value, does not mutate or alias input", func(t *testing.T) {
                  input := make([]int, 6, 20)
                  copy(input, []int{1, 2, 3, 4, 5, 6})
                  original := append([]int(nil), input...)

                  got := Filter(input, func(n int) bool { return n%2 == 0 })

                  want := []int{2, 4, 6}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Filter(...) = %v, want %v", got, want)
                  }
                  if !reflect.DeepEqual(input, original) {
                      t.Errorf("input mutated: got %v, want unchanged %v", input, original)
                  }
                  if len(got) > 0 {
                      inputStart := uintptr(unsafe.Pointer(unsafe.SliceData(input)))
                      inputEnd := inputStart + uintptr(cap(input))*unsafe.Sizeof(input[0])
                      gotStart := uintptr(unsafe.Pointer(unsafe.SliceData(got)))
                      if gotStart >= inputStart && gotStart < inputEnd {
                          t.Error("Filter(...) output shares backing array with input")
                      }
                  }
              })

              t.Run("empty result", func(t *testing.T) {
                  got := Filter([]int{1, 3, 5}, func(n int) bool { return n%2 == 0 })
                  if len(got) != 0 {
                      t.Errorf("Filter(...) = %v, want empty", got)
                  }
              })

              t.Run("nil input", func(t *testing.T) {
                  got := Filter(nil, func(n int) bool { return true })
                  if len(got) != 0 {
                      t.Errorf("Filter(nil, ...) = %v, want empty", got)
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestFilter$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-data-text.truncate-bytes-at-rune-boundary
    version: 1.0.0
    title: Truncar uma string por bytes sem quebrar um rune
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [text-and-binary-data]
    competencies:
      primary: [truncate-string-at-rune-boundary]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que trunca uma string para no máximo um dado
      número de bytes, recuando até a fronteira de rune mais próxima
      quando o corte ingênuo cairia no meio de um caractere multibyte.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - O resultado nunca pode terminar no meio de um rune multibyte.
    acceptance:
      - 'TruncateBytes("hello", 10) retorna "hello".'
      - 'TruncateBytes("café", 4) retorna "caf" (não "caf" seguido de um byte inválido).'
      - 'TruncateBytes("日本語", 4) retorna "日".'
      - 'TruncateBytes("", 5) retorna "".'
      - 'TruncateBytes("ab", 0) retorna "".'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-unchanged-when-within-limit
            kind: micro
            action: implement
            target: function
            title: Retornar s sem alterações quando já cabe no limite
            instruction:
              objective: Implementar o caso em que s já cabe em maxBytes (len(s) <= maxBytes), retornando s sem alterações.
              scope: Somente a verificação de que s já cabe no limite.
              constraints:
                - Não implementar ainda o truncamento em si.
            concepts: [utf8-rune-boundary]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-unchanged-when-already-within-limit
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.truncate-at-rune-boundary
            kind: micro
            action: implement
            target: function
            title: Truncar recuando até a fronteira de rune mais próxima
            instruction:
              objective: Quando s não cabe em maxBytes, truncar em maxBytes e, se isso cair no meio de um rune multibyte, recuar até o início do rune mais próximo, garantindo que o resultado nunca quebre um rune.
              scope: O corte em maxBytes e o recuo até uma fronteira de rune válida.
              constraints:
                - O resultado nunca pode terminar no meio de um rune multibyte.
            concepts: [utf8-rune-boundary]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: truncates-at-rune-boundary
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que um corte ingênuo em s[:maxBytes] pode produzir uma string com bytes UTF-8 inválidos no final?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/truncate-bytes-at-rune-boundary

          go 1.25.0
      - path: truncate.go
        content: |
          package trunc

          // TruncateBytes returns a prefix of s with at most maxBytes bytes,
          // backing off to the nearest earlier rune boundary if the naive cut
          // would split a multi-byte rune.
          func TruncateBytes(s string, maxBytes int) string {
              panic("not implemented")
          }
      - path: truncate_test.go
        content: |
          package trunc

          import "testing"

          func TestTruncateBytes(t *testing.T) {
              cases := []struct {
                  name     string
                  s        string
                  maxBytes int
                  want     string
              }{
                  {"already short enough", "hello", 10, "hello"},
                  {"exact fit", "hello", 5, "hello"},
                  {"backs off mid-rune, 2-byte char", "café", 4, "caf"},
                  {"backs off mid-rune, 3-byte char", "日本語", 4, "日"},
                  {"empty string", "", 5, ""},
                  {"zero budget", "ab", 0, ""},
                  {"ascii truncation, no rune issue", "hello world", 5, "hello"},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := TruncateBytes(c.s, c.maxBytes)
                      if got != c.want {
                          t.Errorf("TruncateBytes(%q, %d) = %q, want %q", c.s, c.maxBytes, got, c.want)
                      }
                      if len(got) > c.maxBytes {
                          t.Errorf("TruncateBytes(%q, %d) = %q with %d bytes, want at most %d", c.s, c.maxBytes, got, len(got), c.maxBytes)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestTruncateBytes$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-data-text.lookup-map-value-with-comma-ok
    version: 1.0.0
    title: Distinguir valor zero de ausência em um map
    kind: atomic
    difficulty: foundational
    estimated_minutes: 10
    themes: [slices-arrays-maps]
    competencies:
      primary: [distinguish-zero-value-from-absence]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma consulta a um map de pontuações que distingue uma
      pontuação de exatamente zero de um nome que nunca foi pontuado.
    constraints:
      - Não usar bibliotecas externas.
      - Usar o padrão comma-ok (value, ok := scores[name]) para verificar se a chave existe.
    acceptance:
      - 'Score({"alice":0,"bob":7}, "alice") retorna (0, true).'
      - 'Score({"alice":0,"bob":7}, "bob") retorna (7, true).'
      - 'Score({"alice":0,"bob":7}, "carol") retorna (0, false).'
      - 'Score({"":0,...}, "") retorna (0, true) quando a chave vazia está presente no map.'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.lookup-with-comma-ok
            kind: micro
            action: implement
            target: function
            title: Consultar scores com comma-ok
            instruction:
              objective: Consultar scores[name] usando o padrão comma-ok, obtendo o valor e se a chave existe.
              scope: A consulta ao mapa.
              constraints:
                - Usar o padrão comma-ok (value, ok := scores[name]) para verificar se a chave existe.
            concepts: [map-comma-ok-lookup]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: uses-comma-ok-lookup
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.return-comma-ok-result-directly
            kind: micro
            action: implement
            target: function
            title: Devolver exatamente o resultado da consulta
            instruction:
              objective: Devolver exatamente o valor e o booleano obtidos da consulta comma-ok, sem usar o valor zero como sinal de ausência.
              scope: O retorno da função.
              constraints:
                - Não usar scores[name] == 0 como sinal de que a chave não existe.
            concepts: [map-comma-ok-lookup]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: never-uses-zero-value-as-absence-signal
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que scores[name] == 0 não é suficiente para saber se name foi pontuado?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/lookup-map-value-with-comma-ok

          go 1.25.0
      - path: score.go
        content: |
          package scoreboard

          // Score returns the score for name and whether name has been scored at
          // all, distinguishing a score of exactly 0 from name never having been
          // scored.
          func Score(scores map[string]int, name string) (score int, scored bool) {
              panic("not implemented")
          }
      - path: score_test.go
        content: |
          package scoreboard

          import "testing"

          func TestScore(t *testing.T) {
              scores := map[string]int{"alice": 0, "bob": 7, "": 0}

              cases := []struct {
                  name      string
                  who       string
                  wantScore int
                  wantOk    bool
              }{
                  {"scored exactly zero counts as scored", "alice", 0, true},
                  {"scored nonzero", "bob", 7, true},
                  {"never scored", "carol", 0, false},
                  {"empty string key present counts as scored", "", 0, true},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      gotScore, gotOk := Score(scores, c.who)
                      if gotScore != c.wantScore || gotOk != c.wantOk {
                          t.Errorf("Score(scores, %q) = (%d, %v), want (%d, %v)", c.who, gotScore, gotOk, c.wantScore, c.wantOk)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestScore$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-data-text.quote-csv-field-when-needed
    version: 1.0.0
    title: Citar um campo CSV apenas quando necessário
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [text-and-binary-data]
    competencies:
      primary: [quote-csv-field-when-needed]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a formatação de um único campo CSV: sem alterações
      quando não contém caracteres especiais, ou citado e com aspas
      internas escapadas quando contém.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Toda aspas dupla interna deve ser dobrada antes de envolver o campo em aspas, mesmo quando o campo também contém vírgula ou quebra de linha.
    acceptance:
      - 'CSVField("hello") retorna "hello" sem alterações.'
      - 'CSVField("") retorna "" sem alterações.'
      - 'CSVField("a,b") retorna "a,b" entre aspas.'
      - 'CSVField("line1\nline2") retorna o texto entre aspas.'
      - 'CSVField("a\rb") retorna o texto entre aspas (retorno de carro também exige citação).'
      - 'CSVField(`say "hi"`) retorna `"say ""hi"""` (aspas internas dobradas).'
      - 'CSVField(`a,"b"`) retorna `"a,""b"""` (vírgula e aspas internas ao mesmo tempo).'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-unchanged-when-no-special-chars
            kind: micro
            action: implement
            target: function
            title: Retornar s sem alterações quando não há caracteres especiais
            instruction:
              objective: Detectar se s contém vírgula, aspas duplas ou quebra de linha (\n ou \r), retornando s sem alterações quando nenhum desses caracteres está presente.
              scope: A detecção de caracteres especiais e o caminho sem alterações.
              constraints:
                - Retornar s sem alterações quando ele não contém vírgula, aspas ou quebra de linha (\n ou \r).
            concepts: [csv-field-quoting]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-unchanged-when-no-special-chars
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.escape-and-wrap-quoted-field
            kind: micro
            action: implement
            target: function
            title: Escapar aspas internas e envolver em aspas
            instruction:
              objective: Quando s precisa ser citado, dobrar cada aspas dupla interna e envolver o resultado inteiro em aspas duplas.
              scope: O caminho em que s precisa ser citado.
              constraints:
                - Toda aspas dupla interna deve ser dobrada antes de envolver o campo em aspas.
            concepts: [csv-field-quoting]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: escapes-and-wraps-quoted-field
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que uma aspas dupla interna precisa ser dobrada, e não só o campo inteiro envolvido em aspas?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/quote-csv-field-when-needed

          go 1.25.0
      - path: csvfield.go
        content: |
          package csvfield

          // CSVField returns s formatted as a single CSV field: unchanged when it
          // contains none of comma, double quote, newline or carriage return, or
          // wrapped in double quotes -- with every internal double quote doubled --
          // when it does.
          func CSVField(s string) string {
              panic("not implemented")
          }
      - path: csvfield_test.go
        content: |
          package csvfield

          import "testing"

          func TestCSVField(t *testing.T) {
              cases := []struct {
                  name string
                  in   string
                  want string
              }{
                  {"plain text unchanged", "hello", "hello"},
                  {"empty unchanged", "", ""},
                  {"comma requires quoting", "a,b", `"a,b"`},
                  {"newline requires quoting", "line1\nline2", "\"line1\nline2\""},
                  {"carriage return requires quoting", "a\rb", "\"a\rb\""},
                  {"internal quotes are doubled and wrapped", `say "hi"`, `"say ""hi"""`},
                  {"comma and quote combined", `a,"b"`, `"a,""b"""`},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := CSVField(c.in)
                      if got != c.want {
                          t.Errorf("CSVField(%q) = %q, want %q", c.in, got, c.want)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestCSVField$
        timeout: 20s
    variants: []
