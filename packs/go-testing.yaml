            - Por que uma dependência explícita facilita provocar e observar falhas?
        - id: testable-expiry.step-3
          kind: micro
          action: implement
          target: function
          title: Fixe um instante para a operação inteira.
          instruction:
            objective: Fixe um instante para a operação inteira.
            scope: Use o relógio recebido uma única vez, inclusive para entrada vazia.
          concepts:
          - testing-counting-double
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: behavior-3
            kind: qualitative
          completion:
