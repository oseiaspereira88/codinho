      '
  - path: schema.go
    content: 'package schema


      import "errors"


      var ErrMissingField = errors.New("legacy field missing")


      type Store struct { rows map[string]map[string]string; mode string }

      func NewStore() *Store { return &Store{rows: make(map[string]map[string]string), mode: "legacy"} }

      func (s *Store) SeedLegacy(id, name string) { s.rows[id] = map[string]string{"name": name} }

      func (s *Store) Expand() { s.mode = "expand" }

      func (s *Store) Write(id, name string) { s.rows[id] = map[string]string{"display_name": name} }

      func (s *Store) Migrate() { for _, row := range s.rows { if value, ok := row["name"]; ok { row["display_name"] = value
      } } }

      func (s *Store) Contract() { s.mode = "contract"; for _, row := range s.rows { delete(row, "name") } }

      func (s *Store) Rollback() { s.mode = "expand"; for _, row := range s.rows { if value, ok := row["display_name"]; ok
      { row["name"] = value } } }

      func (s *Store) LegacyRead(id string) (string, error) { value, ok := s.rows[id]["name"]; if !ok { return "", ErrMissingField
      }; return value, nil }

      func (s *Store) CurrentRead(id string) (string, error) { if value, ok := s.rows[id]["display_name"]; ok { return value,
      nil }; return s.LegacyRead(id) }

