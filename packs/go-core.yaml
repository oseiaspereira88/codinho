        content: |
          package percentage_test

          import (
              "testing"

              "codinho-practice/guard-invariant-with-unexported-field"
          )

          func TestNewPercentage(t *testing.T) {
              cases := []struct {
                  name    string
                  in      int
                  wantErr bool
                  want    int
              }{
                  {"valid middle", 50, false, 50},
                  {"valid lower bound", 0, false, 0},
                  {"valid upper bound", 100, false, 100},
                  {"invalid too low", -1, true, 0},
                  {"invalid too high", 101, true, 0},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      p, err := percentage.NewPercentage(c.in)
                      if c.wantErr {
                          if err == nil {
                              t.Fatalf("NewPercentage(%d) err = nil, want error", c.in)
                          }
                          return
                      }
                      if err != nil {
                          t.Fatalf("NewPercentage(%d) err = %v, want nil", c.in, err)
                      }
                      if p.Value() != c.want {
                          t.Fatalf("NewPercentage(%d).Value() = %d, want %d", c.in, p.Value(), c.want)
                      }
                  })
              }
          }
