challenges:
  - schema_version: 1
    id: go-architecture-debugging.diagnose-shared-state-race
    version: 1.0.0
    title: Diagnosticar uma corrida em estado compartilhado
    kind: debug
    difficulty: advanced
    estimated_minutes: 40
    themes:
      - go-architecture-debugging.investigation
    competencies:
      primary:
        - go-architecture-debugging.diagnose-data-race
      secondary:
        - go-architecture-debugging.justify-trade-off-with-evidence
    prerequisites:
      - go-production.correlate-request-signals
    brief: >
      Um contador usado por vários workers produz um resultado instável sob
      concorrência. Reproduza o comportamento, localize o estado compartilhado
      e proponha uma correção pequena que preserve o contrato da operação.
    constraints:
      - Use o race detector para observar a falha; não use sleep para sincronizar o teste.
      - Preserve as assinaturas públicas da fixture.
      - Não reescreva o contador inteiro; altere somente a fronteira de sincronização necessária.
    acceptance:
      - O baseline falha sob go_test_race por causa do acesso concorrente não coordenado.
      - A referência passa no mesmo teste e produz exatamente o total esperado.
      - A correção estabelece uma relação de ordenação observável sem depender do escalonamento.
    canonical: true
    publication:
      status: draft
      author: codex
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/shared-state-race

          go 1.25.0
      - path: counter.go
        content: |
          package race

          type Counter struct {
              value int
          }

          func NewCounter() *Counter {
              return &Counter{}
          }

          func (c *Counter) Add(_ string) {
              c.value++
          }

          func (c *Counter) Count(_ string) int {
              return c.value
          }
      - path: counter_test.go
        content: |
          package race

          import (
              "sync"
              "testing"
          )

          func TestConcurrentUpdatesAreSafe(t *testing.T) {
              counter := NewCounter()
              const workers = 8
              const updates = 1000
              start := make(chan struct{})
              var group sync.WaitGroup
              group.Add(workers)

              for worker := 0; worker < workers; worker++ {
                  go func() {
                      defer group.Done()
                      <-start
                      for update := 0; update < updates; update++ {
                          counter.Add("ok")
                      }
                  }()
              }
              close(start)
              group.Wait()

              if got, want := counter.Count("ok"), workers*updates; got != want {
                  t.Fatalf("count=%d, want %d", got, want)
              }
          }
    checks:
      - id: shared-state-race
        runner: go_test_race
        package: ./...
        test_pattern: ^TestConcurrentUpdatesAreSafe$
        timeout: 30s
        network: false
    validation:
      reference_fixture:
        - path: go.mod
          content: |
            module codinho-practice/shared-state-race

            go 1.25.0
        - path: counter.go
          content: |
            package race

            import "sync"

            type Counter struct {
                mu    sync.Mutex
                value int
            }

            func NewCounter() *Counter {
                return &Counter{}
            }

            func (c *Counter) Add(_ string) {
                c.mu.Lock()
                c.value++
                c.mu.Unlock()
            }

            func (c *Counter) Count(_ string) int {
                c.mu.Lock()
                defer c.mu.Unlock()
                return c.value
            }
        - path: counter_test.go
          content: |
            package race

            import (
                "sync"
                "testing"
            )

            func TestConcurrentUpdatesAreSafe(t *testing.T) {
                counter := NewCounter()
                const workers = 8
                const updates = 1000
                start := make(chan struct{})
                var group sync.WaitGroup
                group.Add(workers)

                for worker := 0; worker < workers; worker++ {
                    go func() {
                        defer group.Done()
                        <-start
                        for update := 0; update < updates; update++ {
                            counter.Add("ok")
                        }
                    }()
                }
                close(start)
                group.Wait()

                if got, want := counter.Count("ok"), workers*updates; got != want {
                    t.Fatalf("count=%d, want %d", got, want)
                }
            }
      expectations:
        - check_id: shared-state-race
          baseline: test_failure
          reference: pass
    layers:
      - id: go-architecture-debugging.diagnose-shared-state-race.layer
        macro_steps:
          - id: go-architecture-debugging.diagnose-shared-state-race.plan
            kind: macro
            title: Planejar a investigação da corrida
            instruction:
              objective: Delimite o comportamento concorrente que precisa ser observado.
              scope: O teste e o contrato do contador.
            children:
              - id: go-architecture-debugging.diagnose-shared-state-race.observe
                kind: meso
                title: Observar os acessos ao contador
                instruction:
                  objective: Separe a reprodução, a localização e a correção em etapas observáveis.
                  scope: Fluxo de investigação da fixture.
                children:
                  - id: go-architecture-debugging.diagnose-shared-state-race.reproduce-baseline
                    kind: micro
                    action: verify
                    target: baseline-race
                    title: Reproduzir a falha do baseline
                    instruction:
                      objective: Execute o teste concorrente do baseline e registre a falha observada.
                      scope: Somente a execução inicial com go_test_race.
                    concepts:
                      - go-architecture-debugging.race-happens-before
                      - go-architecture-debugging.symptom-vs-cause
                    evidence:
