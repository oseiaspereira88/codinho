  brief: 'Missão: leitores antigos e novos coexistem durante um rollout. O requisito de rollback está incompleto; demonstre
    expand, migrate, contract e retorno seguro com store sintético.'
  constraints:
  - 'Requisito incompleto: a janela de coexistência e o critério de rollback não foram definidos.'
  - 'Falhas: leitor antigo perde campo e migração destrói dados.'
  - Use somente mapas locais; não conecte banco real.
  - Explicite custo de dual-write, compatibilidade e rollback.
  acceptance:
  - Leitor antigo lê registro escrito durante expand.
  - Leitor novo lê dados legados.
  - Migrate não destrói o campo antigo antes de contract.
  - Rollback restaura leitura legada e a reflexão cobre custo, operação, alternativa e trade-off.
