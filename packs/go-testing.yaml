        - id: testable-expiry.step-4
          kind: micro
          action: implement
          target: function
          title: Selecione os tokens ainda válidos.
          instruction:
            objective: Selecione os tokens ainda válidos.
            scope: Preserve a ordem; a igualdade com a expiração já representa um token expirado.
          concepts:
          - testing-time-boundaries
          evidence:
