            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que comparar apenas o conteúdo antes de modificar a saída não detecta aliasing?
          children:
          - id: testable-expiry.verify-empty-result
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
            kind: micro
            action: verify
            target: boundary_case
            title: Verificar resultado vazio não nulo
            instruction:
              objective: Confirme que a seleção sem tokens ativos retorna slice vazio não nil quando o relógio é válido.
              scope: Apenas entradas nil ou sem tokens futuros.
            concepts:
            - testing-table-cases
            evidence:
              strategies:
              - test
            criteria:
            - id: empty-result-is-non-nil
              kind: structural
            completion:
              requires_positive_evaluation: true
          - id: testable-expiry.verify-order-preserved
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
            kind: micro
            action: verify
            target: output_order
            title: Verificar ordem dos tokens ativos
            instruction:
