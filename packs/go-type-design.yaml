  - schema_version: 1
    id: go-type-design.select-validator-true-nil
    version: 1.0.0
    title: Devolver um nil de interface verdadeiro quando não há validador
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [interfaces]
    competencies:
      primary: [return-true-nil-interface]
      secondary: []
    prerequisites: []
    brief: >
      Um serviço escolhe um validador a partir de um modo. O contrato
      precisa distinguir uma configuração utilizável de um modo que não
      oferece validador.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Quando mode for desconhecido, o retorno deve ser comparável a nil com ==, resultando true.
      - O validador devolvido para um modo conhecido precisa estar de fato configurado, não apenas ser um ponteiro não nulo qualquer.
    acceptance:
      - SelectValidator("strict") retorna um Validator não nil, de fato configurado, cujo Validate() retorna nil.
      - SelectValidator("unknown") retorna um Validator que é == nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.define-minimal-validator-consumer
            kind: macro
            title: Definir o contrato mínimo do consumidor
            instruction:
              objective: Relacionar o retorno de Validator à menor interface que o consumidor precisa para validar um valor.
              scope: Interface Validator, implementação strictValidator e SelectValidator.
            concepts: [interface-composition-consumer, constructor-returns-interface]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: consumer-contract-is-minimal
                kind: qualitative
            children:
              - id: model.observe-validator-interface-boundary
                kind: meso
                title: Observar a fronteira entre produtor e consumidor
                instruction:
                  objective: Explique por que SelectValidator pode esconder strictValidator e ainda entregar o método que o consumidor usa.
                  scope: Contrato estático de Validator, sem inspecionar detalhes além de Validate.
                concepts: [interface-composition-consumer, constructor-returns-interface]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: concrete-type-is-hidden-by-minimal-interface
                    kind: qualitative
          - id: model.return-configured-validator-for-known-mode
            kind: micro
            action: implement
            target: function
            title: Entregar um validador utilizável para o modo conhecido
            instruction:
              objective: Fazer SelectValidator("strict") devolver um validador cuja validação conclua sem erro.
              scope: O caso em que mode é "strict".
              constraints:
                - Não tratar ainda o caso de modo desconhecido.
            concepts: [typed-nil-interface-trap]
            evidence:
              strategies: [source_inspection, test]
            criteria:
              - id: returns-configured-validator-for-known-mode
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.return-true-nil-for-unknown-mode
            kind: micro
            action: implement
            target: function
            title: Representar a ausência de validador para modo desconhecido
            instruction:
              objective: Fazer SelectValidator representar a ausência prevista pelo contrato quando mode não for reconhecido.
              scope: O caso em que mode não é reconhecido.
              constraints:
                - Quando mode for desconhecido, o retorno deve ser comparável a nil com ==, resultando true.
            concepts: [typed-nil-interface-trap]
            evidence:
              strategies: [source_inspection, test]
            criteria:
              - id: returns-true-nil-for-unknown-mode
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
            reflection:
              optional:
                - Por que uma interface que recebe um ponteiro nil ainda pode não comparar igual a nil, e que consequência isso teria para quem usa o retorno de um modo não reconhecido?
            children:
              - id: model.verify-validator-identity
                hints:
                  - level: 1
                    kind: guiding_question
                  - level: 2
                    kind: syntax_recall
                  - level: 3
                    kind: logical_prose
                  - level: 4
                    kind: pseudocode
                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
                kind: micro
                action: verify
                target: interface
                title: Verificar a identidade da interface
                instruction:
                  objective: Confirme que o retorno tem presença para o modo conhecido e ausência para modos não reconhecidos.
                  scope: A distinção observável entre validador disponível e ausência de validador.
                concepts: [typed-nil-interface-trap]
                evidence:
                  strategies: [test]
                criteria:
                  - id: known-interface-non-nil
                    kind: structural
                  - id: unknown-interface-true-nil
                    kind: structural
                completion:
                  requires_positive_evaluation: true
                  requires_user_confirmation: false
              - id: model.explain-interface-zero-state
                kind: micro
                action: reflect
                target: decision
                title: Explicar o estado zero da interface
                instruction:
                  objective: Explique por que uma interface sem validador não tem o mesmo estado que uma interface com ponteiro nil.
                  scope: Apenas a justificativa do contrato para modo desconhecido.
                concepts: [typed-nil-interface-trap]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: interface-zero-state-explained
                    kind: qualitative
                completion:
                  requires_positive_evaluation: false
                  requires_user_confirmation: true
                hints:
                  - level: 1
                    kind: guiding_question
                  - level: 2
                    kind: syntax_recall
                  - level: 3
                    kind: logical_prose
                  - level: 4
                    kind: pseudocode
                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/select-validator-true-nil

          go 1.25.0
      - path: validator.go
        content: |
          package validator

          import "errors"

          var errValidatorNotConfigured = errors.New("validator not configured")

          // Validator validates something and reports an error if invalid.
          type Validator interface {
              Validate() error
          }

          // strictValidator only validates successfully once configured with a
          // positive minLength -- a nil or zero-value strictValidator is not
          // configured.
          type strictValidator struct {
              minLength int
          }

          func (v *strictValidator) Validate() error {
              if v.minLength <= 0 {
                  return errValidatorNotConfigured
              }
              return nil
          }

          // SelectValidator returns a Validator for the given mode, or no
          // validator when mode is unknown.
          func SelectValidator(mode string) Validator {
              panic("not implemented")
          }
      - path: validator_test.go
        content: |
          package validator

          import "testing"

          func TestSelectValidator(t *testing.T) {
              t.Run("known mode returns a usable, configured validator", func(t *testing.T) {
                  v := SelectValidator("strict")
                  if v == nil {
                      t.Fatal("SelectValidator(\"strict\") = nil, want non-nil")
                  }
                  if err := v.Validate(); err != nil {
                      t.Errorf("Validate() = %v, want nil (an unconfigured or nil-backed validator would fail here)", err)
                  }
              })

              t.Run("unknown mode returns a true nil interface", func(t *testing.T) {
                  v := SelectValidator("unknown")
                  if v != nil {
                      t.Errorf("SelectValidator(\"unknown\") = %#v, want nil interface", v)
                  }
              })

              t.Run("any other mode is also absent", func(t *testing.T) {
                  v := SelectValidator("")
                  if v != nil {
                      t.Errorf("SelectValidator(\"\") = %#v, want nil interface", v)
                  }
              })
          }
