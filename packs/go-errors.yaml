      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-errors.classify-wrapped-errors
    version: 1.0.0
    title: Classificar erros sem depender da mensagem
    kind: combined
    difficulty: foundational
    estimated_minutes: 35
    themes:
    - errors
    competencies:
      primary:
      - classify-wrapped-and-joined-errors
      - preserve-error-precedence
      - distinguish-error-identity
      secondary:
      - extract-wrapped-error-type
      - aggregate-errors-without-losing-any
    prerequisites: [error-wrapping-with-percent-w, errors-join-aggregation, errors-as-type-extraction]
    brief: Uma camada de validação precisa transformar falhas internas em categorias estáveis, preservando
      as causas reconhecíveis e uma prioridade definida quando mais de uma causa está presente.
    constraints:
    - Use somente a biblioteca padrão.
    - Não use arquivos ou rede; preserve as assinaturas da fixture.
    - Não compare mensagens para decidir a categoria de um erro.
    acceptance:
    - Erro nil produz ok; a sentinela ErrDenied em qualquer causa produz denied.
    - 'Sem ErrDenied, o primeiro FieldError encontrado produz invalid: seguido de seu campo.'
    - Outros erros produzem unknown, mesmo quando sua mensagem é igual à da sentinela.
    - Em erros agregados, denied tem prioridade independentemente da ordem dos filhos.
    - Um erro com método Is personalizado para ErrDenied produz denied sem depender do texto da mensagem.
    - 'Um FieldError envolvido por um wrapper com Unwrap() error continua produzindo invalid: com seu campo.'
    - Classificar não altera a cadeia recebida.
    publication:
      status: draft
      author: codex
    layers:
    - id: classify-wrapped-errors.implementation
      macro_steps:
      - id: classify-wrapped-errors.macro
        kind: macro
        title: Classificar erros sem depender da mensagem
        instruction:
          objective: Classifique um erro em sucesso, acesso negado, campo inválido ou desconhecido, respeitando
            a cadeia de causas e uma precedência explícita.
          scope: Contrato observável e isolamento.
        children:
        - id: classify-wrapped-errors.meso
          kind: meso
          title: Comportamento e tratamento de erros
          instruction:
            objective: Implemente o comportamento conforme os critérios de aceite.
            scope: Resultados, erros e efeitos sobre o estado.
          children:
          - id: classify-wrapped-errors.step-1
            kind: micro
            action: implement
            target: function
            title: Trate a ausência de erro.
            instruction:
              objective: Reconheça a ausência de erro como sucesso.
              scope: A classificação de sucesso não deve consultar mensagem alguma.
            concepts:
            - error-identity-not-message
            evidence:
              strategies:
              - source_inspection
              - test
            criteria:
            - id: behavior-1
              kind: qualitative
            completion:
              requires_positive_evaluation: true
            hints:
            - level: 1
              kind: guiding_question
            - level: 2
              kind: syntax_recall
            - level: 3
              kind: logical_prose
            - level: 4
              kind: pseudocode
            - level: 5
              kind: partial_code
            - level: 6
              kind: solution
            reflection:
              optional:
              - Por que nil precisa de um caso próprio?
          - id: classify-wrapped-errors.step-2
            kind: micro
            action: implement
            target: function
            title: Identifique a categoria prioritária.
            instruction:
              objective: Aplique a precedência da sentinela de acesso negado.
              scope: Reconheça a sentinela também em causas encadeadas ou agregadas.
            concepts:
            - error-classification-precedence
            evidence:
              strategies:
              - source_inspection
              - test
            criteria:
            - id: behavior-2
              kind: qualitative
            completion:
              requires_positive_evaluation: true
            hints:
            - level: 1
              kind: guiding_question
            - level: 2
              kind: syntax_recall
            - level: 3
              kind: logical_prose
            - level: 4
              kind: pseudocode
            - level: 5
              kind: partial_code
            - level: 6
              kind: solution
            reflection:
              optional:
              - Por que inverter a ordem dos filhos agregados não muda essa prioridade?
          - id: classify-wrapped-errors.step-3
            kind: micro
            action: implement
            target: function
            title: Extraia o campo do erro tipado.
            instruction:
              objective: Extraia o primeiro FieldError encontrado.
              scope: Considere encadeamento múltiplo e o primeiro tipo compatível.
            concepts:
            - error-chain-type-traversal
            evidence:
              strategies:
              - source_inspection
              - test
            criteria:
            - id: behavior-3
              kind: qualitative
            completion:
              requires_positive_evaluation: true
            hints:
            - level: 1
              kind: guiding_question
            - level: 2
              kind: syntax_recall
            - level: 3
              kind: logical_prose
            - level: 4
              kind: pseudocode
            - level: 5
              kind: partial_code
            - level: 6
              kind: solution
            reflection:
              optional:
              - Por que uma asserção de tipo direta pode perder um erro envolvido?
          - id: classify-wrapped-errors.step-4
            kind: micro
            action: implement
            target: function
            title: Trate os erros não classificados.
            instruction:
              objective: Conclua a classificação residual como unknown.
              scope: Erros que não correspondem a uma categoria conhecida, incluindo mensagens coincidentes
                com uma sentinela.
            concepts:
            - error-identity-not-message
            - error-joined-tree-order
            evidence:
              strategies:
              - test
            criteria:
            - id: behavior-4
              kind: structural
            completion:
              requires_positive_evaluation: true
            hints:
            - level: 1
              kind: guiding_question
            - level: 2
              kind: syntax_recall
            - level: 3
              kind: logical_prose
            - level: 4
              kind: pseudocode
            - level: 5
              kind: partial_code
            - level: 6
              kind: solution
            reflection:
              optional:
              - Como distinguir a ordem da busca por tipo da precedência de categorias?
            children:
            - id: classify-wrapped-errors.verify-identity-vs-text
              hints:
                - level: 1
                  kind: guiding_question
                - level: 2
                  kind: syntax_recall
                - level: 3
                  kind: logical_prose
                - level: 4
                  kind: pseudocode
                - level: 5
                  kind: partial_code
                - level: 6
                  kind: solution
              kind: micro
              action: verify
              target: classification
              title: Verificar identidade distinta de mensagem igual
              instruction:
                objective: Confirme que um erro novo com texto igual à sentinela não recebe a categoria da sentinela.
                scope: Apenas identidade do erro e resultado de classificação.
              concepts:
              - error-identity-not-message
              evidence:
                strategies:
                - test
              criteria:
              - id: message-does-not-classify
                kind: structural
              completion:
                requires_positive_evaluation: true
            - id: classify-wrapped-errors.verify-joined-precedence
              hints:
                - level: 1
                  kind: guiding_question
                - level: 2
                  kind: syntax_recall
                - level: 3
                  kind: logical_prose
                - level: 4
                  kind: pseudocode
                - level: 5
                  kind: partial_code
                - level: 6
                  kind: solution
              kind: micro
              action: verify
              target: classification
              title: Verificar precedência em erro agregado
              instruction:
                objective: Confirme que a classificação permanece denied nas duas ordens dos filhos de um erro agregado.
                scope: Apenas erros agregados com causas concorrentes.
              concepts:
              - error-joined-tree-order
              evidence:
                strategies:
                - test
              criteria:
              - id: denied-precedence-independent-of-order
                kind: structural
              completion:
                requires_positive_evaluation: true
      - id: classify-wrapped-errors.custom-is.macro
        kind: macro
        title: Reconhecer categorias declaradas por Is
        instruction:
          objective: Verifique como errors.Is delega a correspondência de uma categoria ao erro customizado.
          scope: A classificação de uma falha com dados próprios e uma categoria pública.
        children:
        - id: classify-wrapped-errors.custom-is.meso
          kind: meso
          title: Correspondência sem comparar mensagens
          instruction:
            objective: Confirme que a categoria resulta do contrato Is, não do texto produzido por Error.
            scope: Erros customizados com códigos diferentes.
          children:
          - id: classify-wrapped-errors.verify-custom-is
            kind: micro
            action: verify
            target: classification
            title: Verificar matcher customizado de Is
            instruction:
              objective: Confirme que Classify reconhece ErrDenied quando o erro fornece um método Is personalizado.
              scope: Apenas a correspondência de categoria e sua independência da mensagem.
