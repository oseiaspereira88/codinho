    content: "package boundary\n\nimport (\n    \"bytes\"\n    \"log\"\n    \"net/http\"\n    \"net/http/httptest\"\n    \"\
      strings\"\n    \"testing\"\n)\n\nfunc TestBoundaryRejectsOversizedAndUnknownIdentity(t *testing.T) {\n    var logs bytes.Buffer\n\
      \    secret := \"synthetic-token-42\"\n    handler := NewHandler(\"inventory-worker\", secret, 10, log.New(&logs, \"\
      \", 0))\n    tooLarge := httptest.NewRequest(http.MethodPost, \"/events\", strings.NewReader(\"12345678901\"))\n   \
      \ tooLarge.Header.Set(\"X-Service-Identity\", \"inventory-worker\")\n    tooLarge.Header.Set(\"X-Request-ID\", \"req-1\"\
      )\n    tooLarge.Header.Set(\"Authorization\", \"Bearer \"+secret)\n    rec := httptest.NewRecorder()\n    handler.ServeHTTP(rec,\
      \ tooLarge)\n    if rec.Code != http.StatusRequestEntityTooLarge { t.Fatalf(\"oversized status=%d\", rec.Code) }\n\n\
      \    unknown := httptest.NewRequest(http.MethodPost, \"/events\", strings.NewReader(\"ok\"))\n    unknown.Header.Set(\"\
      X-Service-Identity\", \"other-worker\")\n    unknown.Header.Set(\"X-Request-ID\", \"req-2\")\n    rec = httptest.NewRecorder()\n\
      \    handler.ServeHTTP(rec, unknown)\n    if rec.Code != http.StatusUnauthorized { t.Fatalf(\"unknown identity status=%d\"\
      , rec.Code) }\n\n    valid := httptest.NewRequest(http.MethodPost, \"/events\", strings.NewReader(\"ok\"))\n    valid.Header.Set(\"\
      X-Service-Identity\", \"inventory-worker\")\n    valid.Header.Set(\"X-Request-ID\", \"req-3\")\n    rec = httptest.NewRecorder()\n\
      \    handler.ServeHTTP(rec, valid)\n    if rec.Code != http.StatusOK { t.Fatalf(\"valid status=%d\", rec.Code) }\n \
      \   if strings.Contains(logs.String(), secret) { t.Fatal(\"secret appeared in logs\") }\n    if !strings.Contains(logs.String(),\
      \ \"req-3\") { t.Fatal(\"request correlation missing from logs\") }\n}\n"
