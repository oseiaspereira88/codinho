      - path: leaderboard.go
        content: |
          package leaderboard

          import (
              "strconv"
              "strings"
          )

          // BuildScores parses "name:score" entries, keeping only the first valid
          // score seen for each name -- including when that first score is
          // exactly 0 -- and collecting the raw entries whose score failed to
          // parse as an int, in the order they were seen.
          func BuildScores(entries []string) (scores map[string]int, invalidEntries []string) {
              scores = make(map[string]int)
              for _, entry := range entries {
                  name, raw, found := strings.Cut(entry, ":")
                  n, err := strconv.Atoi(raw)
                  if !found || err != nil {
                      invalidEntries = append(invalidEntries, entry)
                      continue
                  }
                  if _, exists := scores[name]; !exists {
                      scores[name] = n
                  }
              }
              return
          }
