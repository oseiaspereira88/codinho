  - schema_version: 1
    id: go-concurrency-context.concurrent-log-aggregator
    version: 1.0.0
    title: Agregar logs com concorrência limitada
    kind: functional_slice
    difficulty: intermediate
    estimated_minutes: 45
    themes: [go-concurrency-context.scheduling, go-concurrency-context.communication]
    competencies:
      primary: [go-concurrency-context.bound-concurrency, go-concurrency-context.propagate-backpressure]
      secondary: [go-concurrency-context.protect-shared-state, go-concurrency-context.shut-down-pipeline]
    prerequisites: [go-concurrency-context.shutdown-on-first-error]
    brief: Um agregador lê lotes de eventos, processa linhas em paralelo e devolve contagens determinísticas sem corrida de dados.
    constraints:
      - A ordem da resposta deve ser determinística.
      - O estado compartilhado deve ter proteção explícita.
      - Cancelamento deve interromper o processamento.
    acceptance:
      - O resultado contém todas as categorias esperadas.
      - A contagem permanece correta sob execução concorrente repetida.
      - A sincronização deixa explícitos os acessos concorrentes ao estado agregado, sem depender de uma ordem acidental.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: log-aggregator
        macro_steps:
          - id: log-aggregator.plan
            kind: macro
            title: Compor uma fatia concorrente
            children:
              - id: log-aggregator.parse
                kind: meso
                title: Separar parsing e agregação
                children:
                  - id: log-aggregator.dispatch
                    kind: micro
                    action: implement
                    target: workers
                    title: Distribuir linhas
                    instruction: {objective: Distribua linhas para workers limitados., scope: O envio de cada evento.}
                    concepts: [go-concurrency-context.worker-pool, go-concurrency-context.bounded-buffer]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: lines-are-distributed, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: log-aggregator.state
                    kind: micro
                    action: implement
                    target: shared_state
                    title: Proteger as contagens
                    instruction: {objective: Atualize contagens compartilhadas com uma invariante protegida., scope: Estado agregado.}
                    concepts: [go-concurrency-context.mutex-invariant, go-concurrency-context.race-happens-before]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: counts-are-synchronized, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: log-aggregator.order
                    kind: micro
                    action: verify
                    target: result
                    title: Ordenar a saída
                    instruction: {objective: Produza uma resposta independente da ordem dos workers., scope: Formato de retorno.}
                    concepts: [go-concurrency-context.mutex-invariant]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: result-order-is-deterministic, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: log-aggregator.reflect
                    kind: micro
                    action: reflect
                    target: race
                    title: Explicar a proteção
                    instruction: {objective: 'Explique que acesso concorrente o race detector deve distinguir.', scope: 'Leitura, escrita e sincronização.'}
                    concepts: [go-concurrency-context.race-happens-before, go-concurrency-context.mutex-invariant]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-race-boundary, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Por que ordenar somente no fim reduz o estado compartilhado?']}
  - schema_version: 1
    id: go-concurrency-context.reproduce-and-fix-goroutine-leak
    version: 1.0.0
    title: Diagnosticar um goroutine leak no cancelamento
    kind: debug
    difficulty: intermediate
    estimated_minutes: 40
    themes: [go-concurrency-context.lifecycle]
    competencies:
      primary: [go-concurrency-context.diagnose-goroutine-leak]
      secondary: [go-concurrency-context.select-with-cancellation, go-concurrency-context.shut-down-pipeline]
    prerequisites: [go-concurrency-context.cancel-select-loop]
    brief: Um worker de polling continua vivo depois que o chamador cancela a operação. Reproduza o leak e corrija somente a fronteira de encerramento.
    constraints:
      - Preserve a assinatura pública da fixture.
      - Não aumente o timeout do teste para esconder o leak.
      - Use apenas biblioteca padrão.
    acceptance:
      - O teste inicial falha por worker que não encerra após cancelamento.
      - A referência encerra o worker com cancelamento observável.
      - O teste de corrida passa sem sleep usado como sincronização.
    canonical: true
    publication: {status: draft, author: codex}
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/goroutine-leak

          go 1.25.0
      - path: worker.go
        content: |
          package leak

          import "context"

          func Run(ctx context.Context, work <-chan int, done chan<- struct{}) {
              go func() {
                  defer close(done)
                  for {
                      value := <-work
                      _ = value
                  }
              }()
          }
      - path: worker_test.go
        content: |
          package leak

          import (
              "context"
              "testing"
              "time"
          )

          func TestWorkerStopsOnCancel(t *testing.T) {
              ctx, cancel := context.WithCancel(context.Background())
              work := make(chan int)
              done := make(chan struct{})
              Run(ctx, work, done)
              cancel()
              select {
              case <-done:
              case <-time.After(100 * time.Millisecond):
                  t.Fatal("worker did not stop")
              }
          }
    checks:
      - id: focused-tests
        runner: go_test_race
        package: ./...
        test_pattern: ^TestWorkerStopsOnCancel$
        timeout: 20s
    validation:
      reference_fixture:
        - path: go.mod
          content: |
            module codinho-practice/goroutine-leak

            go 1.25.0
        - path: worker.go
          content: |
            package leak

            import "context"

            func Run(ctx context.Context, work <-chan int, done chan<- struct{}) {
                go func() {
                    defer close(done)
                    for {
                        select {
                        case <-ctx.Done():
                            return
                        case value := <-work:
                            _ = value
                        }
                    }
                }()
            }
        - path: worker_test.go
          content: |
            package leak

            import (
                "context"
                "testing"
                "time"
            )

            func TestWorkerStopsOnCancel(t *testing.T) {
                ctx, cancel := context.WithCancel(context.Background())
                work := make(chan int)
                done := make(chan struct{})
                Run(ctx, work, done)
                cancel()
                select {
                case <-done:
                case <-time.After(100 * time.Millisecond):
                    t.Fatal("worker did not stop")
                }
            }
      expectations:
        - {check_id: focused-tests, baseline: test_failure, reference: pass}
    layers:
      - id: leak-investigation
        macro_steps:
          - id: leak-investigation.plan
            kind: macro
            title: Reproduzir e corrigir o leak
            children:
              - id: leak-investigation.observe
                kind: meso
                title: Observar o caminho bloqueante
                children:
                  - id: leak-investigation.reproduce
                    kind: micro
                    action: verify
                    target: fixture
                    title: Reproduzir o encerramento ausente
                    instruction: {objective: Execute o teste e localize a goroutine que permanece bloqueada., scope: Apenas a fixture inicial.}
                    concepts: [go-concurrency-context.leak-detection]
                    evidence: {strategies: [test, source_inspection]}
                    criteria: [{id: baseline-reproduces-leak, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: leak-investigation.select
                    kind: micro
                    action: debug
                    target: cancellation
                    title: Localizar a espera sem cancelamento
                    instruction: {objective: Identifique qual receive não participa da decisão de cancelamento., scope: Loop do worker.}
                    concepts: [go-concurrency-context.select-cancellation, go-concurrency-context.leak-detection]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: blocked-receive-is-identified, kind: reasoning}]
                    completion: {requires_positive_evaluation: false}
                  - id: leak-investigation.fix
                    kind: micro
                    action: implement
                    target: shutdown
                    title: Corrigir o caminho de saída
                    instruction: {objective: Faça o worker observar o contexto e sinalizar o término., scope: Somente o loop e seu cleanup.}
                    concepts: [go-concurrency-context.select-cancellation, go-concurrency-context.graceful-shutdown]
                    evidence: {strategies: [test, source_inspection]}
                    criteria: [{id: reference-fix-stops-worker, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: leak-investigation.reflect
                    kind: micro
                    action: reflect
                    target: diagnosis
                    title: Explicar a causa sistêmica
                    instruction: {objective: 'Explique por que um timeout maior não corrige a causa do leak.', scope: 'Cancelamento, bloqueio e cleanup.'}
                    concepts: [go-concurrency-context.leak-detection, go-concurrency-context.context-deadline]
                    evidence: {strategies: [source_inspection, test]}
                    criteria: [{id: explains-leak-root-cause, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Que outro caminho de saída deve ser revisado quando um worker recebe context.Context?']}
