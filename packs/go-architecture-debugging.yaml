                    title: Reproduzir a retenção contada
                    instruction:
                      objective: Execute o teste do baseline e registre quando os bytes retidos divergem do ownership ativo.
                      scope: Somente a execução inicial; não use métricas do runtime.
                    concepts:
                      - go-architecture-debugging.reachable-heap-retention
                      - go-architecture-debugging.symptom-vs-cause
                    evidence:
                      strategies: [test]
                    criteria:
                      - id: baseline-retention-is-reproduced
                        kind: behavioral
                    completion:
                      requires_positive_evaluation: false
                      requires_user_confirmation: true
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: concept_recall}
                      - {level: 3, kind: design_prompt}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                  - id: go-architecture-debugging.trace-heap-retention.map-references
                    kind: micro
                    action: inspect
                    target: payload-references
                    title: Mapear as referências do payload
                    instruction:
                      objective: Mapeie cada coleção que mantém uma referência ao payload depois de Add.
                      scope: Campos de Store e seus owners.
                    concepts:
                      - go-architecture-debugging.reachable-heap-retention
                    evidence:
