challenges:
  - schema_version: 1
    id: go-errors.wrap-sentinel-error-with-context
    version: 1.0.0
    title: Encadear um erro sentinela preservando o contexto
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [errors]
    competencies:
      primary: [wrap-sentinel-with-context]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a busca de um valor em um mapa, encadeando um erro
      sentinela com o nome da chave quando ela não é encontrada, de
      forma que errors.Is continue detectando a sentinela através do
      encadeamento.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Encadear ErrNotFound com %w, nunca %v ou %s, para que errors.Is continue funcionando.
    acceptance:
      - LoadValue retorna o valor correto e nil para qualquer chave presente no mapa, não apenas para uma chave específica.
      - 'LoadValue de uma chave ausente retorna um erro cuja mensagem menciona exatamente essa chave, e para o qual errors.Is(err, ErrNotFound) é true.'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-value-when-found
            kind: micro
            action: implement
            target: function
            title: Devolver o valor quando a chave existe
            instruction:
              objective: Devolver o valor de store[key] e nil quando a chave existe.
              scope: O caminho em que a chave existe.
              constraints:
                - Não tratar ainda o caso de chave ausente.
            concepts: []
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-value-when-found
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.wrap-not-found-with-context
            kind: micro
            action: implement
            target: function
            title: Encadear ErrNotFound com o nome da chave
            instruction:
              objective: Quando a chave não existe, devolver um erro que mencione a chave e que ainda seja detectável como ErrNotFound por errors.Is.
              scope: O caminho em que a chave não existe.
              constraints:
                - Encadear ErrNotFound com %w, nunca %v ou %s, para que errors.Is continue funcionando.
            concepts: [error-wrapping-with-percent-w]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: wraps-not-found-preserving-is
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que fmt.Errorf com %v em vez de %w produz uma mensagem idêntica, mas quebra errors.Is?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/wrap-sentinel-error-with-context

          go 1.25.0
      - path: loadval.go
        content: |
          package config

          import "errors"

          // ErrNotFound is returned when a key is missing from the store.
          var ErrNotFound = errors.New("not found")

          // LoadValue returns the value for key, or an error wrapping ErrNotFound
          // -- with the key included in the message -- when key is not in store.
          func LoadValue(store map[string]string, key string) (string, error) {
              panic("not implemented")
          }
      - path: loadval_test.go
        content: |
          package config

          import (
              "errors"
              "strings"
              "testing"
          )

          func TestLoadValue(t *testing.T) {
              store := map[string]string{"a": "1", "b": "2", "c": "3", "d": "4", "e": "5"}

              for key, want := range store {
                  key, want := key, want
                  t.Run("found key "+key, func(t *testing.T) {
                      got, err := LoadValue(store, key)
                      if err != nil || got != want {
                          t.Fatalf("LoadValue(store, %q) = (%q, %v), want (%q, nil)", key, got, err, want)
                      }
                  })
              }

              t.Run("missing key wraps ErrNotFound and mentions the key", func(t *testing.T) {
                  _, err := LoadValue(store, "missing")
                  if err == nil {
                      t.Fatal("err = nil, want non-nil")
                  }
                  if !errors.Is(err, ErrNotFound) {
                      t.Errorf("errors.Is(err, ErrNotFound) = false, want true (err = %v)", err)
                  }
                  if !strings.Contains(err.Error(), "missing") {
                      t.Errorf("err.Error() = %q, does not mention the key", err.Error())
                  }
              })

              t.Run("different missing key is mentioned correctly, not hardcoded", func(t *testing.T) {
                  _, err := LoadValue(store, "another-missing-key")
                  if !errors.Is(err, ErrNotFound) {
                      t.Errorf("errors.Is(err, ErrNotFound) = false, want true (err = %v)", err)
                  }
                  if !strings.Contains(err.Error(), "another-missing-key") {
                      t.Errorf("err.Error() = %q, does not mention the key", err.Error())
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestLoadValue$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-errors.extract-field-with-errors-as
    version: 1.0.0
    title: Extrair o campo inválido de um erro encadeado com errors.As
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [errors]
    competencies:
      primary: [extract-wrapped-error-type]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a extração do campo de um *ValidationError encadeado
      dentro de um erro, funcionando mesmo quando o erro foi envolvido
      por outra camada de contexto.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Usar errors.As para procurar um *ValidationError em qualquer profundidade do encadeamento, não uma asserção de tipo direta.
    acceptance:
      - 'FieldFromError(ValidateAge(-1)) retorna ("age", true).'
      - FieldFromError encontra o *ValidationError mesmo quando ele foi encadeado por mais de uma camada externa de contexto.
      - FieldFromError de um erro não relacionado retorna ("", false).
      - FieldFromError(nil) retorna ("", false).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.search-chain-for-validation-error
            kind: micro
            action: implement
            target: function
            title: Procurar um *ValidationError em qualquer profundidade do erro
            instruction:
              objective: Procurar um *ValidationError em err, em qualquer profundidade do encadeamento, não apenas no próprio err.
              scope: A busca pelo *ValidationError.
              constraints:
                - Usar errors.As para procurar um *ValidationError em qualquer profundidade do encadeamento, não uma asserção de tipo direta.
            concepts: [errors-as-type-extraction]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: searches-chain-with-errors-as
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.return-field-or-not-found
            kind: micro
            action: implement
            target: function
            title: Devolver o campo encontrado ou ok false
            instruction:
              objective: Devolver o Field do *ValidationError encontrado com ok true, ou "" com ok false quando nenhum for encontrado.
              scope: O retorno da função a partir do resultado da busca.
              constraints:
                - Devolver ("", false) quando nenhum *ValidationError for encontrado no encadeamento.
            concepts: [errors-as-type-extraction]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-field-or-not-found
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - 'Por que err.(*ValidationError) falha quando err é o resultado de fmt.Errorf com %w, mesmo o *ValidationError estando presente no encadeamento?'
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/extract-field-with-errors-as

          go 1.25.0
      - path: validate.go
        content: |
          package validate

          import "fmt"

          // ValidationError reports which field failed validation.
          type ValidationError struct {
              Field string
          }

          func (e *ValidationError) Error() string {
              return fmt.Sprintf("invalid field: %s", e.Field)
          }

          // ValidateAge returns an error wrapping a *ValidationError when age is
          // negative.
          func ValidateAge(age int) error {
              if age < 0 {
                  return fmt.Errorf("validating age: %w", &ValidationError{Field: "age"})
              }
              return nil
          }

          // FieldFromError returns the Field of the *ValidationError wrapped
          // anywhere in err's chain, and whether one was found.
          func FieldFromError(err error) (field string, ok bool) {
              panic("not implemented")
          }
      - path: validate_test.go
        content: |
          package validate

          import (
              "errors"
              "fmt"
              "testing"
          )

          func TestFieldFromError(t *testing.T) {
              t.Run("wrapped validation error", func(t *testing.T) {
                  err := ValidateAge(-1)
                  field, ok := FieldFromError(err)
                  if !ok || field != "age" {
                      t.Errorf("FieldFromError(err) = (%q, %v), want (\"age\", true)", field, ok)
                  }
              })

              t.Run("deeply wrapped validation error", func(t *testing.T) {
                  inner := ValidateAge(-1)
                  wrapped := fmt.Errorf("handling request: %w", fmt.Errorf("processing user: %w", inner))
                  field, ok := FieldFromError(wrapped)
                  if !ok || field != "age" {
                      t.Errorf("FieldFromError(wrapped) = (%q, %v), want (\"age\", true)", field, ok)
                  }
              })

              t.Run("unrelated error", func(t *testing.T) {
                  field, ok := FieldFromError(errors.New("something else went wrong"))
                  if ok {
                      t.Errorf("FieldFromError(unrelated) = (%q, true), want ok=false", field)
                  }
              })

              t.Run("nil error", func(t *testing.T) {
                  field, ok := FieldFromError(nil)
                  if ok {
                      t.Errorf("FieldFromError(nil) = (%q, true), want ok=false", field)
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestFieldFromError$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-errors.validate-user-joining-all-errors
    version: 1.0.0
    title: Validar um usuário agregando todos os erros com errors.Join
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [errors]
    competencies:
      primary: [aggregate-errors-without-losing-any]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a validação de um usuário que agrega todas as
      violações encontradas em um único erro com errors.Join, em vez de
      parar na primeira violação.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Usar errors.Join para agregar todas as violações encontradas, não retornar só a primeira.
    acceptance:
      - ValidateUser("bob", 5) retorna nil.
      - 'ValidateUser("", 5) retorna um erro para o qual errors.Is(err, ErrNameRequired) é true e errors.Is(err, ErrAgeNegative) é false.'
      - 'ValidateUser("bob", -1) retorna um erro para o qual errors.Is(err, ErrAgeNegative) é true e errors.Is(err, ErrNameRequired) é false.'
      - 'ValidateUser("", -1) retorna um erro para o qual errors.Is(err, ErrNameRequired) e errors.Is(err, ErrAgeNegative) são ambos true -- as duas violações, não só a primeira.'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.collect-violated-rules
            kind: micro
            action: implement
            target: function
            title: Coletar as regras violadas
            instruction:
              objective: Verificar cada regra de validação e acumular o erro sentinela correspondente para cada uma que for violada, sem retornar ainda.
              scope: A verificação de cada regra e o acúmulo dos erros violados.
              constraints:
                - Verificar todas as regras, mesmo quando uma anterior já foi violada.
            concepts: [errors-join-aggregation]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: collects-all-violated-rules
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.join-collected-errors
            kind: micro
            action: implement
            target: function
            title: Agregar os erros coletados com errors.Join
            instruction:
              objective: Devolver os erros coletados agregados em um único erro, de forma que cada um continue detectável individualmente com errors.Is.
              scope: O retorno da função a partir dos erros coletados.
              constraints:
                - Usar errors.Join para agregar todas as violações encontradas, não retornar só a primeira.
            concepts: [errors-join-aggregation]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: joins-collected-errors
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que retornar só o primeiro erro encontrado perderia informação útil quando várias regras são violadas ao mesmo tempo?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/validate-user-joining-all-errors

          go 1.25.0
      - path: validate.go
        content: |
          package user

          import "errors"

          // ErrNameRequired means name was empty.
          var ErrNameRequired = errors.New("name is required")

          // ErrAgeNegative means age was negative.
          var ErrAgeNegative = errors.New("age cannot be negative")

          // ValidateUser returns nil when name and age are both valid, or a
          // single error aggregating every violated rule -- not just the first
          // one found.
          func ValidateUser(name string, age int) error {
              panic("not implemented")
          }
      - path: validate_test.go
        content: |
          package user

          import (
              "errors"
              "testing"
          )

          func TestValidateUser(t *testing.T) {
              t.Run("both valid", func(t *testing.T) {
                  if err := ValidateUser("bob", 5); err != nil {
                      t.Errorf("ValidateUser(\"bob\", 5) = %v, want nil", err)
                  }
              })

              t.Run("only name invalid", func(t *testing.T) {
                  err := ValidateUser("", 5)
                  if !errors.Is(err, ErrNameRequired) {
                      t.Error("expected ErrNameRequired")
                  }
                  if errors.Is(err, ErrAgeNegative) {
                      t.Error("did not expect ErrAgeNegative")
                  }
              })

              t.Run("only age invalid", func(t *testing.T) {
                  err := ValidateUser("bob", -1)
                  if !errors.Is(err, ErrAgeNegative) {
                      t.Error("expected ErrAgeNegative")
                  }
                  if errors.Is(err, ErrNameRequired) {
                      t.Error("did not expect ErrNameRequired")
                  }
              })

              t.Run("both invalid: both errors are present, not just the first", func(t *testing.T) {
                  err := ValidateUser("", -1)
                  if !errors.Is(err, ErrNameRequired) {
                      t.Error("expected ErrNameRequired to be present")
                  }
                  if !errors.Is(err, ErrAgeNegative) {
                      t.Error("expected ErrAgeNegative to also be present, not just the first violation")
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestValidateUser$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-errors.translate-error-at-boundary
    version: 1.0.0
    title: Traduzir um erro interno em uma fronteira sem vazar detalhes
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [errors]
    competencies:
      primary: [translate-error-without-leaking-internals]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma chamada simulada a um serviço externo que, ao
      falhar, traduz a falha interna para um erro público de domínio,
      sem nunca deixar o erro interno detectável por quem chama.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Nunca encadear errDeadlineExceeded no erro devolvido -- ele deve ser substituído, não envolvido.
    acceptance:
      - CallService(false) retorna nil.
      - 'CallService(true) retorna um erro para o qual errors.Is(err, ErrServiceUnavailable) é true.'
      - 'CallService(true) retorna um erro para o qual errors.Is(err, errDeadlineExceeded) é false -- o erro interno nunca é detectável por quem chama.'
      - A mensagem do erro devolvido por CallService(true) nunca contém o texto do erro interno, mesmo quando errors.Is não o detecta.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-nil-on-success
            kind: micro
            action: implement
            target: function
            title: Devolver nil quando a chamada simulada não falha
            instruction:
              objective: Devolver nil quando simulateTimeout é false.
              scope: O caminho em que simulateTimeout é false.
              constraints:
                - Não tratar ainda o caso de falha simulada.
            concepts: [error-translation-at-boundary]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-nil-on-success
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.translate-failure-without-leaking
            kind: micro
            action: implement
            target: function
            title: Traduzir a falha simulada sem vazar o erro interno
            instruction:
              objective: Quando simulateTimeout é true, devolver ErrServiceUnavailable, sem encadear errDeadlineExceeded no erro devolvido.
              scope: O caminho em que simulateTimeout é true.
              constraints:
                - Nunca encadear errDeadlineExceeded no erro devolvido, nem incluir o texto da sua mensagem -- ele deve ser substituído, não envolvido nem citado.
            concepts: [error-translation-at-boundary]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: translates-failure-without-leaking
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que encadear errDeadlineExceeded com %w junto de ErrServiceUnavailable violaria o propósito de uma fronteira de tradução, mesmo que errors.Is(err, ErrServiceUnavailable) continuasse funcionando?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/translate-error-at-boundary

          go 1.25.0
      - path: service.go
        content: |
          package svc

          import "errors"

          // errDeadlineExceeded simulates a low-level networking failure. It is
          // unexported: callers of CallService must never be able to detect it
          // directly.
          var errDeadlineExceeded = errors.New("i/o timeout")

          // ErrServiceUnavailable is the public sentinel CallService returns when
          // the simulated call fails, translating the low-level failure into a
          // domain-appropriate one instead of relaying it as-is.
          var ErrServiceUnavailable = errors.New("service unavailable")

          // CallService simulates calling a flaky downstream service. When
          // simulateTimeout is true, it translates the internal timeout into
          // ErrServiceUnavailable, without leaking errDeadlineExceeded to the
          // caller.
          func CallService(simulateTimeout bool) error {
              panic("not implemented")
          }
      - path: service_test.go
        content: |
          package svc

          import (
              "errors"
              "strings"
              "testing"
          )

          func TestCallService(t *testing.T) {
              t.Run("success", func(t *testing.T) {
                  if err := CallService(false); err != nil {
                      t.Errorf("CallService(false) = %v, want nil", err)
                  }
              })

              t.Run("timeout translates to the public sentinel", func(t *testing.T) {
                  err := CallService(true)
                  if !errors.Is(err, ErrServiceUnavailable) {
                      t.Errorf("errors.Is(err, ErrServiceUnavailable) = false, want true (err = %v)", err)
                  }
              })

              t.Run("the internal low-level error is never leaked to the caller", func(t *testing.T) {
                  err := CallService(true)
                  if errors.Is(err, errDeadlineExceeded) {
                      t.Error("errors.Is(err, errDeadlineExceeded) = true, want false -- internal error leaked across the boundary")
                  }
                  if strings.Contains(err.Error(), errDeadlineExceeded.Error()) {
                      t.Errorf("err.Error() = %q, contains the internal error message %q -- leaked textually even without errors.Is", err.Error(), errDeadlineExceeded.Error())
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestCallService$
        timeout: 20s
    variants: []

  - schema_version: 1
    id: go-errors.load-and-validate-required-keys
    version: 1.0.0
    title: Carregar e validar chaves obrigatórias, agregando toda ausência
    kind: combined
    difficulty: intermediate
    estimated_minutes: 25
    themes: [errors]
    competencies:
      primary: [wrap-sentinel-with-context, aggregate-errors-without-losing-any]
      secondary: []
    prerequisites: [error-wrapping-with-percent-w, errors-join-aggregation]
    brief: >
      Implemente a verificação de que um conjunto de chaves obrigatórias
      está presente em um mapa, encadeando ErrNotFound com o nome de
      cada chave ausente e agregando todas as ausências em um único
      erro, não só a primeira.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Encadear ErrNotFound com %w para cada chave ausente, incluindo o nome da chave.
      - Usar errors.Join para agregar todas as ausências encontradas, não retornar só a primeira.
    acceptance:
      - LoadAndValidate com todas as chaves presentes retorna nil.
      - 'LoadAndValidate com múltiplas chaves ausentes retorna um erro que menciona TODAS elas, não só a primeira, para o qual errors.Is(err, ErrNotFound) é true, e cujo número de erros agregados (via Unwrap() []error) é igual ao número de chaves ausentes -- não um único erro combinado.'
      - LoadAndValidate(store, nil) retorna nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.collect-missing-key-errors
            kind: micro
            action: implement
            target: function
            title: Coletar um erro encadeado para cada chave ausente
            instruction:
              objective: Para cada chave em required que não está em store, encadear ErrNotFound com o nome da chave e acumular esse erro, sem retornar ainda.
              scope: A verificação de cada chave e o acúmulo dos erros de ausência.
              constraints:
                - Encadear ErrNotFound com %w para cada chave ausente, incluindo o nome da chave.
            concepts: [error-wrapping-with-percent-w]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: collects-wrapped-not-found-per-key
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
