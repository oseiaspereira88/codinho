  - schema_version: 1
    id: go-first-steps.avoid-shadowing-named-returns
    version: 1.0.0
    title: Evitar shadowing de retornos nomeados em bloco aninhado
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [avoid-variable-shadowing]
      secondary: []
    prerequisites: [short-variable-declaration]
    brief: >
      Uma rotina de cadastro recebe a idade como texto. Ela precisa
      normalizar a entrada, distinguir ausência de valor de texto inválido e
      devolver o resultado correto em todos os caminhos.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Atualizar os resultados já declarados pela assinatura; não criar novos age/err no bloco condicional.
    acceptance:
      - ParseAge("25") retorna age 25 e err nil.
      - ParseAge(" 25 ") retorna age 25 e err nil, ignorando espaços externos.
      - ParseAge("") retorna err não-nil.
      - ParseAge("   ") retorna err não-nil.
      - ParseAge("abc") retorna err não-nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.validate-empty-input
            kind: micro
            action: implement
            target: function
            title: Tratar entrada vazia como erro
            instruction:
              objective: Fazer uma entrada sem idade produzir um erro.
              scope: A checagem de entrada vazia, dentro do corpo da função, e os imports necessários.
              constraints:
                - Não implementar a conversão numérica ainda.
            concepts: [named-return-values]
            evidence:
              strategies: [source_inspection, test]
            criteria:
