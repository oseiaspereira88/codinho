      \ string, maxBody int64, logger *log.Logger) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter,\
      \ r *http.Request) {\n        if r.Header.Get(\"X-Service-Identity\") == \"\" {\n            http.Error(w, \"identity\
      \ required\", http.StatusUnauthorized)\n            return\n        }\n        body, _ := io.ReadAll(r.Body)\n     \
      \   logger.Printf(\"request_id=%s authorization=%s bytes=%d\", r.Header.Get(\"X-Request-ID\"), r.Header.Get(\"Authorization\"\
      ), len(body))\n        w.WriteHeader(http.StatusOK)\n    })\n}\n"
