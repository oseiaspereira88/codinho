  brief: Implemente uma fatia local de worker com fila bounded. O handler decide quando confirmar, enquanto sinais operacionais
    mostram aceites e rejeições.
  constraints:
  - Use canais e fakes locais.
  - Ack é explícito e idempotente.
  - O teste de concorrência deve passar com race detector.
  acceptance:
  - A fila rejeita a mensagem além da capacidade.
  - Ack só ocorre após uma chamada explícita.
  - Stop retorna dentro do contexto e os contadores são protegidos.
