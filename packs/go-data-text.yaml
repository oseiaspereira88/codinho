    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/format-names-as-csv-fields

          go 1.25.0
      - path: rows.go
        content: |
          package rows

          import (
              "strings"
              "unicode"
          )

          // FormatNames returns a title-cased, CSV-quoted version of each name
          // in names that is not the empty string, skipping empty strings, and
          // pre-allocating its result with capacity exactly len(names) even
          // though some entries are skipped.
          func FormatNames(names []string) []string {
              out := make([]string, 0, len(names))
              for _, name := range names {
                  if name == "" {
                      continue
                  }
                  rs := []rune(name)
                  start := true
                  for i, r := range rs {
                      if unicode.IsSpace(r) {
                          start = true
                          continue
                      }
                      if start {
                          rs[i] = unicode.ToUpper(r)
                          start = false
                      }
                  }
                  name = string(rs)
                  if strings.ContainsAny(name, ",\"\n\r") {
                      name = "\"" + strings.ReplaceAll(name, "\"", "\"\"") + "\""
                  }
                  out = append(out, name)
              }
              return out
          }
