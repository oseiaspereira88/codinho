              "unsafe"
          )

          func TestFilter(t *testing.T) {
              t.Run("keeps order and value, does not mutate or alias input", func(t *testing.T) {
                  input := make([]int, 6, 20)
                  copy(input, []int{1, 2, 3, 4, 5, 6})
                  original := append([]int(nil), input...)

                  got := Filter(input, func(n int) bool { return n%2 == 0 })

                  want := []int{2, 4, 6}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Filter(...) = %v, want %v", got, want)
                  }
                  if !reflect.DeepEqual(input, original) {
                      t.Errorf("input mutated: got %v, want unchanged %v", input, original)
                  }
                  if len(got) > 0 {
                      inputStart := uintptr(unsafe.Pointer(unsafe.SliceData(input)))
                      inputEnd := inputStart + uintptr(cap(input))*unsafe.Sizeof(input[0])
                      gotStart := uintptr(unsafe.Pointer(unsafe.SliceData(got)))
                      if gotStart >= inputStart && gotStart < inputEnd {
                          t.Error("Filter(...) output shares backing array with input")
                      }
                  }
              })

              t.Run("empty result", func(t *testing.T) {
                  got := Filter([]int{1, 3, 5}, func(n int) bool { return n%2 == 0 })
                  if len(got) != 0 {
                      t.Errorf("Filter(...) = %v, want empty", got)
                  }
              })

              t.Run("nil input", func(t *testing.T) {
                  got := Filter(nil, func(n int) bool { return true })
                  if len(got) != 0 {
                      t.Errorf("Filter(nil, ...) = %v, want empty", got)
                  }
              })
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-data-text.truncate-bytes-at-rune-boundary
    version: 1.0.0
    title: Truncar uma string por bytes sem quebrar um rune
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [text-and-binary-data]
    competencies:
      primary: [truncate-string-at-rune-boundary]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que trunca uma string para no máximo um dado
      número de bytes, recuando até a fronteira de rune mais próxima
      quando o corte ingênuo cairia no meio de um caractere multibyte.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - O resultado nunca pode terminar no meio de um rune multibyte.
    acceptance:
      - 'TruncateBytes("hello", 10) retorna "hello".'
      - 'TruncateBytes("café", 4) retorna "caf" (não "caf" seguido de um byte inválido).'
      - 'TruncateBytes("日本語", 4) retorna "日".'
      - 'TruncateBytes("", 5) retorna "".'
      - 'TruncateBytes("ab", 0) retorna "".'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-unchanged-when-within-limit
            kind: micro
            action: implement
            target: function
            title: Retornar s sem alterações quando já cabe no limite
            instruction:
              objective: Implementar o caso em que s já cabe em maxBytes (len(s) <= maxBytes), retornando s sem alterações.
              scope: Somente a verificação de que s já cabe no limite.
              constraints:
                - Não implementar ainda o truncamento em si.
            concepts: [utf8-rune-boundary]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-unchanged-when-already-within-limit
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.truncate-at-rune-boundary
            kind: micro
            action: implement
            target: function
            title: Truncar recuando até a fronteira de rune mais próxima
            instruction:
              objective: Quando s não cabe em maxBytes, truncar em maxBytes e, se isso cair no meio de um rune multibyte, recuar até o início do rune mais próximo, garantindo que o resultado nunca quebre um rune.
              scope: O corte em maxBytes e o recuo até uma fronteira de rune válida.
              constraints:
                - O resultado nunca pode terminar no meio de um rune multibyte.
            concepts: [utf8-rune-boundary]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: truncates-at-rune-boundary
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que um corte ingênuo em s[:maxBytes] pode produzir uma string com bytes UTF-8 inválidos no final?
          - id: model.verify-valid-utf8-prefix
            kind: micro
            action: verify
            target: output
            title: Verificar prefixo UTF-8 válido
            instruction:
              objective: Confirme que cada resultado é um prefixo UTF-8 válido e nunca excede o orçamento de bytes.
              scope: Cortes ASCII e multibyte próximos ao limite.
            concepts: [utf8-rune-boundary]
            evidence:
              strategies: [test]
            criteria:
              - id: result-is-valid-utf8-prefix
                kind: structural
            completion:
              requires_positive_evaluation: true
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/truncate-bytes-at-rune-boundary

          go 1.25.0
      - path: truncate.go
        content: |
          package trunc

          // TruncateBytes returns a prefix of s with at most maxBytes bytes,
          // backing off to the nearest earlier rune boundary if the naive cut
          // would split a multi-byte rune.
          func TruncateBytes(s string, maxBytes int) string {
              panic("not implemented")
          }
      - path: truncate_test.go
        content: |
          package trunc

          import "testing"

          func TestTruncateBytes(t *testing.T) {
              cases := []struct {
                  name     string
                  s        string
                  maxBytes int
                  want     string
              }{
                  {"already short enough", "hello", 10, "hello"},
                  {"exact fit", "hello", 5, "hello"},
                  {"backs off mid-rune, 2-byte char", "café", 4, "caf"},
                  {"backs off mid-rune, 3-byte char", "日本語", 4, "日"},
                  {"empty string", "", 5, ""},
                  {"zero budget", "ab", 0, ""},
                  {"ascii truncation, no rune issue", "hello world", 5, "hello"},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := TruncateBytes(c.s, c.maxBytes)
                      if got != c.want {
                          t.Errorf("TruncateBytes(%q, %d) = %q, want %q", c.s, c.maxBytes, got, c.want)
                      }
                      if len(got) > c.maxBytes {
                          t.Errorf("TruncateBytes(%q, %d) = %q with %d bytes, want at most %d", c.s, c.maxBytes, got, len(got), c.maxBytes)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestTruncateBytes$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/truncate-bytes-at-rune-boundary

          go 1.25.0
      - path: truncate.go
        content: |
          package trunc

          import (
              "unicode/utf8"
          )

          // TruncateBytes returns a prefix of s with at most maxBytes bytes,
          // backing off to the nearest earlier rune boundary if the naive cut
          // would split a multi-byte rune.
          func TruncateBytes(s string, maxBytes int) string {
              if maxBytes <= 0 {
                  return ""
              }
              if len(s) <= maxBytes {
                  return s
              }
              for maxBytes > 0 && !utf8.RuneStart(s[maxBytes]) {
                  maxBytes--
              }
              return s[:maxBytes]
          }
      - path: truncate_test.go
        content: |
          package trunc

          import "testing"

          func TestTruncateBytes(t *testing.T) {
              cases := []struct {
                  name     string
                  s        string
                  maxBytes int
                  want     string
              }{
                  {"already short enough", "hello", 10, "hello"},
