tracks: []
challenges:
- schema_version: 1
  id: go-io.decode-strict-config
  version: 1.0.0
  title: Ler uma configuração JSON estrita
  kind: combined
  difficulty: foundational
  estimated_minutes: 30
  themes:
  - io-and-serialization
  competencies:
    primary:
    - io-decode-one-json
    - io-reject-unknown-fields
    - io-preserve-reader-errors
    secondary:
    - io-validate-document-boundary
    - io-read-fragmented-input
    - io-distinguish-eof
  prerequisites: []
  brief: Leia uma configuração do fluxo recebido, aceitando somente um documento válido com nome não vazio
    e tentativas entre zero e cinco.
  constraints:
  - Use somente a biblioteca padrão.
  - Não abra arquivos, não acesse a rede e não altere as assinaturas da fixture.
  - Propague erros de I/O preservando sua identidade.
  acceptance:
  - Aceita entrada fragmentada e espaços após o documento, preservando nome e tentativas.
  - Rejeita campos desconhecidos, JSON inválido, valores adicionais ou texto após o documento.
  - Rejeita nome vazio ou apenas espaços, tentativas negativas ou maiores que cinco.
  - Preserva a identidade de falhas de leitura para errors.Is.
  publication:
    status: draft
    author: codex
  layers:
  - id: decode-strict-config.implementation
    macro_steps:
    - id: decode-strict-config.macro
      kind: macro
      title: Ler uma configuração JSON estrita
      instruction:
        objective: Leia uma configuração do fluxo recebido, aceitando somente um documento válido com
          nome não vazio e tentativas entre zero e cinco.
        scope: Contrato observável do desafio.
      children:
      - id: decode-strict-config.meso
        kind: meso
        title: Decodificação, fronteira e validação da configuração
        instruction:
          objective: Separe a forma JSON, a fronteira do documento e as regras dos valores.
          scope: Uma configuração única recebida por io.Reader, incluindo falhas de entrada.
        children:
        - id: decode-strict-config.step-1
          kind: micro
          action: implement
          target: function
          title: Decodifique o primeiro documento da entrada.
          instruction:
            objective: Decodifique o primeiro documento JSON da entrada recebida.
            scope: Use o Reader como fluxo; a implementação deve aceitar leituras fragmentadas e manter
              a falha de leitura observável.
          concepts:
          - io-json-decoder
          evidence:
            strategies:
            - source_inspection
            - test
          criteria:
          - id: behavior-1
            kind: qualitative
          completion:
