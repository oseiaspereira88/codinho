      \ string }\nfunc NewClient(call Call, maxRetries int, fallback string) *Client { return &Client{call:call, maxRetries:maxRetries,\
      \ fallback:fallback} }\nfunc (c *Client) Fetch(ctx context.Context, key string) (Outcome, error) {\n    var last error\n\
      \    for attempt := 1; attempt <= c.maxRetries+2; attempt++ {\n        value, err := c.call(ctx, key)\n        if err\
