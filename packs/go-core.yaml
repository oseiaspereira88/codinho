    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/run-commands-with-cleanup-and-recovery

          go 1.25.0
      - path: batch.go
        content: |
          package batch

          import (
              "fmt"
          )

          // RunCommands runs each command in order using run, appending a report
          // line for each one, and closing (cleaning up) every command it starts
          // -- even when run panics. It stops immediately, without running or
          // closing any further commands, as soon as it reaches "stop".
          func RunCommands(commands []string, run func(string) int) (report []string) {
              for _, command := range commands {
                  if command == "stop" {
                      break
                  }
                  func() {
                      report = append(report, "start:"+command)
                      defer func() { report = append(report, "closed:"+command) }()
                      defer func() {
                          if value := recover(); value != nil {
                              report = append(report, fmt.Sprintf("failed:%s:%v", command, value))
                          }
                      }()
                      result := run(command)
                      report = append(report, fmt.Sprintf("ok:%s:%d", command, result))
                  }()
              }
              return
          }
