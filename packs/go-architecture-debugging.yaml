  - schema_version: 1
    id: go-architecture-debugging.trace-heap-retention
    version: 1.0.0
    title: Rastrear uma retenção de heap
    kind: debug
    difficulty: advanced
    estimated_minutes: 40
    themes:
      - go-architecture-debugging.investigation
    competencies:
      primary:
        - go-architecture-debugging.trace-retained-object-lifecycle
      secondary:
        - go-architecture-debugging.justify-trade-off-with-evidence
    prerequisites:
      - go-architecture-debugging.diagnose-shared-state-race
    brief: >
      Um store libera entradas ativas, mas o caminho de histórico continua
      mantendo payloads alcançáveis. Use contadores explícitos de ownership para
      encontrar a referência que sobrevive ao release.
    constraints:
      - Não use RSS, runtime.GC, pausas de GC ou sleep como oráculo.
      - Preserve a API pública e a representação do payload.
      - Corrija o ciclo de vida da referência sem reescrever o store inteiro.
    acceptance:
      - O baseline falha porque um payload liberado continua contado como retido.
      - A referência deixa somente os payloads ativos alcançáveis pelo store.
      - A evidência usa contagem ou bytes retidos determinísticos, sem inferir comportamento do heap pelo timing do runtime.
    canonical: true
    publication:
      status: draft
      author: codex
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/heap-retention

          go 1.25.0
      - path: store.go
        content: |
          package retention

          type entry struct {
              id      string
              payload []byte
          }

          type Store struct {
              active   map[string]entry
              retained []entry
          }

          func NewStore() *Store {
              return &Store{active: make(map[string]entry)}
          }

          func (s *Store) Add(id string, payload []byte) {
              item := entry{id: id, payload: payload}
              s.active[id] = item
              s.retained = append(s.retained, item)
          }

          func (s *Store) Release(id string) {
              delete(s.active, id)
          }

          func (s *Store) ActiveCount() int {
              return len(s.active)
          }

          func (s *Store) RetainedBytes() int {
              total := 0
              for _, item := range s.retained {
                  total += len(item.payload)
              }
              return total
          }
      - path: store_test.go
        content: |
          package retention

          import "testing"

          func TestReleasedPayloadIsNoLongerRetained(t *testing.T) {
              store := NewStore()
              const alphaBytes = 32
              const betaBytes = 48
              store.Add("alpha", make([]byte, alphaBytes))
              store.Add("beta", make([]byte, betaBytes))

              store.Release("alpha")
              if got := store.ActiveCount(); got != 1 {
                  t.Fatalf("active=%d, want 1", got)
              }
              if got := store.RetainedBytes(); got != betaBytes {
                  t.Fatalf("retained bytes after alpha release=%d, want %d", got, betaBytes)
              }

              store.Release("beta")
              if got := store.RetainedBytes(); got != 0 {
                  t.Fatalf("retained bytes after all releases=%d, want 0", got)
              }
          }
    checks:
      - id: heap-retention-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestReleasedPayloadIsNoLongerRetained$
        timeout: 30s
        network: false
    validation:
      reference_fixture:
        - path: go.mod
          content: |
            module codinho-practice/heap-retention

            go 1.25.0
        - path: store.go
          content: |
            package retention

            type entry struct {
                id      string
                payload []byte
            }

            type Store struct {
                active   map[string]entry
                retained []entry
            }

            func NewStore() *Store {
                return &Store{active: make(map[string]entry)}
            }

            func (s *Store) Add(id string, payload []byte) {
                item := entry{id: id, payload: payload}
                s.active[id] = item
                s.retained = append(s.retained, item)
            }

            func (s *Store) Release(id string) {
                delete(s.active, id)
                kept := make([]entry, 0, len(s.retained))
                for _, item := range s.retained {
                    if item.id != id {
                        kept = append(kept, item)
                    }
                }
                s.retained = kept
            }

            func (s *Store) ActiveCount() int {
                return len(s.active)
            }

            func (s *Store) RetainedBytes() int {
                total := 0
                for _, item := range s.retained {
                    total += len(item.payload)
                }
                return total
            }
        - path: store_test.go
          content: |
            package retention

            import "testing"

            func TestReleasedPayloadIsNoLongerRetained(t *testing.T) {
                store := NewStore()
                const alphaBytes = 32
                const betaBytes = 48
                store.Add("alpha", make([]byte, alphaBytes))
                store.Add("beta", make([]byte, betaBytes))

                store.Release("alpha")
                if got := store.ActiveCount(); got != 1 {
                    t.Fatalf("active=%d, want 1", got)
                }
                if got := store.RetainedBytes(); got != betaBytes {
                    t.Fatalf("retained bytes after alpha release=%d, want %d", got, betaBytes)
                }

                store.Release("beta")
                if got := store.RetainedBytes(); got != 0 {
                    t.Fatalf("retained bytes after all releases=%d, want 0", got)
                }
            }
      expectations:
        - check_id: heap-retention-tests
          baseline: test_failure
          reference: pass
    layers:
      - id: go-architecture-debugging.trace-heap-retention.layer
        macro_steps:
          - id: go-architecture-debugging.trace-heap-retention.plan
            kind: macro
            title: Planejar o rastreamento de ownership
            instruction:
              objective: Delimite quais referências devem sobreviver a cada operação do store.
              scope: Entradas ativas, histórico e release.
            children:
