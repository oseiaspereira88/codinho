      queue full\")\nvar ErrUnavailable = errors.New(\"broker unavailable\")\nvar ErrEmpty = errors.New(\"queue empty\")\n\
      var ErrRetryScheduled = errors.New(\"retry scheduled\")\n\ntype Message struct { ID string; Body string }\n\ntype Broker\
      \ struct {\n    mu sync.Mutex\n    queue []Message\n    capacity int\n    available bool\n    redeliveries map[string]int\n\
      \    acked map[string]bool\n}\n\nfunc NewBroker(capacity int) *Broker {\n    return &Broker{capacity: capacity, available:\
      \ true, redeliveries: make(map[string]int), acked: make(map[string]bool)}\n}\nfunc (b *Broker) SetAvailable(ok bool)\
      \ { b.mu.Lock(); b.available = ok; b.mu.Unlock() }\nfunc (b *Broker) Publish(_ context.Context, m Message) error {\n\
      \    b.mu.Lock(); defer b.mu.Unlock()\n    if !b.available { return ErrUnavailable }\n    if len(b.queue) >= b.capacity\
      \ { return nil }\n    b.queue = append(b.queue, m)\n    return nil\n}\nfunc (b *Broker) Receive(_ context.Context) (Message,\
      \ error) {\n    b.mu.Lock(); defer b.mu.Unlock()\n    if !b.available { return Message{}, ErrUnavailable }\n    if len(b.queue)\
      \ == 0 { return Message{}, ErrEmpty }\n    m := b.queue[0]; b.queue = b.queue[1:]\n    return m, nil\n}\nfunc (b *Broker)\
      \ Redeliver(m Message) error { b.mu.Lock(); defer b.mu.Unlock(); b.redeliveries[m.ID]++; b.queue = append(b.queue, m);\
      \ return nil }\nfunc (b *Broker) Ack(id string) { b.mu.Lock(); b.acked[id] = true; b.mu.Unlock() }\nfunc (b *Broker)\
      \ Redeliveries(id string) int { b.mu.Lock(); defer b.mu.Unlock(); return b.redeliveries[id] }\nfunc (b *Broker) Acked(id\
      \ string) bool { b.mu.Lock(); defer b.mu.Unlock(); return b.acked[id] }\n\ntype Service struct { broker *Broker; handle\
      \ func(Message) error; maxAttempts int; mu sync.Mutex; attempts map[string]int }\nfunc NewService(b *Broker, handle\
      \ func(Message) error, maxAttempts int) *Service { return &Service{broker:b, handle:handle, maxAttempts:maxAttempts,\
      \ attempts:make(map[string]int)} }\nfunc (s *Service) Process(ctx context.Context) error {\n    m, err := s.broker.Receive(ctx);\
