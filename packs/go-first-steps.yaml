                hints:
                  - level: 1
                    kind: guiding_question
                  - level: 2
                    kind: syntax_recall
                  - level: 3
                    kind: logical_prose
                  - level: 4
                    kind: pseudocode
                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
                kind: micro
                action: reflect
                target: decision
                title: Explicar a atribuição no escopo correto
                instruction:
