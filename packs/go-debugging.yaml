schema_version: 1
id: go-debugging
version: 1.2.0
themes: []
concepts:
  - id: slice-bounds
    title: Limites de um slice
    content:
      version: 1
      explanation: Uma slice tem índices válidos de zero até len(values)-1. len(values) é a quantidade de elementos, portanto não é um índice válido; usar esse valor diretamente causa panic. Antes de indexar, trate slices vazias quando elas forem permitidas pelo contrato.
      example:
        context: último item de uma lista
        code: |
          package example

          import "testing"

          func last(values []int) (int, bool) {
              if len(values) == 0 { return 0, false }
              return values[len(values)-1], true
          }

          func TestLast(t *testing.T) {
              if got, ok := last([]int{1, 2, 3}); !ok || got != 3 { t.Fatal(got, ok) }
              if _, ok := last(nil); ok { t.Fatal("empty slice accepted") }
          }
        explanation: A guarda trata a slice vazia e -1 transforma o comprimento no último índice válido.
      relation_refs: []
competencies:
  - id: debug-slice-bounds
    title: Diagnosticar um erro de limite em slice
  - id: reproduce-debug-failure
    title: Reproduzir uma falha antes de editar
  - id: locate-index-divergence
    title: Localizar a divergência entre índice e limite
  - id: formulate-debug-hypothesis
    title: Formular uma hipótese de causa
tracks: []
challenges:
  - schema_version: 1
    id: go-debug.slice-off-by-one
    version: 1.0.0
    title: Corrigir um índice fora dos limites
    kind: debug
    difficulty: foundational
    estimated_minutes: 20
    themes: [slices]
    competencies:
      primary: [debug-slice-bounds]
      secondary: [reproduce-debug-failure, locate-index-divergence, formulate-debug-hypothesis]
    prerequisites: [slice-bounds]
    brief: >
      O programa deveria imprimir o último elemento do slice, mas falha com
      panic de índice fora dos limites. Encontre e corrija o menor defeito
      possível.
    constraints:
      - Não reescreva a função inteira; aplique a menor correção.
    acceptance:
      - O programa imprime o último elemento sem panic.
    layers:
      - id: investigation
        macro_steps:
          - id: go-debug.reproduce
            kind: macro
            action: observe
            target: behavior
            title: Reproduzir o problema
            instruction:
              objective: Rode o programa e observe a falha real antes de tocar no código.
              scope: Somente observação; não edite nada ainda.
              constraints:
                - Não altere código nesta etapa.
            concepts: [slice-bounds]
            evidence:
              strategies: [compile, source_inspection]
            criteria:
              - id: reproduced
                kind: structural
            completion:
              requires_positive_evaluation: false
              requires_user_confirmation: true
            children:
              - id: go-debug.locate-divergence
                kind: meso
                title: Localizar a primeira divergência
                instruction:
                  objective: Aponte a linha exata onde o índice usado diverge do índice válido.
                  scope: Somente localização, sem corrigir ainda.
                concepts: [slice-bounds]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: divergence-located
                    kind: structural
                completion:
                  requires_positive_evaluation: false
                  requires_user_confirmation: true
                children:
                  - id: go-debug.hypothesize
                    kind: micro
                    title: Formular uma hipótese
                    instruction:
                      objective: Formule por escrito por que esse índice ultrapassa o limite do slice.
                      scope: Somente a hipótese, sem aplicar a correção.
                    concepts: [slice-bounds]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: hypothesis-stated
                        kind: qualitative
                    completion:
                      requires_positive_evaluation: false
                      requires_user_confirmation: true
                    reflection:
                      optional:
                        - Por que esse índice específico ultrapassa o limite?
                    children:
                      - id: go-debug.apply-smallest-fix
                        kind: micro
                        action: modify
                        target: index_expression
                        title: Aplicar a menor correção
                        instruction:
                          objective: Corrija apenas a expressão de índice, sem reescrever a função.
                          scope: Somente a expressão de índice reportada na hipótese.
                          constraints:
                            - Não reescrever a função inteira.
                        concepts: [slice-bounds]
                        evidence:
                          strategies: [compile, source_inspection]
                        criteria:
                          - id: fix-applied
                            kind: structural
                        completion:
                          requires_positive_evaluation: true
                          requires_user_confirmation: false
                        hints:
                          - level: 1
                            kind: guiding_question
                        children:
                          - id: go-debug.verify-corrected-output
                            hints:
                              - level: 1
                                kind: guiding_question
                              - level: 2
                                kind: syntax_recall
                            kind: micro
                            action: verify
                            target: program_output
                            title: Verificar a saída corrigida
                            instruction:
                              objective: Execute novamente o programa corrigido e confirme a saída esperada sem panic.
                              scope: Somente a execução após a correção.
                            concepts: [slice-bounds]
                            evidence:
                              strategies: [compile]
                            criteria:
                              - id: corrected-output
                                kind: structural
                            completion:
                              requires_positive_evaluation: true
                              requires_user_confirmation: false
                          - id: go-debug.check-empty-boundary
                            kind: micro
                            action: verify
                            target: boundary_case
                            title: Conferir a fronteira de slice vazia
                            instruction:
                              objective: Analise o que a função faria com uma slice vazia e registre se o contrato exige uma guarda adicional.
                              scope: Apenas o caso len(values) igual a zero; não altere a fixture neste passo.
                            concepts: [slice-bounds]
                            evidence:
                              strategies: [source_inspection]
                            criteria:
                              - id: empty-boundary-considered
                                kind: qualitative
                            completion:
                              requires_positive_evaluation: false
                              requires_user_confirmation: true
    fixture:
      - path: main.go
        content: |
          package main

          import "fmt"

          func lastElement(values []int) int {
              return values[len(values)]
          }

          func main() {
              fmt.Println(lastElement([]int{1, 2, 3}))
          }
relations:
- from: debug-slice-bounds
  to: go-debug.slice-off-by-one
  kind: applies_in
- from: reproduce-debug-failure
  to: go-debug.slice-off-by-one
  kind: applies_in
- from: locate-index-divergence
  to: go-debug.slice-off-by-one
  kind: applies_in
- from: formulate-debug-hypothesis
  to: go-debug.slice-off-by-one
  kind: applies_in
- from: slice-bounds
  to: go-debug.slice-off-by-one
  kind: applies_in
