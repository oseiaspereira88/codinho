              server "codinho-practice/configure-server-with-functional-options"
          )

          func TestNewServer(t *testing.T) {
              t.Run("defaults with no options", func(t *testing.T) {
                  s, err := server.NewServer()
                  if err != nil {
                      t.Fatalf("NewServer() err = %v, want nil", err)
                  }
                  if s.Host() != "localhost" || s.Port() != 8080 {
                      t.Fatalf("NewServer() = (%q, %d), want (localhost, 8080)", s.Host(), s.Port())
                  }
              })

              t.Run("applies host option", func(t *testing.T) {
                  s, err := server.NewServer(server.WithHost("example.com"))
                  if err != nil {
                      t.Fatalf("err = %v, want nil", err)
                  }
                  if s.Host() != "example.com" || s.Port() != 8080 {
                      t.Fatalf("got (%q, %d), want (example.com, 8080)", s.Host(), s.Port())
                  }
              })

              t.Run("later option wins over earlier one", func(t *testing.T) {
                  s, err := server.NewServer(server.WithPort(80), server.WithPort(443))
                  if err != nil {
                      t.Fatalf("err = %v, want nil", err)
                  }
                  if s.Port() != 443 {
                      t.Fatalf("Port() = %d, want 443", s.Port())
                  }
              })

              t.Run("valid later option replaces earlier invalid option", func(t *testing.T) {
                  s, err := server.NewServer(server.WithPort(0), server.WithPort(443))
                  if err != nil {
                      t.Fatalf("err = %v, want nil after final port is set to 443", err)
                  }
                  if s.Port() != 443 {
                      t.Fatalf("Port() = %d, want 443", s.Port())
                  }
              })

              t.Run("invalid later option rejects final configuration", func(t *testing.T) {
                  _, err := server.NewServer(server.WithPort(443), server.WithPort(0))
                  if err == nil {
                      t.Fatal("err = nil, want error for final port 0")
                  }
              })

              t.Run("rejects port zero", func(t *testing.T) {
                  _, err := server.NewServer(server.WithPort(0))
                  if err == nil {
                      t.Fatal("err = nil, want error for port 0")
                  }
              })

              t.Run("rejects port above valid range", func(t *testing.T) {
                  _, err := server.NewServer(server.WithPort(70000))
                  if err == nil {
                      t.Fatal("err = nil, want error for port 70000")
                  }
              })

              t.Run("accepts port at upper bound", func(t *testing.T) {
                  s, err := server.NewServer(server.WithPort(65535))
                  if err != nil {
                      t.Fatalf("err = %v, want nil", err)
                  }
                  if s.Port() != 65535 {
                      t.Fatalf("Port() = %d, want 65535", s.Port())
                  }
              })
          }
