          type strictValidator struct {
              minLength int
          }

          func (v *strictValidator) Validate() error {
              if v.minLength <= 0 {
                  return errValidatorNotConfigured
              }
              return nil
          }

          // SelectValidator returns a Validator for the given mode, or no
