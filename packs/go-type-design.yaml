      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestSelectValidator$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/select-validator-true-nil

