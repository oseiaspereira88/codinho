  - schema_version: 1
    id: go-first-steps.convert-celsius-to-fahrenheit
    version: 1.0.0
    title: Converter Celsius para Fahrenheit sem truncar
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [convert-numeric-types-safely]
      secondary: []
    prerequisites: []
    brief: >
      Declare um tipo nomeado para Celsius e implemente a conversão para
      Fahrenheit sem perder precisão em nenhum passo intermediário.
    constraints:
      - Não usar float32 em nenhum ponto da conversão.
      - Não converter para um tipo inteiro em nenhum passo intermediário.
    acceptance:
      - CelsiusToFahrenheit(0) retorna 32.
      - CelsiusToFahrenheit(100) retorna 212.
      - CelsiusToFahrenheit(36.6) retorna um valor entre 97.87 e 97.89.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.separate-static-and-runtime-conversion
            kind: macro
            title: Separar conversão estática e conversão em runtime
            instruction:
              objective: Delimitar quais limites são verificados pelo compilador e quais dependem da execução.
              scope: Literais numéricos da fórmula e valores recebidos pela função.
            concepts: [numeric-constant-representability, type-conversion]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: conversion-boundaries-defined
                kind: qualitative
            children:
