              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.return-field-or-not-found
            kind: micro
            action: implement
            target: function
            title: Devolver o campo encontrado ou ok false
            instruction:
              objective: Devolver o Field do *ValidationError encontrado com ok true, ou "" com ok false quando nenhum for encontrado.
              scope: O retorno da função a partir do resultado da busca.
              constraints:
                - Devolver ("", false) quando nenhum *ValidationError for encontrado no encadeamento.
            concepts: [errors-as-type-extraction]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-field-or-not-found
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
