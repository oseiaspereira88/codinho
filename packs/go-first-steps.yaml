  - schema_version: 1
    id: go-first-steps.avoid-shadowing-named-returns
    version: 1.0.0
    title: Evitar shadowing de retornos nomeados em bloco aninhado
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [avoid-variable-shadowing]
      secondary: []
    prerequisites: [short-variable-declaration]
    brief: >
      Implemente uma função que analisa uma idade em texto, atualizando os
      retornos nomeados corretamente mesmo dentro de um bloco condicional
      aninhado.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Não redeclarar age/err dentro do bloco condicional.
    acceptance:
      - ParseAge("25") retorna age 25 e err nil.
      - ParseAge("") retorna err não-nil.
      - ParseAge("   ") retorna err não-nil.
      - ParseAge("abc") retorna err não-nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.validate-empty-input
            kind: micro
            action: implement
            target: function
            title: Tratar entrada vazia como erro
            instruction:
              objective: Implementar a checagem de que raw (após remover espaços) não é vazio, definindo err quando for o caso.
              scope: A checagem de entrada vazia, dentro do corpo da função, e os imports necessários.
              constraints:
                - Não implementar a conversão numérica ainda.
            concepts: [named-return-values]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: rejects-empty-input
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.parse-and-assign-without-shadowing
            kind: micro
            action: implement
            target: function
            title: Converter e atribuir sem redeclarar dentro do bloco
            instruction:
              objective: Implementar a conversão do texto restante para age dentro do bloco condicional, atualizando os retornos nomeados age e err sem redeclará-los.
              scope: A conversão numérica e os imports necessários.
              constraints:
                - Não redeclarar age/err dentro do bloco condicional.
            concepts: [variable-shadowing, block-scope]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: parses-valid-input
                kind: structural
              - id: rejects-non-numeric-input
                kind: structural
              - id: no-redeclaration-in-conditional
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - O que aconteceria com age e err se você tivesse redeclarado os dois dentro do bloco condicional em vez de atualizá-los?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/avoid-shadowing-named-returns

          go 1.25.0
      - path: parseage.go
        content: |
          package parseage

          // ParseAge parses raw as an age, validating it is non-empty and
          // numeric.
          func ParseAge(raw string) (age int, err error) {
              panic("not implemented")
          }
      - path: parseage_test.go
        content: |
          package parseage

          import "testing"

          func TestParseAge(t *testing.T) {
              cases := []struct {
                  name    string
                  in      string
                  wantAge int
                  wantErr bool
              }{
                  {"valid", "25", 25, false},
                  {"empty", "", 0, true},
                  {"whitespace only", "   ", 0, true},
                  {"not a number", "abc", 0, true},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      age, err := ParseAge(c.in)
                      if age != c.wantAge {
                          t.Errorf("ParseAge(%q) age = %d, want %d", c.in, age, c.wantAge)
                      }
                      if (err != nil) != c.wantErr {
                          t.Errorf("ParseAge(%q) err = %v, wantErr %v", c.in, err, c.wantErr)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestParseAge$
        timeout: 20s
    variants: []
    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/avoid-shadowing-named-returns

          go 1.25.0
      - path: parseage.go
        content: |
          package parseage

          import (
              "strconv"
              "strings"
          )

          // ParseAge parses raw as an age, validating it is non-empty and
          // numeric.
          func ParseAge(raw string) (age int, err error) {
              age, err = strconv.Atoi(strings.TrimSpace(raw))
              return
          }
      - path: parseage_test.go
        content: |
          package parseage

          import "testing"

          func TestParseAge(t *testing.T) {
              cases := []struct {
                  name    string
                  in      string
                  wantAge int
                  wantErr bool
              }{
                  {"valid", "25", 25, false},
                  {"empty", "", 0, true},
                  {"whitespace only", "   ", 0, true},
                  {"not a number", "abc", 0, true},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      age, err := ParseAge(c.in)
                      if age != c.wantAge {
                          t.Errorf("ParseAge(%q) age = %d, want %d", c.in, age, c.wantAge)
                      }
                      if (err != nil) != c.wantErr {
                          t.Errorf("ParseAge(%q) err = %v, wantErr %v", c.in, err, c.wantErr)
                      }
                  })
              }
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
