  - schema_version: 1
    id: go-errors.validate-user-joining-all-errors
    version: 1.0.0
    title: Validar um usuário agregando todos os erros com errors.Join
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [errors]
    competencies:
      primary: [aggregate-errors-without-losing-any]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a validação de um usuário que agrega todas as
      violações encontradas em um único erro com errors.Join, em vez de
      parar na primeira violação.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Usar errors.Join para agregar todas as violações encontradas, não retornar só a primeira.
    acceptance:
      - ValidateUser("bob", 5) retorna nil.
      - 'ValidateUser("", 5) retorna um erro para o qual errors.Is(err, ErrNameRequired) é true e errors.Is(err, ErrAgeNegative) é false.'
      - 'ValidateUser("bob", -1) retorna um erro para o qual errors.Is(err, ErrAgeNegative) é true e errors.Is(err, ErrNameRequired) é false.'
      - 'ValidateUser("", -1) retorna um erro para o qual errors.Is(err, ErrNameRequired) e errors.Is(err, ErrAgeNegative) são ambos true -- as duas violações, não só a primeira.'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.collect-violated-rules
            kind: micro
            action: implement
            target: function
            title: Coletar as regras violadas
            instruction:
              objective: Verificar cada regra de validação e acumular o erro sentinela correspondente para cada uma que for violada, sem retornar ainda.
              scope: A verificação de cada regra e o acúmulo dos erros violados.
              constraints:
                - Verificar todas as regras, mesmo quando uma anterior já foi violada.
            concepts: [errors-join-aggregation]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: collects-all-violated-rules
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.join-collected-errors
            kind: micro
            action: implement
            target: function
            title: Agregar os erros coletados com errors.Join
            instruction:
              objective: Devolver os erros coletados agregados em um único erro, de forma que cada um continue detectável individualmente com errors.Is.
              scope: O retorno da função a partir dos erros coletados.
              constraints:
                - Usar errors.Join para agregar todas as violações encontradas, não retornar só a primeira.
            concepts: [errors-join-aggregation]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: joins-collected-errors
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que retornar só o primeiro erro encontrado perderia informação útil quando várias regras são violadas ao mesmo tempo?
    fixture:
