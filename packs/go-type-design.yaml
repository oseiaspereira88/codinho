                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que o compilador pode ajustar uma chamada em uma variável endereçável, mas não pode usar essa mesma conveniência para um elemento de map?
          - id: model.handle-nil-receiver-first
            kind: micro
            action: implement
            target: function
            title: Definir o resultado para uma lista ausente
            instruction:
              objective: Fazer Sum de um receptor nil produzir a soma neutra 0 sem acessar o receptor.
