  - schema_version: 1
    id: go-core.hide-counter-type-behind-interface
    version: 1.0.0
    title: Esconder o tipo concreto de um contador atrás de uma interface
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [packages-and-apis]
    competencies:
      primary: [hide-concrete-type-behind-constructor]
      secondary: []
    prerequisites: []
    brief: >
      Implemente um contador cujo construtor exportado devolve uma
      interface, sem nunca expor o tipo concreto que a implementa.
    constraints:
      - Não usar bibliotecas externas.
      - NewCounter deve retornar o tipo Counter, não o tipo concreto.
    acceptance:
      - Após uma chamada a Increment em um Counter recém-criado por NewCounter(), o valor retornado é 1.
      - Duas chamadas sucessivas a Increment no mesmo Counter retornam 1 e depois 2.
      - Dois Counters distintos criados por NewCounter() mantêm contagens independentes.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.implement-increment
            kind: micro
            action: implement
            target: function
            title: Implementar Increment para mutar e devolver a nova contagem
            instruction:
              objective: Implementar Increment para aumentar a contagem interna em um e devolver o novo valor.
              scope: Somente o corpo do método Increment.
              constraints:
                - Não usar bibliotecas externas.
            concepts: [pointer-vs-value-receiver]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: increment-mutates-and-returns-new-count
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.implement-new-counter
            kind: micro
            action: implement
            target: function
            title: Implementar NewCounter devolvendo Counter
            instruction:
              objective: Implementar NewCounter para construir e devolver um novo contador, expondo-o apenas através do tipo Counter.
              scope: Somente o corpo de NewCounter.
              constraints:
                - NewCounter deve retornar o tipo Counter, não o tipo concreto.
            concepts: [constructor-returns-interface]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: new-counter-constructs-counter-impl
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que quem chama NewCounter nunca precisa conhecer o nome do tipo concreto para usar o Counter retornado?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/hide-counter-type-behind-interface

          go 1.25.0
      - path: counterapi.go
        content: |
          package counterapi

          // Counter tracks a count that increases by one each time it is
          // incremented.
          type Counter interface {
              Increment() int
          }

          type counterImpl struct {
              count int
          }

          // Increment increases the count by one and returns the new count.
          func (c *counterImpl) Increment() int {
              panic("not implemented")
          }

          // NewCounter returns a new Counter.
          func NewCounter() Counter {
              panic("not implemented")
          }
      - path: counterapi_test.go
        content: |
          package counterapi_test

          import (
              "testing"

              "codinho-practice/hide-counter-type-behind-interface"
          )

          func TestCounter(t *testing.T) {
              c := counterapi.NewCounter()
              if got := c.Increment(); got != 1 {
                  t.Fatalf("first Increment() = %d, want 1", got)
              }
              if got := c.Increment(); got != 2 {
                  t.Fatalf("second Increment() = %d, want 2", got)
              }

              other := counterapi.NewCounter()
              if got := other.Increment(); got != 1 {
                  t.Fatalf("other Increment() = %d, want 1", got)
              }
              if got := c.Increment(); got != 3 {
                  t.Fatalf("c.Increment() after touching other = %d, want 3", got)
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestCounter$
        timeout: 20s
