tracks: []
challenges:
- schema_version: 1
  id: go-testing.select-active-tokens-with-injected-clock
  version: 1.0.0
  title: Tornar uma seleção temporal testável
  kind: combined
  difficulty: foundational
  estimated_minutes: 35
  themes:
  - testing-and-testability
  competencies:
    primary:
    - testing-design-deterministic-time
    - testing-cover-boundary-cases
    - testing-detect-aliasing
    secondary:
    - testing-build-counting-double
    - testing-name-diagnostic-cases
    - control-test-cleanup-lifecycle
  prerequisites: []
  brief: Uma rotina precisa decidir quais tokens continuam válidos quando o instante observado é fornecido
    pelo teste. Os casos-limite devem ser repetíveis e a entrada deve permanecer intacta.
  constraints:
  - Use somente a biblioteca padrão e a dependência de relógio da fixture.
  - Não use time.Now, time.Sleep, rede ou arquivos para determinar o resultado.
  - Preserve os casos existentes e acrescente um caso de fronteira justificado.
  acceptance:
  - Um token só está ativo se sua expiração ocorre estritamente depois do instante observado.
  - O relógio é chamado exatamente uma vez por operação, inclusive com entrada vazia.
  - Relógio nil retorna a sentinela ErrMissingClock e resultado nil.
  - Preserva a ordem dos tokens ativos e todos os dados da entrada.
  - Retorna slice vazio não nil quando não há tokens ativos.
  - Alterar um elemento do resultado não altera a entrada.
  - Os testes demonstram casos antes, na igualdade e depois do limite, sem depender do relógio do sistema.
  publication:
    status: draft
    author: codex
  layers:
  - id: testable-expiry.implementation
    macro_steps:
    - id: testable-expiry.macro
      kind: macro
      title: Estabelecer um contrato temporal testável
      instruction:
        objective: Implemente a seleção temporal conforme os critérios de aceite.
        scope: Contrato, observação do tempo e isolamento dos dados.
      children:
      - id: testable-expiry.meso
        kind: meso
        title: Casos determinísticos e implementação
        instruction:
          objective: Use casos reproduzíveis para orientar a implementação.
          scope: Limites de validade e efeitos observáveis.
        children:
        - id: testable-expiry.step-1
          kind: micro
          action: implement
          target: function
          title: Planeje os casos da fronteira temporal.
          instruction:
            objective: Defina a tabela de casos temporais.
            scope: Registre expectativas observáveis para antes, igualdade e depois do limite, incluindo
              o caso adicional já presente na fixture.
          concepts:
          - testing-table-cases
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: behavior-1
            kind: qualitative
