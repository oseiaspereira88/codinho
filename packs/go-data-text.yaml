          // TitleFirstLetters capitalizes the first letter of each word in s,
          // leaving every other character -- including all original whitespace,
          // exactly as it was.
          func TitleFirstLetters(s string) string {
              runes := []rune(s)
              start := true
              for i, r := range runes {
