                  scope: Chamada do método, tipo do receiver e limite da conversão implícita de endereço.
                concepts: [method-set-addressability, pointer-vs-value-receiver]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: receiver-call-boundary-is-explained
                    kind: qualitative
                children:
                  - id: model.verify-addressable-receiver-call
                    kind: micro
                    action: analyze
                    target: method_set
                    title: Verificar chamada em receiver endereçável
                    instruction:
                      objective: Explique por que a chamada de Sum é válida para o valor de receiver usado pela fixture e qual limite existiria para um elemento não endereçável.
                      scope: A chamada do método e o method set, sem alterar a implementação de Sum.
                      constraints:
                        - Não confundir uma chamada automática por endereço com uma mudança no method set de Node.
                    concepts: [method-set-addressability]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: addressable-call-and-method-set-distinguished
                        kind: qualitative
                    completion:
