schema_version: 1
id: go-errors
version: 1.5.0
themes:
  - id: errors
    title: Erros
concepts:
- id: error-wrapping-with-percent-w
  title: Encadeamento de erro com %w
  content:
    version: 1
    explanation: O verbo %w na função fmt.Errorf cria um erro que envolve outro erro original, preservando
      a cadeia de causa para inspeção com errors.Is e errors.As sem perder a mensagem contextual.
    example:
      context: reserva de planetário
      code: "var ErrSessaoLotada = errors.New(\"sessao esgotada\")\n\nfunc ReservarCadeiraPlanetario(sessaoID\
        \ string, cadeira int) error {\n\tif cadeira > 50 {\n\t\treturn fmt.Errorf(\"planetario %s: %w\"\
        , sessaoID, ErrSessaoLotada)\n\t}\n\treturn nil\n}"
      explanation: O erro retornado inclui o identificador da sessão astronômica no prefixo e preserva
        a sentinela ErrSessaoLotada intacta para verificação pelo chamador.
    analogy: 'Como colocar uma carta dentro de um envelope timbrado do planetário: o envelope adiciona
      informações de postagem, mas a carta original permanece intacta lá dentro.'
    relation_refs:
    - kind: relates_to
      concept_id: errors-as-type-extraction
- id: errors-as-type-extraction
  title: Extração de tipo com errors.As
  content:
    version: 1
    explanation: 'errors.As procura um erro atribuível ao tipo apontado pelo destino e preenche esse destino
      quando encontra uma correspondência. Passe um ponteiro para a variável que receberá o erro: para
      um tipo *SizeError, use uma variável *SizeError e passe seu endereço. Verifique o booleano antes
      de acessar campos; converter diretamente o erro externo não atravessa wrapping.'
    example:
      context: limite de tamanho de uma imagem
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"testing\"\n)\n\ntype SizeError\
        \ struct{ Limit int }\n\nfunc (e *SizeError) Error() string { return \"image too large\" }\nfunc\
        \ TestErrorType(t *testing.T) {\n\terr := fmt.Errorf(\"thumbnail: %w\", &SizeError{Limit: 512})\n\
        \tvar size *SizeError\n\tif !errors.As(err, &size) || size.Limit != 512 {\n\t\tt.Fatal(\"missing\
        \ typed error\")\n\t}\n\tvar absent *SizeError\n\tif errors.As(errors.New(\"other failure\"),\
        \ &absent) {\n\t\tt.Fatal(\"unexpected match\")\n\t}\n}\n"
      explanation: O destino é **SizeError porque a variável receptora é *SizeError. O teste cobre presença
        por wrapping e ausência; não compara o texto para identificar o tipo.
    relation_refs:
    - kind: relates_to
      concept_id: error-wrapping-with-percent-w
- id: errors-join-aggregation
  title: Agregação de erros com errors.Join
  content:
    version: 1
    explanation: errors.Join reúne falhas independentes sem escolher apenas a primeira. Argumentos nil
      são ignorados; se todos forem nil, o resultado é nil. errors.Is e errors.As podem percorrer os erros
      agregados. A mensagem combinada serve para diagnóstico, não deve virar um protocolo de classificação
      por texto.
    example:
      context: checagens independentes de um formulário
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc TestJoinedErrors(t *testing.T)\
        \ {\n\tname := errors.New(\"name missing\")\n\tage := errors.New(\"age invalid\")\n\terr := errors.Join(name,\
        \ nil, age)\n\tif !errors.Is(err, name) || !errors.Is(err, age) {\n\t\tt.Fatal(\"lost cause\"\
        )\n\t}\n\tif errors.Join(nil, nil) != nil {\n\t\tt.Fatal(\"empty aggregation must succeed\")\n\
        \t}\n}\n"
      explanation: As duas identidades permanecem consultáveis. O exemplo verifica também que uma agregação
        sem falhas não produz um erro artificial.
    relation_refs:
    - kind: relates_to
      concept_id: error-identity-not-message
- id: error-translation-at-boundary
  title: Tradução de erro em uma fronteira
  content:
    version: 1
    explanation: 'Uma fronteira pode traduzir erros internos para um contrato público estável. Decida
      quais identidades o chamador deve observar: envolver uma causa interna com %w também a expõe por
      errors.Is e errors.As. Quando a causa não faz parte do contrato público, devolva a categoria pública
      e preserve diagnóstico interno apenas no canal autorizado, sem dados sensíveis.'
    example:
      context: serviço de reserva de bicicletas
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"strings\"\n\t\"testing\"\n)\n\n\
        var errStorageOffline = errors.New(\"storage offline\")\nvar ErrUnavailable = errors.New(\"reservation\
        \ unavailable\")\n\nfunc publicError(err error) error {\n\tif err == nil {\n\t\treturn nil\n\t\
        }\n\treturn ErrUnavailable\n}\nfunc TestBoundary(t *testing.T) {\n\tinternal := fmt.Errorf(\"\
        adapter: %w\", errStorageOffline)\n\tgot := publicError(internal)\n\tif !errors.Is(got, ErrUnavailable)\
        \ || errors.Is(got, errStorageOffline) || strings.Contains(got.Error(), \"adapter\") {\n\t\tt.Fatal(\"\
        public boundary leaked internals\")\n\t}\n\tif publicError(nil) != nil {\n\t\tt.Fatal(\"success\
        \ became failure\")\n\t}\n}\n"
      explanation: Esta fronteira ilustrativa transforma qualquer falha em indisponibilidade. Uma API
        com mais categorias precisa de mapeamento explícito; a mensagem pública não contém a causa interna.
    relation_refs:
    - kind: relates_to
      concept_id: error-identity-not-message
- id: error-classification-precedence
  title: Precedência na classificação de erros
  content:
    version: 1
    explanation: 'Um erro agregado pode satisfazer várias categorias simultaneamente. Defina a prioridade
      no contrato e teste combinações: a ordem das condições pode alterar o resultado mesmo quando cada
      condição está correta. Não confunda prioridade de negócio com ordem dos filhos na árvore de erros.'
    example:
      context: prioridade de uma reserva
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc TestPriority(t *testing.T)\
        \ {\n\tclosed := errors.New(\"closed\")\n\tbusy := errors.New(\"busy\")\n\tclassify := func(err\
        \ error) string {\n\t\tswitch {\n\t\tcase errors.Is(err, closed):\n\t\t\treturn \"closed\"\n\t\
        \tcase errors.Is(err, busy):\n\t\t\treturn \"busy\"\n\t\tdefault:\n\t\t\treturn \"other\"\n\t\t\
        }\n\t}\n\tfor _, err := range []error{errors.Join(closed, busy), errors.Join(busy, closed)} {\n\
        \t\tif classify(err) != \"closed\" {\n\t\t\tt.Fatal(\"priority depends on order\")\n\t\t}\n\t\
        }\n}\n"
      explanation: A categoria closed vence nas duas ordens de agregação. A prioridade está nas condições,
        não na posição do erro.
    relation_refs:
    - kind: relates_to
      concept_id: errors-join-aggregation
- id: error-identity-not-message
  title: Identidade de erro versus mensagem
  content:
    version: 1
    explanation: Dois erros podem ter a mesma mensagem sem representar a mesma identidade. Declare uma
      sentinela compartilhada quando o contrato requer reconhecimento estável e consulte-a com errors.Is.
      Comparar Error() mistura diagnóstico com classificação e pode aceitar uma falha de outra origem.
    example:
      context: mensagens coincidentes
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc TestIdentity(t *testing.T)\
        \ {\n\ta := errors.New(\"unavailable\")\n\tb := errors.New(\"unavailable\")\n\tif a.Error() !=\
        \ b.Error() {\n\t\tt.Fatal(\"expected equal messages\")\n\t}\n\tif errors.Is(a, b) {\n\t\tt.Fatal(\"\
        distinct errors matched\")\n\t}\n\tif !errors.Is(a, a) {\n\t\tt.Fatal(\"identity lost\")\n\t}\n\
        }\n"
      explanation: As mensagens são iguais, mas as chamadas a errors.New criam erros distintos. O teste
        separa texto e identidade.
    relation_refs:
    - kind: relates_to
      concept_id: error-wrapping-with-percent-w
- id: error-chain-type-traversal
  title: Extração de tipos em cadeias de erro
  content:
    version: 1
    explanation: errors.As percorre wrapping para encontrar um erro atribuível ao tipo solicitado. Um
      único errors.Unwrap alcança apenas a próxima camada e não substitui essa busca. O erro encontrado
      mantém os dados do tipo; evite remover contexto manualmente até achar uma mensagem conhecida.
    example:
      context: medida rejeitada por várias camadas
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"testing\"\n)\n\ntype MeasureError\
        \ struct{ Unit string }\n\nfunc (e *MeasureError) Error() string { return \"invalid measure\"\
        \ }\nfunc TestNestedType(t *testing.T) {\n\troot := &MeasureError{Unit: \"kg\"}\n\terr := fmt.Errorf(\"\
        screen: %w\", fmt.Errorf(\"service: %w\", root))\n\tvar got *MeasureError\n\tif !errors.As(err,\
        \ &got) || got != root || got.Unit != \"kg\" {\n\t\tt.Fatal(\"nested type lost\")\n\t}\n}\n"
      explanation: A busca atravessa duas camadas e recupera o mesmo objeto. Um acesso apenas à primeira
        causa ainda encontraria um erro de contexto.
    relation_refs:
    - kind: relates_to
      concept_id: errors-as-type-extraction
- id: error-joined-tree-order
  title: Ordem de tipos em árvores de erros
  content:
    version: 1
    explanation: Erros agregados formam uma árvore. errors.As visita o erro atual e depois os filhos em
      profundidade, na ordem em que aparecem, retornando a primeira correspondência. Quando há vários
      erros do mesmo tipo, inverter os filhos pode mudar o objeto encontrado; não use essa ordem como
      prioridade de negócio implícita.
    example:
      context: duas falhas de campo
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\ntype FieldError struct{ Name\
        \ string }\n\nfunc (e *FieldError) Error() string { return \"invalid field\" }\nfunc TestTreeOrder(t\
        \ *testing.T) {\n\ta := &FieldError{Name: \"color\"}\n\tb := &FieldError{Name: \"size\"}\n\tfor\
        \ _, tc := range []struct {\n\t\terr  error\n\t\twant *FieldError\n\t}{{errors.Join(errors.Join(a),\
        \ b), a}, {errors.Join(b, errors.Join(a)), b}} {\n\t\tvar got *FieldError\n\t\tif !errors.As(tc.err,\
        \ &got) || got != tc.want {\n\t\t\tt.Fatal(\"unexpected first match\")\n\t\t}\n\t}\n}\n"
      explanation: Os dois arranjos contêm as mesmas falhas, mas a primeira correspondência muda. A árvore
        aninhada demonstra a busca em profundidade.
    relation_refs:
    - kind: relates_to
      concept_id: error-classification-precedence
- id: catalog-zero-value
  title: Valor zero de catálogo em memória
  content:
    version: 1
    explanation: Um tipo pode oferecer operações úteis sem construtor. Para mapas, leitura e len funcionam
      com nil, mas atribuir uma entrada a um mapa nil causa panic. Inicialize o mapa antes da primeira
      escrita e documente quais operações o valor zero suporta; isso não implica segurança para acesso
      concorrente.
    example:
      context: contador por cor
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\ntype Counter struct{ counts map[string]int\
        \ }\n\nfunc (c *Counter) Add(key string) {\n\tif c.counts == nil {\n\t\tc.counts = make(map[string]int)\n\
        \t}\n\tc.counts[key]++\n}\nfunc TestZeroCounter(t *testing.T) {\n\tvar c Counter\n\tif len(c.counts)\
        \ != 0 || c.counts[\"blue\"] != 0 {\n\t\tt.Fatal(\"invalid zero\")\n\t}\n\tc.Add(\"blue\")\n\t\
        c.Add(\"blue\")\n\tif c.counts[\"blue\"] != 2 {\n\t\tt.Fatal(\"lost count\")\n\t}\n}\n"
      explanation: A primeira escrita prepara o mapa e a segunda preserva seu conteúdo. O exemplo usa
        uma variável endereçável, não um ponteiro nil para Counter.
    relation_refs:
    - kind: relates_to
      concept_id: catalog-validation-before-mutation
- id: catalog-validation-before-mutation
  title: Validação anterior à mutação
  content:
    version: 1
    explanation: Valide as condições de uma operação antes de alterar o estado. Se um erro deve deixar
      os dados intactos, teste o estado após a rejeição, não apenas a presença do erro. Atualizações com
      várias etapas exigem cuidado adicional para evitar que uma etapa posterior falhe depois de uma mutação
      parcial.
    example:
      context: limite de volume
      code: "package example\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc setVolume(dst *int, next\
        \ int) error {\n\tif next < 0 || next > 10 {\n\t\treturn errors.New(\"volume outside range\")\n\
        \t}\n\t*dst = next\n\treturn nil\n}\nfunc TestNoPartialMutation(t *testing.T) {\n\tvalue := 4\n\
        \tif err := setVolume(&value, 11); err == nil || value != 4 {\n\t\tt.Fatal(\"rejection changed\
        \ state\")\n\t}\n\tif err := setVolume(&value, 7); err != nil || value != 7 {\n\t\tt.Fatal(\"\
        valid update failed\")\n\t}\n}\n"
      explanation: O ponteiro recebido é válido neste contrato ilustrativo. A rejeição preserva o valor
        anterior; o caso válido confirma que a operação realmente atualiza.
    relation_refs:
    - kind: relates_to
      concept_id: catalog-zero-value
- id: catalog-deterministic-list
  title: Listagem determinística de mapas
  content:
    version: 1
    explanation: A ordem de iteração de um map não é um contrato estável. Se a API promete ordem, extraia
      os itens e ordene pelo critério declarado. Escolha também como desempatar quando a chave de ordenação
      não é única; testes não devem depender da ordem casual observada em uma execução.
    example:
      context: nomes de cores
      code: "package example\n\nimport (\n\t\"slices\"\n\t\"testing\"\n)\n\nfunc TestSortedKeys(t *testing.T)\
        \ {\n\tm := map[string]int{\"red\": 2, \"blue\": 1, \"green\": 3}\n\tkeys := make([]string, 0,\
        \ len(m))\n\tfor k := range m {\n\t\tkeys = append(keys, k)\n\t}\n\tslices.Sort(keys)\n\tif !slices.Equal(keys,\
        \ []string{\"blue\", \"green\", \"red\"}) {\n\t\tt.Fatal(keys)\n\t}\n}\n"
      explanation: O resultado usa ordem lexical de strings. Esse critério é explícito e não pretende
        representar ordenação linguística por localidade.
    relation_refs:
    - kind: relates_to
      concept_id: catalog-value-snapshots
- id: catalog-value-snapshots
  title: Snapshots por valor de catálogo
  content:
    version: 1
    explanation: Retornar uma cópia de um valor pode isolar o estado interno, mas o isolamento depende
      dos campos. Inteiros e strings copiados não permitem alterar os campos originais por meio da cópia.
      Slices, mapas e ponteiros podem continuar compartilhando dados; copiar somente a struct não garante
      cópia profunda.
    example:
      context: leitura de um marcador
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\ntype Marker struct {\n\tLabel string\n\t\
        Count int\n}\n\nfunc TestValueSnapshot(t *testing.T) {\n\tstored := Marker{Label: \"blue\", Count:\
        \ 2}\n\tview := stored\n\tview.Count = 9\n\tif stored.Count != 2 {\n\t\tt.Fatal(\"view changed\
        \ storage\")\n\t}\n\tstored.Label = \"red\"\n\tif view.Label != \"blue\" {\n\t\tt.Fatal(\"storage\
        \ changed snapshot\")\n\t}\n}\n"
      explanation: O exemplo verifica mutações em ambas as direções com campos por valor. Uma struct com
        slice exigiria um contrato e uma cópia adicionais.
    relation_refs:
    - kind: relates_to
      concept_id: catalog-validation-before-mutation
- id: custom-error-type-contract
  title: Contrato de tipo de erro customizado
  content:
    version: 1
    explanation: Um tipo de erro customizado pode carregar dados estruturados que o chamador precisa tratar, além de fornecer uma mensagem para diagnóstico. Exponha esses dados por campos estáveis e recupere o tipo com errors.As; analisar ou reconstruir a mensagem não é um contrato equivalente. O tipo deve documentar quais campos são confiáveis e em que fronteira eles podem ser observados.
    example:
      context: validação de remessas
      code: |
        package example

        import (
            "errors"
            "fmt"
            "testing"
        )

        type FieldError struct {
            Field string
            Value string
        }

        func (e *FieldError) Error() string {
            return fmt.Sprintf("invalid field %s", e.Field)
        }

        func validateTracking(code string) error {
            return &FieldError{Field: "tracking", Value: code}
        }

        func TestFieldErrorContract(t *testing.T) {
            err := fmt.Errorf("shipment rejected: %w", validateTracking("??"))
            if err.Error() == "" {
                t.Fatal("missing diagnostic message")
            }
            var fieldErr *FieldError
            if !errors.As(err, &fieldErr) || fieldErr == nil {
                t.Fatal("structured error was not exposed")
            }
            if fieldErr.Field != "tracking" || fieldErr.Value != "??" {
                t.Fatalf("unexpected data: %+v", fieldErr)
            }
        }
      explanation: A mensagem confirma que o erro implementa error, mas o teste usa errors.As para recuperar o mesmo tipo e seus dados Field e Value através de uma camada de contexto. O valor inválido não precisa ser extraído do texto.
    relation_refs:
    - kind: deepens_into
      concept_id: errors-as-type-extraction
    - kind: relates_to
      concept_id: error-identity-not-message
- id: errors-is-custom-matcher
  title: Correspondência customizada com errors.Is
  content:
    version: 1
    explanation: Um erro pode implementar Is para declarar que pertence a uma categoria estável sem ser a mesma instância da sentinela. A implementação deve comparar o alvo e os dados relevantes de forma estreita; mensagens diferentes continuam sendo diagnóstico, não identidade. errors.Is aplica esse contrato enquanto percorre wrapping e não transforma dois erros distintos em um só.
    example:
      context: classificação de respostas de gateway
      code: |
        package example

        import (
            "errors"
            "fmt"
            "testing"
        )

        var ErrRetryable = errors.New("retryable")

        type GatewayError struct {
            Code   int
            Detail string
        }

        func (e *GatewayError) Error() string {
            return fmt.Sprintf("gateway status %d: %s", e.Code, e.Detail)
        }

        func (e *GatewayError) Is(target error) bool {
            return target == ErrRetryable && e.Code >= 500
        }

        func TestCustomIs(t *testing.T) {
            first := &GatewayError{Code: 503, Detail: "edge-a"}
            second := &GatewayError{Code: 502, Detail: "edge-b"}
            if !errors.Is(first, ErrRetryable) || !errors.Is(second, ErrRetryable) {
                t.Fatal("retryable category was not matched")
            }
            if first.Error() == second.Error() || errors.Is(first, second) {
                t.Fatal("custom matching replaced error identity")
            }
            if errors.Is(&GatewayError{Code: 400, Detail: "retryable"}, ErrRetryable) {
                t.Fatal("non-retryable status matched by message")
            }
        }
      explanation: As duas falhas têm detalhes e identidades diferentes, mas o método Is declara a mesma categoria pública. O status 400 mostra que um texto coincidente não deve produzir uma correspondência.
    relation_refs:
    - kind: deepens_into
      concept_id: error-identity-not-message
    - kind: relates_to
      concept_id: error-classification-precedence
- id: errors-as-custom-matcher
  title: Exposição controlada com errors.As
  content:
    version: 1
    explanation: Um wrapper pode implementar As para oferecer ao chamador somente um tipo público, sem colocar o tipo interno na cadeia percorrível. O método deve reconhecer a forma de destino suportada, preencher seu ponteiro e devolver false para destinos que não fazem parte do contrato. Isso é uma fronteira de exposição, diferente de simplesmente encontrar qualquer tipo em um wrapping.
    example:
      context: validação pública de uma etiqueta
      code: |
        package example

        import (
            "errors"
            "testing"
        )

        type PublicFieldError struct {
            Field string
        }

        func (e *PublicFieldError) Error() string { return "invalid public field" }

        type internalFieldError struct {
            field string
        }

        func (e *internalFieldError) Error() string { return "internal field detail" }

        type boundaryError struct {
            internal *internalFieldError
            public   *PublicFieldError
        }

        func (e *boundaryError) Error() string { return "label rejected" }

        func (e *boundaryError) As(target any) bool {
            out, ok := target.(**PublicFieldError)
            if !ok {
                return false
            }
            *out = e.public
            return true
        }

        func TestPublicAs(t *testing.T) {
            err := &boundaryError{
                internal: &internalFieldError{field: "secret-label"},
                public:   &PublicFieldError{Field: "label"},
            }
            var public *PublicFieldError
            if !errors.As(err, &public) || public == nil || public.Field != "label" {
                t.Fatal("public type was not exposed")
            }
            var internal *internalFieldError
            if errors.As(err, &internal) {
                t.Fatal("internal type crossed the boundary")
            }
        }
      explanation: O método As preenche apenas o destino público; como o erro interno não é retornado por Unwrap, uma busca por ele falha. O exemplo separa o contrato de exposição do detalhe guardado dentro da fronteira.
    relation_refs:
    - kind: deepens_into
      concept_id: errors-as-type-extraction
    - kind: relates_to
      concept_id: error-translation-at-boundary
- id: errors-unwrap-method-contract
  title: Contrato de Unwrap em erro customizado
  content:
    version: 1
    explanation: Implementar Unwrap() error declara uma única causa linear que errors.Is e errors.As podem atravessar. Retornar nil encerra essa cadeia; não há causa adicional para o chamador descobrir. Esse contrato é diferente de Unwrap() []error usado por árvores de errors.Join e deve ser escolhido conforme a relação entre as falhas.
    example:
      context: leitura de registros
      code: |
        package example

        import (
            "errors"
            "testing"
        )

        var ErrChecksum = errors.New("invalid checksum")

        type RecordError struct {
            Cause error
        }

        func (e *RecordError) Error() string { return "record rejected" }
        func (e *RecordError) Unwrap() error { return e.Cause }

        func TestLinearUnwrap(t *testing.T) {
            wrapped := &RecordError{Cause: ErrChecksum}
            if !errors.Is(wrapped, ErrChecksum) || errors.Unwrap(wrapped) != ErrChecksum {
                t.Fatal("linear cause was not preserved")
            }
            terminal := &RecordError{}
            if errors.Unwrap(terminal) != nil {
                t.Fatal("nil cause should end the chain")
            }
        }
      explanation: A causa sentinela é alcançada por errors.Is e pelo Unwrap de uma única camada. Um RecordError sem Cause demonstra que nil é o fim explícito da cadeia, não um erro artificial.
    relation_refs:
    - kind: deepens_into
      concept_id: error-chain-type-traversal
    - kind: relates_to
      concept_id: errors-join-aggregation
- id: nil-error-success-contract
  title: Contrato de erro nil no sucesso
  content:
    version: 1
    explanation: Uma função que devolve um valor e um error deve retornar error nil no caminho de sucesso, mesmo quando apenas parte dos dados opcionais foi preenchida. Em uma falha, o erro deve ser não nil e o valor devolvido precisa seguir o contrato documentado, geralmente o valor zero. Não confunda a identidade nil com uma mensagem vazia ou com um ponteiro nil armazenado em uma interface.
    example:
      context: triagem de etiquetas
      code: |
        package example

        import (
            "errors"
            "testing"
        )

        type Label struct {
            Code string
            Note string
        }

        func ValidateLabel(code, note string) (Label, error) {
            if code == "" {
                return Label{}, errors.New("code required")
            }
            return Label{Code: code, Note: note}, nil
        }

        func TestNilSuccessContract(t *testing.T) {
