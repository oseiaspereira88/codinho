              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
            reflection:
              optional:
                - Por que declarar um tipo nomeado Celsius em vez de usar float64 diretamente na assinatura?
          - id: model.implement-celsius-to-fahrenheit
            kind: micro
            action: implement
            target: function
            title: Implementar CelsiusToFahrenheit
            instruction:
              objective: Implementar a função que converte a temperatura armazenada em Celsius para a escala Fahrenheit, aplicando a fórmula de conversão padrão entre as duas escalas.
              scope: Somente o corpo da função de conversão.
              constraints:
