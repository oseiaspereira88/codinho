                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                  - id: model.explain-untyped-constant-defaulting
                    kind: micro
                    action: reflect
                    target: decision
                    title: Explicar o tipo escolhido pelo contexto
                    instruction:
                      objective: Explique como o contexto de uso determina o tipo final de uma constante sem tipo.
                      scope: Apenas a diferença entre default contextual e conversão explícita.
                    concepts: [untyped-constant-defaulting, constant-declaration]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
