schema_version: 1
id: go-data-text
version: 1.3.0
themes:
  - id: slices-arrays-maps
    title: Slices, arrays e maps
  - id: text-and-binary-data
    title: Texto e dados binários
concepts:
  - id: slice-backing-array-aliasing
    title: Aliasing do backing array de uma slice
    content:
      version: 1
      explanation: Uma slice é um descritor que aponta para um backing array. Duas slices podem compartilhar esse array mesmo quando foram obtidas por fatiamento; escrever em uma pode alterar a outra. append pode reutilizar a capacidade disponível ou alocar outro array, então não use essa operação como garantia de isolamento. Copie explicitamente quando a saída não puder compartilhar armazenamento.
      example:
        context: cópia de uma seleção
        code: |
          package example

          import "testing"

          func clone(values []int) []int {
              out := make([]int, len(values))
              copy(out, values)
              return out
          }

          func TestClone(t *testing.T) {
              input := []int{1, 2, 3}
              out := clone(input)
              out[0] = 9
              if input[0] != 1 { t.Fatal("clone aliases input") }
          }
        explanation: copy transfere os valores para um backing array próprio; a alteração posterior da saída não alcança a entrada.
      relation_refs:
        - kind: relates_to
          concept_id: slice-preallocation-length-vs-capacity
  - id: utf8-rune-boundary
    title: Fronteira de rune em UTF-8
    content:
      version: 1
      explanation: String em Go é uma sequência de bytes; UTF-8 pode representar um rune com vários bytes. Cortar por índice de byte pode produzir texto inválido. Converta para []rune quando a regra for baseada em caracteres Unicode, aceitando o custo de uma nova representação.
      example:
        context: limite de título
        code: |
          package example

          import "testing"

          func prefix(text string, n int) string {
              runes := []rune(text)
              if n < 0 { n = 0 }
              if n > len(runes) { n = len(runes) }
              return string(runes[:n])
          }

          func TestPrefix(t *testing.T) {
              if got := prefix("café", 4); got != "café" { t.Fatal(got) }
              if got := prefix("café", 3); got != "caf" { t.Fatal(got) }
          }
        explanation: O limite conta runes e nunca separa o é em seus bytes.
      relation_refs:
        - kind: relates_to
          concept_id: rune-aware-whitespace-preservation
  - id: map-comma-ok-lookup
    title: Consulta a map com comma-ok
    content:
      version: 1
      explanation: A leitura m[key] devolve o valor zero tanto quando a chave existe com valor zero quanto quando está ausente. A forma value, ok distingue esses casos. Use ok para decisões de presença e não compare o valor com o zero do tipo.
      example:
        context: estoque por código
        code: |
          package example

          import "testing"

          func quantity(stock map[string]int, code string) (int, bool) {
              value, ok := stock[code]
              return value, ok
          }

          func TestQuantity(t *testing.T) {
              stock := map[string]int{"A": 0}
              if value, ok := quantity(stock, "A"); value != 0 || !ok { t.Fatal(value, ok) }
              if _, ok := quantity(stock, "B"); ok { t.Fatal("unexpected key") }
          }
        explanation: O mesmo valor zero representa dois estados, separados pelo booleano ok.
      relation_refs:
        - kind: relates_to
          concept_id: set-membership-with-empty-struct-map
  - id: csv-field-quoting
    title: Regras de citação de campo CSV
    content:
      version: 1
      explanation: Um campo CSV que contém vírgula, aspas ou quebra de linha precisa ser citado; uma aspa interna é representada por duas aspas. O pacote encoding/csv implementa as regras e evita que uma decisão parcial quebre a estrutura de registros. Prefira o Writer a concatenar strings manualmente.
      example:
        context: exportação de nomes
        code: |
          package example

          import (
              "encoding/csv"
              "strings"
              "testing"
          )

          func encode(name string) string {
              var b strings.Builder
              w := csv.NewWriter(&b)
              _ = w.Write([]string{name, "ok"})
              w.Flush()
              return b.String()
          }

          func TestEncode(t *testing.T) {
              if got := encode("Silva, Ana"); got != "\"Silva, Ana\",ok\n" { t.Fatal(got) }
              if got := encode(`A "B"`); got != `"A ""B""",ok`+"\n" { t.Fatal(got) }
          }
        explanation: Writer cita a vírgula e duplica as aspas internas conforme o formato.
      relation_refs:
        - kind: relates_to
          concept_id: rune-aware-whitespace-preservation
  - id: set-membership-with-empty-struct-map
    title: Conjunto de pertencimento com map[T]struct{}
    content:
      version: 1
      explanation: Um map[T]struct{} representa presença sem armazenar um valor útil. A escrita usa a struct vazia e a leitura usa comma-ok. O conjunto não preserva ordem; se a saída precisar ser determinística, copie as chaves e ordene separadamente.
      example:
        context: permissões de usuário
        code: |
          package example

          import "testing"

          func hasAll(roles []string, wanted string) bool {
              set := make(map[string]struct{}, len(roles))
              for _, role := range roles { set[role] = struct{}{} }
              _, ok := set[wanted]
              return ok
          }

          func TestSet(t *testing.T) {
              if !hasAll([]string{"reader", "writer"}, "writer") { t.Fatal("missing role") }
              if hasAll(nil, "reader") { t.Fatal("unexpected role") }
          }
        explanation: A presença é o único dado necessário; struct{} não adiciona carga de valor ao conjunto.
      relation_refs:
        - kind: relates_to
          concept_id: map-comma-ok-lookup
  - id: strconv-error-handling
    title: Tratamento do erro de strconv
    content:
      version: 1
      explanation: strconv retorna o valor convertido junto com um error. Ignore o valor quando o erro não for nil; ele pode ser parcial ou zero e não constitui entrada válida. Defina bitSize e base de forma explícita para tornar o limite do contrato observável.
      example:
        context: leitura de quantidade
        code: |
          package example

          import (
              "strconv"
              "testing"
          )

          func parseCount(text string) (int, error) {
              value, err := strconv.Atoi(text)
              if err != nil { return 0, err }
              return value, nil
          }

          func TestParse(t *testing.T) {
              if got, err := parseCount("12"); err != nil || got != 12 { t.Fatal(got, err) }
              if _, err := parseCount("12x"); err == nil { t.Fatal("invalid input accepted") }
          }
        explanation: O caminho de erro não transforma um prefixo num número aceito.
      relation_refs:
        - kind: relates_to
          concept_id: map-comma-ok-lookup
  - id: slice-preallocation-length-vs-capacity
    title: Pré-alocação de slice — comprimento versus capacidade
    content:
      version: 1
      explanation: make([]T, length, capacity) cria length posições acessíveis e capacidade para crescimento até o limite indicado. Para preencher com append, comece com comprimento zero; começar com length e depois usar append deixa posições zero extras. Capacidade reduz realocações, mas não promete um backing array permanente.
      example:
        context: coleta de resultados
        code: |
          package example

          import "testing"

          func collect(values []int) []int {
              out := make([]int, 0, len(values))
              for _, value := range values { out = append(out, value*2) }
              return out
          }

          func TestCollect(t *testing.T) {
              got := collect([]int{2, 3})
              if len(got) != 2 || got[0] != 4 || got[1] != 6 { t.Fatal(got) }
          }
        explanation: comprimento zero evita itens fictícios; a capacidade reserva espaço para os dois append.
      relation_refs:
        - kind: relates_to
          concept_id: slice-backing-array-aliasing
  - id: rune-aware-whitespace-preservation
    title: Preservação de espaçamento consciente de rune
    content:
      version: 1
      explanation: Normalizar palavras sem destruir o espaçamento exige separar conteúdo e separadores. strings.Fields colapsa espaços e remove bordas; use-o apenas quando essa perda fizer parte do contrato. Para preservar a forma original, percorra runes e transforme apenas a primeira letra de cada trecho não vazio.
      example:
        context: títulos com espaçamento editorial
        code: |
          package example

          import "testing"

          func capitalize(text string) string {
              runes := []rune(text)
              inWord := false
              for i, r := range runes {
                  if r == ' ' || r == '\t' { inWord = false; continue }
                  if !inWord && r >= 'a' && r <= 'z' { runes[i] = r - ('a' - 'A') }
                  inWord = true
              }
              return string(runes)
          }

          func TestCapitalize(t *testing.T) {
              if got := capitalize("  café\tcom leite"); got != "  Café\tCom Leite" { t.Fatal(got) }
          }
        explanation: O separador original permanece no lugar e a decisão de capitalização conta runes.
      relation_refs:
        - kind: relates_to
          concept_id: utf8-rune-boundary
  - id: array-value-copy
    title: Cópia de array por valor
    content:
      version: 1
      explanation: 'Atribuir um array a outra variável copia todos os seus elementos, portanto alterar a cópia não alcança o array original. Uma slice tem outro contrato: ela é uma janela sobre um backing array e duas janelas podem compartilhar as mesmas posições. Escolha o tipo e a operação conforme o contrato de independência esperado.'
      example:
        context: snapshot de coordenadas
        code: |
          package example

          import "testing"

          func TestArrayCopyAndSliceView(t *testing.T) {
              original := [3]int{1, 2, 3}
              copied := original
              copied[0] = 9
              if original[0] != 1 {
                  t.Fatalf("array assignment shared storage: %v", original)
              }

              backing := [3]int{1, 2, 3}
              first := backing[:]
              second := backing[:]
              second[0] = 9
              if first[0] != 9 {
                  t.Fatalf("slice views did not share backing array: %v", first)
              }
          }
        explanation: A atribuição do array preserva o valor original, enquanto as duas slices observam a alteração feita no mesmo backing array.
      relation_refs:
        - kind: contrasts_with
          concept_id: slice-backing-array-aliasing
        - kind: relates_to
          concept_id: slice-declaration
  - id: append-reallocation-boundary
    title: Fronteira de realocação de append
    content:
      version: 1
      explanation: 'append pode reutilizar o backing array enquanto existe capacidade disponível depois do comprimento. Quando a nova quantidade ultrapassa essa capacidade, a operação precisa de outro armazenamento; o fator exato de crescimento não faz parte do contrato. Para exigir isolamento, não dependa de uma realocação incidental: copie explicitamente ou reserve um backing array próprio.'
      example:
        context: janela de amostras
        code: |
          package example

          import "testing"

          func TestAppendStorageBoundary(t *testing.T) {
              backing := [5]int{1, 2, 0, 0, 0}
              view := backing[:2:4]

              withinCapacity := append(view, 3)
              withinCapacity[0] = 9
              if backing[0] != 9 {
                  t.Fatalf("append with capacity left did not reuse storage: %v", backing)
              }

              beyondCapacity := append(withinCapacity, 4, 5)
              beyondCapacity[0] = 7
              if backing[0] != 9 {
                  t.Fatalf("append beyond capacity still aliases backing array: %v", backing)
              }
          }
        explanation: A primeira append cabe na capacidade restante e altera o array compartilhado; a segunda excede a capacidade e deixa a nova slice independente.
      relation_refs:
        - kind: deepens_into
          concept_id: slice-backing-array-aliasing
        - kind: relates_to
          concept_id: slice-preallocation-length-vs-capacity
  - id: map-delete-and-clear
    title: Remoção seletiva e limpeza de map
    content:
      version: 1
      explanation: delete remove uma chave específica e não produz erro quando ela já está ausente. clear remove todas as entradas de um map sem alterar seu tipo; depois da limpeza, um map não nil continua pronto para receber novas chaves. As duas operações também são seguras em um map nil, embora ele continue nil e não aceite atribuição.
      example:
        context: permissões temporárias
        code: |
          package example

          import "testing"

          func TestMapRemoval(t *testing.T) {
              permissions := map[string]struct{}{
                  "read":  {},
                  "write": {},
              }
              delete(permissions, "read")
              delete(permissions, "missing")
              if _, ok := permissions["read"]; ok {
                  t.Fatal("selectively deleted permission is still present")
              }
              if _, ok := permissions["write"]; !ok {
                  t.Fatal("delete removed an unrelated permission")
              }

              clear(permissions)
              if len(permissions) != 0 {
                  t.Fatalf("clear left entries: %v", permissions)
              }
              permissions["audit"] = struct{}{}
              if _, ok := permissions["audit"]; !ok {
                  t.Fatal("cleared non-nil map was not reusable")
              }

              var absent map[string]int
              delete(absent, "anything")
              clear(absent)
              if absent != nil {
                  t.Fatal("clear changed a nil map")
              }
          }
        explanation: delete preserva a permissão não removida, clear esvazia o mapa reutilizável e as operações não transformam um mapa nil em mapa gravável.
      relation_refs:
        - kind: deepens_into
          concept_id: map-comma-ok-lookup
        - kind: relates_to
          concept_id: set-membership-with-empty-struct-map
  - id: strings-builder-output
    title: Saída incremental com strings.Builder
    content:
      version: 1
      explanation: strings.Builder acumula fragmentos de texto sem exigir uma concatenação completa a cada etapa. Seu valor zero já pode ser usado e String devolve o texto acumulado até aquele momento; a saída vazia de um builder sem escritas é uma string vazia. Não copie um Builder depois de começar a usá-lo, e defina separadamente o separador entre fragmentos.
      example:
        context: resumo de itens
        code: |
          package example

          import (
              "strings"
              "testing"
          )

          func summarize(labels []string) string {
              var builder strings.Builder
              for i, label := range labels {
                  if i > 0 {
                      builder.WriteString(" / ")
                  }
                  builder.WriteString(label)
              }
              return builder.String()
          }

          func TestBuilderOutput(t *testing.T) {
              if got := summarize([]string{"azul", "médio", "fosco"}); got != "azul / médio / fosco" {
                  t.Fatalf("summary = %q", got)
              }
              if got := summarize(nil); got != "" {
                  t.Fatalf("empty summary = %q", got)
              }
          }
        explanation: O builder recebe cada fragmento e o separador somente entre itens; sem escritas, seu valor zero produz a string vazia.
      relation_refs:
        - kind: relates_to
          concept_id: rune-aware-whitespace-preservation
        - kind: relates_to
          concept_id: utf8-rune-boundary
  - id: regexp-submatch-contract
    title: Contrato de match e submatches de regexp
    content:
      version: 1
      explanation: regexp.FindStringSubmatch devolve o match completo na posição zero e os grupos capturados nas posições seguintes. Um grupo opcional que não participou aparece como string vazia dentro de um resultado não nil; uma entrada que não casa com a expressão inteira produz nil. Distinga esses estados antes de interpretar ou converter qualquer submatch.
      example:
        context: identificadores de inventário
        code: |
          package example

          import (
              "regexp"
              "testing"
          )

          func TestSubmatchContract(t *testing.T) {
              pattern := regexp.MustCompile(`^([A-Z]{2})(?:-([0-9]{3}))?$`)

              complete := pattern.FindStringSubmatch("SP-042")
              if len(complete) != 3 || complete[0] != "SP-042" || complete[1] != "SP" || complete[2] != "042" {
                  t.Fatalf("complete match = %#v", complete)
              }

              optional := pattern.FindStringSubmatch("RJ")
              if len(optional) != 3 || optional[0] != "RJ" || optional[1] != "RJ" || optional[2] != "" {
                  t.Fatalf("optional submatch = %#v", optional)
              }

              if absent := pattern.FindStringSubmatch("sp-042"); absent != nil {
                  t.Fatalf("invalid inventory ID matched: %#v", absent)
              }
          }
        explanation: O primeiro item contém o match completo e os dois grupos; no segundo, o grupo opcional é vazio mas o resultado existe; a grafia inválida retorna nil.
      relation_refs:
        - kind: relates_to
          concept_id: strconv-error-handling
        - kind: relates_to
          concept_id: rune-aware-whitespace-preservation
