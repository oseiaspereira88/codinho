              "context"
              "net/http"
          )

          func Fetch(ctx context.Context, transport http.RoundTripper) error {
              request, err := http.NewRequest(http.MethodGet, "http://service.local/slow", nil)
              if err != nil {
                  return err
              }
              _, err = transport.RoundTrip(request)
              return err
          }
      - path: timeout_test.go
        content: |
          package timeout

          import (
              "context"
              "errors"
              "io"
              "net/http"
              "strings"
              "testing"
              "time"
          )

          type delayedTransport struct{}
          func (delayedTransport) RoundTrip(r *http.Request) (*http.Response, error) {
              select {
              case <-r.Context().Done():
                  return nil, r.Context().Err()
              case <-time.After(200 * time.Millisecond):
                  return &http.Response{StatusCode: http.StatusOK, Body: io.NopCloser(strings.NewReader("ok"))}, nil
              }
          }

          func TestFetchRespectsDeadline(t *testing.T) {
              ctx, cancel := context.WithTimeout(context.Background(), 20*time.Millisecond)
              defer cancel()
              err := Fetch(ctx, delayedTransport{})
              if !errors.Is(err, context.DeadlineExceeded) {
                  t.Fatalf("err = %v, want deadline exceeded", err)
              }
          }
      - path: timeout_contract_test.go
        content: |
          package timeout

          import "testing"

          func TestSyntheticFixtureIsLocal(t *testing.T) {}
    checks:
