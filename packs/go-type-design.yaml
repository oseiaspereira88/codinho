              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
            reflection:
              optional:
                - Por que a constraint any não seria suficiente para comparar elementos com == dentro de Contains?
            children:
              - id: model.verify-comparable-instantiations
                hints:
                  - level: 1
                    kind: guiding_question
                  - level: 2
                    kind: syntax_recall
                  - level: 3
                    kind: logical_prose
                  - level: 4
                    kind: pseudocode
                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
                kind: micro
                action: verify
                target: function
                title: Verificar instanciações comparáveis
                instruction:
                  objective: Confirme que uma única Contains aceita as instanciações int, string, bool e struct comparável.
                  scope: Apenas as instanciações cobertas pela fixture.
