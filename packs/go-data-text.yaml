    id: go-data-text.format-names-as-csv-fields
    version: 1.0.0
    title: Formatar uma lista de nomes como campos CSV capitalizados
    kind: combined
    difficulty: intermediate
    estimated_minutes: 30
    themes: [slices-arrays-maps, text-and-binary-data]
    competencies:
      primary: [preallocate-slice-with-zero-length, title-first-letters-preserving-spacing, quote-csv-field-when-needed]
      secondary: []
    prerequisites: [slice-preallocation-length-vs-capacity, rune-aware-whitespace-preservation, csv-field-quoting]
    brief: >
      Um relatório CSV recebe uma lista de nomes. Formate cada nome diferente
      da string vazia, capitalizando suas palavras e citando o campo quando o
      conteúdo exigir, sem perder o espaçamento original.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Pré-alocar a saída com make usando comprimento 0 e capacidade len(names).
      - Apenas a string vazia "" é ignorada -- um nome composto só de espaços não é ignorado.
      - Preservar exatamente o espaçamento original de cada nome ao capitalizá-lo.
      - Vírgula, aspas, quebra de linha ou retorno de carro exigem um campo CSV citado; aspas internas devem ser escapadas.
    acceptance:
      - 'FormatNames(["", "alice smith", "o''brien, jane", ""]) retorna ["Alice Smith", "\"O''brien, Jane\""], nessa ordem.'
      - A capacidade da slice retornada é exatamente len(names), mesmo quando nomes vazios são ignorados.
      - 'FormatNames(["  bob   smith  "]) retorna ["  Bob   Smith  "], preservando os espaços internos e das pontas.'
      - 'FormatNames(["   "]) retorna ["   "] -- um nome só de espaços não é ignorado.'
      - 'FormatNames([`say "hi" john`]) retorna [`"Say ""hi"" John"`] -- aspas internas são dobradas depois de capitalizar.'
      - 'FormatNames([`say "hi", john`]) retorna [`"Say ""hi"", John"`] -- vírgula e aspas internas são tratadas no mesmo campo.'
      - 'FormatNames(["line\nbreak"]) retorna ["\"Line\nBreak\""] -- uma quebra de linha torna o campo CSV citado e permanece no conteúdo.'
      - 'FormatNames(["line\rbreak"]) retorna ["\"Line\rBreak\""] -- retorno de carro também exige citação.'
      - 'FormatNames(["élan\tvital"]) retorna ["Élan\tVital"] -- a capitalização preserva tabulação e letras não-ASCII.'
      - FormatNames(nil) retorna uma slice vazia.
