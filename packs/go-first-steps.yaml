      - path: weekday.go
        content: |
          package weekdays

          type Weekday int

          const (
              Monday Weekday = iota
              Tuesday
              Wednesday
              Thursday
              Friday
              Saturday
              Sunday
          )

          func IsWeekday(d Weekday) bool {
              return d >= Monday && d <= Friday
          }
      - path: weekday_test.go
