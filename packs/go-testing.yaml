        missing clock\")\n\ntype Token struct {\n\tID        string\n\tExpiresAt time.Time\n}\n\nfunc\
        \ Active(tokens []Token, clock func() time.Time) ([]Token, error) {\n\tif clock == nil {\n\t\t\
        return nil, ErrMissingClock\n\t}\n\tnow := clock()\n\tactive := make([]Token, 0, len(tokens))\n\
        \tfor _, token := range tokens {\n\t\tif token.ExpiresAt.After(now) {\n\t\t\tactive = append(active,\
        \ token)\n\t\t}\n\t}\n\treturn active, nil\n}\n"
    - path: expiry_test.go
      content: "package expiry\n\nimport (\n\t\"errors\"\n\t\"reflect\"\n\t\"testing\"\n\t\"time\"\n)\n\
        \nfunc TestActive(t *testing.T) {\n\tnow := time.Date(2026, 1, 2, 12, 0, 0, 0, time.UTC)\n\tcases\
        \ := []struct {\n\t\tname   string\n\t\ttokens []Token\n\t\twant   []Token\n\t}{\n\t\t{name: \"\
        nil\", want: []Token{}},\n\t\t{name: \"empty\", tokens: []Token{}, want: []Token{}},\n\t\t{name:\
        \ \"before\", tokens: []Token{{ID: \"old\", ExpiresAt: now.Add(-time.Nanosecond)}}, want: []Token{}},\n\
        \t\t{name: \"equal\", tokens: []Token{{ID: \"edge\", ExpiresAt: now}}, want: []Token{}},\n\t\t\
        {name: \"after\", tokens: []Token{{ID: \"new\", ExpiresAt: now.Add(time.Nanosecond)}}, want: []Token{{ID:\
        \ \"new\", ExpiresAt: now.Add(time.Nanosecond)}}},\n\t\t{name: \"same instant in another zone\"\
        , tokens: []Token{{ID: \"zone\", ExpiresAt: now.In(time.FixedZone(\"synthetic\", 7200))}}, want:\
        \ []Token{}},\n\t\t{name: \"mixed preserves order\", tokens: []Token{{ID: \"B\", ExpiresAt: now.Add(time.Hour)},\
        \ {ID: \"old\", ExpiresAt: now}, {ID: \"A\", ExpiresAt: now.Add(time.Minute)}}, want: []Token{{ID:\
        \ \"B\", ExpiresAt: now.Add(time.Hour)}, {ID: \"A\", ExpiresAt: now.Add(time.Minute)}}},\n\t}\n\
        \tfor _, tc := range cases {\n\t\tt.Run(tc.name, func(t *testing.T) {\n\t\t\tbefore := append([]Token(nil),\
        \ tc.tokens...)\n\t\t\tcalls := 0\n\t\t\tclock := func() time.Time { calls++; return now.Add(time.Duration(calls-1)\
        \ * 24 * time.Hour) }\n\t\t\tgot, err := Active(tc.tokens, clock)\n\t\t\tif err != nil || !reflect.DeepEqual(got,\
        \ tc.want) {\n\t\t\t\tt.Fatalf(\"got %+v, want %+v, error %v\", got, tc.want, err)\n\t\t\t}\n\t\
        \t\tif calls != 1 {\n\t\t\t\tt.Fatalf(\"clock calls = %d, want 1\", calls)\n\t\t\t}\n\t\t\tif\
        \ len(tc.tokens) != len(before) {\n\t\t\t\tt.Fatal(\"input length changed\")\n\t\t\t}\n\t\t\t\
        for i := range before {\n\t\t\t\tif tc.tokens[i] != before[i] {\n\t\t\t\t\tt.Fatal(\"input changed\"\
        )\n\t\t\t\t}\n\t\t\t}\n\t\t\tif len(got) > 0 {\n\t\t\t\tgot[0].ID = \"changed-output\"\n\t\t\t\
        \tfor i := range before {\n\t\t\t\t\tif tc.tokens[i] != before[i] {\n\t\t\t\t\t\tt.Fatal(\"output\
        \ aliases input\")\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t})\n\t}\n\tif got, err := Active(nil,\
        \ nil); !errors.Is(err, ErrMissingClock) || got != nil {\n\t\tt.Fatalf(\"missing clock: %+v %v\"\
        , got, err)\n\t}\n}\n"
    expectations:
    - check_id: focused-tests
      baseline: test_failure
      reference: pass
