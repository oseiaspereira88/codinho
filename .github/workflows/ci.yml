name: CI
on:
  pull_request:
  push:
    branches: [main, 'ci/v1-delivery-assurance']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install verified governance tools
        env:
          CI_TOOL_BIN: ${{ runner.temp }}/codinho-tools
        run: |
          bash scripts/ci/install-tools.sh
          printf '%s\n' "$CI_TOOL_BIN" >> "$GITHUB_PATH"
      - name: Required native validation
        id: validation
        run: make check
      - name: Windows static compatibility (not native evidence)
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - name: Record validation report
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          outcome=fail
          if [ "$VALIDATION_OUTCOME" = success ]; then outcome=pass; fi
          pose report --task native-ci-validation --spec v1-delivery-ci-assurance --workflow feature --outcome "$outcome" --context github-actions
      - name: Archive candidate evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            .pose/results/delivery-validation.json
            .pose/results/native-ci.json
            .pose/results/pose-check.log
            .pose/results/pose-validate.latest.log
            .pose/reports/*-standard-native-ci-validation.md
            .pose/reports/history/native-ci-validation.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
