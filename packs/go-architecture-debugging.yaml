                      requires_user_confirmation: true
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: concept_recall}
                      - {level: 3, kind: design_prompt}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                  - id: go-architecture-debugging.diagnose-shared-state-race.map-state
                    kind: micro
                    action: inspect
                    target: shared-state
                    title: Mapear o estado compartilhado
                    instruction:
                      objective: Mapeie o campo que recebe leituras ou escritas de mais de um worker.
                      scope: Implementação do contador antes da edição.
                    concepts:
                      - go-architecture-debugging.race-happens-before
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: shared-state-is-mapped
                        kind: structural
                    completion:
                      requires_positive_evaluation: false
                      requires_user_confirmation: true
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: concept_recall}
                      - {level: 3, kind: design_prompt}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                  - id: go-architecture-debugging.diagnose-shared-state-race.formulate-hypothesis
                    kind: micro
                    action: analyze
                    target: missing-ordering
                    title: Formular a hipótese de ordenação
                    instruction:
                      objective: Formule por que os acessos atuais não estabelecem uma relação happens-before suficiente.
                      scope: Relação entre Add, Count e os workers.
                    concepts:
                      - go-architecture-debugging.race-happens-before
                      - go-architecture-debugging.symptom-vs-cause
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: missing-ordering-is-explained
                        kind: reasoning
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: true
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: concept_recall}
                      - {level: 3, kind: design_prompt}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                  - id: go-architecture-debugging.diagnose-shared-state-race.apply-minimal-fix
                    kind: micro
                    action: modify
                    target: synchronization-boundary
                    title: Aplicar a correção mínima
                    instruction:
                      objective: Aplique uma sincronização que proteja a fronteira de estado compartilhado.
                      scope: Somente Counter; preserve a API e não introduza sleep.
                    concepts:
                      - go-architecture-debugging.race-happens-before
                    evidence:
                      strategies: [source_inspection, compile]
                    criteria:
                      - id: minimal-race-fix-is-applied
                        kind: structural
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: concept_recall}
                      - {level: 3, kind: design_prompt}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                  - id: go-architecture-debugging.diagnose-shared-state-race.verify-race-free
                    kind: micro
                    action: verify
                    target: race-detector
                    title: Verificar a fronteira sem corrida
                    instruction:
                      objective: Execute novamente o teste com race detector e confirme o total esperado.
                      scope: Somente a fixture após a correção.
                    concepts:
                      - go-architecture-debugging.race-happens-before
                    evidence:
                      strategies: [test]
                    criteria:
                      - id: reference-race-check-passes
                        kind: behavioral
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: concept_recall}
                      - {level: 3, kind: design_prompt}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection:
