    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Usar errors.As para procurar um *ValidationError em qualquer profundidade do encadeamento, não uma asserção de tipo direta.
    acceptance:
      - 'FieldFromError(ValidateAge(-1)) retorna ("age", true).'
      - FieldFromError encontra o *ValidationError mesmo quando ele foi encadeado por mais de uma camada externa de contexto.
      - FieldFromError de um erro não relacionado retorna ("", false).
      - FieldFromError(nil) retorna ("", false).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.search-chain-for-validation-error
