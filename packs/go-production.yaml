  brief: Um serviço precisa ligar eventos ao trace de uma requisição sem transformar cada identificador em uma série métrica
    nova.
  constraints:
  - Use somente IDs sintéticos.
  - Mantenha o trace ID no evento.
  - O orçamento de cardinalidade é explícito e local.
  acceptance:
  - O sinal devolvido preserva o trace ID e a rota.
  - O número de chaves métricas permanece dentro do orçamento declarado.
  - O benchmark de correlação emite medição sem depender de rede.
  canonical: true
  publication:
    status: draft
    author: codex
  fixture:
  - path: go.mod
    content: 'module codinho-practice/correlation


      go 1.25.0

      '
  - path: correlation.go
    content: "package correlation\n\nimport \"sync\"\n\ntype Signal struct {\n    TraceID   string\n    Route     string\n\
      \    MetricKey string\n}\n\ntype Correlator struct {\n    mu   sync.Mutex\n    seen map[string]struct{}\n    max  int\n\
      }\n\nfunc NewCorrelator(max int) *Correlator {\n    return &Correlator{seen: make(map[string]struct{}), max: max}\n\
      }\n\nfunc (c *Correlator) Observe(traceID, route string) Signal {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.seen[traceID]\
      \ = struct{}{}\n    return Signal{TraceID: traceID, Route: route, MetricKey: route}\n}\n\nfunc (c *Correlator) Cardinality()\
      \ int {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    return len(c.seen)\n}\n"
  - path: correlation_test.go
    content: "package correlation\n\nimport (\n    \"fmt\"\n    \"testing\"\n)\n\nvar benchmarkSignal Signal\n\nfunc TestCorrelationCardinality(t\
      \ *testing.T) {\n    c := NewCorrelator(2)\n    for i := 0; i < 8; i++ {\n        signal := c.Observe(fmt.Sprintf(\"\
      trace-%d\", i), \"/items\")\n        if signal.TraceID == \"\" || signal.MetricKey != \"/items\" {\n            t.Fatalf(\"\
      correlation was not propagated: %+v\", signal)\n        }\n    }\n    if got := c.Cardinality(); got > 2 {\n       \
      \ t.Fatalf(\"cardinality=%d, want at most 2\", got)\n    }\n}\n\nfunc BenchmarkRequestCorrelation(b *testing.B) {\n\
      \    c := NewCorrelator(32)\n    b.ReportAllocs()\n    for i := 0; i < b.N; i++ {\n        benchmarkSignal = c.Observe(\"\
      trace-fixed\", \"/items\")\n    }\n}\n"
  checks:
  - id: correlation-tests
    runner: go_test
    package: ./...
    test_pattern: ^TestCorrelationCardinality$
    timeout: 30s
    network: false
  - id: correlation-benchmark
    runner: go_benchmark
    package: ./...
    test_pattern: ^BenchmarkRequestCorrelation$
    timeout: 30s
    network: false
  validation:
    reference_fixture:
    - path: go.mod
      content: 'module codinho-practice/correlation


        go 1.25.0

        '
    - path: correlation.go
      content: "package correlation\n\nimport \"sync\"\n\ntype Signal struct {\n    TraceID   string\n    Route     string\n\
        \    MetricKey string\n}\n\ntype Correlator struct {\n    mu   sync.Mutex\n    seen map[string]struct{}\n    max \
        \ int\n}\n\nfunc NewCorrelator(max int) *Correlator {\n    return &Correlator{seen: make(map[string]struct{}), max:\
        \ max}\n}\n\nfunc (c *Correlator) Observe(traceID, route string) Signal {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n\
        \    if len(c.seen) < c.max {\n        c.seen[route] = struct{}{}\n    }\n    return Signal{TraceID: traceID, Route:\
        \ route, MetricKey: route}\n}\n\nfunc (c *Correlator) Cardinality() int {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n\
        \    return len(c.seen)\n}\n"
    - path: correlation_test.go
      content: "package correlation\n\nimport (\n    \"fmt\"\n    \"testing\"\n)\n\nvar benchmarkSignal Signal\n\nfunc TestCorrelationCardinality(t\
        \ *testing.T) {\n    c := NewCorrelator(2)\n    for i := 0; i < 8; i++ {\n        signal := c.Observe(fmt.Sprintf(\"\
        trace-%d\", i), \"/items\")\n        if signal.TraceID == \"\" || signal.MetricKey != \"/items\" {\n            t.Fatalf(\"\
        correlation was not propagated: %+v\", signal)\n        }\n    }\n    if got := c.Cardinality(); got > 2 {\n     \
        \   t.Fatalf(\"cardinality=%d, want at most 2\", got)\n    }\n}\n\nfunc BenchmarkRequestCorrelation(b *testing.B)\
        \ {\n    c := NewCorrelator(32)\n    b.ReportAllocs()\n    for i := 0; i < b.N; i++ {\n        benchmarkSignal = c.Observe(\"\
        trace-fixed\", \"/items\")\n    }\n}\n"
    expectations:
    - check_id: correlation-tests
      baseline: test_failure
      reference: pass
    - check_id: correlation-benchmark
      baseline: pass
      reference: pass
