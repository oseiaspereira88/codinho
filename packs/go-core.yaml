  - schema_version: 1
    id: go-core.find-first-value-at-least
    version: 1.0.0
    title: Encontrar o primeiro valor que atende a um mínimo, ignorando nós nulos
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [control-flow]
    competencies:
      primary: [guard-nil-access-with-short-circuit]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que percorre uma lista de nós, alguns deles
      nulos, e retorna o primeiro valor que atende a um mínimo, sem nunca
      acessar um campo de um nó nulo.
    constraints:
      - Não usar bibliotecas externas.
      - Verificar nilidade e o valor mínimo em uma única condição, usando curto-circuito, sem acessar Value de um node nil.
    acceptance:
      - 'FindFirstAtLeast([nil, {Value: 3}, {Value: 10}], 5) retorna (10, true).'
      - 'FindFirstAtLeast([nil, nil], 0) retorna (0, false), sem panic.'
      - 'FindFirstAtLeast([{Value: 7}, {Value: 1}], 5) retorna (7, true).'
      - FindFirstAtLeast(nil, 0) retorna (0, false).
      - 'FindFirstAtLeast([{Value: 1}, {Value: 2}], 5) retorna (0, false).'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.skip-nil-nodes
            kind: micro
            action: implement
            target: function
            title: Percorrer nodes ignorando elementos nil
            instruction:
              objective: Percorrer nodes ignorando elementos nil, sem nunca acessar Value de um node nil, e sem aplicar ainda o filtro de valor mínimo.
              scope: O corpo da função, sem aplicar ainda o filtro min.
              constraints:
                - Não acessar Value de um node nil.
                - Não aplicar ainda o filtro de valor mínimo.
            concepts: [short-circuit-nil-guard]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: skips-nil-nodes
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.apply-minimum-filter
            kind: micro
            action: implement
            target: function
            title: Aplicar o filtro de valor mínimo
            instruction:
              objective: Aplicar o filtro de valor mínimo sobre os nodes não nulos e retornar o primeiro Value que atende, junto com found indicando se algum foi encontrado.
              scope: O corpo da função e o valor de retorno.
              constraints:
                - Verificar nilidade e o valor mínimo em uma única condição, usando curto-circuito.
            concepts: [short-circuit-nil-guard]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-first-match-with-found
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que checar node != nil antes de node.Value >= min na mesma condição evita panic, mesmo quando algum node é nil?
