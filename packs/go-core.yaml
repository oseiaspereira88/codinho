            action: implement
            target: function
            title: Agendar o fechamento de cada comando com defer
            instruction:
              objective: Para cada comando que não é "stop", agendar com defer o registro de uma entrada "closed:<comando>" antes de rodá-lo, garantindo que ela seja registrada mesmo que rodar o comando panique.
              scope: A função responsável por processar um único comando, antes de chamar run.
