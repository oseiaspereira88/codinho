    - go-production.verify-release-provenance
  brief: 'Missão: uma dependência falha parcialmente. O orçamento de retries e a proveniência do fallback precisam ser decididos
    com dados sintéticos antes de uma mitigação reversível.'
  constraints:
  - 'Requisito incompleto: não há SLO de latência nem política de fallback definida.'
  - 'Falhas: timeout da dependência e resposta primária inconsistente.'
  - Use um Call local; não use DNS, credenciais ou serviços externos.
  - Compare retry, fallback e desligamento gradual por custo e operabilidade.
  acceptance:
  - O cliente respeita o orçamento de tentativas.
  - Fallback informa sua proveniência e marca mitigação.
  - Sucesso primário interrompe retries.
  - Cancelamento não inicia nova tentativa.
  - A reflexão justifica custo, falha, operabilidade, alternativa e trade-off.
