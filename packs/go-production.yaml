- schema_version: 1
  id: go-production.observable-worker-shutdown
  version: 1.0.0
  title: Encerrar worker com readiness observável
  kind: combined
  difficulty: advanced
  estimated_minutes: 45
  themes:
  - go-production.observability
  - go-production.resilience
  competencies:
    primary:
    - go-production.separate-readiness-from-liveness
    secondary:
    - go-production.drain-workers-with-deadline
    - go-production.separate-readiness-from-liveness
  brief: Um worker local precisa sair do tráfego, drenar trabalho aceito e retornar dentro de um prazo de shutdown.
  constraints:
  - Não use sleep como sincronização.
  - A fila é local e limitada.
  - O cancelamento do contexto é um prazo verificável.
  acceptance:
  - Readiness fica falsa antes do retorno de shutdown.
  - Trabalho aceito é processado antes do retorno normal.
  - Um contexto cancelado faz shutdown retornar erro observável.
  canonical: true
  publication:
    status: draft
    author: codex
  fixture:
  - path: go.mod
    content: 'module codinho-practice/worker-shutdown


      go 1.25.0

      '
  - path: worker.go
    content: "package shutdown\n\nimport (\n    \"context\"\n    \"sync\"\n)\n\ntype Worker struct {\n    mu         sync.Mutex\n\
      \    jobs       chan int\n    done       chan struct{}\n    ready      bool\n    accepting  bool\n    processed  int\n\
      }\n\nfunc NewWorker(capacity int) *Worker {\n    return &Worker{jobs: make(chan int, capacity), done: make(chan struct{})}\n\
      }\n\nfunc (w *Worker) Start() {\n    w.mu.Lock()\n    w.ready = true\n    w.accepting = true\n    w.mu.Unlock()\n  \
      \  go func() {\n        defer close(w.done)\n        for job := range w.jobs {\n            w.mu.Lock()\n          \
      \  w.processed += job\n            w.mu.Unlock()\n        }\n    }()\n}\n\nfunc (w *Worker) Submit(job int) bool {\n\
      \    w.mu.Lock()\n    defer w.mu.Unlock()\n    if !w.accepting {\n        return false\n    }\n    select {\n    case\
      \ w.jobs <- job:\n        return true\n    default:\n        return false\n    }\n}\n\nfunc (w *Worker) Ready() bool\
      \ {\n    w.mu.Lock()\n    defer w.mu.Unlock()\n    return w.ready\n}\n\nfunc (w *Worker) Processed() int {\n    w.mu.Lock()\n\
      \    defer w.mu.Unlock()\n    return w.processed\n}\n\nfunc (w *Worker) Shutdown(ctx context.Context) error {\n    return\
      \ nil\n}\n"
  - path: worker_test.go
    content: "package shutdown\n\nimport (\n    \"context\"\n    \"testing\"\n)\n\nfunc TestShutdownDrainsBeforeReturn(t *testing.T)\
      \ {\n    w := NewWorker(4)\n    w.Start()\n    for _, job := range []int{1, 2, 3} {\n        if !w.Submit(job) {\n \
