schema_version: 1
id: go-testing
version: 1.3.0
publication:
  status: draft
  author: codex
themes:
- id: testing-and-testability
  title: Testes e testabilidade
concepts:
- id: testing-table-cases
  title: Casos de teste em tabela
  content:
    version: 1
    explanation: 'Uma tabela reúne entradas e resultados esperados para o mesmo contrato. Escolha casos
      que distingam comportamentos: vazio, limite e valor comum. Calcule o esperado explicitamente; repetir
      a implementação dentro do teste pode reproduzir o mesmo erro.'
    example:
      context: classificação de paridade
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\nfunc TestParity(t *testing.T) {\n\tfor _,\
        \ tc := range []struct {\n\t\tn    int\n\t\teven bool\n\t}{{0, true}, {3, false}, {4, true}} {\n\
        \t\tif got := tc.n%2 == 0; got != tc.even {\n\t\t\tt.Fatalf(\"n=%d: got %v, want %v\", tc.n, got,\
        \ tc.even)\n\t\t}\n\t}\n}\n"
      explanation: Os valores esperados estão declarados na tabela. Um caso novo amplia a cobertura sem
        duplicar a lógica de verificação.
    relation_refs:
    - kind: relates_to
      concept_id: testing-named-subtests
- id: testing-named-subtests
  title: Subtestes com nomes descritivos
  content:
    version: 1
    explanation: Um subteste nomeado associa uma falha a um cenário legível. Use t.Run e nomes que descrevam
      a condição, em vez de índices sem significado. O nome ajuda a selecionar e diagnosticar o caso;
      não substitui uma mensagem com entrada, obtido e esperado.
    example:
      context: tamanhos de mensagens
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\nfunc TestMessageSizes(t *testing.T) {\n\t\
        for _, tc := range []struct {\n\t\tname, text string\n\t\twant       int\n\t}{{\"empty\", \"\"\
        , 0}, {\"ascii\", \"ola\", 3}} {\n\t\tt.Run(tc.name, func(t *testing.T) {\n\t\t\tif got := len(tc.text);\
        \ got != tc.want {\n\t\t\t\tt.Fatalf(\"got %d, want %d\", got, tc.want)\n\t\t\t}\n\t\t})\n\t}\n\
        }\n"
      explanation: Cada cenário aparece separadamente na saída de go test. O exemplo mede bytes e escolhe
        ASCII explicitamente; não afirma contar caracteres Unicode.
    relation_refs:
    - kind: relates_to
      concept_id: testing-table-cases
- id: testing-clock-injection
  title: Injeção de relógio
  content:
    version: 1
    explanation: Receber uma função de relógio permite escolher o instante observado sem depender da hora
      da máquina. O código usa essa dependência, e o teste fornece um valor fixo. Injetar o relógio não
      basta se a implementação ainda consulta time.Now por outro caminho.
    example:
      context: ano de um registro
      code: "package example\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc recordedYear(clock func()\
        \ time.Time) int { return clock().Year() }\nfunc TestRecordedYear(t *testing.T) {\n\tfixed :=\
        \ time.Date(2030, 7, 1, 0, 0, 0, 0, time.UTC)\n\tif got := recordedYear(func() time.Time { return\
        \ fixed }); got != 2030 {\n\t\tt.Fatalf(\"got %d\", got)\n\t}\n}\n"
      explanation: O teste escolhe a data diretamente. A função ilustrativa exige um relógio não nil;
        cada API deve definir separadamente seu contrato para dependências ausentes.
    relation_refs:
    - kind: relates_to
      concept_id: testing-repeatability
- id: testing-counting-double
  title: Dublê com contagem de chamadas
  content:
    version: 1
    explanation: Um dublê pode registrar quantas vezes uma dependência foi chamada, além de fornecer um
      valor. Verifique a contagem apenas quando ela faz parte do contrato observável. Um retorno que muda
      entre chamadas pode revelar uma consulta extra que um valor constante esconderia.
    example:
      context: leitura de uma sequência controlada
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\nfunc TestCountingDouble(t *testing.T) {\n\
        \tcalls := 0\n\tnext := func() int { calls++; return calls * 10 }\n\tfirst, second := next(),\
        \ next()\n\tif calls != 2 || first != 10 || second != 20 {\n\t\tt.Fatalf(\"calls=%d values=%d,%d\"\
        , calls, first, second)\n\t}\n}\n"
      explanation: O estado local registra chamadas e altera os resultados. Este dublê é sequencial; uso
        concorrente exigiria sincronização.
    relation_refs:
    - kind: relates_to
      concept_id: testing-clock-injection
- id: testing-time-boundaries
  title: Fronteiras temporais
  content:
    version: 1
    explanation: Para uma fronteira, teste imediatamente antes, na igualdade e imediatamente depois. Declare
      se o limite é inclusivo ou exclusivo antes de escrever a comparação. Casos muito distantes podem
      passar mesmo quando o operador de igualdade está errado.
    example:
      context: abertura de um portão
      code: "package example\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestOpeningBoundary(t *testing.T)\
        \ {\n\topening := time.Date(2030, 1, 1, 9, 0, 0, 0, time.UTC)\n\tfor _, tc := range []struct {\n\
        \t\toffset time.Duration\n\t\topen   bool\n\t}{{-time.Nanosecond, false}, {0, true}, {time.Nanosecond,\
        \ true}} {\n\t\tgot := !opening.Add(tc.offset).Before(opening)\n\t\tif got != tc.open {\n\t\t\t\
        t.Fatalf(\"offset=%v got=%v\", tc.offset, got)\n\t\t}\n\t}\n}\n"
      explanation: Aqui o limite de abertura é inclusivo. A expectativa da igualdade torna esse contrato
        explícito; outros domínios podem usar limite exclusivo.
    relation_refs:
    - kind: relates_to
      concept_id: testing-table-cases
- id: testing-instant-versus-zone
  title: Instante versus representação em fuso
  content:
    version: 1
    explanation: 'Um instante pode ter representações diferentes em fusos diferentes. Use time.Time.Equal
      para igualdade de instante: o operador == também compara detalhes da representação. Fixe o fuso
      quando o contrato trata de hora civil; não confunda hora local com ordem cronológica.'
    example:
      context: representações de uma reunião
      code: "package example\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestSameInstant(t *testing.T)\
        \ {\n\tutc := time.Date(2030, 1, 1, 12, 0, 0, 0, time.UTC)\n\tlocal := utc.In(time.FixedZone(\"\
        example\", -3*60*60))\n\tif !utc.Equal(local) || local.Hour() != 9 {\n\t\tt.Fatal(\"instant or\
        \ representation changed\")\n\t}\n}\n"
      explanation: A representação local mostra 9h, e a UTC mostra 12h, mas ambas identificam o mesmo
        instante. FixedZone usa um deslocamento fixo neste exemplo.
    relation_refs:
    - kind: relates_to
      concept_id: testing-time-boundaries
- id: testing-input-isolation
  title: Verificação de preservação da entrada
  content:
    version: 1
    explanation: Comparar entrada e saída antes de modificá-las não demonstra independência. Faça uma
      mutação controlada na saída e observe a entrada, depois teste a direção contrária. Copiar um slice
      separa seu array, mas elementos com ponteiros, mapas ou outros slices podem continuar compartilhando
      dados.
    example:
      context: cópia de uma lista de pontuações
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\nfunc TestScoreIsolation(t *testing.T) {\n\
        \tinput := []int{4, 8}\n\toutput := append([]int(nil), input...)\n\toutput[0] = 99\n\tif input[0]\
        \ != 4 {\n\t\tt.Fatal(\"output changed input\")\n\t}\n\tinput[1] = 77\n\tif output[1] != 8 {\n\
        \t\tt.Fatal(\"input changed output\")\n\t}\n}\n"
      explanation: Os elementos int são valores sem referências internas. O teste verifica mutações em
        ambas as direções; não demonstra uma cópia profunda de qualquer tipo.
    relation_refs:
    - kind: relates_to
      concept_id: testing-repeatability
- id: testing-repeatability
  title: Repetibilidade sem esperas reais
  content:
    version: 1
    explanation: 'Um teste repetível controla entradas e dependências relevantes e não depende da ordem
      de execução. Evite esperas reais para simular passagem de tempo: agendamento da máquina pode mudar
      o resultado. Repita o teste para investigar instabilidade, mas lembre que várias execuções aprovadas
      não provam ausência de dependências ocultas.'
    example:
      context: geração local de identificadores
      code: "package example\n\nimport (\n\t\"testing\"\n)\n\nfunc TestLocalSequence(t *testing.T) {\n\
        \tfor run := 0; run < 3; run++ {\n\t\tvalue := 0\n\t\tnext := func() int { value++; return value\
        \ }\n\t\tif next() != 1 || next() != 2 {\n\t\t\tt.Fatal(\"sequence differs\")\n\t\t}\n\t}\n}\n"
      explanation: Cada execução cria seu próprio estado. Um contador global compartilhado entre testes
        perderia esse isolamento.
    relation_refs:
    - kind: relates_to
      concept_id: testing-counting-double
- id: testing-helper-context
  title: Contexto de helper em testes
  content:
    version: 1
    explanation: t.Helper marca a função atual como auxiliar para o framework de testes. Quando essa função registra uma falha, o diagnóstico omite a moldura do helper e aponta para o chamador que precisa ser corrigido. Isso melhora a localização da falha, mas não altera a asserção nem torna o teste determinístico; o helper ainda deve incluir obtido e esperado na mensagem.
    example:
      context: diagnóstico de respostas HTTP
      code: |
        package example

        import (
            "os"
            "os/exec"
            "regexp"
            "runtime"
            "strings"
            "testing"
        )

        func assertStatus(t *testing.T, got, want int) {
            t.Helper()
            if got != want {
                t.Fatalf("status = %d, want %d", got, want)
            }
        }

        func status(code int) int {
            if code >= 200 && code < 300 {
                return 1
            }
            return 0
        }

        func TestHelperContext(t *testing.T) {
            cmd := exec.Command(os.Args[0], "-test.run=^TestHelperFailure$", "-test.v")
            cmd.Env = append(os.Environ(), "HELPER_CHILD=1")
            output, err := cmd.CombinedOutput()
            if err == nil {
                t.Fatal("the child test should fail")
            }

            report := string(output)
            if !strings.Contains(report, "TestHelperFailure/redirect_response") {
                t.Fatalf("subtest name missing from report: %s", report)
            }
            line := regexp.MustCompile(`caller-line=(\d+)`).FindStringSubmatch(report)
            if len(line) != 2 || !strings.Contains(report, "helper_test.go:"+line[1]+":") {
                t.Fatalf("helper did not point at caller: %s", report)
            }
        }

        func TestHelperFailure(t *testing.T) {
            if os.Getenv("HELPER_CHILD") == "" {
                t.Skip("run by TestHelperContext")
            }
            t.Run("redirect response", func(t *testing.T) {
                _, _, callerLine, _ := runtime.Caller(0)
                t.Logf("caller-line=%d", callerLine+2)
                assertStatus(t, status(302), 1)
            })
        }
      explanation: O teste pai inicia um filho que falha de propósito. A saída precisa manter o nome redirect response e apontar para a linha da chamada de assertStatus, não para o corpo do helper; assim o exemplo observa o efeito de t.Helper sem deixar uma suíte sempre falhando.
    relation_refs:
    - kind: deepens_into
      concept_id: testing-named-subtests
    - kind: relates_to
      concept_id: testing-repeatability
- id: testing-cleanup-lifecycle
  title: Lifecycle de cleanup em testes
  content:
    version: 1
    explanation: t.Cleanup registra uma função para o lifecycle do teste corrente. Os callbacks executam depois do corpo e dos subtestes desse teste, em ordem LIFO; um cleanup de subteste termina antes do cleanup do pai. A garantia pertence ao framework de testes, portanto não é a mesma coisa que um defer dentro da função sob teste.
    example:
      context: descarte de um lote de trabalho
      code: |
        package example

        import (
            "reflect"
            "testing"
        )

        func TestCleanupLifecycle(t *testing.T) {
            var trace []string
            if !t.Run("batch", func(t *testing.T) {
                t.Cleanup(func() { trace = append(trace, "batch cleanup") })
                if !t.Run("item", func(t *testing.T) {
                    t.Cleanup(func() { trace = append(trace, "item first") })
                    t.Cleanup(func() { trace = append(trace, "item second") })
                    trace = append(trace, "item body")
                }) {
                    t.Fatal("item subtest failed")
                }
            }) {
                t.Fatal("batch subtest failed")
            }

            want := []string{"item body", "item second", "item first", "batch cleanup"}
            if !reflect.DeepEqual(trace, want) {
                t.Fatalf("cleanup trace = %v, want %v", trace, want)
            }
        }
      explanation: O corpo é registrado antes dos callbacks; os dois cleanups do item executam em ordem inversa, e só depois o cleanup do batch. A verificação ocorre após t.Run, quando todos os callbacks aninhados já terminaram.
    relation_refs:
    - kind: relates_to
      concept_id: testing-repeatability
    - kind: relates_to
      concept_id: testing-counting-double
- id: testing-fuzz-invariant
  title: Invariante em teste de fuzz
  content:
    version: 1
    explanation: Um teste de fuzz declara uma propriedade que deve continuar verdadeira para muitas entradas, em vez de enumerar somente resultados individuais. f.Add registra seeds conhecidos; o mesmo alvo pode rodar esses seeds no teste normal e receber entradas geradas durante uma sessão de fuzz. A propriedade precisa ser independente o bastante da implementação para revelar uma mutação que viole o contrato.
    example:
      context: normalização de rótulos
      code: |
        package example

        import (
            "strings"
            "testing"
        )

        func canonicalLabel(input string) string {
            return strings.Join(strings.Fields(input), " ")
        }

        func isCanonicalLabel(value string) bool {
            return value == strings.TrimSpace(value) &&
                !strings.Contains(value, "  ") &&
                !strings.ContainsAny(value, "\t\n\r")
        }

        func FuzzCanonicalLabel(f *testing.F) {
            f.Add("  go   testing ")
            f.Add("")
            f.Fuzz(func(t *testing.T, input string) {
                got := canonicalLabel(input)
                if !isCanonicalLabel(got) {
                    t.Fatalf("non-canonical label %q", got)
                }
                if canonicalLabel(got) != got {
                    t.Fatalf("normalization is not stable for %q", input)
                }
            })
        }
      explanation: Os seeds cobrem uma entrada com espaços e o caso vazio; a propriedade exige saída sem bordas ou separadores repetidos e permanece válida para entradas geradas. Uma mutação que devolva a entrada sem normalizar falha já no seed conhecido.
    relation_refs:
    - kind: deepens_into
      concept_id: testing-table-cases
    - kind: relates_to
      concept_id: testing-repeatability
