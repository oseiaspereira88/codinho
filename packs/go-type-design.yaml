  - schema_version: 1
    id: go-type-design.map-generic-transform
    version: 1.0.0
    title: Transformar uma slice genericamente preservando ordem
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [generics]
    competencies:
      primary: [implement-generic-transform]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função genérica que aplica uma transformação a cada
      elemento de uma slice, produzindo uma nova slice de um tipo
      possivelmente diferente, sem mutar a entrada.
    constraints:
      - Não usar bibliotecas externas.
      - Não mutar items.
    acceptance:
      - Map([1,2,3], strconv.Itoa) retorna ["1","2","3"], na mesma ordem.
      - Mutar o resultado de Map nunca altera a slice de entrada, mesmo quando a entrada tem capacidade excedente.
      - Map aplica transform a todos os elementos de uma slice longa, não apenas a um prefixo.
      - Map de uma slice vazia retorna uma slice vazia.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-independent-output-slice
            kind: micro
            action: declare
            target: function
            title: Declarar a saída independente da entrada
            instruction:
              objective: Declarar a slice de saída de forma que ela nunca reaproveite o backing array de items, sem ainda percorrer items.
              scope: Somente a criação da slice de saída.
              constraints:
                - Não mutar items.
            concepts: [generic-two-type-parameters]
            evidence:
              strategies: [source_inspection, compile]
