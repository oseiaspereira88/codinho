                  }
              })

              t.Run("empty shapes", func(t *testing.T) {
                  reg := Registry{Name: "empty"}
                  clone, first := FirstCircleClone(reg)
                  if first != nil {
                      t.Errorf("firstCircle = %#v, want nil", first)
                  }
                  if len(clone.Shapes) != 0 {
                      t.Errorf("clone.Shapes = %v, want empty", clone.Shapes)
                  }
              })

              t.Run("returns the first circle, not the last, when multiple are present", func(t *testing.T) {
                  reg := Registry{Shapes: []Shape{Square{Side: 1}, Circle{Radius: 2}, Square{Side: 3}, Circle{Radius: 5}}}
                  _, first := FirstCircleClone(reg)
                  want := Shape(Circle{Radius: 2})
                  if first != want {
                      t.Errorf("firstCircle = %#v, want %#v (the first one, not the last)", first, want)
                  }
              })

              t.Run("finds a circle at every possible index, not just a fixed subset", func(t *testing.T) {
                  const length = 20
                  for circleAt := 0; circleAt < length; circleAt++ {
                      shapes := make([]Shape, length)
                      for i := range shapes {
                          shapes[i] = Square{Side: float64(i)}
                      }
                      shapes[circleAt] = Circle{Radius: float64(circleAt)}
                      reg := Registry{Shapes: shapes}
                      _, first := FirstCircleClone(reg)
                      want := Shape(Circle{Radius: float64(circleAt)})
                      if first != want {
                          t.Fatalf("circle at index %d: firstCircle = %#v, want %#v", circleAt, first, want)
                      }
                  }
              })
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-type-design.generic-node-values-nil-safe
    version: 1.0.0
    title: Coletar os valores de uma lista genérica com receptor seguro para nil
    kind: combined
    difficulty: intermediate
    estimated_minutes: 25
    themes: [structs-and-pointers, generics]
    competencies:
      primary: [handle-nil-receiver-safely, implement-generic-transform]
      secondary: []
    prerequisites: [nil-safe-pointer-receiver, generic-two-type-parameters]
    brief: >
      Implemente um método em uma lista encadeada genérica que coleta os
      valores de todos os nós em uma nova slice, funcionando para
      qualquer tipo e mesmo quando chamado em um receptor nil.
    constraints:
      - Não usar bibliotecas externas.
      - Chamar Values em um *Node[T] nil não pode panicar.
      - Incluir Value de todos os nós da cadeia, seguindo Next até o fim.
    acceptance:
      - Chamar Values em um *Node[int] nil retorna uma slice vazia, sem panicar.
      - Values funciona para qualquer tipo de elemento, incluindo um struct definido pelo usuário, não só int/string.
      - Values preserva a ordem dos nós, incluindo cadeias longas (a coleta não pode parar em um prefixo fixo).
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.handle-nil-receiver-first
            kind: micro
            action: implement
            target: function
            title: Garantir que um receptor nil nunca cause panic
            instruction:
              objective: Garantir que chamar Values em um receptor nil não acesse nenhum campo e retorne uma slice vazia.
              scope: Somente o tratamento do receptor nil.
              constraints:
                - Chamar Values em um *Node[T] nil não pode panicar.
            concepts: [nil-safe-pointer-receiver]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: handles-nil-receiver-first
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.collect-values-across-the-whole-chain
            kind: micro
            action: implement
            target: function
            title: Coletar Value de n e de todos os nós alcançáveis a partir de Next
            instruction:
              objective: Quando n não é nil, incluir Value de n e de todos os nós alcançáveis a partir de Next na slice devolvida, preservando a ordem.
              scope: O caso em que n não é nil.
              constraints:
                - Incluir Value de todos os nós da cadeia, seguindo Next até o fim.
            concepts: [generic-two-type-parameters]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: collects-values-across-the-whole-chain
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
