                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
                kind: micro
                action: verify
                target: function
                title: Verificar casos válidos e inválidos
                instruction:
                  objective: Execute os casos numérico, vazio, somente espaços e texto inválido, confirmando age e err no retorno.
                  scope: Apenas a observação dos retornos após a implementação.
                concepts: [named-return-values, variable-shadowing]
                evidence:
                  strategies: [test]
                criteria:
                  - id: valid-case-verified
                    kind: structural
                  - id: invalid-cases-verified
                    kind: structural
                completion:
                  requires_positive_evaluation: true
                  requires_user_confirmation: false
