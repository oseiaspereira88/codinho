  - schema_version: 1
    id: go-core.configure-server-with-functional-options
    version: 1.0.0
    title: Configurar um servidor com opções funcionais validadas
    kind: combined
    difficulty: intermediate
    estimated_minutes: 30
    themes: [functions-and-methods, packages-and-apis]
    competencies:
      primary: [use-variadic-parameters, guard-invariant-with-unexported-field]
      secondary: []
    prerequisites: [variadic-parameters, unexported-field-invariant]
    brief: >
      Implemente a configuração de um Server usando o padrão de opções
      funcionais: funções que devolvem uma Option mutando o Server através
      de um ponteiro, aplicadas em ordem sobre valores padrão, com o
      resultado final validado antes de ser devolvido.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Os campos de Server não podem ser exportados.
      - NewServer deve aplicar os opts recebidos, na ordem, sobre os valores padrão.
      - NewServer deve validar a porta final antes de retornar, com erro se estiver fora de 1-65535.
    acceptance:
      - NewServer() retorna host "localhost" e port 8080, err nil.
      - NewServer(WithHost("example.com")) retorna host "example.com", port 8080, err nil.
      - NewServer(WithPort(80), WithPort(443)) retorna port 443 (a opção posterior prevalece sobre a anterior).
      - NewServer(WithPort(0)) retorna err não nil.
      - NewServer(WithPort(70000)) retorna err não nil.
      - NewServer(WithPort(65535)) retorna port 65535, err nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-options-mutating-by-pointer
            kind: micro
            action: implement
            target: function
            title: Declarar WithHost e WithPort mutando o Server via ponteiro
            instruction:
              objective: Implementar WithHost e WithPort para devolver uma Option que, quando aplicada, muta o campo correspondente do Server recebido por ponteiro.
              scope: O corpo de WithHost e WithPort.
              constraints:
                - Os campos de Server não podem ser exportados.
            concepts: [functional-options-pattern]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: options-mutate-via-pointer
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.apply-options-over-defaults
            kind: micro
            action: implement
            target: function
            title: Aplicar as opções em ordem sobre os valores padrão
            instruction:
              objective: Implementar NewServer para partir dos valores padrão (host "localhost", port 8080) e aplicar cada opt recebido em opts, na ordem, sobre o Server, sem validar ainda o resultado.
              scope: A criação do Server com os padrões e o laço que aplica opts.
              constraints:
                - NewServer deve aplicar os opts recebidos, na ordem, sobre os valores padrão.
                - Não validar ainda o resultado.
            concepts: [functional-options-pattern, variadic-parameters]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: applies-options-in-order-over-defaults
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.validate-final-port
            kind: micro
            action: implement
            target: function
            title: Validar a porta final antes de retornar
            instruction:
              objective: Depois de aplicar os opts, validar que a porta final está entre 1 e 65535 (inclusive), retornando erro caso contrário, e o Server válido caso contrário.
              scope: Somente a validação final e o retorno de NewServer.
              constraints:
                - NewServer deve validar a porta final antes de retornar, com erro se estiver fora de 1-65535.
            concepts: [unexported-field-invariant]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: validates-final-port-range
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que validar só depois de aplicar todos os opts, em vez de validar dentro de cada WithPort individualmente?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/configure-server-with-functional-options

          go 1.25.0
      - path: server.go
        content: |
          package server

          // Option configures a Server during construction.
          type Option func(*Server)

          // Server holds validated configuration.
          type Server struct {
              host string
              port int
          }

          func (s *Server) Host() string { return s.host }
          func (s *Server) Port() int    { return s.port }

          // WithHost sets the server's host.
          func WithHost(host string) Option {
              panic("not implemented")
          }

          // WithPort sets the server's port.
          func WithPort(port int) Option {
              panic("not implemented")
          }

          // NewServer applies opts in order over sensible defaults
          // (host "localhost", port 8080), validating the result before
          // returning it.
          func NewServer(opts ...Option) (*Server, error) {
              panic("not implemented")
          }
      - path: server_test.go
        content: |
          package server_test

          import (
              "testing"

              server "codinho-practice/configure-server-with-functional-options"
          )

          func TestNewServer(t *testing.T) {
              t.Run("defaults with no options", func(t *testing.T) {
                  s, err := server.NewServer()
                  if err != nil {
                      t.Fatalf("NewServer() err = %v, want nil", err)
                  }
                  if s.Host() != "localhost" || s.Port() != 8080 {
                      t.Fatalf("NewServer() = (%q, %d), want (localhost, 8080)", s.Host(), s.Port())
                  }
              })

              t.Run("applies host option", func(t *testing.T) {
                  s, err := server.NewServer(server.WithHost("example.com"))
                  if err != nil {
                      t.Fatalf("err = %v, want nil", err)
                  }
                  if s.Host() != "example.com" || s.Port() != 8080 {
                      t.Fatalf("got (%q, %d), want (example.com, 8080)", s.Host(), s.Port())
                  }
              })

              t.Run("later option wins over earlier one", func(t *testing.T) {
                  s, err := server.NewServer(server.WithPort(80), server.WithPort(443))
                  if err != nil {
                      t.Fatalf("err = %v, want nil", err)
                  }
                  if s.Port() != 443 {
                      t.Fatalf("Port() = %d, want 443", s.Port())
                  }
              })

              t.Run("rejects port zero", func(t *testing.T) {
                  _, err := server.NewServer(server.WithPort(0))
                  if err == nil {
                      t.Fatal("err = nil, want error for port 0")
                  }
              })

              t.Run("rejects port above valid range", func(t *testing.T) {
                  _, err := server.NewServer(server.WithPort(70000))
                  if err == nil {
                      t.Fatal("err = nil, want error for port 70000")
                  }
              })

              t.Run("accepts port at upper bound", func(t *testing.T) {
                  s, err := server.NewServer(server.WithPort(65535))
                  if err != nil {
                      t.Fatalf("err = %v, want nil", err)
                  }
                  if s.Port() != 65535 {
                      t.Fatalf("Port() = %d, want 65535", s.Port())
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestNewServer$
        timeout: 20s
    variants: []
    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/configure-server-with-functional-options

          go 1.25.0
      - path: server.go
        content: |
          package server

          import "fmt"

          type Option func(*Server)
          type Server struct {
              host string
              port int
          }

          func (s *Server) Host() string    { return s.host }
          func (s *Server) Port() int       { return s.port }
          func WithHost(host string) Option { return func(s *Server) { s.host = host } }
          func WithPort(port int) Option    { return func(s *Server) { s.port = port } }
          func NewServer(opts ...Option) (*Server, error) {
              s := &Server{host: "localhost", port: 8080}
              for _, opt := range opts {
                  opt(s)
              }
              if s.port < 1 || s.port > 65535 {
                  return nil, fmt.Errorf("port out of range: %d", s.port)
              }
              return s, nil
          }
