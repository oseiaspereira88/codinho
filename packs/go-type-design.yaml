                kind: micro
                action: verify
                target: boundary_case
                title: Verificar slice vazia e correspondência tardia
                instruction:
                  objective: 'Confirme os dois limites da busca: uma slice vazia não encontra e o último índice de uma slice longa é encontrado.'
                  scope: Apenas os casos de fronteira de busca.
                concepts: [generic-comparable-constraint]
                evidence:
                  strategies: [test]
                criteria:
                  - id: empty-slice-false
