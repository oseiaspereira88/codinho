schema_version: 1
id: go-core
version: 1.4.0
themes:
  - id: control-flow
    title: Controle de fluxo
  - id: functions-and-methods
    title: Funções e métodos
  - id: packages-and-apis
    title: Packages e APIs
concepts:
  - id: defer-execution-order
    title: Ordem de execução de defer
    content:
      version: 1
      explanation: 'defer registra uma chamada para quando a função atual terminar. Os argumentos são avaliados
        no registro; as chamadas executam em ordem inversa. Um retorno nomeado ainda pode ser alterado por
        uma função adiada. O escopo é a função, não o bloco do laço: acumular defer num laço longo pode reter
        recursos até o final.'
      example:
        context: rastreamento de uma operação
        code: "package example\n\nimport \"testing\"\n\nfunc trace() (events []int) {\n\tn := 1\n\tdefer func(v\
          \ int) { events = append(events, v) }(n)\n\tn = 2\n\tdefer func() { events = append(events, n) }()\n\
          \treturn\n}\nfunc TestTrace(t *testing.T) {\n\tgot := trace()\n\tif len(got) != 2 || got[0] != 2\
          \ || got[1] != 1 {\n\t\tt.Fatal(got)\n\t}\n}\n"
        explanation: O segundo defer lê n ao executar; o primeiro conserva o argumento 1. O retorno nomeado
          recebe as duas alterações antes de chegar ao chamador.
      relation_refs:
      - kind: relates_to
        concept_id: panic-recover-boundary
  - id: variadic-parameters
    title: Parâmetros variádicos
    content:
      version: 1
      explanation: Um parâmetro final ...T recebe zero ou mais argumentos como um slice de T. Ao expandir
        um slice com s..., a função compartilha seu armazenamento; modificar elementos pode afetar o chamador.
        Sem argumentos o slice recebido é nil. Decida se a API apenas lê os dados ou permite mutação.
      example:
        context: marcação de amostras
        code: "package example\n\nimport \"testing\"\n\nfunc mark(values ...int) int {\n\tif len(values) ==\
          \ 0 {\n\t\treturn 0\n\t}\n\tvalues[0]++\n\treturn len(values)\n}\nfunc TestVariadic(t *testing.T)\
          \ {\n\tif mark() != 0 {\n\t\tt.Fatal(\"empty\")\n\t}\n\tvalues := []int{4, 8}\n\tif mark(values...)\
          \ != 2 || values[0] != 5 {\n\t\tt.Fatal(values)\n\t}\n\tif mark(10) != 1 {\n\t\tt.Fatal(\"single\
          \ argument\")\n\t}\n}\n"
        explanation: A expansão preserva o compartilhamento com values. A chamada sem argumentos é tratada
          antes de qualquer acesso por índice.
      relation_refs:
      - kind: relates_to
        concept_id: functional-options-pattern
  - id: labeled-break-scope
    title: Escopo de break rotulado
    content:
      version: 1
      explanation: Um break sem rótulo encerra o for, switch ou select mais interno. Dentro de um switch em
        um laço, ele encerra apenas o switch. Um break com rótulo pode encerrar o laço externo rotulado que
        contém a instrução. Escolha o alvo de saída de acordo com o trabalho que deve deixar de acontecer.
      example:
        context: leitura de uma sequência até um marcador
        code: "package example\n\nimport \"testing\"\n\nfunc countBeforeStop(words []string) int {\n\tcount\
          \ := 0\nscan:\n\tfor _, word := range words {\n\t\tswitch word {\n\t\tcase \"stop\":\n\t\t\tbreak\
          \ scan\n\t\tcase \"skip\":\n\t\t\tcontinue\n\t\t}\n\t\tcount++\n\t}\n\treturn count\n}\nfunc TestStop(t\
          \ *testing.T) {\n\tif got := countBeforeStop([]string{\"a\", \"skip\", \"stop\", \"b\"}); got !=\
          \ 1 {\n\t\tt.Fatal(got)\n\t}\n\tif got := countBeforeStop(nil); got != 0 {\n\t\tt.Fatal(got)\n\t\
          }\n}\n"
        explanation: O rótulo encerra o for antes de contar stop ou visitar b. O continue ignora skip e segue
          para a próxima iteração.
      relation_refs:
      - kind: relates_to
        concept_id: short-circuit-nil-guard
  - id: pointer-vs-value-receiver
    title: Receptor de ponteiro versus receptor de valor
    content:
      version: 1
      explanation: Um receptor de valor recebe uma cópia do valor; um receptor de ponteiro permite alterar
        o objeto apontado. A cópia de uma struct com slices ou maps ainda compartilha os dados referenciados.
        O method set de T inclui métodos com receptor T; o de *T inclui também os de *T. A chamada automática
        por endereço em uma variável endereçável não faz T satisfazer interfaces que exigem métodos de *T.
      example:
        context: contador de visitas
        code: "package example\n\nimport \"testing\"\n\ntype Counter struct{ N int }\n\nfunc (c Counter) CopyIncrement()\
          \ { c.N++ }\nfunc (c *Counter) Increment()    { c.N++ }\n\ntype Incrementer interface{ Increment()\
          \ }\n\nvar _ Incrementer = (*Counter)(nil)\n\nfunc TestReceivers(t *testing.T) {\n\tc := Counter{N:\
          \ 3}\n\tc.CopyIncrement()\n\tif c.N != 3 {\n\t\tt.Fatal(c.N)\n\t}\n\tc.Increment()\n\tif c.N !=\
          \ 4 {\n\t\tt.Fatal(c.N)\n\t}\n\tif _, ok := any(c).(Incrementer); ok {\n\t\tt.Fatal(\"value unexpectedly\
          \ implements interface\")\n\t}\n}\n"
        explanation: A cópia não altera N no original. A variável c permite chamada com endereço implícito,
          mas somente *Counter satisfaz Incrementer.
      relation_refs:
      - kind: relates_to
        concept_id: constructor-returns-interface
  - id: panic-recover-boundary
    title: Fronteira de recuperação de panic
    content:
      version: 1
      explanation: recover interrompe um panic quando é chamado diretamente por uma função adiada durante
        o desenrolamento da pilha na mesma goroutine. A função protegida não retoma a instrução que falhou.
        Use essa fronteira de forma deliberada; falhas esperadas devem normalmente ser retornadas como error,
        e capturar qualquer panic pode esconder defeitos.
      example:
        context: isolamento de uma operação local
        code: "package example\n\nimport \"testing\"\n\nfunc invoke(run func()) (failed bool) {\n\tdefer func()\
          \ {\n\t\tif recover() != nil {\n\t\t\tfailed = true\n\t\t}\n\t}()\n\trun()\n\treturn false\n}\n\
          func TestBoundary(t *testing.T) {\n\treached := false\n\tif !invoke(func() { panic(\"broken\") })\
          \ {\n\t\tt.Fatal(\"missing recovery\")\n\t}\n\tif invoke(func() { reached = true }) || !reached\
          \ {\n\t\tt.Fatal(\"normal call\")\n\t}\n}\n"
        explanation: O retorno nomeado informa a recuperação. A execução normal também é verificada; o exemplo
          não captura panics de outras goroutines.
      relation_refs:
      - kind: relates_to
        concept_id: defer-execution-order
  - id: unexported-field-invariant
    title: Invariante protegido por campo não exportado
    content:
      version: 1
      explanation: 'Campos não exportados restringem acesso direto ao package que os declara. Um construtor
        e métodos podem validar transições antes de alterar o estado, mas o próprio package ainda pode escrever
        nesses campos. Considere o zero value: quando o tipo é exportado, chamadores podem construí-lo sem
        passar pelo construtor. Não devolva referências mutáveis que permitam contornar a validação.'
      example:
        context: saldo não negativo
        code: "package example\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\ntype Balance struct{ amount\
          \ int }\n\nfunc (b *Balance) Set(amount int) error {\n\tif amount < 0 {\n\t\treturn errors.New(\"\
          negative amount\")\n\t}\n\tb.amount = amount\n\treturn nil\n}\nfunc (b Balance) Amount() int { return\
          \ b.amount }\nfunc TestInvariant(t *testing.T) {\n\tvar b Balance\n\tif b.Amount() != 0 {\n\t\t\
          t.Fatal(\"zero value\")\n\t}\n\tif err := b.Set(7); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err\
          \ := b.Set(-2); err == nil || b.Amount() != 7 {\n\t\tt.Fatal(\"invalid transition\")\n\t}\n}\n"
        explanation: O zero value é válido e a validação antecede a escrita. O teste demonstra transições;
          a restrição de acesso externo decorre da visibilidade do campo no Go.
      relation_refs:
      - kind: relates_to
        concept_id: pointer-vs-value-receiver
  - id: short-circuit-nil-guard
    title: Curto-circuito para evitar acesso a valor nil
    content:
      version: 1
      explanation: Go avalia && e || da esquerda para a direita e só avalia o segundo operando quando necessário.
        Em p != nil && p.Ready, a verificação de nil protege o acesso seguinte. Em p == nil || !p.Ready, nil
        já torna a condição verdadeira. Inverter a ordem dos operandos elimina essa proteção; o padrão também
        não fornece sincronização entre goroutines.
      example:
        context: disponibilidade de uma estação
        code: "package example\n\nimport \"testing\"\n\ntype Station struct{ Ready bool }\n\nfunc available(s\
          \ *Station) bool { return s != nil && s.Ready }\nfunc TestGuard(t *testing.T) {\n\tfor _, c := range\
          \ []struct {\n\t\ts    *Station\n\t\twant bool\n\t}{\n\t\t{nil, false}, {&Station{}, false}, {&Station{Ready:\
          \ true}, true},\n\t} {\n\t\tif got := available(c.s); got != c.want {\n\t\t\tt.Fatalf(\"got %v want\
          \ %v\", got, c.want)\n\t\t}\n\t}\n}\n"
        explanation: Os casos distinguem ponteiro ausente, estação inativa e estação pronta. O operando esquerdo
          impede dereferenciar nil.
      relation_refs:
      - kind: relates_to
        concept_id: pointer-vs-value-receiver
  - id: constructor-returns-interface
    title: Construtor retornando tipo de interface
    content:
      version: 1
      explanation: 'Um construtor pode retornar uma interface para expor um conjunto pequeno de operações
        e ocultar o tipo concreto. Isso reduz as operações disponíveis pelo contrato estático, mas também
        pode limitar a evolução da API; interfaces pequenas definidas por consumidores são outra opção. Uma
        interface só é nil quando não contém tipo dinâmico nem valor: guardar um ponteiro nil dentro dela
        não produz uma interface nil.'
      example:
        context: leitura de uma etiqueta fixa
        code: "package example\n\nimport \"testing\"\n\ntype Label interface{ Text() string }\ntype fixedLabel\
          \ struct{ text string }\n\nfunc (l *fixedLabel) Text() string { return l.text }\nfunc NewLabel(text\
          \ string) Label {\n\tif text == \"\" {\n\t\treturn nil\n\t}\n\treturn &fixedLabel{text: text}\n\
          }\nfunc TestConstructor(t *testing.T) {\n\tif NewLabel(\"\") != nil {\n\t\tt.Fatal(\"expected absent\
          \ label\")\n\t}\n\tlabel := NewLabel(\"north\")\n\tif label == nil || label.Text() != \"north\"\
          \ {\n\t\tt.Fatal(\"label\")\n\t}\n\tvar pointer *fixedLabel\n\tvar boxed Label = pointer\n\tif boxed\
          \ == nil {\n\t\tt.Fatal(\"typed nil interface\")\n\t}\n}\n"
        explanation: O caminho vazio retorna nil diretamente. A comparação com um ponteiro nil encaixotado
          evidencia a armadilha; chamar Text nesse ponteiro causaria panic.
      relation_refs:
      - kind: relates_to
        concept_id: unexported-field-invariant
  - id: functional-options-pattern
    title: Padrão de opções funcionais
    content:
      version: 1
      explanation: O padrão de opções funcionais representa cada ajuste opcional como uma função que recebe a configuração por ponteiro. O construtor começa com defaults, aplica as opções na ordem recebida e valida o estado final; assim, novas opções não precisam aumentar a lista de parâmetros obrigatórios.
      example:
        context: calendário de uma equipe
        code: |
          package example

          import "testing"

          type CalendarEvent struct {
              title            string
              reminderMinutes  int
          }

          type EventOption func(*CalendarEvent)

          func WithReminder(minutes int) EventOption {
              return func(event *CalendarEvent) {
                  event.reminderMinutes = minutes
              }
          }

          func NewCalendarEvent(title string, opts ...EventOption) *CalendarEvent {
              event := &CalendarEvent{title: title, reminderMinutes: 15}
              for _, opt := range opts {
                  opt(event)
              }
              return event
          }

          func TestFunctionalOptions(t *testing.T) {
              defaultEvent := NewCalendarEvent("retro")
              if defaultEvent.title != "retro" || defaultEvent.reminderMinutes != 15 {
                  t.Fatalf("defaults = %#v", defaultEvent)
              }
              customEvent := NewCalendarEvent("planning", WithReminder(5), WithReminder(10))
              if customEvent.reminderMinutes != 10 {
                  t.Fatalf("last option = %d, want 10", customEvent.reminderMinutes)
              }
          }
        explanation: O teste verifica o default e mostra que a última opção aplicada prevalece. A função do evento é um exemplo completo, por isso o código pode ser executado isoladamente sem depender do desafio de configuração de servidor.
      analogy: "Como preencher uma folha de compromissos: você anota o título obrigatório e marca apenas os lembretes ou cores opcionais que desejar."
      relation_refs:
        - kind: relates_to
          concept_id: variadic-parameters
        - kind: relates_to
          concept_id: unexported-field-invariant
  - id: if-initializer-scope
    title: Escopo do inicializador de if
    content:
      version: 1
      explanation: Uma instrução simples antes da condição de if é executada uma vez e cria nomes visíveis na própria condição e nos dois ramos. O nome deixa de existir depois do if, porque o inicializador tem o escopo da instrução inteira, não do bloco que a contém. Esse escopo permite manter uma leitura ou um erro perto da decisão sem vazar uma variável auxiliar para o restante da função.
      example:
        context: classificação de temperatura
        code: |
          package example

          import (
              "go/ast"
              "go/parser"
              "go/token"
              "go/types"
              "strings"
              "testing"
          )

          func classifyTemperature(value int) string {
              if limit := 25; value >= limit {
                  return "warm"
              }
              return "cool"
          }

          func TestIfInitializerScope(t *testing.T) {
              if got := classifyTemperature(27); got != "warm" {
                  t.Fatalf("classifyTemperature(27) = %q", got)
              }

              source := `package sample

          func classify(value int) int {
              if limit := 25; value >= limit {
                  return limit
              }
              return limit
          }`
              fileSet := token.NewFileSet()
              file, err := parser.ParseFile(fileSet, "sample.go", source, 0)
              if err != nil {
                  t.Fatal(err)
              }
              var typeErrors []string
              _, checkErr := (&types.Config{Error: func(err error) {
                  typeErrors = append(typeErrors, err.Error())
              }}).Check("sample", fileSet, []*ast.File{file}, nil)
              if checkErr == nil || !strings.Contains(strings.Join(typeErrors, "\n"), "undefined: limit") {
                  t.Fatalf("expected limit to be out of scope, errors=%v check=%v", typeErrors, checkErr)
              }
          }
        explanation: >
          A função usa limit apenas dentro da decisão. O segundo trecho é analisado em memória por go/types:
          retornar limit depois do if produz um erro de nome indefinido, evidenciando o limite do escopo sem
          tornar o exemplo inteiro inválido.
      relation_refs:
        - kind: relates_to
          concept_id: block-scope
        - kind: relates_to
          concept_id: short-circuit-nil-guard
  - id: for-clause-lifecycle
    title: Ciclo de vida das cláusulas de for
    content:
      version: 1
      explanation: No for clássico, o inicializador ocorre antes da primeira condição, o corpo só roda enquanto a condição é verdadeira e a cláusula posterior roda depois de cada corpo, inclusive quando ele termina com continue. A próxima condição só é avaliada depois do post. Esse ciclo é diferente de range, que fornece a iteração sobre uma coleção.
      example:
        context: rastreamento de entregas
        code: |
          package example

          import (
              "strconv"
              "testing"
          )

          func deliveryTrace(limit int) []string {
              events := []string{"init"}
              i := 0
              condition := func() bool {
                  events = append(events, "condition:"+strconv.Itoa(i))
                  return i < limit
              }
              for ; condition(); func() {
                  events = append(events, "post:"+strconv.Itoa(i))
                  i++
              }() {
                  events = append(events, "body:"+strconv.Itoa(i))
                  if i == 1 {
                      events = append(events, "continue")
                      continue
                  }
                  events = append(events, "after:"+strconv.Itoa(i))
              }
              return append(events, "done")
          }

          func TestForClauseLifecycle(t *testing.T) {
              want := []string{
                  "init", "condition:0", "body:0", "after:0", "post:0",
                  "condition:1", "body:1", "continue", "post:1",
                  "condition:2", "body:2", "after:2", "post:2",
                  "condition:3", "done",
              }
              got := deliveryTrace(3)
              if len(got) != len(want) {
                  t.Fatalf("trace length = %d, want %d: %v", len(got), len(want), got)
              }
              for i := range want {
                  if got[i] != want[i] {
                      t.Fatalf("trace[%d] = %q, want %q: %v", i, got[i], want[i], got)
                  }
              }
          }
        explanation: O trace torna visível que cada condição ocorre antes do corpo, que post:1 aparece mesmo depois de continue e antes de condition:2, e que a cláusula posterior também acontece na última iteração antes de condition:3 falhar e do evento done.
      relation_refs:
        - kind: contrasts_with
          concept_id: range-loop
        - kind: relates_to
          concept_id: labeled-break-scope
  - id: defer-argument-evaluation
    title: Avaliação dos argumentos de defer
    content:
      version: 1
      explanation: Ao registrar um defer, os argumentos da chamada são avaliados imediatamente; uma closure sem argumentos pode, por outro lado, ler uma variável quando for executada no retorno da função. Ambas as chamadas ainda obedecem à ordem de execução dos defers, mas seus valores podem representar instantes diferentes.
      example:
        context: registro de etiquetas de auditoria
        code: |
          package example

          import "testing"

          func auditTrace() (events []string) {
              label := "before"
              defer func(captured string) {
                  events = append(events, "argument:"+captured)
              }(label)
              defer func() {
                  events = append(events, "closure:"+label)
              }()
              label = "after"
              return
          }

          func TestDeferArgumentEvaluation(t *testing.T) {
              want := []string{"closure:after", "argument:before"}
              got := auditTrace()
              if len(got) != len(want) || got[0] != want[0] || got[1] != want[1] {
                  t.Fatalf("auditTrace() = %v, want %v", got, want)
              }
          }
        explanation: O argumento da primeira função adiada conserva before no momento do registro. A closure lê label somente durante o retorno e observa after; o trace também deixa explícito que a segunda inscrição executa primeiro.
      relation_refs:
        - kind: deepens_into
          concept_id: defer-execution-order
  - id: closure-capture-lifetime
    title: Tempo de vida do estado capturado por closure
    content:
      version: 1
      explanation: >
        Uma closure pode conservar um ambiente depois que a função que o criou retorna. Cada chamada à fábrica
        cria um ambiente próprio: duas closures derivadas separadamente podem mudar seus estados sem compartilhar
        a variável capturada. A captura não transforma automaticamente todos os dados externos em cópias; o
        contrato depende da variável e do momento em que ela é lida.
      example:
        context: placares de partidas
        code: |
          package example

          import "testing"

          func newScore(start int) func() int {
              score := start
              return func() int {
                  score++
                  return score
              }
          }

          func TestClosureCaptureLifetime(t *testing.T) {
              home := newScore(0)
              away := newScore(100)
              got := []int{home(), away(), home(), away()}
              want := []int{1, 101, 2, 102}
              for i := range want {
                  if got[i] != want[i] {
                      t.Fatalf("scores = %v, want %v", got, want)
                  }
              }
          }
        explanation: Os contadores continuam vivos depois de newScore retornar. As chamadas intercaladas mostram que home e away têm ambientes independentes, em vez de atualizar uma variável global compartilhada.
      relation_refs:
        - kind: relates_to
          concept_id: block-scope
        - kind: relates_to
          concept_id: named-return-values
  - id: method-value-binding
    title: Ligação de method value ao receiver
    content:
      version: 1
      explanation: Ao obter um method value, o receiver é ligado naquele momento. Para um receiver de valor, essa ligação guarda uma cópia; para um receiver de ponteiro, ela guarda a referência ao objeto e observa suas mudanças posteriores. Obter outro method value depois da mudança produz outra cópia para o receiver de valor.
      example:
        context: leituras de um painel
        code: |
          package example

          import "testing"

          type Panel struct {
              value int
          }

          func (p Panel) Reading() int { return p.value }

          func (p *Panel) Add(delta int) { p.value += delta }

          func TestMethodValueBinding(t *testing.T) {
              panel := Panel{value: 10}
              earlyReading := panel.Reading
              add := panel.Add
              panel.value = 20
              lateReading := panel.Reading

              if earlyReading() != 10 {
                  t.Fatalf("early value method = %d, want 10", earlyReading())
              }
              if lateReading() != 20 {
                  t.Fatalf("late value method = %d, want 20", lateReading())
              }
              add(5)
              if panel.value != 25 {
                  t.Fatalf("pointer method value = %d, want 25", panel.value)
              }
          }
        explanation: O method value de valor criado antes da alteração lê 10, enquanto o criado depois lê 20. O method value de ponteiro continua ligado ao painel original e a chamada add altera seu estado atual para 25.
      relation_refs:
        - kind: deepens_into
          concept_id: pointer-vs-value-receiver
  - id: package-import-export-boundary
    title: Fronteira de importação e exportação entre packages
    content:
      version: 1
      explanation: Um consumidor em outro package só pode referir nomes exportados pelo package produtor. Uma API pública mínima pode devolver uma interface pequena, mantendo o tipo concreto e seus campos não exportados dentro do produtor. O teste do consumidor deve depender do contrato que usa, não de detalhes internos que não lhe pertencem.
      example:
        context: cliente de um conversor de unidades
        code: |
          package example

          import (
              "os"
              "os/exec"
              "path/filepath"
              "testing"
          )

          func TestExternalConsumerUsesMinimalAPI(t *testing.T) {
              dir := t.TempDir()
              write := func(name, content string) {
                  t.Helper()
                  if err := os.WriteFile(filepath.Join(dir, name), []byte(content), 0600); err != nil {
                      t.Fatal(err)
                  }
              }
              write("go.mod", "module example.test\n\ngo 1.25.0\n")
          write("producer.go", `package producer

          type Formatter interface{ Label() string }

          type formatter struct{ unit string }

          func (f *formatter) Label() string {
              return f.unit
          }

          func NewFormatter(unit string) Formatter { return &formatter{unit: unit} }
          `)
              write("consumer_test.go", `package producer_test

          import (
              "testing"
              producer "example.test"
          )

          func TestConsumer(t *testing.T) {
              var formatter producer.Formatter = producer.NewFormatter("kilometers")
              if formatter.Label() != "kilometers" {
                  t.Fatal("unexpected unit")
              }
          }
          `)
              command := exec.Command("go", "test", "./...")
              command.Dir = dir
              command.Env = append(os.Environ(), "GOTOOLCHAIN=local", "GOFLAGS=-buildvcs=false")
              if output, err := command.CombinedOutput(); err != nil {
                  t.Fatalf("external consumer failed: %v\n%s", err, output)
              }
          }
        explanation: O mini-módulo materializa um produtor e um teste externo separado. O consumidor compila referindo apenas Formatter, NewFormatter e Label; formatter e unit permanecem nomes internos do produtor. O próprio exemplo roda o teste do módulo local, sem baixar dependências.
      relation_refs:
        - kind: relates_to
          concept_id: constructor-returns-interface
        - kind: relates_to
          concept_id: go-modules
