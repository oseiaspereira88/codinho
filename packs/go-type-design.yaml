schema_version: 1
id: go-type-design
version: 1.2.0
themes:
  - id: structs-and-pointers
    title: Structs e ponteiros
  - id: interfaces
    title: Interfaces
  - id: generics
    title: Generics
concepts:
  - id: struct-shallow-copy-aliasing
    title: Aliasing em cópia rasa de struct
    content:
      version: 1
      explanation: Copiar uma struct por valor copia o descritor de uma slice, não os elementos do backing array. O valor novo ganha identidade própria para campos escalares, mas alterações nos elementos compartilhados continuam visíveis. Faça uma cópia explícita dos elementos quando o contrato exigir independência.
      example:
        context: perfil com etiquetas
        code: |
          package example

          import "testing"

          type Profile struct { Name string; Tags []string }

          func clone(p Profile) Profile {
              tags := append([]string(nil), p.Tags...)
              p.Tags = tags
              return p
          }

          func TestClone(t *testing.T) {
              original := Profile{Name: "Ana", Tags: []string{"go"}}
              copy := clone(original)
              copy.Tags[0] = "rust"
              if original.Tags[0] != "go" { t.Fatal("shared tags") }
          }
        explanation: A nova slice recebe seus próprios elementos e não altera a lista original.
      relation_refs:
        - kind: relates_to
          concept_id: nil-safe-pointer-receiver
  - id: typed-nil-interface-trap
    title: Armadilha do nil tipado dentro de uma interface
    content:
      version: 1
      explanation: Uma interface só é nil quando tipo dinâmico e valor dinâmico estão ausentes. Atribuir um ponteiro nil a uma interface preenche o tipo dinâmico; a comparação com nil então resulta falsa. Verifique o ponteiro antes de encaixotá-lo ou defina claramente o comportamento do método para receptor nil.
      example:
        context: resultado opcional
        code: |
          package example

          import "testing"

          type Notice interface { Text() string }
          type notice struct{}
          func (*notice) Text() string { return "notice" }

          func optional(ok bool) Notice {
              if !ok { return nil }
              return (*notice)(nil)
          }

          func TestTypedNil(t *testing.T) {
              if optional(false) != nil { t.Fatal("expected true nil") }
              if optional(true) == nil { t.Fatal("typed nil was lost") }
          }
        explanation: O retorno falso é nil real; o retorno verdadeiro contém um ponteiro nil dentro de uma interface não nil.
      relation_refs:
        - kind: relates_to
          concept_id: nil-safe-pointer-receiver
  - id: nil-safe-pointer-receiver
    title: Receptor de ponteiro seguro para nil
    content:
      version: 1
      explanation: "Um método com receptor de ponteiro pode receber nil e decidir um resultado seguro antes de acessar campos. Isso pode ser útil para tipos opcionais, mas não transforma toda API em nil-safe: métodos devem documentar a decisão e evitar esconder estado inválido."
      example:
        context: nome de uma etiqueta opcional
        code: |
          package example

          import "testing"

          type Tag struct { Value string }
          func (t *Tag) Text() string {
              if t == nil { return "" }
              return t.Value
          }

          func TestNilReceiver(t *testing.T) {
              var absent *Tag
              if absent.Text() != "" { t.Fatal("nil receiver") }
              if (&Tag{Value: "go"}).Text() != "go" { t.Fatal("value") }
          }
        explanation: A guarda precede o acesso a Value e define o retorno para o receptor ausente.
      relation_refs:
        - kind: relates_to
          concept_id: typed-nil-interface-trap
  - id: generic-comparable-constraint
    title: Constraint comparable em funções genéricas
    content:
      version: 1
      explanation: A constraint comparable limita T aos tipos que podem usar == e !=. Isso permite implementar operações de pertencimento sem reflet ou conversões, mas exclui slices, maps e funções, que não são comparáveis. A constraint expressa uma necessidade real da operação.
      example:
        context: pertencimento em uma coleção
        code: |
          package example

          import "testing"

          func contains[T comparable](values []T, want T) bool {
              for _, value := range values { if value == want { return true } }
              return false
          }

          func TestContains(t *testing.T) {
              if !contains([]string{"go", "rust"}, "rust") { t.Fatal("missing") }
              if contains([]int{1, 2}, 3) { t.Fatal("unexpected") }
          }
        explanation: A mesma função compara strings e inteiros porque ambos satisfazem comparable.
      relation_refs:
        - kind: relates_to
          concept_id: generic-two-type-parameters
  - id: safe-type-assertion
    title: Type assertion segura com comma-ok
    content:
      version: 1
      explanation: "A forma value, ok := item.(T) informa se o valor dinâmico implementa ou é do tipo T sem panicar. A forma direta item.(T) é apropriada apenas quando a invariância já foi garantida e um panic é realmente o contrato. Trate o caminho falso antes de acessar o valor convertido."
      example:
        context: mensagens de eventos
        code: |
          package example

          import "testing"

          type Event interface{ event() }
          type Login struct{ User string }
          func (Login) event() {}

          func username(event Event) (string, bool) {
              login, ok := event.(Login)
              if !ok { return "", false }
              return login.User, true
          }

          func TestAssertion(t *testing.T) {
              name, ok := username(Login{User: "ana"})
              if !ok || name != "ana" { t.Fatal(name, ok) }
          }
        explanation: O comma-ok transforma um tipo inesperado em resultado controlável, sem panic.
      relation_refs:
        - kind: relates_to
          concept_id: typed-nil-interface-trap
  - id: generic-two-type-parameters
    title: Função genérica com dois parâmetros de tipo
    content:
      version: 1
      explanation: Uma função pode declarar parâmetros de tipo independentes e relacioná-los na assinatura. O compilador infere os tipos quando os argumentos tornam a relação inequívoca; explicitar os parâmetros pode ajudar em APIs ambíguas. Mantenha a transformação separada da política de ordenação ou validação.
      example:
        context: associação de chaves e valores
        code: |
          package example

          import "testing"

          func Pair[K comparable, V any](keys []K, values []V) map[K]V {
              out := make(map[K]V, len(keys))
              for i, key := range keys {
                  if i == len(values) { break }
                  out[key] = values[i]
              }
              return out
          }

          func TestPair(t *testing.T) {
              got := Pair([]string{"a", "b"}, []int{1, 2})
              if got["a"] != 1 || got["b"] != 2 { t.Fatal(got) }
          }
        explanation: K precisa ser comparável para chave de map; V pode ser qualquer tipo.
      relation_refs:
        - kind: relates_to
          concept_id: generic-comparable-constraint
  - id: struct-embedding-promotion
    title: Promoção de membros por embedding
    content:
      version: 1
      explanation: >
        Quando uma struct embute outra, os campos e métodos do tipo embutido
        podem ser usados por um selector da struct externa como membros
        promovidos. A promoção é uma conveniência de seleção, não herança: o
        tipo interno continua existindo e pode ser acessado explicitamente.
        Se dois tipos embutidos promovem o mesmo nome no mesmo nível, o
        selector direto fica ambíguo e o caminho explícito é necessário.
      example:
        context: ficha de manutenção de equipamento
        code: |
          package example

          import "testing"

          type Audit struct {
              UpdatedBy string
          }

          func (a Audit) Stamp() string {
              return "updated-by:" + a.UpdatedBy
          }

          type Equipment struct {
              Audit
              Serial string
          }

          type LocalName struct{ Name string }
          type RemoteName struct{ Name string }
          type Asset struct {
              LocalName
              RemoteName
          }

          func TestEmbeddingPromotion(t *testing.T) {
              equipment := Equipment{
                  Audit:  Audit{UpdatedBy: "ops"},
                  Serial: "EQ-7",
              }
              if equipment.UpdatedBy != "ops" || equipment.Stamp() != "updated-by:ops" {
                  t.Fatalf("promoted members = (%q, %q)", equipment.UpdatedBy, equipment.Stamp())
              }

              asset := Asset{
                  LocalName:  LocalName{Name: "local"},
                  RemoteName: RemoteName{Name: "remote"},
              }
              if asset.LocalName.Name == asset.RemoteName.Name {
                  t.Fatal("explicit paths should preserve distinct names")
              }
          }
        explanation: O campo UpdatedBy e o método Stamp podem ser selecionados diretamente em Equipment. Em Asset, os dois nomes Name entram em conflito no mesmo nível; os selectors explícitos deixam a intenção inequívoca.
      relation_refs:
        - kind: relates_to
          concept_id: struct-shallow-copy-aliasing
        - kind: deepens_into
          concept_id: structs
  - id: struct-tags-reflection
    title: Metadados de struct observáveis por reflexão
    content:
      version: 1
      explanation: >
        Uma struct tag é uma string de metadados associada à declaração de um
        campo. Pacotes como encoding/json e ferramentas de reflexão podem ler
        essa informação, mas a tag não muda o tipo, o nome Go ou o zero value
        do campo. Use Lookup quando a diferença entre uma tag ausente e uma
        tag presente com valor vazio fizer parte do contrato.
      example:
        context: ficha de empréstimo de biblioteca
        code: |
          package example

          import (
              "reflect"
              "testing"
          )

          type Loan struct {
              Code   string `json:"code" catalog:"identifier"`
              Closed bool   `json:"closed,omitempty"`
          }

          func TestStructTags(t *testing.T) {
              field, ok := reflect.TypeOf(Loan{}).FieldByName("Code")
              if !ok {
                  t.Fatal("Code field missing")
              }
              if got := field.Tag.Get("json"); got != "code" {
                  t.Fatalf("json tag = %q, want code", got)
              }
              if got := field.Tag.Get("catalog"); got != "identifier" {
                  t.Fatalf("catalog tag = %q, want identifier", got)
              }
              if _, ok := reflect.TypeOf(Loan{}).FieldByName("Missing"); ok {
                  t.Fatal("unexpected field found")
              }
          }
        explanation: A reflexão encontra a declaração de Code e lê cada namespace de tag separadamente. Os metadados orientam consumidores, mas não criam um campo Go chamado code nem alteram o tipo string.
      relation_refs:
        - kind: relates_to
          concept_id: structs
        - kind: relates_to
          concept_id: field-types
  - id: method-set-addressability
    title: Addressability e method sets
    content:
      version: 1
      explanation: >
        O compilador pode tomar o endereço implicitamente quando um método de
        ponteiro é chamado em uma variável endereçável. Isso não muda o method
        set do tipo de valor e não torna um elemento de map endereçável: uma
        chamada de método de ponteiro nesse elemento é rejeitada. Separe a
        conveniência sintática da chamada da satisfação de uma interface.
      example:
        context: calibração de medidores
        code: |
          package example

          import (
              "go/ast"
              "go/parser"
              "go/token"
              "go/types"
              "testing"
          )

          type Meter struct {
              value int
          }

          func (m *Meter) Calibrate(delta int) {
              m.value += delta
          }

          func TestAddressabilityAndMethodSet(t *testing.T) {
              meter := Meter{}
              meter.Calibrate(2)
              if meter.value != 2 {
                  t.Fatalf("addressable value = %d, want 2", meter.value)
              }

              source := `package sample

          type Meter struct{}

          func (*Meter) Calibrate() {}

          func use() {
              meters := map[string]Meter{"primary": {}}
              meters["primary"].Calibrate()
          }`
              fileSet := token.NewFileSet()
              file, err := parser.ParseFile(fileSet, "sample.go", source, 0)
              if err != nil {
                  t.Fatal(err)
              }
              _, checkErr := (&types.Config{}).Check("sample", fileSet, []*ast.File{file}, nil)
              if checkErr == nil {
                  t.Fatal("map element unexpectedly accepted a pointer method call")
              }
          }
        explanation: A variável meter é endereçável, então a chamada de Calibrate pode obter seu endereço automaticamente. O trecho analisado por go/types usa um elemento de map, que não pode ser endereçado para formar a mesma chamada e por isso falha na compilação.
      relation_refs:
        - kind: deepens_into
          concept_id: pointer-vs-value-receiver
        - kind: relates_to
          concept_id: nil-safe-pointer-receiver
  - id: compile-time-interface-satisfaction
    title: Satisfação de interface verificada em compilação
    content:
      version: 1
      explanation: >
        Uma atribuição ou declaração var _ Interface = Implementation{}
        transforma a satisfação de uma interface em uma decisão verificada
        pelo compilador. A falha aparece antes de qualquer type assertion ou
        valor em runtime, o que torna mudanças no contrato detectáveis perto
        da implementação. O valor concreto ainda pode ser usado por uma API
        que recebe a interface depois da verificação.
      example:
        context: formato de recibos
        code: |
          package example

          import (
              "go/ast"
              "go/parser"
              "go/token"
              "go/types"
              "testing"
          )

          type Formatter interface {
              Format() string
          }

          type Receipt struct {
              Number string
          }

          func (r Receipt) Format() string {
              return "receipt:" + r.Number
          }

          var _ Formatter = Receipt{}

          func render(formatter Formatter) string {
              return formatter.Format()
          }

          func TestCompileTimeSatisfaction(t *testing.T) {
              if got := render(Receipt{Number: "42"}); got != "receipt:42" {
                  t.Fatalf("rendered receipt = %q", got)
              }

              source := `package sample

          type Formatter interface { Format() string }
          type Broken struct{}
          var _ Formatter = Broken{}
          `
              fileSet := token.NewFileSet()
              file, err := parser.ParseFile(fileSet, "sample.go", source, 0)
              if err != nil {
                  t.Fatal(err)
              }
              _, checkErr := (&types.Config{}).Check("sample", fileSet, []*ast.File{file}, nil)
              if checkErr == nil {
                  t.Fatal("a type without Format unexpectedly satisfied Formatter")
              }
          }
        explanation: Receipt satisfaz Formatter por sua declaração de Format e a linha var _ mantém essa garantia no código compilável. O segundo trecho é analisado separadamente por go/types; Broken não possui o método exigido e falha antes de qualquer execução.
      relation_refs:
        - kind: contrasts_with
          concept_id: safe-type-assertion
        - kind: relates_to
          concept_id: typed-nil-interface-trap
  - id: interface-composition-consumer
    title: Composição de interface pelo consumidor
    content:
      version: 1
      explanation: >
        O consumidor deve declarar a menor interface que sua operação precisa,
        mesmo quando o produtor oferece métodos adicionais. Interfaces também
        podem ser compostas por embedding quando um contrato maior realmente
        exige os contratos menores. Um fake que implementa só a interface do
        consumidor torna esse limite explícito e mantém o teste independente
        do tipo concreto do produtor.
      example:
        context: renderização de avisos de viagem
        code: |
          package example

          import "testing"

          type Labeler interface {
              Label() string
          }

          type DetailedNotice struct {
              text string
              id   string
          }

          func (n DetailedNotice) Label() string { return n.text }
          func (n DetailedNotice) ID() string    { return n.id }

          type fakeLabeler struct{ text string }

          func (f fakeLabeler) Label() string { return f.text }

          func renderNotice(labeler Labeler) string {
              return "notice:" + labeler.Label()
          }

          func TestConsumerInterface(t *testing.T) {
              producer := DetailedNotice{text: "platform 2", id: "N-7"}
              fake := fakeLabeler{text: "test notice"}
              if got := renderNotice(producer); got != "notice:platform 2" {
                  t.Fatalf("producer = %q", got)
              }
              if got := renderNotice(fake); got != "notice:test notice" {
                  t.Fatalf("fake = %q", got)
              }
          }
        explanation: renderNotice depende apenas de Labeler. O produtor tem também ID, mas o fake mínimo, com um único método, prova que o consumidor não exige o restante da API concreta.
      relation_refs:
        - kind: deepens_into
          concept_id: constructor-returns-interface
        - kind: relates_to
          concept_id: safe-type-assertion
  - id: generic-underlying-type-constraint
    title: Constraint baseada no tipo subjacente
    content:
      version: 1
      explanation: >
        O til em uma constraint, como ~int, permite tipos definidos cujo tipo
        subjacente é int, sem aceitar tipos arbitrários. A operação genérica
        pode usar as operações válidas para o conjunto restrito, enquanto uma
        instanciação com string deve ser rejeitada pelo compilador. ~ não torna
        tipos nomeados idênticos: a identidade do tipo e suas conversões
        continuam preservadas.
      example:
        context: pontuação de partidas
        code: |
          package example

          import (
              "go/ast"
              "go/parser"
              "go/token"
              "go/types"
              "testing"
          )

          type Score int

          func next[T ~int](value T) T {
              return value + 1
          }

          func TestUnderlyingTypeConstraint(t *testing.T) {
              if got := next(Score(7)); got != Score(8) {
                  t.Fatalf("next score = %v, want 8", got)
              }
              if got := next(3); got != 4 {
                  t.Fatalf("next int = %v, want 4", got)
              }

              source := `package sample

          type Label string

          func next[T ~int](value T) T { return value }

          var _ = next(Label("final"))
          `
              fileSet := token.NewFileSet()
              file, err := parser.ParseFile(fileSet, "sample.go", source, 0)
              if err != nil {
                  t.Fatal(err)
              }
              _, checkErr := (&types.Config{}).Check("sample", fileSet, []*ast.File{file}, nil)
              if checkErr == nil {
                  t.Fatal("string-based type unexpectedly satisfied ~int")
              }
          }
        explanation: Score é um tipo definido, mas seu tipo subjacente int permite a instanciação de next. Label tem subjacente string; a chamada inválida é verificada por go/types e não chega ao runtime.
      relation_refs:
        - kind: deepens_into
          concept_id: generic-comparable-constraint
        - kind: relates_to
          concept_id: generic-two-type-parameters
competencies:
  - id: clone-struct-with-independent-slice
    title: Clonar uma struct com slice de forma independente
  - id: return-true-nil-interface
    title: Retornar um nil de interface verdadeiro
  - id: handle-nil-receiver-safely
    title: Tratar um receptor nil com segurança
  - id: implement-generic-membership-check
    title: Implementar uma checagem de pertencimento genérica
  - id: assert-type-without-panicking
    title: Verificar um tipo concreto sem panicar
  - id: implement-generic-transform
    title: Implementar uma transformação genérica
tracks: []
challenges:
  - schema_version: 1
    id: go-type-design.clone-inventory-independently
    version: 1.0.0
    title: Clonar um inventário sem compartilhar a lista de itens
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [structs-and-pointers]
    competencies:
      primary: [clone-struct-with-independent-slice]
      secondary: []
    prerequisites: []
    brief: >
      Um inventário precisa ser duplicado para uma operação independente,
      mantendo o proprietário e a ordem dos itens mesmo quando a lista
      original reservou espaço extra.
    constraints:
      - Não usar bibliotecas externas.
      - Items do clone não pode compartilhar backing array com Items do original.
    acceptance:
      - CloneInventory(inv) retorna uma Inventory com o mesmo Owner e os mesmos Items, na mesma ordem.
      - Mutar Items do clone nunca altera Items do original, mesmo quando o original tem capacidade excedente.
      - O isolamento vale mesmo quando Items do original está vazio mas tem capacidade excedente (make com comprimento 0 e capacidade maior que 0).
      - CloneInventory preserva o Source promovido do metadado embutido de Inventory.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.inspect-embedded-inventory
            kind: macro
            title: Identificar composição e membros promovidos
            instruction:
              objective: Distinguir a cópia dos campos de Inventory da seleção de membros que poderiam ser promovidos por embedding.
              scope: A declaração composta e a construção do valor retornado.
            concepts: [struct-embedding-promotion, struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: composition-and-copy-are-separated
                kind: qualitative
            children:
              - id: model.observe-embedded-inventory-members
                kind: meso
                title: Observar seleção de membros da struct
                instruction:
                  objective: Relacionar a forma da struct ao modo como seus campos são acessados durante a cópia.
                  scope: Campos declarados, campos promovidos e armazenamento referenciado por Items.
                concepts: [struct-embedding-promotion, struct-shallow-copy-aliasing]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: promoted-members-and-shared-storage-distinguished
                    kind: qualitative
                children:
                  - id: model.verify-embedded-member-selection
                    kind: micro
                    action: analyze
                    target: struct_layout
                    title: Verificar a seleção de membros promovidos
                    instruction:
                      objective: Identifique quais selectors acessariam um membro promovido e quais campos de Items ainda exigem isolamento explícito.
                      scope: A relação entre composição de structs e a slice Items, sem alterar CloneInventory.
                      constraints:
                        - Não tratar um membro promovido como herança nem concluir que a cópia de uma slice copia seus elementos.
                    concepts: [struct-embedding-promotion]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: promoted-member-selection-is-explained
                        kind: qualitative
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que promover um campo muda a forma de selecioná-lo, mas não transforma o armazenamento de uma slice em uma cópia profunda?
          - id: model.inspect-inventory-field-metadata
            kind: macro
            title: Inspecionar metadados dos campos do inventário
            instruction:
              objective: Separar a identidade dos campos de Inventory dos metadados que consumidores de reflexão podem ler.
              scope: Declaração dos campos Owner e Items e o contrato de cópia.
            concepts: [struct-tags-reflection, struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: field-metadata-is-separated-from-copy
                kind: qualitative
            children:
              - id: model.observe-inventory-field-metadata
                kind: meso
                title: Relacionar campos e metadados
                instruction:
                  objective: Observar como tags de struct seriam lidas sem confundi-las com nomes ou tipos de campos.
                  scope: Metadados associados à declaração de Inventory.
                concepts: [struct-tags-reflection]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: field-tags-and-types-are-distinguished
                    kind: qualitative
          - id: model.copy-items-into-independent-slice
            kind: micro
            action: implement
            target: function
            title: Copiar Items para uma slice independente
            instruction:
              objective: Construir a slice Items do clone de forma que ela nunca compartilhe o backing array de inv.Items.
              scope: A construção do campo Items do valor retornado.
              constraints:
                - Items do clone não pode compartilhar backing array com Items do original.
            concepts: [struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection, test]
            criteria:
              - id: items-copied-independently
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.copy-remaining-fields
            kind: micro
            action: implement
            target: function
            title: Copiar os demais campos da struct
            instruction:
              objective: Preservar Owner no valor retornado.
              scope: O campo escalar de Inventory que acompanha a nova lista de Items.
              constraints:
                - Owner deve ser copiado com o mesmo valor de inv.Owner.
            concepts: [struct-shallow-copy-aliasing]
            evidence:
              strategies: [source_inspection, test]
            criteria:
              - id: copies-remaining-fields
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
