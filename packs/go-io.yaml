  fixture:
  - path: go.mod
    content: |
      module codinho-practice/io

      go 1.25.0
  - path: config.go
    content: "package config\n\nimport \"io\"\n\ntype Config struct {\n\tName    string `json:\"name\"\
      `\n\tRetries int    `json:\"retries\"`\n}\n\nfunc Decode(r io.Reader) (Config, error) { return Config{},\
      \ nil }\n"
  - path: config_test.go
    content: "package config\n\nimport (\n\t\"errors\"\n\t\"io\"\n\t\"strings\"\n\t\"testing\"\n)\n\n\
      type failedReader struct{ err error }\n\nfunc (r failedReader) Read([]byte) (int, error) { return\
      \ 0, r.err }\n\ntype tinyReader struct{ r io.Reader }\n\nfunc (r tinyReader) Read(p []byte) (int,\
      \ error) {\n\tif len(p) > 1 {\n\t\tp = p[:1]\n\t}\n\treturn r.r.Read(p)\n}\nfunc TestDecode(t *testing.T)\
      \ {\n\tfor _, input := range []string{`{\"name\":\"sensor\",\"retries\":0}`, `{\"name\":\"sensor\"\
      ,\"retries\":5}   `} {\n\t\tgot, err := Decode(tinyReader{strings.NewReader(input)})\n\t\tif err\
      \ != nil || got.Name != \"sensor\" || (strings.Contains(input, \":5\") && got.Retries != 5) || (strings.Contains(input,\
      \ \":0\") && got.Retries != 0) {\n\t\t\tt.Fatalf(\"valid input: %+v %v\", got, err)\n\t\t}\n\t}\n\
      \tfor _, input := range []string{\"\", `null`, `[]`, `{`, `{\"name\":\"\",\"retries\":0}`, `{\"\
      name\":\"  \",\"retries\":0}`, `{\"name\":\"sensor\",\"retries\":-1}`, `{\"name\":\"sensor\",\"\
      retries\":6}`, `{\"name\":\"sensor\",\"retry\":1}`, `{\"name\":\"sensor\",\"retries\":1.5}`, `{\"\
      name\":\"sensor\"} {}`, `{\"name\":\"sensor\"} garbage`} {\n\t\tt.Run(input, func(t *testing.T)\
      \ {\n\t\t\tif _, err := Decode(strings.NewReader(input)); err == nil {\n\t\t\t\tt.Fatal(\"invalid\
      \ input accepted\")\n\t\t\t}\n\t\t})\n\t}\n\twant := errors.New(\"synthetic read failure\")\n\t\
      if _, err := Decode(failedReader{want}); !errors.Is(err, want) {\n\t\tt.Fatalf(\"lost source error:\
      \ %v\", err)\n\t}\n\tif _, err := Decode(io.MultiReader(strings.NewReader(`{\"name\":\"sensor\"\
      }`), failedReader{want})); !errors.Is(err, want) {\n\t\tt.Fatalf(\"lost trailing source error: %v\"\
      , err)\n\t}\n}\n"
  checks:
  - id: focused-tests
    runner: go_test
    package: ./...
    test_pattern: ^TestDecode$
    timeout: 20s
  variants: []
  validation:
    reference_fixture:
    - path: go.mod
      content: |
        module codinho-practice/io

        go 1.25.0
    - path: config.go
      content: "package config\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"io\"\n\t\"strings\"\n\
        )\n\ntype Config struct {\n\tName    string `json:\"name\"`\n\tRetries int    `json:\"retries\"\
        `\n}\n\nfunc Decode(r io.Reader) (Config, error) {\n\tvar cfg Config\n\tdecoder := json.NewDecoder(r)\n\
        \tdecoder.DisallowUnknownFields()\n\tif err := decoder.Decode(&cfg); err != nil {\n\t\treturn\
        \ Config{}, fmt.Errorf(\"decode config: %w\", err)\n\t}\n\tvar extra any\n\tif err := decoder.Decode(&extra);\
        \ err != io.EOF {\n\t\tif err == nil {\n\t\t\treturn Config{}, fmt.Errorf(\"unexpected trailing\
        \ JSON value\")\n\t\t}\n\t\treturn Config{}, fmt.Errorf(\"trailing input: %w\", err)\n\t}\n\t\
        if strings.TrimSpace(cfg.Name) == \"\" || cfg.Retries < 0 || cfg.Retries > 5 {\n\t\treturn Config{},\
        \ fmt.Errorf(\"invalid name or retries\")\n\t}\n\treturn cfg, nil\n}\n"
    - path: config_test.go
      content: "package config\n\nimport (\n\t\"errors\"\n\t\"io\"\n\t\"strings\"\n\t\"testing\"\n)\n\n\
        type failedReader struct{ err error }\n\nfunc (r failedReader) Read([]byte) (int, error) { return\
        \ 0, r.err }\n\ntype tinyReader struct{ r io.Reader }\n\nfunc (r tinyReader) Read(p []byte) (int,\
        \ error) {\n\tif len(p) > 1 {\n\t\tp = p[:1]\n\t}\n\treturn r.r.Read(p)\n}\nfunc TestDecode(t\
        \ *testing.T) {\n\tfor _, input := range []string{`{\"name\":\"sensor\",\"retries\":0}`, `{\"\
        name\":\"sensor\",\"retries\":5}   `} {\n\t\tgot, err := Decode(tinyReader{strings.NewReader(input)})\n\
