  - schema_version: 1
    id: go-first-steps.clamp-int-to-byte
    version: 1.0.0
    title: Converter int para byte sem wraparound silencioso
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [convert-numeric-types-safely]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma conversão de int para byte que nunca sofre wraparound
      silencioso para valores fora do intervalo representável.
    constraints:
      - Não usar bibliotecas externas.
      - Não deixar valores fora do intervalo estourarem silenciosamente.
    acceptance:
      - ClampToByte(-10) retorna 0.
      - ClampToByte(300) retorna 255.
      - ClampToByte(120) retorna 120.
      - ClampToByte(0) retorna 0.
      - ClampToByte(255) retorna 255.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-clamp-signature
            kind: micro
            action: declare
            target: function
            title: Declarar a assinatura de ClampToByte
            instruction:
              objective: Declarar a função ClampToByte com um parâmetro int e retorno byte, sem implementar o corpo ainda.
              scope: Somente a assinatura da função.
              constraints:
                - Não implementar a lógica de conversão ainda.
            concepts: [type-conversion]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: signature-matches
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.clamp-int-to-valid-byte-range
            kind: micro
            action: implement
            target: function
            title: Ajustar o valor de entrada para o intervalo válido de um byte
            instruction:
              objective: Garantir que o valor de entrada seja ajustado para dentro do intervalo válido de um byte antes de qualquer conversão, sem alterar valores que já estejam dentro do intervalo.
              scope: Somente a lógica de ajuste, antes da conversão de tipo.
              constraints:
                - Não realizar a conversão de tipo neste passo.
                - Não usar bibliotecas externas.
            concepts: [narrowing-conversion-overflow]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: clamp-precedes-conversion
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
          - id: model.convert-clamped-value-to-byte
            kind: micro
            action: implement
            target: function
            title: Converter o valor já ajustado para byte
            instruction:
              objective: Converter o valor já ajustado ao intervalo válido para o tipo byte e retorná-lo.
              scope: Somente a conversão de tipo final e o retorno.
              constraints:
                - Não deixar a conversão de tipo fazer o ajuste sozinha.
            concepts: [type-conversion]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: clamps-below-range
                kind: structural
              - id: clamps-above-range
                kind: structural
              - id: preserves-in-range-values
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
            reflection:
              optional:
                - O que aconteceria com o resultado se a conversão para byte fosse feita antes do ajuste, e não depois?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/clamp-int-to-byte

          go 1.25.0
      - path: clamp.go
        content: |
          package clamp

          // ClampToByte converts n to a byte, clamping to the valid byte
          // range instead of allowing it to wrap around silently.
          func ClampToByte(n int) byte {
              panic("not implemented")
          }
      - path: clamp_test.go
        content: |
          package clamp

          import "testing"

          func TestClampToByte(t *testing.T) {
              cases := []struct {
                  name string
                  in   int
                  want byte
              }{
                  {"below range", -10, 0},
                  {"above range", 300, 255},
                  {"within range", 120, 120},
                  {"lower bound", 0, 0},
                  {"upper bound", 255, 255},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := ClampToByte(c.in)
                      if got != c.want {
                          t.Errorf("ClampToByte(%d) = %d, want %d", c.in, got, c.want)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestClampToByte$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/clamp-int-to-byte

          go 1.25.0
      - path: clamp.go
        content: |
          package clamp

          // ClampToByte converts n to a byte, clamping to the valid byte
          // range instead of allowing it to wrap around silently.
          func ClampToByte(n int) byte {
              if n < 0 {
                  return 0
              }
              if n > 255 {
                  return 255
              }
              return byte(n)
          }
      - path: clamp_test.go
        content: |
          package clamp

          import "testing"

          func TestClampToByte(t *testing.T) {
              cases := []struct {
                  name string
                  in   int
                  want byte
              }{
                  {"below range", -10, 0},
                  {"above range", 300, 255},
                  {"within range", 120, 120},
                  {"lower bound", 0, 0},
                  {"upper bound", 255, 255},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := ClampToByte(c.in)
                      if got != c.want {
                          t.Errorf("ClampToByte(%d) = %d, want %d", c.in, got, c.want)
                      }
                  })
              }
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-first-steps.format-rate-limit-message
    version: 1.0.0
    title: Formatar uma mensagem com os verbos corretos
    kind: atomic
    difficulty: foundational
    estimated_minutes: 10
    themes: [tooling]
    competencies:
      primary: [catch-format-verb-mismatches-with-vet]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que formata uma mensagem de limite de taxa
      combinando um nome de recurso e um número de tentativas, sem
      introduzir um verbo de formatação incompatível com o tipo do
      argumento.
    constraints:
      - Não usar bibliotecas externas.
      - Deve usar fmt.Sprintf para montar a mensagem.
      - Cada verbo de formatação deve corresponder ao tipo do argumento correspondente.
    acceptance:
      - RateLimitMessage("checkout", 3) retorna "checkout exceeded rate limit after 3 attempts".
      - go vet não aponta nenhum problema de formatação no pacote.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.implement-ratelimit-formatting
            kind: micro
            action: implement
            target: function
            title: Implementar a formatação da mensagem
            instruction:
              objective: Implementar o corpo de RateLimitMessage combinando os dois parâmetros em uma única mensagem com fmt.Sprintf, com cada verbo de formatação correspondendo ao tipo do argumento.
              scope: O corpo da função e os imports necessários.
              constraints:
                - Não usar bibliotecas externas.
                - Deve usar fmt.Sprintf para montar a mensagem.
            concepts: [printf-verb-matching]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: uses-sprintf
                kind: structural
              - id: message-format-correct
                kind: structural
              - id: verb-types-match
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - O que go vet reportaria se você usasse %s para o número de tentativas?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/format-rate-limit-message

          go 1.25.0
      - path: ratelimit.go
        content: |
          package ratelimit

          // RateLimitMessage formats a rate-limit notice for resource,
          // after the given number of attempts.
          func RateLimitMessage(resource string, attempts int) string {
              panic("not implemented")
          }
      - path: ratelimit_test.go
        content: |
          package ratelimit

          import "testing"

          func TestRateLimitMessage(t *testing.T) {
              got := RateLimitMessage("checkout", 3)
              want := "checkout exceeded rate limit after 3 attempts"
              if got != want {
                  t.Errorf("RateLimitMessage(...) = %q, want %q", got, want)
              }
          }
    checks:
      - id: message-content
        runner: go_test
        package: ./...
        test_pattern: ^TestRateLimitMessage$
        timeout: 20s
      - id: format-safety
