            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Que erro um teste apenas com datas distantes deixaria passar?
        - id: testable-expiry.step-2
          kind: micro
          action: implement
          target: function
          title: Trate a ausência de relógio.
          instruction:
            objective: Trate a ausência de relógio.
            scope: O retorno deve preservar a sentinela prevista na fixture, sem executar uma função nil.
          concepts:
          - testing-clock-injection
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: behavior-2
            kind: qualitative
          completion:
