challenges:
  - schema_version: 1
    id: go-database.parameterize-query-and-null
    version: 1.0.0
    title: Parametrizar query e modelar null
    kind: atomic
    difficulty: foundational
    estimated_minutes: 25
    themes: [go-database.sql-model]
    competencies:
      primary: [go-database.bind-query-parameters]
      secondary: [go-database.model-nullable-data]
    prerequisites: []
    brief: Uma consulta recebe texto externo e devolve um campo que pode ser nulo sem interpolar entrada na instrução SQL.
    constraints:
      - Use os argumentos da API database/sql para valores externos.
      - Diferencie NULL do banco de uma string vazia no modelo Go.
    acceptance:
      - A instrução permanece constante para entradas com aspas ou sintaxe SQL.
      - O valor nulo é representado explicitamente no resultado.
      - A consulta não transforma entrada em código SQL.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: parameterize-query
        macro_steps:
          - id: parameterize-query.plan
            kind: macro
            title: Separar código e dados
            children:
              - id: parameterize-query.boundary
                kind: meso
                title: Definir a fronteira SQL
                children:
                  - id: parameterize-query.inspect
                    kind: micro
                    action: inspect
                    target: query-boundary
                    title: Identificar entrada externa
                    instruction:
                      objective: Localize cada valor que chega de fora da consulta.
                      scope: O contrato entre aplicação e database/sql.
                    concepts: [go-database.database-sql-contract]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: external-values-are-listed, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: parameterize-query.bind
                    kind: micro
                    action: implement
                    target: query-arguments
                    title: Vincular argumentos
                    instruction:
                      objective: Passe os valores como argumentos da operação SQL.
                      scope: A chamada QueryContext ou ExecContext.
                    concepts: [go-database.parameterized-query]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: query-uses-arguments, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: parameterize-query.null
                    kind: micro
                    action: implement
                    target: nullable-field
                    title: Representar NULL
                    instruction:
                      objective: Escolha um tipo que preserve a diferença entre NULL e valor vazio.
                      scope: O scan da coluna opcional.
                    concepts: [go-database.sql-nullability]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: null-is-not-empty, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: parameterize-query.verify
                    kind: micro
                    action: verify
                    target: injection-negative
                    title: Verificar entrada hostil
                    instruction:
                      objective: Verifique que aspas e marcadores SQL continuam sendo dados.
                      scope: O caso negativo da consulta.
                    concepts: [go-database.parameterized-query, go-database.sql-nullability]
                    evidence: {strategies: [source_inspection, test]}
                    criteria: [{id: hostile-input-stays-data, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: parameterize-query.reflect
                    kind: micro
                    action: reflect
                    target: data-code-separation
                    title: Explicar a fronteira
                    instruction:
                      objective: Explique por que parametrização e nullability resolvem riscos diferentes.
                      scope: Segurança da query e fidelidade do modelo.
                    concepts: [go-database.parameterized-query, go-database.sql-nullability]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-data-code-separation, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Que informação seria perdida se NULL fosse convertido silenciosamente em string vazia?']}
  - schema_version: 1
    id: go-database.bound-query-to-context
    version: 1.0.0
    title: Vincular query ao contexto
    kind: atomic
    difficulty: foundational
    estimated_minutes: 25
    themes: [go-database.sql-model]
    competencies:
      primary: [go-database.cancel-database-work]
      secondary: [go-database.configure-pool]
    prerequisites: [go-database.parameterize-query-and-null]
    brief: Uma consulta lenta não pode ignorar o cancelamento que o chamador já propagou.
    constraints:
      - O contexto deve chegar à operação que pode bloquear.
      - Não use goroutine extra para mascarar uma chamada sem cancelamento.
    acceptance:
      - Cancelar o contexto torna a operação observavelmente interrompível.
      - O erro de cancelamento é devolvido ao chamador.
      - O código não cria um contexto de fundo no meio da requisição.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: bound-query-context
        macro_steps:
          - id: bound-query-context.plan
            kind: macro
            title: Propagar cancelamento até o banco
            children:
              - id: bound-query-context.path
                kind: meso
                title: Mapear o caminho bloqueante
                children:
                  - id: bound-query-context.receive
                    kind: micro
                    action: inspect
                    target: caller-context
                    title: Encontrar o contexto recebido
                    instruction:
                      objective: Identifique o contexto que representa o orçamento do chamador.
                      scope: A assinatura da função de persistência.
                    concepts: [go-database.query-context]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: caller-context-is-preserved, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: bound-query-context.call
                    kind: micro
                    action: implement
                    target: query-context
                    title: Usar QueryContext
                    instruction:
                      objective: Escolha a operação database/sql que recebe o contexto.
                      scope: A consulta ou comando que pode esperar por I/O.
                    concepts: [go-database.query-context, go-database.database-sql-contract]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: blocking-call-accepts-context, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: bound-query-context.pool
                    kind: micro
                    action: verify
                    target: pool-wait
                    title: Considerar espera por conexão
                    instruction:
                      objective: Descreva como o contexto também limita a espera por uma conexão do pool.
                      scope: Limites antes da execução SQL.
                    concepts: [go-database.query-context, go-database.pool-limits]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: pool-wait-has-budget, kind: reasoning}]
                    completion: {requires_positive_evaluation: false}
                  - id: bound-query-context.error
                    kind: micro
                    action: verify
                    target: cancellation-error
                    title: Preservar erro de cancelamento
                    instruction:
                      objective: Verifique que o erro devolvido mantém a causa observável do cancelamento.
                      scope: O retorno da camada de persistência.
                    concepts: [go-database.query-context]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: cancellation-error-is-returned, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: bound-query-context.reflect
                    kind: micro
                    action: reflect
                    target: context-boundary
                    title: Explicar o orçamento
                    instruction:
                      objective: Explique por que goroutine e timeout local não substituem contexto propagado.
                      scope: Ownership do cancelamento e espera por recursos.
                    concepts: [go-database.query-context, go-database.pool-limits]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-context-budget, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Em que ponto o cancelamento deixaria de ser observável se a camada criasse context.Background?']}
  - schema_version: 1
    id: go-database.transaction-with-isolation
    version: 1.0.0
    title: Compor transação com isolamento
    kind: combined
    difficulty: intermediate
    estimated_minutes: 40
    themes: [go-database.transactions-pool]
    competencies:
      primary: [go-database.commit-or-rollback-transaction]
      secondary: [go-database.model-nullable-data]
    prerequisites: [go-database.bound-query-to-context]
    brief: Duas escritas relacionadas precisam compartilhar uma fronteira transacional e deixar explícita a política de isolamento.
    constraints:
      - Toda saída antecipada deve reverter a transação ainda aberta.
      - A escolha de isolamento deve ser justificada pelo conflito que se quer evitar.
    acceptance:
      - Falha em qualquer escrita não deixa commit parcial.
      - Sucesso comita uma vez depois das operações necessárias.
      - O nível de isolamento não aparece como detalhe sem relação com a invariável.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: transaction-isolation
        macro_steps:
          - id: transaction-isolation.plan
            kind: macro
            title: Definir a fronteira da transação
            children:
              - id: transaction-isolation.boundary
                kind: meso
                title: Encadear operações relacionadas
                children:
                  - id: transaction-isolation.begin
                    kind: micro
                    action: implement
                    target: transaction
                    title: Iniciar com contexto
                    instruction:
                      objective: Inicie uma transação usando o contexto do chamador e as opções necessárias.
                      scope: A entrada da operação composta.
                    concepts: [go-database.transaction-boundary, go-database.query-context]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: transaction-has-caller-context, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: transaction-isolation.write
                    kind: micro
                    action: implement
                    target: related-writes
                    title: Executar escritas relacionadas
                    instruction:
                      objective: Execute as operações que precisam observar a mesma fronteira transacional.
                      scope: A sequência de comandos dentro da transação.
                    concepts: [go-database.transaction-boundary, go-database.isolation-level]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: related-writes-share-transaction, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: transaction-isolation.rollback
                    kind: micro
                    action: implement
                    target: rollback
                    title: Reverter falhas
                    instruction:
                      objective: Garanta rollback em cada caminho de erro antes de retornar.
                      scope: Falha da primeira ou da segunda escrita.
                    concepts: [go-database.rollback-semantics]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: every-error-rolls-back, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: transaction-isolation.commit
                    kind: micro
                    action: verify
                    target: commit
                    title: Comitar no final
                    instruction:
                      objective: Verifique que commit ocorre somente depois da última operação bem-sucedida.
                      scope: O caminho de sucesso.
                    concepts: [go-database.transaction-boundary, go-database.rollback-semantics]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: commit-is-last, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: transaction-isolation.reflect
                    kind: micro
                    action: reflect
                    target: isolation-policy
                    title: Explicar isolamento
                    instruction:
                      objective: Explique qual conflito a política de isolamento pretende controlar.
                      scope: Leitura, escrita e invariável de negócio.
                    concepts: [go-database.isolation-level, go-database.rollback-semantics]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-isolation-choice, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Que invariável seria quebrada se a segunda escrita ocorresse fora da transação?']}
  - schema_version: 1
    id: go-database.pool-and-migration-lifecycle
    version: 1.0.0
    title: Configurar pool e lifecycle de migration
    kind: combined
    difficulty: intermediate
    estimated_minutes: 40
    themes: [go-database.transactions-pool, go-database.persistence-lifecycle]
    competencies:
      primary: [go-database.configure-pool, go-database.apply-migrations-safely]
      secondary: [go-database.commit-or-rollback-transaction]
    prerequisites: [go-database.transaction-with-isolation]
    brief: Um serviço precisa abrir o pool, aplicar migrations ordenadas e fechá-lo sem esconder vazamentos de recursos.
    constraints:
      - Migrations devem ser idempotentes ou ter uma política explícita de versão.
      - O pool deve ser configurado por orçamento de conexão observável.
    acceptance:
      - A ordem de migrations é estável e falha cedo quando uma etapa falha.
      - Os limites do pool refletem o orçamento do processo.
      - O fechamento do pool ocorre no lifecycle do serviço.
    canonical: true
    publication: {status: draft, author: codex}
    layers:
      - id: pool-migration
        macro_steps:
          - id: pool-migration.plan
            kind: macro
            title: Orquestrar recursos de persistência
            children:
              - id: pool-migration.startup
                kind: meso
                title: Abrir e preparar o pool
                children:
                  - id: pool-migration.open
                    kind: micro
                    action: implement
                    target: database-open
                    title: Abrir database
                    instruction:
                      objective: Abra o handle database/sql sem confundir abertura lógica com conexão pronta.
                      scope: Inicialização do serviço.
                    concepts: [go-database.database-sql-contract]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: database-handle-is-opened, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: pool-migration.limits
                    kind: micro
                    action: implement
                    target: pool-config
                    title: Configurar limites
                    instruction:
                      objective: Defina limites de conexões coerentes com a capacidade do serviço.
                      scope: MaxOpenConns, MaxIdleConns e lifetime.
                    concepts: [go-database.pool-limits]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: pool-budget-is-explicit, kind: structural}]
                    completion: {requires_positive_evaluation: false}
                  - id: pool-migration.order
                    kind: micro
                    action: implement
                    target: migrations
                    title: Ordenar migrations
                    instruction:
                      objective: Aplique migrations em ordem determinística e registre cada fronteira.
                      scope: Startup sem banco remoto obrigatório.
                    concepts: [go-database.migration-order, go-database.transaction-boundary]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: migrations-have-stable-order, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: pool-migration.close
                    kind: micro
                    action: verify
                    target: pool-close
                    title: Fechar no shutdown
                    instruction:
                      objective: Verifique que o handle é fechado depois que o trabalho dependente terminou.
                      scope: O caminho normal e o caminho de erro do serviço.
                    concepts: [go-database.graceful-persistence-shutdown, go-database.pool-limits]
                    evidence: {strategies: [source_inspection, compile]}
                    criteria: [{id: pool-closes-on-lifecycle-end, kind: behavioral}]
                    completion: {requires_positive_evaluation: false}
                  - id: pool-migration.reflect
                    kind: micro
                    action: reflect
                    target: pool-policy
                    title: Explicar o orçamento
                    instruction:
                      objective: Explique como pool, migration e shutdown compõem um único lifecycle de recurso.
                      scope: Capacidade, ordenação e cleanup.
                    concepts: [go-database.pool-limits, go-database.migration-order, go-database.graceful-persistence-shutdown]
                    evidence: {strategies: [source_inspection]}
                    criteria: [{id: explains-persistence-lifecycle, kind: reasoning}]
                    completion: {requires_positive_evaluation: true}
                    hints:
                      - {level: 1, kind: guiding_question}
                      - {level: 2, kind: syntax_recall}
                      - {level: 3, kind: logical_prose}
                      - {level: 4, kind: pseudocode}
                      - {level: 5, kind: partial_code}
                      - {level: 6, kind: solution}
                    reflection: {optional: ['Por que fechar o pool antes de terminar migrations pode transformar um erro de ordem em indisponibilidade?']}
  - schema_version: 1
    id: go-database.transactional-repository
    version: 1.0.0
    title: Implementar repositório transacional
    kind: functional_slice
    difficulty: intermediate
    estimated_minutes: 50
    themes: [go-database.sql-model, go-database.transactions-pool]
    competencies:
      primary: [go-database.test-transactional-repository]
      secondary: [go-database.bind-query-parameters, go-database.commit-or-rollback-transaction]
    prerequisites: [go-database.pool-and-migration-lifecycle]
    brief: Um repositório salva uma entidade com query parametrizada e precisa provar rollback quando o driver falha.
    constraints:
      - A fixture usa somente um driver sintético local controlado pelo teste.
      - O erro do driver não pode produzir commit parcial.
      - A entrada hostil deve permanecer em argumentos e não em SQL concatenado.
    acceptance:
      - O caso negativo prova parametrização e rollback.
      - O caso positivo comita depois da operação.
      - O teste não depende de banco ou serviço remoto.
    canonical: true
    publication: {status: draft, author: codex}
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/repository

          go 1.25.0
      - path: repository.go
        content: |
          package repository

          import (
              "context"
              "database/sql"
              "fmt"
          )

          func SaveUser(ctx context.Context, db *sql.DB, name, email string) error {
              tx, err := db.BeginTx(ctx, nil)
              if err != nil {
                  return err
              }
              query := fmt.Sprintf("INSERT INTO users (name, email) VALUES ('%s', '%s')", name, email)
              if _, err := tx.ExecContext(ctx, query); err != nil {
                  _ = tx.Rollback()
                  return err
              }
              return tx.Commit()
          }
      - path: repository_test.go
        content: |
          package repository

          import (
              "context"
              "database/sql"
              "database/sql/driver"
              "errors"
              "fmt"
              "strings"
              "sync"
              "testing"
          )

          type fakeState struct {
              mu        sync.Mutex
              fail      bool
              query     string
              args      []driver.NamedValue
              commits   int
              rollbacks int
          }

          type fakeDriver struct{}

          var fakeStates sync.Map

          func init() {
              sql.Register("codinho-repository", fakeDriver{})
          }

          func (fakeDriver) Open(name string) (driver.Conn, error) {
              state, ok := fakeStates.Load(name)
              if !ok {
                  return nil, errors.New("unknown fake state")
              }
              return &fakeConn{state: state.(*fakeState)}, nil
          }

          type fakeConn struct{ state *fakeState }

          func (c *fakeConn) Prepare(query string) (driver.Stmt, error) {
              return &fakeStmt{conn: c, query: query}, nil
          }
          func (c *fakeConn) Close() error { return nil }
          func (c *fakeConn) Begin() (driver.Tx, error) { return &fakeTx{state: c.state}, nil }
          func (c *fakeConn) BeginTx(ctx context.Context, _ driver.TxOptions) (driver.Tx, error) {
              select {
              case <-ctx.Done():
                  return nil, ctx.Err()
              default:
                  return &fakeTx{state: c.state}, nil
              }
          }
