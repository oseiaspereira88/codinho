              })

              t.Run("every one of several missing keys is individually joined, not merged or hardcoded", func(t *testing.T) {
                  missing := []string{"zeta-1", "zeta-2", "zeta-3", "zeta-4", "zeta-5", "zeta-6"}
                  required := append([]string{"a", "b"}, missing...)

                  err := LoadAndValidate(store, required)
                  if err == nil {
                      t.Fatal("err = nil, want non-nil")
                  }
                  if !errors.Is(err, ErrNotFound) {
                      t.Errorf("errors.Is(err, ErrNotFound) = false, want true (err = %v)", err)
                  }
                  for _, key := range missing {
                      if !strings.Contains(err.Error(), `"`+key+`"`) {
                          t.Errorf("err.Error() = %q, does not mention missing key %q", err.Error(), key)
                      }
                  }

                  joined, ok := err.(interface{ Unwrap() []error })
                  if !ok {
                      t.Fatal("err does not implement Unwrap() []error -- not a joined multi-error")
                  }
                  if got := len(joined.Unwrap()); got != len(missing) {
                      t.Errorf("len(err.Unwrap()) = %d, want %d (one joined error per missing key, not merged into one)", got, len(missing))
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestLoadAndValidate$
        timeout: 20s
    variants: []
    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/load-and-validate-required-keys

          go 1.25.0
      - path: loadvalidate.go
        content: |
          package config

          import (
              "fmt"
          )

          import "errors"

          // ErrNotFound is returned when a key is missing from the store.
          var ErrNotFound = errors.New("not found")

          // LoadAndValidate checks that every key in required is present in
          // store. It wraps ErrNotFound with the missing key's name for each
          // absent key, and aggregates every such error into a single joined
          // error -- not just the first one found. It returns nil when every
          // required key is present.
          func LoadAndValidate(store map[string]string, required []string) error {
              var missing []error
              for _, key := range required {
                  if _, ok := store[key]; !ok {
                      missing = append(missing, fmt.Errorf("key %q: %w", key, ErrNotFound))
                  }
              }
              return errors.Join(missing...)
          }
