              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/enumerate-weekdays-with-iota

          go 1.25.0
      - path: weekday.go
        content: |
          package weekdays

          type Weekday int

          const (
              Monday Weekday = iota
              Tuesday
              Wednesday
              Thursday
              Friday
              Saturday
              Sunday
          )

          func IsWeekday(d Weekday) bool {
              panic("not implemented")
          }
      - path: weekday_test.go
        content: |
          package weekdays

          import "testing"

          func TestWeekdayEnumeration(t *testing.T) {
              days := []Weekday{Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday}
              for i, got := range days {
                  if got != Weekday(i) {
                      t.Errorf("day %d = %d, want %d", i, got, i)
                  }
              }

              cases := []struct {
                  name string
                  day  Weekday
                  want bool
              }{
                  {"monday", Monday, true},
                  {"friday", Friday, true},
                  {"saturday", Saturday, false},
                  {"sunday", Sunday, false},
                  {"before enumeration", Weekday(-1), false},
                  {"after enumeration", Weekday(7), false},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      if got := IsWeekday(c.day); got != c.want {
                          t.Errorf("IsWeekday(%d) = %v, want %v", c.day, got, c.want)
                      }
                  })
              }
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestWeekdayEnumeration$
        timeout: 20s
    validation:
