          )

          func TestFieldFromError(t *testing.T) {
              t.Run("wrapped validation error", func(t *testing.T) {
                  err := ValidateAge(-1)
                  field, ok := FieldFromError(err)
                  if !ok || field != "age" {
                      t.Errorf("FieldFromError(err) = (%q, %v), want (\"age\", true)", field, ok)
                  }
              })

              t.Run("deeply wrapped validation error", func(t *testing.T) {
                  inner := ValidateAge(-1)
                  wrapped := fmt.Errorf("handling request: %w", fmt.Errorf("processing user: %w", inner))
                  field, ok := FieldFromError(wrapped)
                  if !ok || field != "age" {
                      t.Errorf("FieldFromError(wrapped) = (%q, %v), want (\"age\", true)", field, ok)
                  }
              })

              t.Run("unrelated error", func(t *testing.T) {
                  field, ok := FieldFromError(errors.New("something else went wrong"))
                  if ok {
                      t.Errorf("FieldFromError(unrelated) = (%q, true), want ok=false", field)
                  }
              })

              t.Run("nil error", func(t *testing.T) {
                  field, ok := FieldFromError(nil)
                  if ok {
                      t.Errorf("FieldFromError(nil) = (%q, true), want ok=false", field)
                  }
              })
          }
