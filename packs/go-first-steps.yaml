                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que uma conversão explícita mudaria a pergunta que o exemplo está testando?
          - id: model.declare-weekday-type
            kind: micro
            action: declare
            target: named_type
            title: Declarar o tipo Weekday
            instruction:
              objective: Declarar o tipo Weekday como um tipo nomeado inteiro.
              scope: Somente a declaração do tipo.
              constraints:
                - Não declarar as constantes ainda.
                - Não implementar métodos.
            concepts: [named-types]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: type-exists
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.declare-weekday-constants
            kind: micro
            action: declare
            target: constant_block
            title: Declarar as constantes Monday a Sunday com iota
            instruction:
              objective: Declarar as constantes Monday a Sunday do tipo Weekday usando iota, na ordem correta.
              scope: Somente o bloco de constantes.
              constraints:
                - Não atribuir valores literais explícitos às constantes.
            concepts: [constant-declaration, iota-sequence]
