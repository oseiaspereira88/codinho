  - schema_version: 1
    id: go-type-design.first-circle-clone
    version: 1.0.0
    title: Clonar um registro de formas e achar o primeiro Circle com segurança
    kind: combined
    difficulty: intermediate
    estimated_minutes: 30
    themes: [structs-and-pointers, interfaces]
    competencies:
      primary: [clone-struct-with-independent-slice, assert-type-without-panicking, return-true-nil-interface]
      secondary: []
    prerequisites: [struct-shallow-copy-aliasing, safe-type-assertion, typed-nil-interface-trap]
    brief: >
      Implemente uma função que clona um Registry de formas -- sem que o
      clone compartilhe o backing array de Shapes com o original -- e
      devolve, junto com o clone, o primeiro Circle encontrado entre as
      formas, ou um nil de interface verdadeiro quando não há nenhum,
      sem nunca panicar mesmo com outras implementações de Shape.
    constraints:
      - Não usar bibliotecas externas.
      - Shapes do clone não pode compartilhar backing array com Shapes do original.
      - Verificar o tipo concreto de cada forma sem panicar quando ela não for Circle.
      - Quando nenhum Circle for encontrado, o retorno deve ser comparável a nil com ==, resultando true.
    acceptance:
      - 'FirstCircleClone com [Square, Circle, Square] devolve o Circle e um clone com Shapes independente do original.'
      - Mutar Shapes do clone nunca altera Shapes do original, mesmo quando o original tem capacidade excedente.
      - Um Registry sem nenhum Circle devolve um Shape que é == nil, sem panicar.
      - FirstCircleClone encontra um Circle em qualquer posição de um Registry com muitas formas, não apenas em um prefixo ou subconjunto fixo de posições.
      - Quando há mais de um Circle, FirstCircleClone devolve o primeiro, não o último.
