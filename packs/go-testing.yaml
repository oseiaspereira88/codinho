challenges:
- schema_version: 1
  id: go-testing.select-active-tokens-with-injected-clock
  version: 1.0.0
  title: Tornar uma seleção temporal testável
  kind: combined
  difficulty: foundational
  estimated_minutes: 35
  themes:
  - testing-and-testability
  competencies:
    primary:
    - testing-design-deterministic-time
    - testing-cover-boundary-cases
    - testing-detect-aliasing
    secondary:
    - testing-build-counting-double
    - testing-name-diagnostic-cases
  prerequisites: []
  brief: Selecione os tokens ainda válidos em um instante controlável pelo teste, preservando a entrada
    e a ordem original. Torne os casos de fronteira reproduzíveis sem esperar o tempo passar.
  constraints:
  - Use somente a biblioteca padrão e a dependência de relógio da fixture.
  - Não use time.Now, time.Sleep, rede ou arquivos para determinar o resultado.
  - Preserve os casos existentes e acrescente um caso de fronteira justificado.
  acceptance:
  - Um token só está ativo se sua expiração ocorre estritamente depois do instante observado.
  - O relógio é chamado exatamente uma vez por operação, inclusive com entrada vazia.
  - Relógio nil retorna a sentinela ErrMissingClock e resultado nil.
  - Preserva a ordem dos tokens ativos e todos os dados da entrada.
  - Retorna slice vazio não nil quando não há tokens ativos.
  - Alterar um elemento do resultado não altera a entrada.
  - Os testes demonstram casos antes, na igualdade e depois do limite, sem depender do relógio do sistema.
  publication:
    status: draft
    author: codex
