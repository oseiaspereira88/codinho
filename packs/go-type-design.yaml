  - schema_version: 1
    id: go-type-design.contains-generic-comparable
    version: 1.0.0
    title: Implementar uma checagem de pertencimento genérica
    kind: atomic
    difficulty: foundational
    estimated_minutes: 10
    themes: [generics]
    competencies:
      primary: [implement-generic-membership-check]
      secondary: []
    prerequisites: []
    brief: >
      Uma coleção precisa responder se um item pertence a ela, permitindo
      reutilizar a mesma operação com diferentes tipos de valores.
    constraints:
      - Não usar bibliotecas externas.
      - O parâmetro de tipo deve ter a constraint comparable.
    acceptance:
      - 'Contains([2,1,3], 2) retorna true, incluindo quando o valor procurado está no primeiro índice.'
      - 'Contains([1,2,3,4], 4) retorna true, mesmo quando o valor procurado não está entre os primeiros elementos.'
      - Contains funciona para qualquer índice de uma slice longa (20 elementos), não apenas para um prefixo fixo ou um subconjunto esparso de posições.
      - Contains([1,2,3], 5) retorna false.
      - 'Contains(["a","b"], "b") retorna true, funcionando também para string.'
      - 'Contains funciona para qualquer tipo comparable, incluindo bool e structs comparáveis -- não apenas int e string.'
      - Contains de uma slice vazia sempre retorna false.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.inspect-defined-types-in-constraints
            kind: macro
            title: Inspecionar tipos definidos em constraints
            instruction:
              objective: Distinguir a constraint comparable usada pela busca da forma de aceitar tipos definidos pelo tipo subjacente.
              scope: Declaração genérica de Contains e suas instanciações.
            concepts: [generic-underlying-type-constraint, generic-comparable-constraint]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: underlying-type-boundary-is-understood
                kind: qualitative
            children:
              - id: model.compare-comparable-and-underlying-constraints
                kind: meso
                title: Comparar constraints de operação e de representação
                instruction:
                  objective: Relacionar a operação de igualdade da busca ao conjunto de tipos aceitos pela constraint.
                  scope: Tipos comparáveis, tipos definidos e o uso de ~ quando a API precisa do tipo subjacente.
                concepts: [generic-underlying-type-constraint, generic-comparable-constraint]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: comparable-and-underlying-contracts-are-distinguished
                    kind: qualitative
                children:
                  - id: model.verify-defined-type-constraint
                    kind: micro
                    action: analyze
                    target: generic_constraint
                    title: Verificar o limite da constraint para tipos definidos
                    instruction:
                      objective: Determine se a operação de Contains exige apenas comparabilidade ou também deve declarar uma constraint baseada no tipo subjacente.
                      scope: A assinatura genérica e o comportamento que ela promete, sem trocar a operação de busca.
                      constraints:
                        - Não criar uma segunda noção de comparable nem aceitar tipos não comparáveis só por serem definidos.
                    concepts: [generic-underlying-type-constraint]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: defined-type-constraint-boundary-is-explained
                        kind: qualitative
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que ~int amplia uma constraint para tipos definidos com subjacente int, mas não substitui a exigência de que a operação seja válida para todos os tipos aceitos?
          - id: model.search-for-target-value
            kind: micro
            action: implement
            target: function
            title: Verificar se target aparece em items
            instruction:
              objective: Verificar se target aparece em items, comparando os elementos até decidir a presença do valor.
