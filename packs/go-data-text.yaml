  - schema_version: 1
    id: go-data-text.quote-csv-field-when-needed
    version: 1.0.0
    title: Citar um campo CSV apenas quando necessário
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [text-and-binary-data]
    competencies:
      primary: [quote-csv-field-when-needed]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a formatação de um único campo CSV: sem alterações
      quando não contém caracteres especiais, ou citado e com aspas
      internas escapadas quando contém.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Toda aspas dupla interna deve ser dobrada antes de envolver o campo em aspas, mesmo quando o campo também contém vírgula ou quebra de linha.
    acceptance:
      - 'CSVField("hello") retorna "hello" sem alterações.'
      - 'CSVField("") retorna "" sem alterações.'
      - 'CSVField("a,b") retorna "a,b" entre aspas.'
      - 'CSVField("line1\nline2") retorna o texto entre aspas.'
      - 'CSVField("a\rb") retorna o texto entre aspas (retorno de carro também exige citação).'
      - 'CSVField(`say "hi"`) retorna `"say ""hi"""` (aspas internas dobradas).'
      - 'CSVField(`a,"b"`) retorna `"a,""b"""` (vírgula e aspas internas ao mesmo tempo).'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-unchanged-when-no-special-chars
            kind: micro
            action: implement
            target: function
            title: Retornar s sem alterações quando não há caracteres especiais
            instruction:
              objective: Detectar se s contém vírgula, aspas duplas ou quebra de linha (\n ou \r), retornando s sem alterações quando nenhum desses caracteres está presente.
              scope: A detecção de caracteres especiais e o caminho sem alterações.
              constraints:
                - Retornar s sem alterações quando ele não contém vírgula, aspas ou quebra de linha (\n ou \r).
            concepts: [csv-field-quoting]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-unchanged-when-no-special-chars
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.escape-and-wrap-quoted-field
            kind: micro
            action: implement
            target: function
            title: Escapar aspas internas e envolver em aspas
            instruction:
              objective: Quando s precisa ser citado, dobrar cada aspas dupla interna e envolver o resultado inteiro em aspas duplas.
              scope: O caminho em que s precisa ser citado.
              constraints:
                - Toda aspas dupla interna deve ser dobrada antes de envolver o campo em aspas.
            concepts: [csv-field-quoting]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: escapes-and-wraps-quoted-field
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
