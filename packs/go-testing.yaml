- schema_version: 1
  id: go-testing.count-deadline-clock-calls
  version: 1.0.0
  canonical: false
  variant_of: go-testing.select-active-tokens-with-injected-clock
  title: Observar o relógio de um lote de prazos
  kind: atomic
  difficulty: foundational
  estimated_minutes: 20
  themes:
  - testing-and-testability
  competencies:
    primary:
    - testing-build-counting-double
  brief: Conte os prazos ainda futuros usando um único instante para o lote inteiro, com um dublê que
    revele chamadas extras.
  constraints:
  - Use somente a biblioteca padrão e as entradas recebidas.
  - Não use rede, arquivos externos ou esperas reais; preserve as assinaturas da fixture.
  acceptance:
  - Relógio válido é chamado exatamente uma vez, mesmo para lote vazio.
  - Conta apenas prazos estritamente posteriores ao instante observado.
  - Relógio nil retorna ErrMissingClock.
