          package squares

          import (
              "reflect"
              "testing"
          )

          func TestEvenSquares(t *testing.T) {
              cases := []struct {
                  name string
                  n    int
                  want []int
              }{
                  {"six", 6, []int{0, 4, 16}},
                  {"one", 1, []int{0}},
                  {"two", 2, []int{0}},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := EvenSquares(c.n)
                      if len(got) != len(c.want) {
                          t.Fatalf("EvenSquares(%d) has length %d, want %d (got %v)", c.n, len(got), len(c.want), got)
                      }
                      if !reflect.DeepEqual(got, c.want) {
                          t.Errorf("EvenSquares(%d) = %v, want %v", c.n, got, c.want)
                      }
                  })
              }

              t.Run("zero has length zero", func(t *testing.T) {
                  got := EvenSquares(0)
                  if len(got) != 0 {
                      t.Errorf("EvenSquares(0) has length %d, want 0 (got %v)", len(got), got)
                  }
              })

              t.Run("capacity is preallocated to exactly n", func(t *testing.T) {
                  got := EvenSquares(6)
                  if cap(got) != 6 {
                      t.Errorf("cap(EvenSquares(6)) = %d, want exactly 6", cap(got))
                  }
              })
          }
