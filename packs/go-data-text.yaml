      - 'TitleFirstLetters("go   ") retorna "Go   ", preservando os espaços finais.'
      - 'TitleFirstLetters("go\tis fun") retorna "Go\tIs Fun" -- tabulação também separa palavras e é preservada.'
      - 'TitleFirstLetters("élan vital") retorna "Élan Vital" -- a capitalização funciona para letras não-ASCII.'
      - 'TitleFirstLetters("") retorna "".'
