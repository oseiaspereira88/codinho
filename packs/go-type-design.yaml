          module codinho-practice/generic-node-values-nil-safe

          go 1.25.0
      - path: gnode.go
        content: |
          package gnode

          // Node is one element of a singly linked list holding a value of any
          // type.
          type Node[T any] struct {
              Value T
              Next  *Node[T]
          }

          // Values returns a new slice with the Value field of n and every node
          // reachable via Next, in order. It works correctly even when n is nil,
          // returning an empty slice in that case, and never mutates the list.
          func (n *Node[T]) Values() []T {
              panic("not implemented")
          }
      - path: gnode_test.go
        content: |
          package gnode

          import (
              "reflect"
              "testing"
          )

          type item struct {
              ID   int
              Name string
          }

          func TestNodeValues(t *testing.T) {
              t.Run("nil receiver returns an empty slice without panicking", func(t *testing.T) {
                  var n *Node[int]
                  got := n.Values()
                  if len(got) != 0 {
                      t.Errorf("nil.Values() = %v, want empty", got)
                  }
              })

              t.Run("single node", func(t *testing.T) {
                  n := &Node[string]{Value: "a"}
                  got := n.Values()
                  want := []string{"a"}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Values() = %v, want %v", got, want)
                  }
              })

              t.Run("chain of nodes, order preserved", func(t *testing.T) {
                  n := &Node[int]{Value: 1, Next: &Node[int]{Value: 2, Next: &Node[int]{Value: 3}}}
                  got := n.Values()
                  want := []int{1, 2, 3}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Values() = %v, want %v", got, want)
                  }
              })

              t.Run("works for a user-defined struct type, not just int/string", func(t *testing.T) {
                  n := &Node[item]{
                      Value: item{ID: 1, Name: "a"},
                      Next: &Node[item]{
                          Value: item{ID: 2, Name: "b"},
                          Next: &Node[item]{
                              Value: item{ID: 3, Name: "c"},
                          },
                      },
                  }
                  got := n.Values()
                  want := []item{{1, "a"}, {2, "b"}, {3, "c"}}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Values() = %v, want %v", got, want)
                  }
              })

              t.Run("long chain includes every node, not just a fixed prefix", func(t *testing.T) {
                  const length = 20
                  var head *Node[int]
                  want := make([]int, length)
                  for i := length - 1; i >= 0; i-- {
                      head = &Node[int]{Value: i, Next: head}
                      want[i] = i
                  }
                  got := head.Values()
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Values() over a %d-node chain = %v, want %v", length, got, want)
                  }
              })
          }
