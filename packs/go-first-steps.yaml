                      scope: Apenas a análise dos literais; não altere a fórmula de conversão.
                    concepts: [numeric-constant-representability]
                    evidence:
                      strategies: [source_inspection, compile]
                    criteria:
                      - id: formula-literals-are-representable
                        kind: structural
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                  - id: model.explain-static-runtime-boundary
                    kind: micro
                    action: reflect
                    target: decision
                    title: Explicar a fronteira entre compilação e runtime
                    instruction:
                      objective: Explique a diferença entre uma constante que falha na compilação e um valor recebido que só pode ser validado durante a execução.
                      scope: Apenas a distinção entre representabilidade e conversão de entrada.
                    concepts: [numeric-constant-representability, type-conversion]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: compile-runtime-distinction-explained
