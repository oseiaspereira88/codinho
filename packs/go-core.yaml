  - schema_version: 1
    id: go-core.configure-server-with-functional-options
    version: 1.0.0
    title: Configurar um servidor com opções funcionais validadas
    kind: combined
    difficulty: intermediate
    estimated_minutes: 30
    themes: [functions-and-methods, packages-and-apis]
    competencies:
      primary: [use-variadic-parameters, guard-invariant-with-unexported-field, control-closure-capture]
      secondary: [define-package-api-boundary]
    prerequisites: [variadic-parameters, unexported-field-invariant]
    brief: >
      Um servidor deve ser construído com uma configuração útil por padrão,
      aceitar ajustes opcionais em sequência e rejeitar o resultado quando a
      porta final não puder ser usada. A configuração aceita deve permanecer
      consultável pela API.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Os campos de Server não podem ser exportados.
      - NewServer deve aplicar os opts recebidos, na ordem, sobre os valores padrão.
      - NewServer deve validar a porta final antes de retornar, com erro se estiver fora de 1-65535.
    acceptance:
      - NewServer() retorna host "localhost" e port 8080, err nil.
      - NewServer(WithHost("example.com")) retorna host "example.com", port 8080, err nil.
      - NewServer(WithPort(80), WithPort(443)) retorna port 443 (a opção posterior prevalece sobre a anterior).
      - NewServer(WithPort(0)) retorna err não nil.
      - NewServer(WithPort(70000)) retorna err não nil.
      - NewServer(WithPort(65535)) retorna port 65535, err nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-options-mutating-by-pointer
            kind: micro
            action: implement
            target: function
            title: Fazer WithHost e WithPort configurarem o servidor
            instruction:
              objective: Fazer cada construtor de opção configurar o valor correspondente quando aplicado ao Server.
              scope: O corpo de WithHost e WithPort.
              constraints:
                - Os campos de Server não podem ser exportados.
            concepts: [functional-options-pattern, closure-capture-lifetime]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: options-mutate-via-pointer
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.apply-options-over-defaults
            kind: micro
            action: implement
            target: function
            title: Aplicar as opções em ordem sobre os valores padrão
            instruction:
              objective: Implementar NewServer para partir dos valores padrão (host "localhost", port 8080) e aplicar cada opt recebido em opts, na ordem, sobre o Server, sem validar ainda o resultado.
              scope: A criação do Server com os padrões e o laço que aplica opts.
              constraints:
                - NewServer deve aplicar os opts recebidos, na ordem, sobre os valores padrão.
                - Não validar ainda o resultado.
            concepts: [functional-options-pattern, variadic-parameters]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: applies-options-in-order-over-defaults
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.validate-final-port
            kind: micro
            action: implement
            target: function
            title: Validar a porta final antes de retornar
            instruction:
              objective: Depois de aplicar os opts, validar que a porta final está entre 1 e 65535 (inclusive), retornando erro caso contrário, e o Server válido caso contrário.
              scope: Somente a validação final e o retorno de NewServer.
              constraints:
                - NewServer deve validar a porta final antes de retornar, com erro se estiver fora de 1-65535.
            concepts: [unexported-field-invariant]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: validates-final-port-range
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
            reflection:
              optional:
                - Por que validar só depois de aplicar todos os opts, em vez de validar dentro de cada WithPort individualmente?
          - id: model.verify-defaults-and-overrides
            kind: micro
            action: verify
            target: constructor
            title: Verificar padrões e sobrescritas
            instruction:
              objective: Confirme que os padrões são mantidos quando nenhuma opção é fornecida e que a última opção prevalece quando há repetição.
              scope: NewServer sem opções e com duas opções de porta em sequência.
            concepts: [functional-options-pattern, package-import-export-boundary]
            evidence:
              strategies: [test]
            criteria:
              - id: defaults-and-order-are-observable
                kind: structural
            completion:
              requires_positive_evaluation: true
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: go-core.configure-server-with-functional-options.closure-capture-lifetime.macro
            kind: macro
            title: Preservar o valor capturado por uma opção
            instruction:
              objective: Identifique o valor que cada closure de opção conserva.
              scope: A criação de WithHost e WithPort e a aplicação posterior da opção.
            concepts: [closure-capture-lifetime]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: option-closure-capture-defined
                kind: qualitative
            children:
              - id: go-core.configure-server-with-functional-options.closure-capture-lifetime.meso
                kind: meso
                title: Comparar opções criadas com argumentos distintos
                instruction:
                  objective: Compare a opção criada com cada argumento recebido.
                  scope: O valor capturado pela closure antes da aplicação em NewServer.
                concepts: [closure-capture-lifetime]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: option-closure-capture-is-distinct
                    kind: qualitative
                children:
                  - id: go-core.configure-server-with-functional-options.verify-option-capture
                    kind: micro
                    action: verify
                    target: closure_capture
                    title: Verificar o argumento próprio de cada opção
                    instruction:
                      objective: Confirme que cada opção aplica o argumento de sua própria criação.
                      scope: Apenas a closure retornada por WithHost ou WithPort.
                    concepts: [closure-capture-lifetime]
                    evidence:
                      strategies: [source_inspection, test]
                    criteria:
                      - id: option-closure-keeps-own-argument
                        kind: structural
                    completion:
                      requires_positive_evaluation: true
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que cada opção precisa conservar seu próprio argumento até NewServer aplicá-la?
