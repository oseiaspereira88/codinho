    fixture:
      - path: go.mod
        content: |
          module codinho-practice/map-generic-transform

          go 1.25.0
      - path: mapgen.go
        content: |
          package gentransform

          // Map returns a new slice with transform applied to each element of
          // items, in order, preserving length and not mutating items.
          func Map[T, U any](items []T, transform func(T) U) []U {
              panic("not implemented")
          }
      - path: mapgen_test.go
        content: |
          package gentransform

          import (
              "reflect"
              "strconv"
              "testing"
              "unsafe"
          )

          func TestMap(t *testing.T) {
              t.Run("int to string, preserves order and length", func(t *testing.T) {
                  got := Map([]int{1, 2, 3}, strconv.Itoa)
                  want := []string{"1", "2", "3"}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("Map(...) = %v, want %v", got, want)
                  }
              })

              t.Run("mutating the result never affects the input, even with spare capacity", func(t *testing.T) {
                  input := make([]int, 3, 10)
                  copy(input, []int{1, 2, 3})
                  original := append([]int(nil), input...)

                  got := Map(input, func(n int) int { return n * 100 })
                  if len(got) > 0 {
                      got[0] = -1
                  }
                  if !reflect.DeepEqual(input, original) {
                      t.Errorf("input mutated after touching result: got %v, want unchanged %v", input, original)
                  }

                  if len(got) > 0 {
                      inputStart := uintptr(unsafe.Pointer(unsafe.SliceData(input)))
                      inputEnd := inputStart + uintptr(cap(input))*unsafe.Sizeof(input[0])
                      gotStart := uintptr(unsafe.Pointer(unsafe.SliceData(got)))
                      if gotStart >= inputStart && gotStart < inputEnd {
                          t.Error("Map(...) result shares backing array with input")
                      }
                  }
              })

              t.Run("every element is transformed, not just a fixed prefix", func(t *testing.T) {
                  const length = 20
                  items := make([]int, length)
                  for i := range items {
                      items[i] = i
                  }
                  got := Map(items, func(n int) int { return n * 2 })
                  if len(got) != length {
                      t.Fatalf("len(Map(...)) = %d, want %d", len(got), length)
                  }
                  for i, v := range got {
                      if v != i*2 {
                          t.Fatalf("Map(...)[%d] = %d, want %d", i, v, i*2)
                      }
                  }
              })

              t.Run("empty input", func(t *testing.T) {
                  got := Map([]int{}, func(n int) int { return n })
                  if len(got) != 0 {
                      t.Errorf("Map([], ...) = %v, want empty", got)
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestMap$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/map-generic-transform

          go 1.25.0
      - path: mapgen.go
        content: |
          package gentransform

          // Map returns a new slice with transform applied to each element of
          // items, in order, preserving length and not mutating items.
          func Map[T, U any](items []T, transform func(T) U) []U {
              out := make([]U, len(items))
              for i, item := range items {
                  out[i] = transform(item)
              }
              return out
          }
      - path: mapgen_test.go
        content: |
