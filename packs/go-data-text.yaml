tracks: []
challenges:
  - schema_version: 1
    id: go-data-text.filter-without-mutating-input
    version: 1.0.0
    title: Filtrar uma slice sem mutar a entrada
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [slices-arrays-maps]
    competencies:
      primary: [filter-without-mutating-input]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função que filtra uma slice de inteiros, preservando
      a ordem dos valores aceitos, sem nunca alterar a slice recebida.
    constraints:
      - Não usar bibliotecas externas.
      - A slice de retorno não pode reaproveitar o backing array de nums.
    acceptance:
      - 'Filter([1,2,3,4,5,6], par) retorna [2,4,6], preservando a ordem.'
      - Após a chamada, a slice recebida permanece com os mesmos valores, na mesma ordem.
      - A slice retornada não aponta para nenhuma posição do backing array da entrada, mesmo quando a entrada tem capacidade excedente.
      - Filter com nenhum valor aceito retorna uma slice vazia.
      - Filter(nil, keep) retorna uma slice vazia.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.filter-with-independent-result
            kind: macro
            title: Construir uma filtragem sem aliasing
            instruction:
              objective: Produzir uma coleção filtrada sem alterar nem compartilhar o armazenamento da entrada.
              scope: Contrato completo de Filter, da saída independente aos casos sem resultados.
            concepts: [slice-backing-array-aliasing]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: filter-contract-is-understood
                kind: qualitative
            children:
              - id: model.build-independent-filter-result
                kind: meso
                title: Separar saída, percurso e fronteiras da filtragem
                instruction:
                  objective: Organizar a construção da saída e a preservação da entrada em decisões verificáveis.
                  scope: Declaração da saída, percurso ordenado e resultados vazios.
                concepts: [slice-backing-array-aliasing]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: filter-decisions-are-separated
                    kind: qualitative
                children:
                  - id: model.declare-independent-output-slice
                    kind: micro
                    action: declare
                    target: function
                    title: Declarar a saída independente do backing array de nums
                    instruction:
                      objective: Declarar a slice de saída de forma que ela nunca reaproveite o backing array de nums, sem ainda percorrer os elementos de nums.
                      scope: Somente a declaração da variável de saída.
                      constraints:
                        - A slice de retorno não pode reaproveitar o backing array de nums.
                        - Não percorrer nums ainda.
                    concepts: [slice-backing-array-aliasing]
                    evidence:
                      strategies: [source_inspection, compile]
                    criteria:
                      - id: output-independent-of-input-backing-array
                        kind: structural
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                  - id: model.append-accepted-values-in-order
                    kind: micro
                    action: implement
                    target: function
                    title: Percorrer nums e acrescentar os valores aceitos
                    instruction:
                      objective: Construir a saída na ordem dos valores aceitos por keep.
                      scope: O laço sobre nums e a construção da saída.
                      constraints:
                        - Preservar a ordem original dos elementos aceitos.
                    concepts: [slice-backing-array-aliasing]
                    evidence:
                      strategies: [source_inspection, compile]
                    criteria:
                      - id: filter-preserves-order
                        kind: structural
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que escrever o resultado de volta em nums[i], mesmo devolvendo nums[:n], mutaria a slice que o chamador ainda enxerga?
          - id: model.contrast-array-copy-and-slice-growth
            kind: macro
            title: Contrastar cópia de array e crescimento de slice
            instruction:
              objective: Distinguir cópia de valores e compartilhamento de armazenamento ao trabalhar com arrays e slices.
              scope: Atribuição de arrays, capacidade disponível e realocação durante append.
            concepts: [array-value-copy, append-reallocation-boundary, slice-backing-array-aliasing]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: array-and-append-boundaries-are-understood
                kind: qualitative
            children:
              - id: model.inspect-array-and-append-storage
                kind: meso
                title: Observar fronteiras de armazenamento
                instruction:
                  objective: Organizar a análise da atribuição de array e das duas situações de capacidade de uma slice.
                  scope: Cópia por valor, append que cabe e append que ultrapassa a capacidade disponível.
                concepts: [array-value-copy, append-reallocation-boundary, slice-backing-array-aliasing]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: storage-boundaries-are-separated
                    kind: qualitative
                children:
                  - id: model.explain-array-assignment-copy
                    kind: micro
                    action: analyze
                    target: storage_semantics
                    title: Explicar a cópia produzida por uma atribuição de array
                    instruction:
                      objective: Explicar por que modificar um array atribuído a outra variável não altera o array original.
                      scope: O efeito da atribuição de um array antes de qualquer operação sobre uma slice.
                      constraints:
                        - Não generalizar a cópia por valor de arrays para slices que apenas compartilham uma janela.
                    concepts: [array-value-copy, slice-backing-array-aliasing]
                    evidence:
                      strategies: [source_inspection]
                    criteria:
                      - id: array-assignment-is-independent
                        kind: structural
                    completion:
                      requires_positive_evaluation: true
                      requires_user_confirmation: false
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que a atribuição de um array pode isolar elementos escalares, enquanto duas slices do mesmo array continuam observando a mesma alteração?
                  - id: model.identify-append-within-capacity
                    kind: micro
                    action: analyze
                    target: storage_semantics
                    title: Identificar append dentro da capacidade disponível
                    instruction:
                      objective: Identificar o caso em que append cabe na capacidade restante da slice.
                      scope: A reutilização potencial do backing array antes de ultrapassar a capacidade.
                      constraints:
                        - Considerar len e cap da slice, sem depender do fator de crescimento escolhido pelo runtime.
