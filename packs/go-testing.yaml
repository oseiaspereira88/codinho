          target: function
          title: Planeje os casos da fronteira temporal.
          instruction:
            objective: Planeje os casos da fronteira temporal.
            scope: Explique as expectativas para antes, igualdade e depois; acrescente um caso relevante
              à tabela sem enfraquecer os existentes.
          concepts:
