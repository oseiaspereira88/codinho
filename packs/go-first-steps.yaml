          }
      - path: temperature_test.go
        content: |
          package temperature

          import (
              "math"
              "testing"
          )

          func TestCelsiusToFahrenheit(t *testing.T) {
              cases := []struct {
                  name string
                  in   Celsius
                  want float64
              }{
                  {"freezing point", 0, 32},
                  {"boiling point", 100, 212},
                  {"fractional value", 36.6, 97.88},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      if got := CelsiusToFahrenheit(c.in); math.Abs(got-c.want) > 0.01 {
                          t.Errorf("CelsiusToFahrenheit(%v) = %v, want %v", c.in, got, c.want)
                      }
                  })
              }
          }
