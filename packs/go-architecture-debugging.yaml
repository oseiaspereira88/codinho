  - schema_version: 1
    id: go-architecture-debugging.review-partial-outage-evidence
    version: 1.0.0
    title: Revisar evidências de uma falha parcial
    kind: code_review
    difficulty: advanced
    estimated_minutes: 40
    themes:
      - go-architecture-debugging.investigation
      - go-architecture-debugging.design-evolution
    competencies:
      primary:
        - go-architecture-debugging.reconstruct-incident-evidence
      secondary:
        - go-architecture-debugging.select-reversible-mitigation
        - go-architecture-debugging.distinguish-correlation-from-causation
        - go-architecture-debugging.justify-trade-off-with-evidence
    prerequisites:
      - go-architecture-debugging.simplify-overengineered-boundary
    brief: >
      Uma revisão de incidente recebeu eventos de cache, banco e API para a
      mesma requisição. Separe o que apenas aparece junto do que a linha do
      tempo sustenta como causa e escolha uma resposta reversível para a falha
      parcial.
    constraints:
      - Use somente os eventos sintéticos da fixture; não invente serviço remoto ou telemetria adicional.
      - Não trate request_id compartilhado como prova causal por si só.
      - A mitigação deve ser limitada, reversível e compatível com a evidência disponível.
    acceptance:
      - O baseline falha ao atribuir a causa ao sinal correlacionado de cache.
      - A referência identifica a indisponibilidade da dependência ligada ao timeout pela evidência causal explícita.
      - A decisão registrada usa uma mitigação reversível e limitada, sem afirmar certeza além da linha do tempo.
    canonical: true
    publication:
      status: draft
      author: codex
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/partial-outage-review

          go 1.25.0
      - path: review.go
        content: |
          package outage

          type Event struct {
              ID        string
              At        int
              Service   string
              Kind      string
              RequestID string
              CausedBy  string
          }

          type Finding struct {
              CauseID    string
              Mitigation string
          }

          func ReviewIncident(events []Event) Finding {
              for _, event := range events {
                  if event.RequestID == "req-42" && event.Kind == "cache_miss" {
                      return Finding{CauseID: event.ID, Mitigation: "warm-cache"}
                  }
              }
              return Finding{Mitigation: "collect-more-evidence"}
          }
      - path: review_test.go
        content: |
          package outage

          import "testing"

          func TestIncidentReviewUsesCausalEvidence(t *testing.T) {
              events := []Event{
                  {ID: "request-42", At: 1, Service: "api", Kind: "request_started", RequestID: "req-42"},
                  {ID: "cache-17", At: 2, Service: "cache", Kind: "cache_miss", RequestID: "req-42", CausedBy: "request-42"},
                  {ID: "db-17", At: 3, Service: "database", Kind: "dependency_unavailable", RequestID: "req-42", CausedBy: "request-42"},
                  {ID: "timeout-17", At: 4, Service: "api", Kind: "timeout", RequestID: "req-42", CausedBy: "db-17"},
                  {ID: "retry-17", At: 5, Service: "api", Kind: "retry_exhausted", RequestID: "req-42", CausedBy: "timeout-17"},
              }

              got := ReviewIncident(events)
              if got.CauseID != "db-17" {
                  t.Fatalf("cause=%q, want db-17", got.CauseID)
              }
              if got.Mitigation != "cap-retries" {
                  t.Fatalf("mitigation=%q, want cap-retries", got.Mitigation)
              }
          }
    checks:
      - id: outage-evidence-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestIncidentReviewUsesCausalEvidence$
        timeout: 30s
        network: false
    validation:
      reference_fixture:
        - path: go.mod
          content: |
            module codinho-practice/partial-outage-review

            go 1.25.0
        - path: review.go
          content: |
            package outage

            type Event struct {
                ID        string
                At        int
                Service   string
                Kind      string
                RequestID string
                CausedBy  string
            }

            type Finding struct {
                CauseID    string
                Mitigation string
            }

            func ReviewIncident(events []Event) Finding {
                byID := make(map[string]Event, len(events))
                for _, event := range events {
                    byID[event.ID] = event
                }
                for _, event := range events {
                    if event.Kind != "timeout" || event.CausedBy == "" {
                        continue
                    }
                    cause, ok := byID[event.CausedBy]
                    if ok && cause.Kind == "dependency_unavailable" && cause.At < event.At {
                        return Finding{CauseID: cause.ID, Mitigation: "cap-retries"}
                    }
                }
                return Finding{Mitigation: "collect-more-evidence"}
            }
        - path: review_test.go
          content: |
            package outage

            import "testing"

            func TestIncidentReviewUsesCausalEvidence(t *testing.T) {
                events := []Event{
                    {ID: "request-42", At: 1, Service: "api", Kind: "request_started", RequestID: "req-42"},
                    {ID: "cache-17", At: 2, Service: "cache", Kind: "cache_miss", RequestID: "req-42", CausedBy: "request-42"},
                    {ID: "db-17", At: 3, Service: "database", Kind: "dependency_unavailable", RequestID: "req-42", CausedBy: "request-42"},
                    {ID: "timeout-17", At: 4, Service: "api", Kind: "timeout", RequestID: "req-42", CausedBy: "db-17"},
                    {ID: "retry-17", At: 5, Service: "api", Kind: "retry_exhausted", RequestID: "req-42", CausedBy: "timeout-17"},
                }

                got := ReviewIncident(events)
                if got.CauseID != "db-17" {
                    t.Fatalf("cause=%q, want db-17", got.CauseID)
                }
                if got.Mitigation != "cap-retries" {
                    t.Fatalf("mitigation=%q, want cap-retries", got.Mitigation)
                }
            }
      expectations:
        - check_id: outage-evidence-tests
          baseline: test_failure
          reference: pass
