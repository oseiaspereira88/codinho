            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
            reflection:
              optional:
                - O que aconteceria com age e err se você tivesse redeclarado os dois dentro do bloco condicional em vez de atualizá-los?
            children:
              - id: model.verify-shadowing-cases
                hints:
                  - level: 1
                    kind: guiding_question
