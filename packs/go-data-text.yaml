                  }
                  wantInvalid := []string{"bob:not-an-int"}
                  if !reflect.DeepEqual(invalidEntries, wantInvalid) {
                      t.Errorf("invalidEntries = %v, want %v", invalidEntries, wantInvalid)
                  }
              })

              t.Run("empty score is invalid", func(t *testing.T) {
                  scores, invalidEntries := BuildScores([]string{"bob:"})
                  if _, ok := scores["bob"]; ok {
                      t.Error(`scores["bob"] should be absent for an empty score`)
                  }
                  wantInvalid := []string{"bob:"}
