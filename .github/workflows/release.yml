# Build-only artifacts. Native compatibility is established separately by CI.
name: Release (build-only, no publish)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build label vMAJOR.MINOR.PATCH[-PRERELEASE]; never creates a tag or release.'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Validate label and cross-build
        env:
          BUILD_VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: bash scripts/ci/build-release.sh "$BUILD_VERSION"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
