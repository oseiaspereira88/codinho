- schema_version: 1
  id: go-production.profile-hot-path
  version: 1.0.0
  title: Medir um hot path com baseline local
  kind: atomic
  difficulty: advanced
  estimated_minutes: 35
  themes:
  - go-production.performance
  competencies:
    primary:
    - go-production.profile-hot-path-with-local-baseline
    secondary:
    - go-production.interpret-cpu-and-allocation-evidence
  brief: Uma transformação determinística precisa de uma medição local repetível. Compare o custo observado antes de escolher
    uma mudança.
  constraints:
  - Use somente dados gerados na fixture.
  - Não transforme ns/op em limite absoluto entre máquinas.
  - Registre carga, versão Go e GOMAXPROCS na interpretação.
  acceptance:
  - O benchmark executa a transformação determinística e emite ns/op e alocações.
  - A comparação usa o mesmo host e trata variações abaixo de 15% como inconclusivas.
  - A decisão de mudança aponta uma evidência observável do perfil.
  canonical: true
  publication:
    status: draft
    author: codex
  fixture:
  - path: go.mod
    content: 'module codinho-practice/profile-hot-path


      go 1.25.0

      '
  - path: transform.go
    content: "package profile\n\nfunc Transform(input []int) []int {\n    var output []int\n    for _, value := range input\
      \ {\n        output = append(output, value*3+1)\n    }\n    return output\n}\n"
  - path: transform_test.go
    content: "package profile\n\nimport \"testing\"\n\nvar benchmarkSink []int\n\nfunc BenchmarkHotPath(b *testing.B) {\n\
      \    input := make([]int, 1024)\n    for i := range input {\n        input[i] = i\n    }\n    b.ReportAllocs()\n   \
      \ b.SetBytes(int64(len(input)))\n    for i := 0; i < b.N; i++ {\n        benchmarkSink = Transform(input)\n    }\n}\n"
  checks:
  - id: hot-path-benchmark
    runner: go_benchmark
    package: ./...
    test_pattern: ^BenchmarkHotPath$
    timeout: 30s
    network: false
  validation:
    reference_fixture:
    - path: go.mod
      content: 'module codinho-practice/profile-hot-path


        go 1.25.0

        '
    - path: transform.go
      content: "package profile\n\nfunc Transform(input []int) []int {\n    output := make([]int, len(input))\n    for i,\
        \ value := range input {\n        output[i] = value*3+1\n    }\n    return output\n}\n"
    - path: transform_test.go
      content: "package profile\n\nimport \"testing\"\n\nvar benchmarkSink []int\n\nfunc BenchmarkHotPath(b *testing.B) {\n\
        \    input := make([]int, 1024)\n    for i := range input {\n        input[i] = i\n    }\n    b.ReportAllocs()\n \
        \   b.SetBytes(int64(len(input)))\n    for i := 0; i < b.N; i++ {\n        benchmarkSink = Transform(input)\n    }\n\
        }\n"
    expectations:
    - check_id: hot-path-benchmark
      baseline: pass
      reference: pass
