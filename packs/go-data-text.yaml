          go 1.25.0
      - path: leaderboard.go
        content: |
          package leaderboard

          import (
              "strconv"
              "strings"
          )

          // BuildScores parses "name:score" entries, keeping only the first valid
          // score seen for each name -- including when that first score is
          // exactly 0 -- and collecting the raw entries whose score failed to
          // parse as an int, in the order they were seen.
          func BuildScores(entries []string) (scores map[string]int, invalidEntries []string) {
              scores = make(map[string]int)
              for _, entry := range entries {
                  name, raw, found := strings.Cut(entry, ":")
                  n, err := strconv.Atoi(raw)
                  if !found || err != nil {
                      invalidEntries = append(invalidEntries, entry)
                      continue
                  }
                  if _, exists := scores[name]; !exists {
                      scores[name] = n
                  }
              }
              return
          }
      - path: leaderboard_test.go
        content: |
          package leaderboard

          import (
              "reflect"
              "testing"
          )

          func TestBuildScores(t *testing.T) {
              t.Run("mixed valid, invalid, and duplicate entries", func(t *testing.T) {
                  entries := []string{"alice:10", "bob:x", "alice:99", "carol:0", "dave:abc", "noformat"}
                  scores, invalidEntries := BuildScores(entries)

                  wantScores := map[string]int{"alice": 10, "carol": 0}
                  if !reflect.DeepEqual(scores, wantScores) {
                      t.Errorf("scores = %v, want %v", scores, wantScores)
                  }
                  wantInvalid := []string{"bob:x", "dave:abc", "noformat"}
                  if !reflect.DeepEqual(invalidEntries, wantInvalid) {
                      t.Errorf("invalidEntries = %v, want %v", invalidEntries, wantInvalid)
                  }
              })

              t.Run("first score of zero is kept, not treated as absent", func(t *testing.T) {
                  scores, _ := BuildScores([]string{"alice:0", "alice:50"})
                  v, ok := scores["alice"]
                  if !ok || v != 0 {
                      t.Errorf(`scores["alice"] = (%d, %v), want (0, true)`, v, ok)
                  }
              })

              t.Run("name never mentioned is absent, not zero", func(t *testing.T) {
                  scores, _ := BuildScores([]string{"alice:10"})
                  _, ok := scores["nobody"]
                  if ok {
                      t.Error(`scores["nobody"] should be absent (ok=false)`)
                  }
              })

              t.Run("empty input", func(t *testing.T) {
                  scores, invalidEntries := BuildScores(nil)
                  if len(scores) != 0 || len(invalidEntries) != 0 {
                      t.Errorf("BuildScores(nil) = (%v, %v), want both empty", scores, invalidEntries)
                  }
              })

              t.Run("invalid entry does not claim the dedup slot for a later valid one", func(t *testing.T) {
                  scores, invalidEntries := BuildScores([]string{"bob:not-an-int", "bob:5"})
                  v, ok := scores["bob"]
                  if !ok || v != 5 {
                      t.Errorf(`scores["bob"] = (%d, %v), want (5, true)`, v, ok)
                  }
                  wantInvalid := []string{"bob:not-an-int"}
                  if !reflect.DeepEqual(invalidEntries, wantInvalid) {
                      t.Errorf("invalidEntries = %v, want %v", invalidEntries, wantInvalid)
                  }
              })
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
