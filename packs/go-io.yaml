- schema_version: 1
  id: go-io.import-csv-inventory
  version: 1.0.0
  title: Importar um inventário CSV validado
  kind: functional_slice
  difficulty: foundational
  estimated_minutes: 50
  themes:
  - io-and-serialization
  competencies:
    primary:
    - io-import-validated-records
    - io-write-json-result
    - io-preserve-writer-errors
    secondary:
    - io-parse-quoted-fields
    - io-encode-structured-output
  prerequisites: []
  brief: Transforme um inventário CSV em um array JSON, preservando a ordem dos registros e evitando qualquer
    escrita enquanto a entrada não for inteiramente validada.
  constraints:
  - Use somente a biblioteca padrão.
  - Não abra arquivos, não acesse a rede e não altere as assinaturas da fixture.
  - Propague erros de I/O preservando sua identidade.
  acceptance:
  - Exige cabeçalho exato name,quantity; nomes são aparados e únicos, quantidades são inteiros positivos.
  - Preserva UTF-8 e campos CSV entre aspas, inclusive nomes contendo vírgulas.
  - Cabeçalho sem registros produz um array JSON vazio.
  - Rejeita CSV malformado, largura incorreta, nomes vazios/duplicados, quantidades inválidas ou fora
    do intervalo de int.
  - Qualquer erro de entrada ou validação deixa o Writer intocado, mesmo após linhas válidas.
  - Propaga erros do Reader e do Writer com identidade preservada; falha de escrita pode ter produzido
    saída parcial.
  publication:
    status: draft
    author: codex
  layers:
  - id: import-csv-inventory.implementation
    macro_steps:
    - id: import-csv-inventory.macro
      kind: macro
      title: Importar um inventário CSV validado
      instruction:
        objective: Transforme um inventário CSV em um array JSON, preservando a ordem dos registros e
          evitando qualquer escrita enquanto a entrada não for inteiramente validada.
        scope: Contrato observável do desafio.
      children:
      - id: import-csv-inventory.meso
        kind: meso
        title: Leitura, validação e serialização do inventário
        instruction:
          objective: Transforme o CSV em inventário somente depois de validar todos os registros.
          scope: Cabeçalho, registros, memória de validação e Writer de saída.
        children:
        - id: import-csv-inventory.step-1
          kind: micro
          action: implement
          target: function
          title: Confirme o cabeçalho do inventário.
          instruction:
            objective: Confirme que o cabeçalho contém exatamente name e quantity nessa ordem.
            scope: Valide os nomes e a largura antes de considerar qualquer registro.
          concepts:
          - io-csv-record-width
          evidence:
            strategies:
            - source_inspection
            - test
          criteria:
          - id: behavior-1
            kind: qualitative
          completion:
            requires_positive_evaluation: true
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que validar nomes e ordem, além da quantidade de colunas, impede que colunas semanticamente trocadas sejam aceitas?
        - id: import-csv-inventory.step-2
          kind: micro
          action: implement
          target: function
          title: Leia os registros como CSV.
          instruction:
