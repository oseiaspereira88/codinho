      primary: [implement-generic-transform]
      secondary: []
    prerequisites: []
    brief: >
      Implemente uma função genérica que aplica uma transformação a cada
      elemento de uma slice, produzindo uma nova slice de um tipo
      possivelmente diferente, sem mutar a entrada.
    constraints:
      - Não usar bibliotecas externas.
      - Não mutar items.
    acceptance:
      - Map([1,2,3], strconv.Itoa) retorna ["1","2","3"], na mesma ordem.
      - Mutar o resultado de Map nunca altera a slice de entrada, mesmo quando a entrada tem capacidade excedente.
      - Map aplica transform a todos os elementos de uma slice longa, não apenas a um prefixo.
      - Map de uma slice vazia retorna uma slice vazia.
