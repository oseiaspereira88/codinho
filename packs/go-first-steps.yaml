  - schema_version: 1
    id: go-first-steps.avoid-shadowing-named-returns
    version: 1.0.0
    title: Evitar shadowing de retornos nomeados em bloco aninhado
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [avoid-variable-shadowing]
      secondary: []
    prerequisites: [short-variable-declaration]
    brief: >
      Uma rotina de cadastro recebe a idade como texto. Ela precisa
      normalizar a entrada, distinguir ausência de valor de texto inválido e
      devolver o resultado correto em todos os caminhos.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Atualizar os resultados já declarados pela assinatura; não criar novos age/err no bloco condicional.
    acceptance:
      - ParseAge("25") retorna age 25 e err nil.
      - ParseAge(" 25 ") retorna age 25 e err nil, ignorando espaços externos.
      - ParseAge("") retorna err não-nil.
      - ParseAge("   ") retorna err não-nil.
      - ParseAge("abc") retorna err não-nil.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.trace-return-scope
            kind: macro
            title: Rastrear o escopo dos resultados
            instruction:
              objective: Delimitar onde os resultados nomeados permanecem acessíveis durante o parsing.
              scope: Bloco condicional, função e valores devolvidos.
            concepts: [block-scope, named-return-values]
            evidence:
              strategies: [source_inspection]
            criteria:
              - id: return-scope-defined
                kind: qualitative
            children:
              - id: model.connect-conditional-to-return-scope
                kind: meso
                title: Conectar bloco condicional e retorno
                instruction:
                  objective: Relacionar a duração do escopo condicional à observação dos resultados da função.
                  scope: Variáveis locais, retornos nomeados e saída do exercício.
                concepts: [block-scope, named-return-values, variable-shadowing]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: conditional-return-boundary-is-explained
                    kind: qualitative
          - id: model.validate-empty-input
            kind: micro
            action: implement
            target: function
            title: Tratar entrada vazia como erro
            instruction:
              objective: Fazer uma entrada sem idade produzir um erro.
              scope: A checagem de entrada vazia, dentro do corpo da função, e os imports necessários.
              constraints:
                - Não implementar a conversão numérica ainda.
            concepts: [named-return-values]
            evidence:
              strategies: [source_inspection, test]
            criteria:
              - id: rejects-empty-input
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
          - id: model.parse-and-assign-without-shadowing
            kind: micro
            action: implement
            target: function
            title: Converter e atribuir sem redeclarar dentro do bloco
            instruction:
              objective: Converter o texto restante em age e err sem criar novos nomes no bloco condicional.
              scope: A conversão numérica e os imports necessários.
              constraints:
                - Não redeclarar age/err dentro do bloco condicional.
            concepts: [variable-shadowing, block-scope]
            evidence:
              strategies: [source_inspection, test]
            criteria:
              - id: parses-valid-input
                kind: structural
              - id: rejects-non-numeric-input
                kind: structural
              - id: no-redeclaration-in-conditional
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
              - level: 4
                kind: pseudocode
              - level: 5
                kind: partial_code
              - level: 6
                kind: solution
            reflection:
              optional:
                - O que aconteceria com age e err se você tivesse redeclarado os dois dentro do bloco condicional em vez de atualizá-los?
            children:
              - id: model.verify-shadowing-cases
                hints:
                  - level: 1
                    kind: guiding_question
                  - level: 2
                    kind: syntax_recall
                  - level: 3
                    kind: logical_prose
                  - level: 4
                    kind: pseudocode
                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
                kind: micro
                action: verify
                target: function
                title: Verificar casos válidos e inválidos
                instruction:
                  objective: Execute os casos numérico, vazio, somente espaços e texto inválido, confirmando age e err no retorno.
                  scope: Apenas a observação dos retornos após a implementação.
                concepts: [named-return-values, variable-shadowing]
                evidence:
                  strategies: [test]
                criteria:
                  - id: valid-case-verified
                    kind: structural
                  - id: invalid-cases-verified
                    kind: structural
                completion:
                  requires_positive_evaluation: true
                  requires_user_confirmation: false
              - id: model.explain-assignment-scope
                hints:
                  - level: 1
                    kind: guiding_question
                  - level: 2
                    kind: syntax_recall
                  - level: 3
                    kind: logical_prose
                  - level: 4
                    kind: pseudocode
                  - level: 5
                    kind: partial_code
                  - level: 6
                    kind: solution
                kind: micro
                action: reflect
                target: decision
                title: Explicar a atribuição no escopo correto
                instruction:
                  objective: Explique por que := dentro do bloco criaria novos nomes e por que a atribuição simples atualiza os retornos nomeados.
                  scope: Apenas a justificativa sobre escopo e shadowing.
                concepts: [variable-shadowing, block-scope]
                evidence:
                  strategies: [source_inspection]
                criteria:
                  - id: assignment-scope-explained
                    kind: qualitative
                completion:
                  requires_positive_evaluation: false
                  requires_user_confirmation: true
