  - schema_version: 1
    id: go-core.run-commands-with-cleanup-and-recovery
    version: 1.0.0
    title: Rodar comandos com limpeza garantida, recuperação de panic e parada segura
    kind: combined
    difficulty: intermediate
    estimated_minutes: 35
    themes: [control-flow, functions-and-methods]
    competencies:
      primary: [sequence-cleanup-with-defer, escape-loop-from-switch-with-label, recover-from-panic-at-boundary]
      secondary: [control-closure-capture]
    prerequisites: [defer-execution-order, labeled-break-scope, panic-recover-boundary]
    brief: >
      Um executor de comandos precisa produzir um relatório por comando
      processado, registrar início, sucesso ou falha e encerramento, e
      respeitar um marcador de parada. O relatório deve permanecer completo
      mesmo quando uma execução falha abruptamente.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Usar switch e break rotulado para parar o laço externo ao encontrar "stop".
      - Usar defer para garantir o registro de fechamento de cada comando, mesmo com panic.
      - Usar recover para converter um panic de run em uma entrada de falha, sem interromper os comandos seguintes.
    acceptance:
      - 'RunCommands(["a", "boom", "bb"], run) retorna ["start:a", "ok:a:1", "closed:a", "start:boom", "failed:boom:kaboom", "closed:boom", "start:bb", "ok:bb:2", "closed:bb"], onde run panica com "kaboom" para "boom" e retorna len(cmd) para os demais.'
      - 'RunCommands(["a", "stop", "c"], run) retorna ["start:a", "ok:a:1", "closed:a"], sem nenhuma entrada para "stop" ou "c".'
      - RunCommands(nil, run) retorna vazio.
      - 'RunCommands(["stop", "a"], run) retorna vazio.'
