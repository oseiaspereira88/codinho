                    completion:
                      requires_positive_evaluation: false
                      requires_user_confirmation: true
                    hints:
                      - level: 1
                        kind: guiding_question
                      - level: 2
                        kind: syntax_recall
                      - level: 3
                        kind: logical_prose
                      - level: 4
                        kind: pseudocode
                      - level: 5
                        kind: partial_code
                      - level: 6
                        kind: solution
                    reflection:
                      optional:
                        - Por que um erro de representabilidade não pode ser tratado como se fosse um erro retornado pela função?
          - id: model.declare-celsius-type
            kind: micro
            action: declare
            target: named_type
            title: Declarar o tipo Celsius
            instruction:
              objective: Declarar um tipo nomeado para representar uma temperatura em graus Celsius, com um tipo subjacente que suporte casas decimais.
              scope: Somente a declaração do tipo.
              constraints:
                - Não usar float32.
                - Não implementar a conversão ainda.
            concepts: [named-types, type-conversion]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: type-exists
