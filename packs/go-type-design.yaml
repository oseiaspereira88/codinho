          type Node[T any] struct {
              Value T
              Next  *Node[T]
          }

          // Values returns a new slice with the Value field of n and every node
          // reachable via Next, in order. It works correctly even when n is nil,
          // returning an empty slice in that case, and never mutates the list.
          func (n *Node[T]) Values() []T {
              var out []T
              for current := n; current != nil; current = current.Next {
                  out = append(out, current.Value)
              }
              return out
          }
