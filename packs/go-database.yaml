  - schema_version: 1
    id: go-database.graceful-service-with-persistence
    version: 1.0.0
    title: Encerrar serviço com persistência
    kind: systems_mission
    difficulty: intermediate
    estimated_minutes: 60
    themes: [go-database.persistence-lifecycle, go-database.transactions-pool]
    competencies:
      primary: [go-database.run-persistent-service-lifecycle]
      secondary: [go-database.cancel-database-work, go-database.configure-pool]
    prerequisites: [go-database.transactional-repository]
    brief: Um serviço local precisa observar cancelamento, deixar o trabalho persistente terminar e fechar o pool no encerramento.
    constraints:
      - O cenário deve permanecer hermético e usar apenas driver sintético.
      - Não encerre o processo com os workers de persistência ainda vivos.
      - Diferencie cancelamento esperado de erro inesperado do trabalho.
    acceptance:
      - O callback recebe o contexto de shutdown e termina quando ele é cancelado.
      - O database handle é fechado depois da decisão de encerramento.
      - O caminho de cancelamento devolve context.Canceled sem depender de sleep de sincronização.
    canonical: true
    publication: {status: draft, author: codex}
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/service

          go 1.25.0
      - path: service.go
