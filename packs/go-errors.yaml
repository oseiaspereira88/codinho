schema_version: 1
id: go-errors
version: 1.2.0
themes:
  - id: errors
    title: Erros
concepts:
  - id: error-wrapping-with-percent-w
    title: Encadeamento de erro com %w
    content:
      version: 1
      explanation: "O verbo %w na função fmt.Errorf cria um erro que envolve outro erro original, preservando a cadeia de causa para inspeção com errors.Is e errors.As sem perder a mensagem contextual."
      example:
        context: "reserva de planetário"
        code: "var ErrSessaoLotada = errors.New(\"sessao esgotada\")\n\nfunc ReservarCadeiraPlanetario(sessaoID string, cadeira int) error {\n\tif cadeira > 50 {\n\t\treturn fmt.Errorf(\"planetario %s: %w\", sessaoID, ErrSessaoLotada)\n\t}\n\treturn nil\n}"
        explanation: "O erro retornado inclui o identificador da sessão astronômica no prefixo e preserva a sentinela ErrSessaoLotada intacta para verificação pelo chamador."
      analogy: "Como colocar uma carta dentro de um envelope timbrado do planetário: o envelope adiciona informações de postagem, mas a carta original permanece intacta lá dentro."
      relation_refs:
        - kind: relates_to
          concept_id: errors-as-type-extraction
  - id: errors-as-type-extraction
    title: Extração de tipo com errors.As
  - id: errors-join-aggregation
    title: Agregação de erros com errors.Join
  - id: error-translation-at-boundary
    title: Tradução de erro em uma fronteira
  - id: error-classification-precedence
    title: Precedência na classificação de erros
  - id: error-identity-not-message
    title: Identidade de erro versus mensagem
  - id: error-chain-type-traversal
    title: Extração de tipos em cadeias de erro
  - id: error-joined-tree-order
    title: Ordem de tipos em árvores de erros
  - id: catalog-zero-value
    title: Valor zero de catálogo em memória
  - id: catalog-validation-before-mutation
    title: Validação anterior à mutação
  - id: catalog-deterministic-list
    title: Listagem determinística de mapas
  - id: catalog-value-snapshots
    title: Snapshots por valor de catálogo
competencies:
  - id: wrap-sentinel-with-context
    title: Encadear um erro sentinela preservando o contexto
  - id: extract-wrapped-error-type
    title: Extrair um tipo de erro encadeado
  - id: aggregate-errors-without-losing-any
    title: Agregar erros sem perder nenhum
  - id: translate-error-without-leaking-internals
    title: Traduzir um erro sem vazar detalhes internos
  - id: classify-wrapped-and-joined-errors
    title: Classificar erros encadeados e agregados
  - id: preserve-error-precedence
    title: Aplicar precedência explícita de categorias
  - id: distinguish-error-identity
    title: Distinguir identidade e texto de erro
  - id: manage-catalog-state
    title: Gerenciar estado de um catálogo em memória
  - id: reject-catalog-conflicts
    title: Rejeitar entradas inválidas e conflitos sem mutar
  - id: return-isolated-catalog-views
    title: Retornar visões ordenadas e isoladas
tracks: []
challenges:
  - schema_version: 1
    id: go-errors.wrap-sentinel-error-with-context
    version: 1.0.0
    title: Encadear um erro sentinela preservando o contexto
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [errors]
    competencies:
      primary: [wrap-sentinel-with-context]
      secondary: []
    prerequisites: []
    brief: >
      Implemente a busca de um valor em um mapa, encadeando um erro
      sentinela com o nome da chave quando ela não é encontrada, de
      forma que errors.Is continue detectando a sentinela através do
      encadeamento.
    constraints:
      - Não usar bibliotecas externas além da biblioteca padrão.
      - Encadear ErrNotFound com %w, nunca %v ou %s, para que errors.Is continue funcionando.
    acceptance:
      - LoadValue retorna o valor correto e nil para qualquer chave presente no mapa, não apenas para uma chave específica.
      - 'LoadValue de uma chave ausente retorna um erro cuja mensagem menciona exatamente essa chave, e para o qual errors.Is(err, ErrNotFound) é true.'
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.return-value-when-found
            kind: micro
            action: implement
            target: function
            title: Devolver o valor quando a chave existe
            instruction:
              objective: Devolver o valor de store[key] e nil quando a chave existe.
              scope: O caminho em que a chave existe.
              constraints:
                - Não tratar ainda o caso de chave ausente.
            concepts: []
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-value-when-found
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.wrap-not-found-with-context
            kind: micro
            action: implement
            target: function
            title: Encadear ErrNotFound com o nome da chave
            instruction:
              objective: Quando a chave não existe, devolver um erro que mencione a chave e que ainda seja detectável como ErrNotFound por errors.Is.
              scope: O caminho em que a chave não existe.
              constraints:
                - Encadear ErrNotFound com %w, nunca %v ou %s, para que errors.Is continue funcionando.
            concepts: [error-wrapping-with-percent-w]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: wraps-not-found-preserving-is
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Por que fmt.Errorf com %v em vez de %w produz uma mensagem idêntica, mas quebra errors.Is?
    fixture:
      - path: go.mod
        content: |
          module codinho-practice/wrap-sentinel-error-with-context

          go 1.25.0
      - path: loadval.go
        content: |
          package config

          import "errors"

          // ErrNotFound is returned when a key is missing from the store.
          var ErrNotFound = errors.New("not found")

          // LoadValue returns the value for key, or an error wrapping ErrNotFound
          // -- with the key included in the message -- when key is not in store.
          func LoadValue(store map[string]string, key string) (string, error) {
              panic("not implemented")
          }
      - path: loadval_test.go
        content: |
          package config

          import (
              "errors"
              "strings"
              "testing"
          )

          func TestLoadValue(t *testing.T) {
              store := map[string]string{"a": "1", "b": "2", "c": "3", "d": "4", "e": "5"}

              for key, want := range store {
                  key, want := key, want
                  t.Run("found key "+key, func(t *testing.T) {
                      got, err := LoadValue(store, key)
                      if err != nil || got != want {
                          t.Fatalf("LoadValue(store, %q) = (%q, %v), want (%q, nil)", key, got, err, want)
                      }
                  })
              }

              t.Run("missing key wraps ErrNotFound and mentions the key", func(t *testing.T) {
                  _, err := LoadValue(store, "missing")
                  if err == nil {
                      t.Fatal("err = nil, want non-nil")
                  }
                  if !errors.Is(err, ErrNotFound) {
                      t.Errorf("errors.Is(err, ErrNotFound) = false, want true (err = %v)", err)
                  }
                  if !strings.Contains(err.Error(), "missing") {
                      t.Errorf("err.Error() = %q, does not mention the key", err.Error())
                  }
              })

              t.Run("different missing key is mentioned correctly, not hardcoded", func(t *testing.T) {
                  _, err := LoadValue(store, "another-missing-key")
                  if !errors.Is(err, ErrNotFound) {
                      t.Errorf("errors.Is(err, ErrNotFound) = false, want true (err = %v)", err)
                  }
                  if !strings.Contains(err.Error(), "another-missing-key") {
                      t.Errorf("err.Error() = %q, does not mention the key", err.Error())
                  }
              })
          }
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestLoadValue$
        timeout: 20s
    variants: []

    validation:
      reference_fixture:
      - path: go.mod
        content: |
          module codinho-practice/wrap-sentinel-error-with-context

          go 1.25.0
      - path: loadval.go
        content: |
          package config

          import (
              "fmt"
          )

          import "errors"

          // ErrNotFound is returned when a key is missing from the store.
          var ErrNotFound = errors.New("not found")

          // LoadValue returns the value for key, or an error wrapping ErrNotFound
          // -- with the key included in the message -- when key is not in store.
          func LoadValue(store map[string]string, key string) (string, error) {
              if value, ok := store[key]; ok {
                  return value, nil
              }
              return "", fmt.Errorf("key %q: %w", key, ErrNotFound)
          }
      - path: loadval_test.go
        content: |
