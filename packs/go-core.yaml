              scope: O laço externo e o switch, sem processar ainda os comandos que não são "stop".
              constraints:
                - Usar switch e break rotulado para parar o laço externo ao encontrar "stop".
                - Não processar ainda os comandos que não são "stop".
            concepts: [labeled-break-scope]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: stops-on-stop-command
