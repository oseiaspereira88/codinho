                  got := FormatNames(nil)
                  if len(got) != 0 {
                      t.Errorf("FormatNames(nil) = %v, want empty", got)
                  }
              })

              t.Run("original spacing preserved through title-casing", func(t *testing.T) {
                  got := FormatNames([]string{"  bob   smith  "})
                  want := []string{"  Bob   Smith  "}
                  if !reflect.DeepEqual(got, want) {
                      t.Errorf("FormatNames(...) = %v, want %v", got, want)
                  }
              })

