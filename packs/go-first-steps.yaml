      - path: parseage.go
        content: |
          package parseage

          import (
              "strconv"
              "strings"
          )

          // ParseAge parses raw as an age, validating it is non-empty and
          // numeric.
          func ParseAge(raw string) (age int, err error) {
              raw = strings.TrimSpace(raw)
              if raw == "" {
                  err = strconv.ErrSyntax
                  return
              }
              if age, err = strconv.Atoi(raw); err != nil {
                  return
              }
              return
          }
