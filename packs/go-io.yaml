            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que tratar o Reader como uma única leitura pode perder bytes ou esconder a identidade de uma falha?
        - id: decode-strict-config.step-2
          kind: micro
          action: implement
          target: function
          title: Rejeite propriedades desconhecidas.
          instruction:
            objective: Rejeite propriedades JSON que não pertencem à configuração.
            scope: Compare os nomes recebidos com os campos declarados, sem transformar a validação em
              uma regra de valores.
          concepts:
          - io-json-strict-fields
          evidence:
            strategies:
            - source_inspection
            - test
          criteria:
          - id: behavior-2
            kind: qualitative
          completion:
            requires_positive_evaluation: true
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que rejeitar uma propriedade desconhecida evita que um erro de digitação pareça uma configuração válida?
        - id: decode-strict-config.step-3
          kind: micro
          action: implement
          target: function
          title: Confirme o fim do documento.
          instruction:
            objective: Confirme que não existe um segundo valor ou texto após a configuração.
            scope: Aceite espaços finais, mas trate conteúdo posterior e falhas tardias do Reader como
              parte do contrato.
          concepts:
          - io-eof-boundary
          evidence:
            strategies:
            - source_inspection
            - test
          criteria:
          - id: behavior-3
            kind: qualitative
          completion:
            requires_positive_evaluation: true
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que testar uma segunda decodificação distingue espaços finais de um segundo valor JSON e de uma falha tardia?
        - id: decode-strict-config.step-4
          kind: micro
          action: implement
          target: function
          title: Aplique as regras dos valores.
          instruction:
            objective: Aplique as regras de nome e de faixa de tentativas.
            scope: Depois da forma JSON ser aceita, rejeite nome vazio ou em branco e tentativas fora de
              zero a cinco.
          concepts:
          - io-reader-stream
          evidence:
            strategies:
            - test
          criteria:
          - id: behavior-4
            kind: structural
          completion:
            requires_positive_evaluation: true
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que separar a validação semântica da decodificação permite aceitar JSON bem formado sem aceitar uma configuração inválida?
    - id: decode-strict-config.input-boundaries
      kind: macro
      title: Delimitar o fluxo de entrada
      instruction:
        objective: Compare os limites que podem encerrar uma leitura antes de interpretar a configuração.
        scope: Token, prefixo limitado, EOF e erro no Reader que alimenta o documento.
      concepts:
      - bufio-scanner-token-boundary
      - io-limit-reader-boundary
      - io-reader-stream
      - io-eof-boundary
      evidence:
        strategies:
        - source_inspection
      criteria:
      - id: input-boundaries-are-distinguished
        kind: qualitative
      children:
      - id: decode-strict-config.input-boundaries.analysis
        kind: meso
        title: Separar limite de token e limite de fluxo
        instruction:
          objective: Organize a diferença entre um token que excede o buffer e um Reader que expõe apenas um prefixo.
          scope: Limites configuráveis e sinais de término no fluxo da configuração.
        concepts:
        - bufio-scanner-token-boundary
        - io-limit-reader-boundary
        - io-eof-boundary
        evidence:
          strategies:
          - source_inspection
        criteria:
        - id: token-and-flow-limits-are-separated
          kind: qualitative
        children:
        - id: decode-strict-config.inspect-scanner-buffer-limit
          kind: micro
          action: analyze
          target: scanner_token
          title: Identificar a fronteira de token do Scanner
          instruction:
            objective: Identifique como um limite de buffer pode impedir a entrega de um token completo.
            scope: Um token curto e outro maior que o limite configurado, sem trocar a estratégia de decodificação do desafio.
            constraints:
            - Não tratar um token grande como se fosse uma indicação de EOF.
          concepts:
          - bufio-scanner-token-boundary
          - io-partial-reads
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: scanner-token-limit-is-recognized
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que um limite de token precisa ser uma decisão explícita quando uma configuração pode conter uma linha longa?
        - id: decode-strict-config.distinguish-scanner-too-long
          kind: micro
          action: analyze
          target: scanner_error
          title: Separar token grande de EOF
          instruction:
            objective: Diferencie a falha de tamanho de token do término normal de uma entrada.
            scope: Sinal retornado pelo Scanner depois que a varredura interrompe uma entrada limitada.
            constraints:
            - Não usar a ausência de um próximo token como prova suficiente de EOF.
          concepts:
          - bufio-scanner-token-boundary
          - io-eof-boundary
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: scanner-error-is-not-eof
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que confundir ErrTooLong com EOF poderia aceitar uma configuração truncada como se estivesse completa?
        - id: decode-strict-config.inspect-limited-prefix
          kind: micro
          action: analyze
          target: reader_prefix
          title: Observar o prefixo exposto por LimitReader
          instruction:
            objective: Observe que um Reader limitado entrega somente o prefixo autorizado da fonte.
            scope: Quantidade de bytes consumidos pela visão limitada e conteúdo ainda existente na fonte.
            constraints:
            - Não afirmar que a fonte original terminou apenas porque a visão limitada chegou ao seu fim.
          concepts:
          - io-limit-reader-boundary
          - io-reader-stream
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: limited-prefix-is-recognized
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Que informação sobre a fonte permanece fora do Reader limitado e por que isso importa para interpretar o fim do fluxo?
        - id: decode-strict-config.separate-limit-eof
          kind: micro
          action: analyze
          target: reader_end
          title: Explicar o EOF imposto pelo limite
          instruction:
            objective: Explique por que o EOF do Reader limitado marca o orçamento do consumidor, não necessariamente o fim da fonte.
            scope: Relação entre o limite aplicado, os bytes restantes e a validação da fronteira do documento.
            constraints:
            - Manter separado o EOF produzido pelo limite e um erro originado no Reader subjacente.
          concepts:
          - io-limit-reader-boundary
          - io-eof-boundary
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: imposed-eof-is-distinguished
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que um limite de leitura é útil para controlar memória, mas não deve ser confundido com a validação de um documento completo?
    - id: decode-strict-config.json-field-states
      kind: macro
      title: Distinguir estados de campos JSON
      instruction:
        objective: Compare os estados que um campo opcional pode representar durante a decodificação da configuração.
        scope: Propriedade ausente, null e zero explícito antes das regras de negócio.
      concepts:
      - json-null-versus-absent
      - io-json-decoder
      - io-json-strict-fields
      evidence:
        strategies:
        - source_inspection
      criteria:
      - id: json-field-states-are-distinguished
        kind: qualitative
      children:
      - id: decode-strict-config.json-field-states.analysis
        kind: meso
        title: Preservar presença e valor do campo
        instruction:
          objective: Organize a diferença entre não receber uma propriedade, receber null e receber o número zero.
          scope: Estado observável do campo durante a leitura de um objeto JSON.
        concepts:
        - json-null-versus-absent
        - io-json-decoder
        evidence:
          strategies:
          - source_inspection
        criteria:
        - id: presence-and-value-are-separated
          kind: qualitative
        children:
        - id: decode-strict-config.inspect-absent-json-field
          kind: micro
          action: analyze
          target: json_presence
          title: Identificar uma propriedade JSON ausente
          instruction:
            objective: Identifique o estado produzido quando a propriedade opcional não aparece no documento.
            scope: Presença do nome e valor padrão observado, sem transformar ausência em uma regra de validade.
            constraints:
            - Não concluir que um valor zero prova que a propriedade foi enviada.
          concepts:
          - json-null-versus-absent
          - io-json-decoder
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: absent-field-is-observable
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que o zero observado em um campo escalar não permite saber sozinho se a propriedade veio no JSON?
        - id: decode-strict-config.inspect-null-json-field
          kind: micro
          action: analyze
          target: json_null
          title: Distinguir null de ausência
          instruction:
            objective: Distingua uma propriedade explicitamente recebida como null de uma propriedade ausente.
            scope: Presença do nome e nulidade do valor antes de aplicar limites numéricos.
            constraints:
            - Não tratar null como sinônimo automático de zero ou de ausência.
          concepts:
          - json-null-versus-absent
          - io-json-strict-fields
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: null-field-is-distinguished
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Em que contrato de configuração null deveria ser rejeitado, aceito como ausência ou tratado como estado próprio?
        - id: decode-strict-config.inspect-explicit-zero
          kind: micro
          action: analyze
          target: json_zero
          title: Preservar o zero explícito
          instruction:
            objective: Contraste o zero enviado explicitamente com os estados em que o campo não trouxe um número.
            scope: Valor numérico presente e sua diferença em relação a ausência e null.
            constraints:
            - Não usar somente a comparação com o valor zero para decidir presença.
          concepts:
          - json-null-versus-absent
          - io-json-decoder
          evidence:
            strategies:
            - source_inspection
          criteria:
          - id: explicit-zero-is-preserved
            kind: structural
          completion:
            requires_positive_evaluation: true
            requires_user_confirmation: false
          hints:
          - level: 1
            kind: guiding_question
          - level: 2
            kind: syntax_recall
          - level: 3
            kind: logical_prose
          - level: 4
            kind: pseudocode
          - level: 5
            kind: partial_code
          - level: 6
            kind: solution
          reflection:
            optional:
            - Por que uma API que precisa distinguir uma configuração omitida de uma configuração zerada deve preservar a presença do campo?
