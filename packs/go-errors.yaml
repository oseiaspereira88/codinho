  - schema_version: 1
    id: go-errors.maintain-memory-catalog
    version: 1.0.0
    title: Manter um catálogo em memória com erros verificáveis
    kind: functional_slice
    difficulty: foundational
    estimated_minutes: 60
    themes:
    - errors
    competencies:
      primary:
      - manage-catalog-state
      - reject-catalog-conflicts
      - return-isolated-catalog-views
    prerequisites: [catalog-zero-value, error-identity-not-message]
    brief: Uma loja em memória precisa aceitar produtos, permitir consultas e remoções e oferecer uma visão
      estável do inventário, inclusive quando entradas inválidas ou IDs repetidos são rejeitados.
    constraints:
    - Use somente a biblioteca padrão.
    - Não use arquivos ou rede; preserve as assinaturas da fixture.
    - Não compare mensagens para decidir a categoria de um erro.
    acceptance:
    - O valor zero do catálogo pode ser usado sem construtor; instâncias são independentes.
    - ID e nome não podem ser vazios ou apenas espaços; preço em centavos deve ser positivo. IDs válidos
      são preservados exatamente como recebidos.
    - 'Validação precede a verificação de conflito: um produto inválido retorna ErrInvalid mesmo se seu
      ID já existir.'
    - Inserir ID existente retorna ErrExists sem sobrescrever o produto.
    - Consultar ou excluir ID ausente retorna ErrMissing; erros de conflito/ausência incluem o ID e preservam
      a sentinela para errors.Is.
    - List retorna cópias ordenadas por ID; resultado vazio é slice não nil.
    - Mudar o produto de entrada ou os resultados de Get/List não modifica o catálogo.
    - Excluir remove apenas o ID solicitado; reinserir depois de excluir é permitido.
