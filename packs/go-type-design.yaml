          func TestFirstCircleClone(t *testing.T) {
              t.Run("finds the first circle and clones independently", func(t *testing.T) {
                  reg := Registry{Name: "r1", Shapes: make([]Shape, 3, 10)}
                  reg.Shapes[0] = Square{Side: 1}
                  reg.Shapes[1] = Circle{Radius: 2}
                  reg.Shapes[2] = Square{Side: 3}
                  original := reg.Shapes[1]

                  clone, first := FirstCircleClone(reg)

                  wantCircle := Circle{Radius: 2}
                  if first != Shape(wantCircle) {
                      t.Errorf("firstCircle = %#v, want %#v", first, wantCircle)
                  }
                  if !reflect.DeepEqual(clone.Shapes, reg.Shapes) {
                      t.Fatalf("clone.Shapes = %v, want %v", clone.Shapes, reg.Shapes)
                  }

                  clone.Shapes[1] = Square{Side: 99}
                  if reg.Shapes[1] != original {
