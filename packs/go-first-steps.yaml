challenges:
  - schema_version: 1
    id: go-data.slice-filter-preserve-input
    version: 1.0.0
    title: Filtrar valores sem alterar a entrada
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [slices]
    competencies:
      primary: [slice-filter, preserve-input]
      secondary: [slice-allocation]
    prerequisites: [slice-declaration, range-loop]
    brief: >
      Produza apenas os valores aceitos preservando a ordem e a coleção recebida.
    constraints:
      - Não alterar a coleção de entrada.
    acceptance:
      - A saída contém apenas valores aceitos.
      - A ordem original é preservada.
      - A entrada permanece inalterada.
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-user-struct
            kind: micro
            action: declare
            target: named_type
            title: Declarar a struct User
            instruction:
              objective: Declarar o tipo User conforme a especificação fornecida.
              scope: Somente a declaração da struct.
              constraints:
                - Não adicionar métodos.
                - Não implementar validações.
                - Não criar construtores.
            concepts: [named-types, structs, field-types, zero-values]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: type-exists
                kind: structural
              - id: fields-match
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
            reflection:
              optional:
                - Qual é o valor zero de dois campos escolhidos?
    checks:
      - id: focused-tests
        runner: go_test
        package: ./...
        test_pattern: ^TestFilter$
        timeout: 20s
    variants: []

    validation:
      justification: 'Protótipo sem fixture distribuída: baseline privada reproduz o check declarado sem materializar
        solução no workspace do aluno.'
      baseline_fixture:
      - path: go.mod
        content: |
          module example.invalid/filterproof

          go 1.25.0
      - path: filter.go
        content: |
          package filterproof
          func Filter(nums []int, keep func(int) bool) []int { panic("not implemented") }
      - path: filter_test.go
        content: |
          package filterproof

          import (
              "reflect"
              "testing"
          )

          func TestFilter(t *testing.T) {
              input := []int{1, 2, 3, 4}
              before := append([]int(nil), input...)
              got := Filter(input, func(v int) bool { return v%2 == 0 })
              if !reflect.DeepEqual(got, []int{2, 4}) || !reflect.DeepEqual(input, before) {
                  t.Fatal("filter must preserve order and input")
              }
              got[0] = 99
              if !reflect.DeepEqual(input, before) {
                  t.Fatal("shared storage")
              }
              if len(Filter(nil, func(int) bool { return true })) != 0 {
                  t.Fatal("nil input")
              }
          }
      reference_fixture:
      - path: go.mod
        content: |
          module example.invalid/filterproof

          go 1.25.0
      - path: filter.go
        content: |
          package filterproof

          func Filter(nums []int, keep func(int) bool) []int {
              out := make([]int, 0, len(nums))
              for _, n := range nums {
                  if keep(n) {
                      out = append(out, n)
                  }
              }
              return out
          }
      - path: filter_test.go
        content: |
          package filterproof

          import (
              "reflect"
              "testing"
          )

          func TestFilter(t *testing.T) {
              input := []int{1, 2, 3, 4}
              before := append([]int(nil), input...)
              got := Filter(input, func(v int) bool { return v%2 == 0 })
              if !reflect.DeepEqual(got, []int{2, 4}) || !reflect.DeepEqual(input, before) {
                  t.Fatal("filter must preserve order and input")
              }
              got[0] = 99
              if !reflect.DeepEqual(input, before) {
                  t.Fatal("shared storage")
              }
              if len(Filter(nil, func(int) bool { return true })) != 0 {
                  t.Fatal("nil input")
              }
          }
      expectations:
      - check_id: focused-tests
        baseline: test_failure
        reference: pass
  - schema_version: 1
    id: go-first-steps.enumerate-weekdays-with-iota
    version: 1.0.0
    title: Modelar os dias da semana com iota
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [model-enumeration-with-iota]
      secondary: []
    prerequisites: []
    brief: >
      Modele um conjunto fechado de dias da semana sem espalhar strings
      mágicas pelo código, e decida quais deles contam como dia útil.
    constraints:
      - Não usar uma struct ou interface para representar os dias.
      - Não comparar dias usando string literal.
    acceptance:
      - As constantes formam uma sequência contígua começando em Monday.
      - IsWeekday retorna true apenas para Monday a Friday.
      - Nenhuma comparação usa string literal.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-weekday-type
            kind: micro
            action: declare
            target: named_type
            title: Declarar o tipo Weekday
            instruction:
              objective: Declarar o tipo Weekday como um tipo nomeado inteiro.
              scope: Somente a declaração do tipo.
              constraints:
                - Não declarar as constantes ainda.
                - Não implementar métodos.
            concepts: [named-types]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: type-exists
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
          - id: model.declare-weekday-constants
            kind: micro
            action: declare
            target: constant_block
            title: Declarar as constantes Monday a Sunday com iota
            instruction:
              objective: Declarar as constantes Monday a Sunday do tipo Weekday usando iota, na ordem correta.
              scope: Somente o bloco de constantes.
              constraints:
                - Não atribuir valores literais explícitos às constantes.
            concepts: [constant-declaration, iota-sequence]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: constants-sequential-from-monday
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
            reflection:
              optional:
                - Por que iota evita reatribuir valores manualmente quando só a ordem relativa importa?
          - id: model.implement-is-weekday
            kind: micro
            action: implement
            target: function
            title: Implementar IsWeekday
            instruction:
              objective: Implementar IsWeekday(d Weekday) bool retornando true apenas para Monday a Friday.
              scope: Somente o corpo da função IsWeekday.
              constraints:
                - Não usar comparação de string.
                - Não usar um mapa auxiliar para a checagem.
            concepts: [named-types, constant-declaration]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: returns-true-for-weekdays
                kind: structural
              - id: returns-false-for-weekend
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
    variants: []

  - schema_version: 1
    id: go-first-steps.convert-celsius-to-fahrenheit
    version: 1.0.0
    title: Converter Celsius para Fahrenheit sem truncar
    kind: atomic
    difficulty: foundational
    estimated_minutes: 15
    themes: [declarations-and-types]
    competencies:
      primary: [convert-numeric-types-safely]
      secondary: []
    prerequisites: []
    brief: >
      Declare um tipo nomeado para Celsius e implemente a conversão para
      Fahrenheit sem perder precisão em nenhum passo intermediário.
    constraints:
      - Não usar float32 em nenhum ponto da conversão.
      - Não converter para um tipo inteiro em nenhum passo intermediário.
    acceptance:
      - CelsiusToFahrenheit(0) retorna 32.
      - CelsiusToFahrenheit(100) retorna 212.
      - CelsiusToFahrenheit(36.6) retorna um valor entre 97.87 e 97.89.
    publication:
      author: claude
    layers:
      - id: understanding
        macro_steps:
          - id: model.declare-celsius-type
            kind: micro
            action: declare
            target: named_type
            title: Declarar o tipo Celsius
            instruction:
              objective: Declarar um tipo nomeado para representar uma temperatura em graus Celsius, com um tipo subjacente que suporte casas decimais.
              scope: Somente a declaração do tipo.
              constraints:
                - Não usar float32.
                - Não implementar a conversão ainda.
            concepts: [named-types, type-conversion]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: type-exists
                kind: structural
              - id: underlying-type-is-float64
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
            reflection:
              optional:
                - Por que declarar um tipo nomeado Celsius em vez de usar float64 diretamente na assinatura?
          - id: model.implement-celsius-to-fahrenheit
            kind: micro
            action: implement
            target: function
            title: Implementar CelsiusToFahrenheit
            instruction:
              objective: Implementar a função que converte a temperatura armazenada em Celsius para a escala Fahrenheit, aplicando a fórmula de conversão padrão entre as duas escalas.
              scope: Somente o corpo da função de conversão.
              constraints:
                - Não converter para int em nenhum passo intermediário.
                - Não usar float32.
            concepts: [type-conversion]
            evidence:
              strategies: [source_inspection, compile]
            criteria:
              - id: formula-correct
                kind: structural
              - id: no-intermediate-truncation
                kind: structural
            completion:
              requires_positive_evaluation: true
              requires_user_confirmation: false
            hints:
              - level: 1
                kind: guiding_question
              - level: 2
                kind: syntax_recall
              - level: 3
                kind: logical_prose
    variants: []

