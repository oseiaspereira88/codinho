                  name string
                  in   int
                  want byte
              }{
                  {"below range", -10, 0},
                  {"just below range", -1, 0},
                  {"above range", 300, 255},
                  {"just above range", 256, 255},
                  {"within range", 120, 120},
                  {"lower bound", 0, 0},
                  {"upper bound", 255, 255},
              }
              for _, c := range cases {
                  t.Run(c.name, func(t *testing.T) {
                      got := ClampToByte(c.in)
                      if got != c.want {
                          t.Errorf("ClampToByte(%d) = %d, want %d", c.in, got, c.want)
                      }
                  })
              }
